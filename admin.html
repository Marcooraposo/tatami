<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tatami — Academy Management</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="data.js"></script>
  <script>
  // =============================================================================
  // admin.html — Web management prototype
  // Single-page app with hash-based routing.
  //   #/students            → Students list
  //   #/students/:id        → Student report
  //   #/classes             → Classes list
  //   #/classes/:id         → Class detail
  //   #/curriculum          → Curriculum builder
  //   #/setup               → Org onboarding wizard
  //   #/schedule → weekly calendar  #/dashboard → overview
  // =============================================================================

  // ---------- Full data persistence -----------------------------------------
  // All mutable arrays are saved together. On boot, localStorage wins over seed.

  const DATA_KEY = 'tatami_v1_data';

  function persistData() {
    try {
      localStorage.setItem(DATA_KEY, JSON.stringify({
        students:      STUDENTS,
        enrollments:   ENROLLMENTS,
        classes:       CLASSES,
        bookings:      BOOKINGS,
        attendance:    ATTENDANCE,
        templates:     RECURRING_TEMPLATES,
        waitlist:      WAITLIST,
        announcements: ANNOUNCEMENTS,
        events:             EVENTS,
        prospects:          PROSPECTS,
        competitionResults: COMPETITION_RESULTS,
        discountCodes:      DISCOUNT_CODES,
        gradingLog:         GRADING_LOG,
      }));
    } catch(e) { console.warn('persistData failed', e); }
  }

  function loadPersistedData() {
    try {
      const saved = JSON.parse(localStorage.getItem(DATA_KEY));
      if (!saved || !saved.students) return false;
      // Replace const arrays in-place (can't reassign, but splice+push works)
      const replace = (arr, data) => { arr.splice(0, arr.length, ...(data || [])); };
      replace(STUDENTS,           saved.students);
      replace(ENROLLMENTS,        saved.enrollments);
      replace(CLASSES,            saved.classes);
      replace(BOOKINGS,           saved.bookings);
      replace(ATTENDANCE,         saved.attendance);
      replace(RECURRING_TEMPLATES, saved.templates);
      replace(WAITLIST,           saved.waitlist || []);
      replace(ANNOUNCEMENTS,      saved.announcements || []);
      replace(EVENTS,              saved.events || []);
      replace(PROSPECTS,           saved.prospects || []);
      replace(COMPETITION_RESULTS, saved.competitionResults || []);
      replace(DISCOUNT_CODES,      saved.discountCodes || []);
      replace(GRADING_LOG,         saved.gradingLog || []);
      return true;
    } catch(e) { console.warn('loadPersistedData failed', e); return false; }
  }

  // Legacy — kept so existing callers don't break; now delegates to persistData
  function persistAttendance() { persistData(); }

  // ---------- Command Palette (Cmd+K / Ctrl+K) ------------------------------

  const CMD_NAV_ITEMS = [
    { id: 'dashboard',      label: 'Dashboard',       icon: '◆' },
    { id: 'schedule',       label: 'Schedule',        icon: '▦' },
    { id: 'classes',        label: 'Classes',         icon: '◷' },
    { id: 'private-lessons',label: 'Private Lessons', icon: '🥋' },
    { id: 'curriculum',     label: 'Curriculum',      icon: '☰' },
    { id: 'students',       label: 'Students',        icon: '◉' },
    { id: 'families',       label: 'Families',        icon: '👪' },
    { id: 'prospects',          label: 'Prospects',           icon: '🎯' },
    { id: 'referrals',          label: 'Referrals',           icon: '🔗' },
    { id: 'memberships',    label: 'Memberships',     icon: '◈' },
    { id: 'discounts',      label: 'Discounts',       icon: '%' },
    { id: 'grading',        label: 'Grading',         icon: '★' },
    { id: 'instructors',    label: 'Instructors',     icon: '👤' },
    { id: 'billing',        label: 'Billing',         icon: '💳' },
    { id: 'analytics',      label: 'Analytics',       icon: '📊' },
    { id: 'ratings',        label: 'Feedback / Ratings', icon: '⭐' },
    { id: 'attendance-log', label: 'Attendance Log',  icon: '✓' },
    { id: 'goals',          label: 'Goals',           icon: '◎' },
    { id: 'events',         label: 'Events',          icon: '🏆' },
    { id: 'announcements',  label: 'Announcements',   icon: '📢' },
    { id: 'settings',       label: 'Settings',        icon: '⚙' },
  ];

  let _cmdOpen = false;
  let _cmdQuery = '';
  let _cmdSelected = 0;

  function _cmdResults() {
    const q = _cmdQuery.toLowerCase().trim();
    const navMatches = CMD_NAV_ITEMS
      .filter(n => !q || n.label.toLowerCase().includes(q) || n.id.includes(q))
      .map(n => ({ type: 'nav', id: n.id, label: n.label, sub: 'Screen', icon: n.icon }));
    const stuMatches = !q ? [] : STUDENTS
      .filter(s => !s.inactive && (s.name.toLowerCase().includes(q) || (s.contact||'').toLowerCase().includes(q)))
      .slice(0, 8)
      .map(s => {
        const enr = ENROLLMENTS.find(e => e.studentId === s.id);
        const level = enr ? DB.level(enr.sportId, enr.currentLevelId) : null;
        return { type: 'student', id: s.id, label: s.name, sub: level ? level.name : 'Student', icon: '◉' };
      });
    // Students first when there's a query, nav first when empty
    return q ? [...stuMatches, ...navMatches] : navMatches;
  }

  function openCmdPalette() {
    _cmdOpen = true; _cmdQuery = ''; _cmdSelected = 0;
    _renderCmdPalette();
    setTimeout(() => {
      const inp = document.getElementById('cmd-input');
      if (inp) inp.focus();
    }, 30);
  }

  function closeCmdPalette() {
    _cmdOpen = false;
    const el = document.getElementById('cmd-palette-overlay');
    if (el) el.remove();
  }

  function _renderCmdPalette() {
    const results = _cmdResults();
    if (_cmdSelected >= results.length) _cmdSelected = Math.max(0, results.length - 1);

    const rows = results.map((r, i) => `
      <div class="cmd-row ${i === _cmdSelected ? 'cmd-row-active' : ''}"
           onmouseenter="cmdHover(${i})"
           onclick="cmdSelect(${i})">
        <span class="cmd-row-icon">${r.icon}</span>
        <span class="cmd-row-label">${r.label}</span>
        <span class="cmd-row-sub">${r.sub}</span>
      </div>
    `).join('');

    const existing = document.getElementById('cmd-palette-overlay');
    const html = `
      <div id="cmd-palette-overlay" onclick="if(event.target.id==='cmd-palette-overlay')closeCmdPalette()"
           style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;display:flex;align-items:flex-start;justify-content:center;padding-top:15vh">
        <div style="background:var(--surface,#fff);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,90vw);overflow:hidden;display:flex;flex-direction:column">
          <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border,#e5e7eb)">
            <span style="color:var(--text-muted,#9ca3af);font-size:16px">⌕</span>
            <input id="cmd-input" type="text" value="${_cmdQuery.replace(/"/g,'&quot;')}"
                   placeholder="Search screens and students…"
                   oninput="cmdType(this.value)"
                   onkeydown="cmdKey(event)"
                   style="flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--text,#111)">
            <kbd style="font-size:11px;padding:2px 6px;border-radius:4px;background:var(--surface-alt,#f1f5f9);border:1px solid var(--border,#e5e7eb);color:var(--text-muted)">Esc</kbd>
          </div>
          <div id="cmd-list" style="max-height:340px;overflow-y:auto;padding:6px 0">
            ${rows || '<div style="padding:24px;text-align:center;color:var(--text-muted,#9ca3af);font-size:13px">No results</div>'}
          </div>
          ${results.length ? `<div style="padding:8px 14px;border-top:1px solid var(--border,#e5e7eb);font-size:11px;color:var(--text-muted);display:flex;gap:16px">
            <span>↑↓ navigate</span><span>↵ open</span><span>Esc close</span>
          </div>` : ''}
        </div>
      </div>
      <style>
        .cmd-row { display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:background .1s }
        .cmd-row:hover,.cmd-row-active { background:var(--surface-alt,#f1f5f9) }
        .cmd-row-icon { font-size:15px;width:22px;text-align:center;flex-shrink:0 }
        .cmd-row-label { flex:1;font-size:14px;font-weight:500;color:var(--text,#111) }
        .cmd-row-sub { font-size:12px;color:var(--text-muted,#9ca3af) }
      </style>
    `;

    if (existing) {
      existing.outerHTML = html;
    } else {
      document.body.insertAdjacentHTML('beforeend', html);
    }
  }

  function cmdType(val) {
    _cmdQuery = val; _cmdSelected = 0; _renderCmdPalette();
    setTimeout(() => { const inp = document.getElementById('cmd-input'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }, 0);
  }

  function cmdHover(i) { _cmdSelected = i; _renderCmdPalette(); setTimeout(() => { const inp = document.getElementById('cmd-input'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }, 0); }

  function cmdKey(e) {
    const results = _cmdResults();
    if (e.key === 'ArrowDown') { e.preventDefault(); _cmdSelected = Math.min(_cmdSelected + 1, results.length - 1); _renderCmdPalette(); setTimeout(() => { const inp = document.getElementById('cmd-input'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }, 0); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); _cmdSelected = Math.max(_cmdSelected - 1, 0); _renderCmdPalette(); setTimeout(() => { const inp = document.getElementById('cmd-input'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }, 0); }
    else if (e.key === 'Enter') { cmdSelect(_cmdSelected); }
    else if (e.key === 'Escape') { closeCmdPalette(); }
  }

  function cmdSelect(i) {
    const results = _cmdResults();
    const r = results[i];
    if (!r) return;
    closeCmdPalette();
    if (r.type === 'nav') go(r.id);
    else if (r.type === 'student') go('students/' + r.id);
  }

  // Global Cmd+K / Ctrl+K listener — attached after DOM ready
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      _cmdOpen ? closeCmdPalette() : openCmdPalette();
    }
  });

  // Toast utility -------------------------------------------------
  function showToast(msg, durationMs = 2500) {
    let toast = document.getElementById('admin-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'admin-toast';
      Object.assign(toast.style, {
        position: 'fixed', bottom: '24px', left: '50%', transform: 'translateX(-50%)',
        background: '#1e293b', color: '#fff', padding: '10px 20px', borderRadius: '8px',
        fontSize: '13px', fontWeight: '600', zIndex: '9999', pointerEvents: 'none',
        boxShadow: '0 4px 12px rgba(0,0,0,.25)', opacity: '0', transition: 'opacity .2s',
      });
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.opacity = '1';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, durationMs);
  }

  // ---------- Org setup state (persisted to localStorage) --------------------

  const ORG_SETUP_KEY = 'tatami_org_setup';

  function getOrgSetup() {
    try { return JSON.parse(localStorage.getItem(ORG_SETUP_KEY)) || null; } catch { return null; }
  }
  function saveOrgSetup(data) {
    localStorage.setItem(ORG_SETUP_KEY, JSON.stringify(data));
  }
  // Apply any saved org name to ACADEMY at runtime
  function applyOrgSetup() {
    const saved = getOrgSetup();
    if (saved?.org?.name) ACADEMY.name = saved.org.name;
    if (saved?.org?.location) ACADEMY.location = saved.org.location;
    if (saved?.org?.website) ACADEMY.website = saved.org.website;
  }

  // ---------- Grading sessions persistence ----------------------------------

  const GRADING_SESSIONS_KEY = 'tatami_grading_sessions';
  let GRADING_SESSIONS = [];
  let gradingSelectedIds = new Set(); // student ids checked in the grading screen
  let pendingCancellationNotice = null; // { cls, students } shown after cancel
  let attendanceLogState = { query: '', classType: '', days: 30, page: 1 };

  function loadGradingSessions() {
    try {
      const saved = JSON.parse(localStorage.getItem(GRADING_SESSIONS_KEY));
      if (Array.isArray(saved)) { GRADING_SESSIONS.splice(0, GRADING_SESSIONS.length, ...saved); }
    } catch(e) {}
  }
  function saveGradingSessions() {
    try { localStorage.setItem(GRADING_SESSIONS_KEY, JSON.stringify(GRADING_SESSIONS)); } catch(e) {}
  }

  function gradingToggle(studentId) {
    if (gradingSelectedIds.has(studentId)) gradingSelectedIds.delete(studentId);
    else gradingSelectedIds.add(studentId);
    // Re-render just the grading screen
    document.getElementById('content').innerHTML = GradingScreen();
  }

  function gradingSelectAll(ids) {
    ids.forEach(id => gradingSelectedIds.add(id));
    document.getElementById('content').innerHTML = GradingScreen();
  }

  function runGradingSession() {
    if (gradingSelectedIds.size === 0) return;
    const results = [];
    gradingSelectedIds.forEach(studentId => {
      const enrollment = ENROLLMENTS.find(e => e.studentId === studentId && e.sportId === 'sport-bjj');
      if (!enrollment) return;
      const promo = computePromotionStatus(studentId, 'sport-bjj');
      if (!promo?.ready || !promo.nextLevel) return;
      results.push({ studentId, fromLevelId: enrollment.currentLevelId, toLevelId: promo.nextLevel.id });
      enrollment.currentLevelId  = promo.nextLevel.id;
      enrollment.currentStripes  = 0;
      enrollment.levelSince      = new Date().toISOString();
      enrollment.lastPromotionAt = new Date().toISOString();
    });
    if (results.length === 0) return;
    GRADING_SESSIONS.unshift({
      id: 'gs-' + Date.now(),
      date: new Date().toISOString().slice(0, 10),
      results,
    });
    saveGradingSessions();
    persistData();
    gradingSelectedIds.clear();
    document.getElementById('content').innerHTML = GradingScreen();
  }

  // ---------- Promotion rules persistence ------------------------------------

  const PROMO_RULES_KEY = 'tatami_promotion_rules';

  function persistPromotionRules() {
    try {
      const rules = {};
      GRADING_SYSTEMS.forEach(g => { rules[g.id] = g.promotionRules || {}; });
      localStorage.setItem(PROMO_RULES_KEY, JSON.stringify(rules));
    } catch(e) { console.warn('persistPromotionRules failed', e); }
  }

  function loadPersistedPromotionRules() {
    try {
      const saved = JSON.parse(localStorage.getItem(PROMO_RULES_KEY));
      if (!saved) return;
      GRADING_SYSTEMS.forEach(g => {
        if (saved[g.id]) g.promotionRules = saved[g.id];
      });
    } catch(e) { console.warn('loadPersistedPromotionRules failed', e); }
  }

  // Preset martial arts the org can choose from
  const PRESET_SPORTS = [
    { id: 'sport-bjj',      name: 'Brazilian Jiu-Jitsu', icon: '🥋' },
    { id: 'sport-muaythai', name: 'Muay Thai',            icon: '🥊' },
    { id: 'sport-judo',     name: 'Judo',                 icon: '🎽' },
    { id: 'sport-wrestling',name: 'Wrestling',             icon: '🤼' },
    { id: 'sport-karate',   name: 'Karate',               icon: '🥋' },
    { id: 'sport-boxing',   name: 'Boxing',               icon: '🥊' },
  ];

  // Default belt systems per sport
  const DEFAULT_BELTS = {
    'sport-bjj':       ['White','Blue','Purple','Brown','Black'],
    'sport-judo':      ['White','Yellow','Orange','Green','Blue','Brown','Black'],
    'sport-karate':    ['White','Yellow','Orange','Green','Blue','Brown','Black'],
    'sport-muaythai':  ['No formal belt system'],
    'sport-wrestling': ['No formal belt system'],
    'sport-boxing':    ['No formal belt system'],
  };

  // Wizard state (in-memory during the wizard session)
  let wizardState = {
    step: 1,
    org: { name: '', location: '', website: '' },
    sports: [],           // array of sport ids selected
    curricula: {},        // { sportId: { belts: [...], rules: { minMonths, minClasses } } }
    rules: { safety: '', uniform: '', hygiene: '' }
  };

  // ---------- Router ---------------------------------------------------------

  function getRoute() {
    const hash = location.hash.replace(/^#\/?/, '') || 'dashboard';
    const [section, ...params] = hash.split('/');
    return { section, params };
  }
  function go(path) { location.hash = '#/' + path; }
  window.addEventListener('hashchange', renderApp);

  // ---------- Wizard navigation helpers -------------------------------------
  function wizardNext() {
    wizardState.step = Math.min(wizardState.step + 1, 4);
    renderApp();
  }
  function wizardBack() {
    wizardState.step = Math.max(wizardState.step - 1, 1);
    renderApp();
  }
  function wizardToggleSport(id) {
    if (wizardState.sports.includes(id)) {
      wizardState.sports = wizardState.sports.filter(s => s !== id);
      delete wizardState.curricula[id];
    } else {
      wizardState.sports.push(id);
      // Pre-populate belts from defaults
      const belts = DEFAULT_BELTS[id] || [];
      wizardState.curricula[id] = { belts: [...belts], rules: { minMonths: 6, minClasses: 40 } };
    }
    renderApp();
  }
  function wizardUpdateOrg(field, value) {
    wizardState.org[field] = value;
  }
  function wizardUpdateRules(field, value) {
    wizardState.rules[field] = value;
  }
  function wizardAddBelt(sportId) {
    const input = document.getElementById(`new-belt-${sportId}`);
    const val = input?.value.trim();
    if (!val) return;
    wizardState.curricula[sportId].belts.push(val);
    input.value = '';
    renderApp();
  }
  function wizardRemoveBelt(sportId, index) {
    wizardState.curricula[sportId].belts.splice(index, 1);
    renderApp();
  }
  function wizardUpdateBeltRule(sportId, field, value) {
    wizardState.curricula[sportId].rules[field] = parseInt(value) || 0;
  }
  function wizardSave() {
    // Collect final values from form fields before saving
    wizardState.org.name     = document.getElementById('org-name')?.value     || wizardState.org.name;
    wizardState.org.location = document.getElementById('org-location')?.value || wizardState.org.location;
    wizardState.org.website  = document.getElementById('org-website')?.value  || wizardState.org.website;
    wizardState.rules.safety  = document.getElementById('rules-safety')?.value  || wizardState.rules.safety;
    wizardState.rules.uniform = document.getElementById('rules-uniform')?.value || wizardState.rules.uniform;
    wizardState.rules.hygiene = document.getElementById('rules-hygiene')?.value || wizardState.rules.hygiene;
    saveOrgSetup({ ...wizardState, completedAt: new Date().toISOString() });
    applyOrgSetup();
    go('dashboard');
  }

  // ---------- Top-level render ----------------------------------------------

  function renderApp() {
    const route = getRoute();
    document.title = `Tatami — ${t(UI.appName)} · ${t(UI.nav[route.section] || UI.appName)}`;
    document.getElementById('app').innerHTML = `
      ${Sidebar(route.section)}
      <div class="main">
        ${Topbar(route)}
        <div class="content" id="content"></div>
      </div>
    `;
    // Reset student search + selection when navigating away from the list
    if (route.section !== 'students' || route.params.length) { studentSearchQuery = ''; studentSelectedIds.clear(); studentBeltFilter = null; }
    // Reset grading selection when leaving grading screen
    if (route.section !== 'grading') gradingSelectedIds.clear();
    // Clear cancellation notice when navigating away from that class
    if (pendingCancellationNotice && !(route.section === 'classes' && route.params[0] === pendingCancellationNotice.cls.id)) {
      pendingCancellationNotice = null;
    }

    const content = document.getElementById('content');
    switch (route.section) {
      case 'students':
        if (route.params[0] === 'new') content.innerHTML = StudentOnboardingWizard();
        else content.innerHTML = route.params.length ? StudentReport(route.params[0]) : StudentsList();
        break;
      case 'templates':     content.innerHTML = TemplatesScreen();         break;
      case 'closures':      content.innerHTML = ClosuresScreen();          break;
      case 'classes':
        if (route.params[0] === 'new') content.innerHTML = NewClassForm();
        else content.innerHTML = route.params.length ? ClassDetail(route.params[0]) : ClassesList();
        break;
      case 'curriculum':        content.innerHTML = CurriculumBuilder();     break;
      case 'curriculum-wizard': content.innerHTML = CurriculumWizard();      break;
      case 'curriculum-tech':   content.innerHTML = TechniquePage(route.params[0]); break;
      case 'promotion-rules':   content.innerHTML = PromotionRulesScreen(); break;
      case 'packages':          content.innerHTML = PackagesScreen();       break;
      case 'grading':           content.innerHTML = GradingScreen();        break;
      case 'prospects':             content.innerHTML = ProspectsScreen();           break;
      case 'onboarding-pipeline': content.innerHTML = OnboardingPipelineScreen(); break;
      case 'referrals':           content.innerHTML = ReferralsScreen();           break;
      case 'retention':         content.innerHTML = RetentionScreen();       break;
      case 'waivers':           content.innerHTML = WaiversScreen();         break;
      case 'equipment':         content.innerHTML = EquipmentScreen();       break;
      case 'renewals':          content.innerHTML = RenewalTrackerScreen();  break;
      case 'private-lessons':   content.innerHTML = PrivateLessonsScreen();  break;
      case 'instructors':
        if (route.params.length) content.innerHTML = InstructorDetail(route.params[0]);
        else content.innerHTML = InstructorScreen();
        break;
      case 'billing':           content.innerHTML = BillingScreen();         break;
      case 'analytics':         content.innerHTML = AnalyticsScreen();       break;
      case 'ratings':           content.innerHTML = RatingsOverviewScreen(); break;
      case 'attendance-log':    content.innerHTML = AttendanceLogScreen();   break;
      case 'goals':             content.innerHTML = GoalsScreen();           break;
      case 'events':
        if (route.params[0] === 'new') content.innerHTML = NewEventForm();
        else if (route.params.length)  content.innerHTML = EventDetail(route.params[0]);
        else                           content.innerHTML = EventsList();
        break;
      case 'families':          content.innerHTML = FamiliesScreen();         break;
      case 'announcements':     content.innerHTML = AnnouncementsScreen();   break;
      case 'discounts':         content.innerHTML = DiscountsScreen();        break;
      case 'kiosk':             content.innerHTML = KioskScreen();           break;
      case 'messages':          content.innerHTML = MessagesScreen();        break;
      case 'comm-log':          content.innerHTML = CommLogScreen();         break;
      case 'setup':        content.innerHTML = OrgSetupWizard();    break;  // entry point from onboarding.html
      case 'settings':     content.innerHTML = SettingsScreen();    break;
      case 'schedule':     content.innerHTML = Schedule();          break;
      case 'memberships':
        if (route.params[0] === 'plans') content.innerHTML = MembershipPlansScreen();
        else content.innerHTML = MembershipsList();
        break;
      case 'dashboard':
      default:           content.innerHTML = Dashboard();  break;
    }
    autoPaginate(content);
  }

  // ---------- Generic table/list pagination --------------------------------
  // Runs after each render. Any <table> or .list with more than PAGE_SIZE rows
  // gets page controls; extra rows are hidden. Re-callable after partial
  // re-renders (e.g. filtered lists).
  const PAGE_SIZE = 15;
  function autoPaginate(root) {
    root = root || document.getElementById('content');
    if (!root) return;
    root.querySelectorAll('table').forEach(tbl => {
      const tb = tbl.tBodies && tbl.tBodies[0];
      if (!tb) return;
      const rows = [...tb.rows];
      _applyPager(rows, tbl, tb);
    });
    root.querySelectorAll('.list').forEach(list => {
      const rows = [...list.children].filter(c =>
        c.classList && c.classList.contains('list-row') && !c.classList.contains('list-header'));
      _applyPager(rows, list, list);
    });
  }

  function _applyPager(rows, container, anchorParent) {
    if (!rows.length || rows.length <= PAGE_SIZE) return;
    if (container.dataset.pgInit === '1') return;
    container.dataset.pgInit = '1';
    let page = 1;
    const pageCount = Math.ceil(rows.length / PAGE_SIZE);
    const ctrl = document.createElement('div');
    ctrl.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:var(--sp-3);padding:var(--sp-3);font-size:13px';
    // place controls right after the table/list
    (container.tagName === 'TABLE' ? container : container).insertAdjacentElement('afterend', ctrl);

    function show() {
      const start = (page - 1) * PAGE_SIZE, end = start + PAGE_SIZE;
      rows.forEach((r, i) => { r.style.display = (i >= start && i < end) ? '' : 'none'; });
      ctrl.innerHTML = '';
      const prev = document.createElement('button');
      prev.className = 'btn btn-secondary'; prev.style.cssText = 'font-size:12px;padding:2px 10px';
      prev.textContent = tr('common.prev'); prev.disabled = page === 1; prev.style.opacity = page === 1 ? '.4' : '1';
      prev.onclick = () => { if (page > 1) { page--; show(); } };
      const next = document.createElement('button');
      next.className = 'btn btn-secondary'; next.style.cssText = 'font-size:12px;padding:2px 10px';
      next.textContent = tr('common.nextarr'); next.disabled = page === pageCount; next.style.opacity = page === pageCount ? '.4' : '1';
      next.onclick = () => { if (page < pageCount) { page++; show(); } };
      const label = document.createElement('span');
      label.style.color = 'var(--text-muted)';
      label.textContent = tr('pager.page', { a: page, b: pageCount, n: rows.length });
      ctrl.append(prev, label, next);
    }
    show();
  }

  function _studentLastSeen(studentId) {
    // Returns days since last attended class, or null if never
    const nowMs = Date.now();
    const attended = ATTENDANCE.filter(a => a.studentId === studentId && a.attended);
    const lastMs = attended.reduce((latest, a) => {
      const cls = CLASSES.find(c => c.id === a.classId);
      if (!cls) return latest;
      const t = new Date(cls.startsAt).getTime();
      return t > latest ? t : latest;
    }, 0);
    return lastMs ? Math.floor((nowMs - lastMs) / 86400000) : null;
  }

  function _lastSeenBadge(daysSince) {
    if (daysSince === null) return `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fef2f2;color:#ef4444;white-space:nowrap">Never</span>`;
    if (daysSince < 14)    return `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#f0fdf4;color:#16a34a;white-space:nowrap">${daysSince}d ago</span>`;
    if (daysSince < 30)    return `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fefce8;color:#ca8a04;white-space:nowrap">${daysSince}d ago</span>`;
    return `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff1f2;color:#e11d48;white-space:nowrap">${daysSince}d ago</span>`;
  }

  function _sortStudents(students) {
    return [...students].sort((a, b) => {
      let av, bv;
      if (studentSortKey === 'lastSeen') {
        av = _studentLastSeen(a.id) ?? 99999;
        bv = _studentLastSeen(b.id) ?? 99999;
      } else if (studentSortKey === 'classes') {
        av = ATTENDANCE.filter(x => x.studentId === a.id && x.attended).length;
        bv = ATTENDANCE.filter(x => x.studentId === b.id && x.attended).length;
      } else if (studentSortKey === 'belt') {
        const enrA = DB.enrollment(a.id, 'sport-bjj');
        const enrB = DB.enrollment(b.id, 'sport-bjj');
        const lvlA = enrA ? DB.level(enrA.gradingSystemId, enrA.currentLevelId) : null;
        const lvlB = enrB ? DB.level(enrB.gradingSystemId, enrB.currentLevelId) : null;
        av = lvlA?.order ?? 0;
        bv = lvlB?.order ?? 0;
      } else {
        av = a.name.toLowerCase();
        bv = b.name.toLowerCase();
        return studentSortDir * av.localeCompare(bv);
      }
      return studentSortDir * (av - bv);
    });
  }

  function _sortHeader(label, key, extraStyle = '') {
    const active = studentSortKey === key;
    const arrow = active ? (studentSortDir === 1 ? ' ↑' : ' ↓') : '';
    return `<div class="list-col-hide" style="cursor:pointer;user-select:none;white-space:nowrap;${active ? 'color:var(--accent);font-weight:700;' : ''}${extraStyle}"
      onclick="studentSortDir=(studentSortKey==='${key}')?-studentSortDir:1;studentSortKey='${key}';filterStudents(studentSearchQuery)"
      >${label}${arrow}</div>`;
  }

  function filterStudents(q) {
    studentSearchQuery = q.toLowerCase().trim();
    const rows = _studentListRows();
    const list = document.querySelector('.list');
    if (list) {
      const noMatch = !getFilteredStudents().length
        ? `<div style="padding:var(--sp-5);text-align:center;color:var(--text-muted)">No students match your filters.</div>`
        : '';
      list.innerHTML = _studentListHeader() + rows + noMatch;
    }
    // Update bulk bar (selection may still be active while filtering)
    const bar = document.getElementById('student-bulk-bar');
    if (bar) bar.outerHTML = _studentBulkBar();
    // Re-render belt chips to update active state
    const chipWrap = document.getElementById('student-belt-chips');
    if (chipWrap) chipWrap.outerHTML = `<div id="student-belt-chips">${_studentBeltFilterChips()}</div>`;
    const tagWrap = document.getElementById('student-tag-chips');
    if (tagWrap) tagWrap.outerHTML = `<div id="student-tag-chips">${_studentTagFilterChips()}</div>`;
    if (list) autoPaginate(list.parentNode);
  }

  function getFilteredStudents() {
    let base = studentShowInactive ? STUDENTS : STUDENTS.filter(s => !s.inactive);
    if (studentSearchQuery) {
      base = base.filter(stu => {
        const enr = DB.enrollment(stu.id, 'sport-bjj');
        const levelName = enr ? t(DB.level(enr.gradingSystemId, enr.currentLevelId)?.name || {en:''}) : '';
        const haystack = [stu.name, stu.contact, stu.notes || '', levelName].join(' ').toLowerCase();
        return haystack.includes(studentSearchQuery);
      });
    }
    if (studentBeltFilter) {
      base = base.filter(stu => {
        const enr = DB.enrollment(stu.id, 'sport-bjj');
        return enr && enr.currentLevelId === studentBeltFilter;
      });
    }
    if (studentTagFilter) {
      base = base.filter(stu => studentTags(stu).includes(studentTagFilter));
    }
    return _sortStudents(base);
  }

  function _studentTagFilterChips() {
    const chip = (id, label, active) => `<button
      onclick="studentTagFilter=${active ? 'null' : `'${id}'`};filterStudents(studentSearchQuery)"
      style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
        background:${active ? 'var(--primary)' : 'var(--surface-alt)'};color:${active ? '#fff' : 'var(--text)'};
        border:1px solid ${active ? 'var(--primary)' : 'var(--border)'}">${label}</button>`;
    const tagChips = AUDIENCE_TAGS.map(tg => {
      const count = STUDENTS.filter(s => !s.inactive && studentTags(s).includes(tg.id)).length;
      if (!count) return '';
      return chip(tg.id, `${t(tg.label)} <span style="opacity:.7;font-weight:400">${count}</span>`, studentTagFilter === tg.id);
    }).join('');
    if (!tagChips) return '';
    return `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:var(--sp-3)">
      ${chip('', 'All tags', !studentTagFilter)}${tagChips}</div>`;
  }

  function _studentBeltFilterChips() {
    // Collect all belt levels from the default grading system, in order
    const gs = GRADING_SYSTEMS.find(g => g.sportId === 'sport-bjj');
    if (!gs) return '';
    const chips = gs.levels.map(lvl => {
      const count = STUDENTS.filter(s => {
        if (s.inactive) return false;
        const enr = DB.enrollment(s.id, 'sport-bjj');
        return enr && enr.currentLevelId === lvl.id;
      }).length;
      if (count === 0) return '';
      const active = studentBeltFilter === lvl.id;
      const dotColor = lvl.color || '#6b7280';
      return `<button
        onclick="studentBeltFilter=${active ? 'null' : `'${lvl.id}'`};filterStudents(studentSearchQuery)"
        style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s;
          background:${active ? dotColor : 'var(--surface-alt)'};
          color:${active ? (lvl.textColor || '#fff') : 'var(--text)'};
          border:1px solid ${active ? dotColor : 'var(--border)'}">
        <span style="width:8px;height:8px;border-radius:50%;background:${active ? (lvl.textColor || '#fff') : dotColor};flex-shrink:0"></span>
        ${t(lvl.name)} <span style="opacity:0.7;font-weight:400">${count}</span>
      </button>`;
    }).join('');
    const allActive = !studentBeltFilter;
    const allChip = `<button
      onclick="studentBeltFilter=null;filterStudents(studentSearchQuery)"
      style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s;
        background:${allActive ? 'var(--accent)' : 'var(--surface-alt)'};
        color:${allActive ? '#fff' : 'var(--text)'};
        border:1px solid ${allActive ? 'var(--accent)' : 'var(--border)'}">
      All
    </button>`;
    return `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:var(--sp-3)">${allChip}${chips}</div>`;
  }

  function toggleStudentInactive(studentId) {
    const stu = DB.student(studentId);
    if (!stu) return;
    stu.inactive = !stu.inactive;
    persistData();
    document.getElementById('content').innerHTML = StudentReport(studentId);
  }

  // ---------- Screen: Student report ----------------------------------------

  function AttendanceSparkline(studentId) {
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
    const todayMs = new Date(CONFIG.today).setHours(0, 0, 0, 0);
    // Align to Sunday of current week
    const dayOfWeek = new Date(CONFIG.today).getDay();
    const thisWeekStart = todayMs - dayOfWeek * 86400000;

    const weeks = Array.from({ length: 8 }, (_, i) => {
      const wkStart = thisWeekStart - (7 - i) * WEEK_MS;
      const wkEnd   = wkStart + WEEK_MS;
      const count   = ATTENDANCE.filter(a => {
        if (!a.attended || a.studentId !== studentId) return false;
        const cls = CLASSES.find(c => c.id === a.classId);
        if (!cls) return false;
        const t = new Date(cls.startsAt).getTime();
        return t >= wkStart && t < wkEnd;
      }).length;
      // Short week label: "May 5", etc.
      const d = new Date(wkStart);
      const label = d.toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
      return { label, count };
    });

    const maxCount = Math.max(...weeks.map(w => w.count), 1);
    const totalShown = weeks.reduce((s, w) => s + w.count, 0);

    const bars = weeks.map((w, i) => {
      const pct   = Math.round((w.count / maxCount) * 100);
      const isNow = i === 7;
      const color = isNow ? 'var(--accent)' : w.count === 0 ? 'var(--border)' : 'var(--accent-muted, #93c5fd)';
      return `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
          <div style="font-size:11px;font-weight:600;color:${w.count > 0 ? 'var(--text)' : 'var(--text-faint)'}">${w.count || ''}</div>
          <div style="width:100%;background:var(--surface-alt);border-radius:4px;height:44px;display:flex;align-items:flex-end;overflow:hidden">
            <div style="width:100%;height:${Math.max(pct, w.count > 0 ? 8 : 0)}%;background:${color};border-radius:3px 3px 0 0;transition:height .3s"></div>
          </div>
          <div style="font-size:9px;color:var(--text-faint);text-align:center;line-height:1.2;writing-mode:horizontal-tb">${w.label}</div>
        </div>`;
    }).join('');

    return `
      <div class="card" style="margin-bottom:var(--sp-4)">
        <div class="row-between" style="margin-bottom:var(--sp-3)">
          <h3 class="card-title" style="margin:0">Attendance — last 8 weeks</h3>
          <span class="muted" style="font-size:12px">${totalShown} class${totalShown !== 1 ? 'es' : ''} attended</span>
        </div>
        <div style="display:flex;gap:6px;align-items:flex-end;height:68px">
          ${bars}
        </div>
      </div>`;
  }

  // ---------- Belt Promotion Timeline ---------------------------------------

  function BeltPromotionTimeline(studentId) {
    const enrollment = ENROLLMENTS.find(e => e.studentId === studentId && e.sportId === 'sport-bjj');
    if (!enrollment) return '';
    const grading = GRADING_SYSTEMS.find(g => g.id === enrollment.gradingSystemId);
    if (!grading) return '';

    // Collect all sessions where this student was promoted, sorted oldest→newest
    const sessions = GRADING_SESSIONS
      .filter(s => s.results.some(r => r.studentId === studentId))
      .map(s => {
        const r = s.results.find(r => r.studentId === studentId);
        return { date: s.date, fromLevelId: r.fromLevelId, toLevelId: r.toLevelId };
      })
      .sort((a, b) => new Date(a.date) - new Date(b.date));

    const student = STUDENTS.find(s => s.id === studentId);
    const joinedAt = student?.joinedAt ? student.joinedAt.slice(0, 10) : null;

    // Build timeline nodes: [joined] → [promo1] → [promo2] → ... → [current]
    // Each node: { date, levelId, label, isStart, isEnd }
    const nodes = [];

    if (sessions.length === 0) {
      // No recorded promotions — show just current belt
      const level = grading.levels.find(l => l.id === enrollment.currentLevelId);
      if (!level) return '';
      return `
        <div class="card" style="margin-bottom:var(--sp-4)">
          <h3 class="card-title" style="margin-bottom:var(--sp-3)">Belt Promotion History</h3>
          <div style="display:flex;align-items:center;gap:var(--sp-3)">
            <div style="width:14px;height:14px;border-radius:50%;background:${level.color};border:2px solid var(--border);flex-shrink:0"></div>
            <div>
              ${BeltChip(enrollment.gradingSystemId, enrollment.currentLevelId, enrollment.currentStripes)}
              <span class="muted" style="font-size:12px;margin-left:var(--sp-2)">Current belt${joinedAt ? ' · joined ' + new Date(joinedAt).toLocaleDateString('en-GB', {month:'short', year:'numeric'}) : ''}</span>
            </div>
          </div>
          <div class="muted" style="font-size:12px;margin-top:var(--sp-3)">No promotion sessions recorded yet. Run a grading session to start the timeline.</div>
        </div>`;
    }

    // Start node — belt they had at first promotion (fromLevelId of earliest session)
    const startLevelId = sessions[0].fromLevelId;
    nodes.push({ date: joinedAt, levelId: startLevelId, isStart: true });

    // Promotion nodes
    for (const sess of sessions) {
      nodes.push({ date: sess.date, levelId: sess.toLevelId, isStart: false });
    }

    // Helper: ms between two ISO date strings
    function daysBetween(a, b) {
      if (!a || !b) return null;
      const diff = new Date(b) - new Date(a);
      return Math.round(diff / 86400000);
    }

    function durationLabel(days) {
      if (days === null) return '';
      if (days < 30) return `${days}d`;
      const months = Math.round(days / 30.4);
      if (months < 12) return `${months}mo`;
      const yrs = Math.floor(months / 12);
      const rem = months % 12;
      return rem ? `${yrs}y ${rem}mo` : `${yrs}y`;
    }

    const rows = nodes.map((node, i) => {
      const level = grading.levels.find(l => l.id === node.levelId);
      if (!level) return '';
      const isLight = level.color === '#f8fafc' || level.color === '#ffffff' || level.color === '#e2e8f0';
      const isLast  = i === nodes.length - 1;
      const dateStr = node.date ? new Date(node.date).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '—';

      // Duration spent at this belt (from this node's date to the next)
      const nextDate = nodes[i + 1]?.date;
      const days = daysBetween(node.date, nextDate);
      const durLabel = isLast
        ? durationLabel(daysBetween(node.date, new Date().toISOString().slice(0,10))) + ' · current'
        : days !== null ? durationLabel(days) : '';

      return `
        <div style="display:flex;gap:var(--sp-3);position:relative">
          <!-- Connector line -->
          ${!isLast ? `<div style="position:absolute;left:7px;top:22px;bottom:-8px;width:2px;background:var(--border);z-index:0"></div>` : ''}
          <!-- Dot -->
          <div style="width:16px;height:16px;border-radius:50%;background:${level.color};border:2px solid ${isLight ? '#cbd5e1' : level.color};flex-shrink:0;margin-top:3px;z-index:1;
            ${isLast ? 'box-shadow:0 0 0 3px ' + (isLight ? '#e2e8f0' : level.color + '33') : ''}"></div>
          <!-- Content -->
          <div style="padding-bottom:var(--sp-3);min-width:0">
            <div style="display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap">
              ${BeltChip(enrollment.gradingSystemId, node.levelId, isLast ? enrollment.currentStripes : 0)}
              ${node.isStart ? `<span style="font-size:11px;background:var(--surface-alt);padding:1px 7px;border-radius:999px;color:var(--text-muted)">started</span>` : ''}
              ${isLast && !node.isStart ? `<span style="font-size:11px;background:#dcfce7;padding:1px 7px;border-radius:999px;color:#16a34a">current</span>` : ''}
            </div>
            <div style="font-size:11px;color:var(--text-faint);margin-top:3px;display:flex;gap:var(--sp-3)">
              <span>${dateStr}</span>
              ${durLabel ? `<span style="color:var(--text-muted)">${durLabel}</span>` : ''}
            </div>
          </div>
        </div>`;
    });

    return `
      <div class="card" style="margin-bottom:var(--sp-4)">
        <div class="row-between" style="margin-bottom:var(--sp-3)">
          <h3 class="card-title" style="margin:0">Belt Promotion History</h3>
          <span class="muted" style="font-size:12px">${sessions.length} promotion${sessions.length !== 1 ? 's' : ''}</span>
        </div>
        <div style="padding-left:var(--sp-1)">
          ${rows.join('')}
        </div>
      </div>`;
  }

  // ---------- Achievement Badges -------------------------------------------

  function computeBadges(studentId) {
    const student     = STUDENTS.find(s => s.id === studentId);
    const enrollment  = ENROLLMENTS.find(e => e.studentId === studentId);
    const totalAttended = ATTENDANCE.filter(a => a.studentId === studentId && a.attended).length;
    const joinedMs    = student?.joinedAt ? new Date(student.joinedAt).getTime() : 0;
    const nowMs       = Date.now();
    const monthsJoined = joinedMs ? Math.floor((nowMs - joinedMs) / (30.5 * 24 * 60 * 60 * 1000)) : 0;
    const results     = COMPETITION_RESULTS.filter(r => r.studentId === studentId);
    const hasGold     = results.some(r => r.medal === 'gold');
    const hasPodium   = results.some(r => ['gold','silver','bronze'].includes(r.medal));
    const hasPromotion = !!enrollment?.lastPromotionAt;
    const gradingSystem = enrollment ? GRADING_SYSTEMS.find(g => g.id === enrollment.gradingSystemId) : null;
    const levelIdx    = gradingSystem ? gradingSystem.levels.findIndex(l => l.id === enrollment?.currentLevelId) : 0;

    return [
      { id: 'first-class',    icon: '🎯', label: 'First Step',        desc: 'Attended your first class',       earned: totalAttended >= 1 },
      { id: 'ten-classes',    icon: '💪', label: '10 Classes',         desc: 'Attended 10 classes',             earned: totalAttended >= 10 },
      { id: 'fifty-classes',  icon: '⚡', label: '50 Classes',         desc: 'Attended 50 classes',             earned: totalAttended >= 50 },
      { id: 'hundred-classes',icon: '🔥', label: '100 Classes',        desc: 'Attended 100 classes',            earned: totalAttended >= 100 },
      { id: 'two-hundred',    icon: '⭐', label: '200 Classes',        desc: 'Attended 200 classes',            earned: totalAttended >= 200 },
      { id: '3-months',       icon: '📅', label: '3 Month Member',     desc: 'Member for 3+ months',            earned: monthsJoined >= 3 },
      { id: '6-months',       icon: '📅', label: '6 Month Member',     desc: 'Member for 6+ months',            earned: monthsJoined >= 6 },
      { id: '1-year',         icon: '🏠', label: '1 Year Member',      desc: 'Member for 1+ year',              earned: monthsJoined >= 12 },
      { id: '2-years',        icon: '🏆', label: '2 Year Member',      desc: 'Member for 2+ years',             earned: monthsJoined >= 24 },
      { id: 'first-promo',    icon: '🥋', label: 'First Promotion',    desc: 'Earned first belt promotion',     earned: hasPromotion },
      { id: 'two-belts',      icon: '🎖', label: 'Double Stripe',      desc: 'Promoted at least twice',         earned: levelIdx >= 2 },
      { id: 'competitor',     icon: '🎽', label: 'Competitor',         desc: 'Entered at least one competition',earned: results.length > 0 },
      { id: 'podium',         icon: '🥈', label: 'Podium Finish',      desc: 'Top 3 placement in competition', earned: hasPodium },
      { id: 'gold',           icon: '🥇', label: 'Gold Medalist',      desc: 'Won gold in competition',         earned: hasGold },
    ];
  }

  function AchievementBadgesCard(studentId) {
    const badges  = computeBadges(studentId);
    const earned  = badges.filter(b => b.earned);
    const locked  = badges.filter(b => !b.earned);
    if (badges.length === 0) return '';

    const badgePill = (b) => `
      <div title="${b.desc}" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;opacity:${b.earned ? '1' : '0.28'};filter:${b.earned ? 'none' : 'grayscale(1)'}">
        <div style="font-size:28px;line-height:1">${b.icon}</div>
        <div style="font-size:10px;font-weight:600;text-align:center;color:${b.earned ? 'var(--text)' : 'var(--text-muted)'};line-height:1.3">${b.label}</div>
      </div>`;

    return `
      <div class="card" style="margin-top:var(--sp-4);margin-bottom:var(--sp-4)">
        <div class="row-between" style="margin-bottom:var(--sp-3)">
          <h3 class="card-title" style="margin:0">🏅 Achievements</h3>
          <span style="font-size:12px;color:var(--text-muted)">${earned.length} / ${badges.length} earned</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:var(--sp-4)">
          ${badges.map(b => badgePill(b)).join('')}
        </div>
      </div>`;
  }

  // -------------------------------------------------------------------------
  // Student Activity Log — unified chronological feed of significant events
  // Sources: join, grading promotions, coach notes, injuries, competition results,
  //          attendance milestones (1, 10, 25, 50, 100, 200 classes)

  function StudentActivityLog(studentId) {
    const student = STUDENTS.find(s => s.id === studentId);
    if (!student) return '';

    const events = [];

    // 1. Join date
    if (student.joinedAt) {
      events.push({
        date: student.joinedAt,
        icon: '🎉',
        color: '#7c3aed',
        title: 'Joined the academy',
        sub: '',
      });
    }

    // 2. Belt promotions (from GRADING_SESSIONS)
    const enrollment = ENROLLMENTS.find(e => e.studentId === studentId && e.sportId === 'sport-bjj');
    const grading = enrollment ? GRADING_SYSTEMS.find(g => g.id === enrollment.gradingSystemId) : null;
    GRADING_SESSIONS.forEach(sess => {
      const r = sess.results && sess.results.find(x => x.studentId === studentId);
      if (!r || !grading) return;
      const fromLevel = grading.levels.find(l => l.id === r.fromLevelId);
      const toLevel   = grading.levels.find(l => l.id === r.toLevelId);
      if (!toLevel) return;
      events.push({
        date: sess.date + 'T12:00:00Z',
        icon: '🥋',
        color: toLevel.color === '#f8fafc' || toLevel.color === '#ffffff' ? '#94a3b8' : toLevel.color,
        title: `Promoted to ${t(toLevel.name)}`,
        sub: fromLevel ? `From ${t(fromLevel.name)}` : '',
      });
    });

    // 3. Coach notes (from STUDENT_NOTES in-memory map)
    const notes = (STUDENT_NOTES[studentId] || []);
    notes.forEach(n => {
      const typeLabel = { '📝': 'Note', '📞': 'Call', '✉️': 'Email', '⚠': 'Concern' }[n.type] || 'Note';
      const icon = n.type || '📝';
      events.push({
        date: n.createdAt,
        icon,
        color: n.type === '⚠' ? '#dc2626' : '#6366f1',
        title: `${typeLabel} logged`,
        sub: n.text.length > 60 ? n.text.slice(0, 60) + '…' : n.text,
      });
    });

    // 4. Injuries (from STUDENT_INJURIES in-memory array)
    STUDENT_INJURIES.filter(i => i.studentId === studentId).forEach(inj => {
      events.push({
        date: inj.loggedAt || inj.date + 'T12:00:00Z',
        icon: '🩹',
        color: inj.status === 'active' ? '#dc2626' : '#16a34a',
        title: `${inj.type.charAt(0).toUpperCase() + inj.type.slice(1)} — ${inj.bodyPart}`,
        sub: inj.status === 'recovered' ? 'Recovered' : 'Active',
      });
    });

    // 5. Competition results
    COMPETITION_RESULTS.filter(r => r.studentId === studentId).forEach(r => {
      const evt = EVENTS.find(e => e.id === r.eventId);
      const medalEmoji = { gold: '🥇', silver: '🥈', bronze: '🥉' }[r.medal] || '🏅';
      events.push({
        date: r.loggedAt,
        icon: medalEmoji,
        color: r.medal === 'gold' ? '#d97706' : r.medal === 'silver' ? '#64748b' : r.medal === 'bronze' ? '#92400e' : '#6b7280',
        title: `${r.placement} · ${r.division}`,
        sub: evt ? evt.name : 'Competition',
      });
    });

    // 6. Attendance milestones — computed from ATTENDANCE sorted by class start time
    const milestoneThresholds = [1, 10, 25, 50, 100, 200];
    // Get all attended records for this student, sorted by class date
    const attendedClasses = ATTENDANCE
      .filter(a => a.studentId === studentId && a.attended)
      .map(a => {
        const cls = CLASSES.find(c => c.id === a.classId);
        return { date: cls?.startsAt || null };
      })
      .filter(a => a.date)
      .sort((a, b) => new Date(a.date) - new Date(b.date));

    milestoneThresholds.forEach(n => {
      if (attendedClasses.length >= n) {
        const cls = attendedClasses[n - 1];
        events.push({
          date: cls.date,
          icon: n >= 100 ? '💯' : '⭐',
          color: '#0891b2',
          title: `${n}${n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'} class attended`,
          sub: n === 1 ? 'First class!' : `Milestone reached`,
        });
      }
    });

    // 7. Grading log — stripe awards and quick promotions recorded via setStudentStripes / promoteStudent
    const gradingSystem = enrollment ? GRADING_SYSTEMS.find(g => g.id === enrollment.gradingSystemId) : null;
    GRADING_LOG.filter(g => g.studentId === studentId).forEach(g => {
      if (g.type === 'stripe') {
        const lvl = gradingSystem ? gradingSystem.levels.find(l => l.id === g.levelId) : null;
        const lvlName = lvl ? t(lvl.name) : 'current belt';
        events.push({
          date: g.date + 'T12:00:00Z',
          icon: '⬛',
          color: lvl?.color === '#f8fafc' || lvl?.color === '#ffffff' ? '#94a3b8' : (lvl?.color || '#374151'),
          title: `Stripe ${g.stripes} awarded`,
          sub: `${lvlName} — ${g.stripes} stripe${g.stripes !== 1 ? 's' : ''}`,
        });
      } else if (g.type === 'promotion') {
        const toLvl = gradingSystem ? gradingSystem.levels.find(l => l.id === g.levelId) : null;
        const fromLvl = gradingSystem ? gradingSystem.levels.find(l => l.id === g.fromLevelId) : null;
        events.push({
          date: g.date + 'T12:00:00Z',
          icon: '🥋',
          color: toLvl?.color === '#f8fafc' || toLvl?.color === '#ffffff' ? '#94a3b8' : (toLvl?.color || '#374151'),
          title: `Promoted to ${toLvl ? t(toLvl.name) : 'next belt'}`,
          sub: fromLvl ? `From ${t(fromLvl.name)}` : '',
        });
      }
    });

    if (events.length === 0) {
      return `<div class="card" style="margin-top:var(--sp-4);margin-bottom:var(--sp-4)">
        <h3 class="card-title">📅 Activity Log</h3>
        <div class="muted" style="font-size:13px">No activity recorded yet.</div>
      </div>`;
    }

    // Sort reverse-chronological
    events.sort((a, b) => new Date(b.date) - new Date(a.date));

    const MAX_DEFAULT = 10;
    const showAll = document.getElementById(`activity-log-all-${studentId}`)?.dataset.show === '1';
    const displayed = showAll ? events : events.slice(0, MAX_DEFAULT);
    const hiddenCount = events.length - MAX_DEFAULT;

    function row(ev) {
      const d = new Date(ev.date);
      const dateStr = isNaN(d) ? '—' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      const dotColor = ev.color && (ev.color.startsWith('#') || ev.color.startsWith('rgb')) ? ev.color : '#6366f1';
      return `<div style="display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-2) 0;border-bottom:1px solid var(--surface-alt,#f1f5f9)">
        <div style="width:32px;height:32px;border-radius:50%;background:${dotColor}18;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-top:2px">${ev.icon}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--text)">${ev.title}</div>
          ${ev.sub ? `<div style="font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ev.sub.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>` : ''}
        </div>
        <div style="font-size:11px;color:var(--text-faint,#9ca3af);white-space:nowrap;flex-shrink:0;margin-top:3px">${dateStr}</div>
      </div>`;
    }

    return `
      <div class="card" id="activity-log-all-${studentId}" data-show="${showAll ? '1' : '0'}" style="margin-top:var(--sp-4);margin-bottom:var(--sp-4)">
        <div class="row-between" style="margin-bottom:var(--sp-3)">
          <h3 class="card-title" style="margin:0">📅 Activity Log</h3>
          <span style="font-size:12px;color:var(--text-muted)">${events.length} events</span>
        </div>
        <div>${displayed.map(row).join('')}</div>
        ${!showAll && hiddenCount > 0 ? `
          <button class="btn btn-secondary" style="margin-top:var(--sp-3);font-size:12px;width:100%"
            onclick="document.getElementById('activity-log-all-${studentId}').dataset.show='1';
                     document.getElementById('activity-log-all-${studentId}').outerHTML=StudentActivityLog('${studentId}')">
            Show ${hiddenCount} more events
          </button>` : ''}
        ${showAll && events.length > MAX_DEFAULT ? `
          <button class="btn btn-secondary" style="margin-top:var(--sp-3);font-size:12px;width:100%"
            onclick="document.getElementById('activity-log-all-${studentId}').dataset.show='0';
                     document.getElementById('activity-log-all-${studentId}').outerHTML=StudentActivityLog('${studentId}')">
            Show less
          </button>` : ''}
      </div>`;
  }

  function promoteStudent(studentId, sportId) {
    const enrollment = ENROLLMENTS.find(e => e.studentId === studentId && e.sportId === sportId);
    if (!enrollment) return;
    const promo = computePromotionStatus(studentId, sportId);
    if (!promo || !promo.ready || !promo.nextLevel) return;
    const prevLevelId = enrollment.currentLevelId;
    enrollment.currentLevelId  = promo.nextLevel.id;
    enrollment.currentStripes  = 0;
    enrollment.levelSince      = new Date().toISOString();
    enrollment.lastPromotionAt = new Date().toISOString();
    GRADING_LOG.push({
      id: 'gl-' + Date.now(),
      studentId,
      sportId,
      type: 'promotion',
      fromLevelId: prevLevelId,
      levelId: promo.nextLevel.id,
      stripes: 0,
      date: new Date(CONFIG.today).toISOString().slice(0, 10),
    });
    persistData();
    renderApp();
  }

  function setStudentStripes(studentId, sportId, newCount) {
    const enr = ENROLLMENTS.find(e => e.studentId === studentId && e.sportId === sportId);
    if (!enr) return;
    const level = DB.level(enr.gradingSystemId, enr.currentLevelId);
    const max = level?.maxStripes ?? 4;
    const prev = enr.currentStripes;
    enr.currentStripes = Math.max(0, Math.min(max, newCount));
    // Log stripe awards (not removals)
    if (enr.currentStripes > prev) {
      GRADING_LOG.push({
        id: 'gl-' + Date.now(),
        studentId,
        sportId,
        type: 'stripe',
        levelId: enr.currentLevelId,
        stripes: enr.currentStripes,
        date: new Date(CONFIG.today).toISOString().slice(0, 10),
      });
    }
    persistData();
    document.getElementById('content').innerHTML = StudentReport(studentId);
  }

  function printStudentProgressReport(studentId) {
    const stu        = DB.student(studentId);
    if (!stu) return;
    const sportId    = 'sport-bjj';
    const enrollment = DB.enrollment(studentId, sportId);
    const grading    = enrollment ? DB.grading(enrollment.gradingSystemId) : null;
    const level      = enrollment ? DB.level(enrollment.gradingSystemId, enrollment.currentLevelId) : null;
    const sport      = SPORTS.find(s => s.id === sportId);
    const promotion  = computePromotionStatus(studentId, sportId);
    const badges     = computeBadges(studentId);
    const earnedBadges = badges.filter(b => b.earned);

    // ---- Attendance: last 8 weeks ----
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
    const todayMs = new Date(CONFIG.today).setHours(0, 0, 0, 0);
    const dow = new Date(CONFIG.today).getDay();
    const thisWeekStart = todayMs - dow * 86400000;
    const weeks = Array.from({ length: 8 }, (_, i) => {
      const wkStart = thisWeekStart - (7 - i) * WEEK_MS;
      const wkEnd   = wkStart + WEEK_MS;
      const count   = ATTENDANCE.filter(a => {
        if (!a.attended || a.studentId !== studentId) return false;
        const cls = CLASSES.find(c => c.id === a.classId);
        if (!cls) return false;
        const t = new Date(cls.startsAt).getTime();
        return t >= wkStart && t < wkEnd;
      }).length;
      const d = new Date(wkStart);
      const label = d.toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
      return { label, count };
    });
    const totalAttended = ATTENDANCE.filter(a => a.studentId === studentId && a.attended).length;
    const maxWkCount = Math.max(...weeks.map(w => w.count), 1);

    // ---- Mastery ----
    const mastered  = new Set(STUDENT_MASTERY[studentId] || []);
    const allItems  = CURRICULUM_ITEMS.filter(it => DB.section(it.sectionId)?.sportId === sportId);
    const masteryPct = allItems.length ? Math.round((mastered.size / allItems.length) * 100) : 0;

    // ---- Membership ----
    const plan = MEMBERSHIP_PLANS.find(p => p.id === (enrollment?.membership || 'plan-monthly'));

    // ---- Months ----
    const joinedMs    = stu.joinedAt ? new Date(stu.joinedAt).getTime() : 0;
    const monthsTotal = joinedMs ? Math.floor((Date.now() - joinedMs) / (30.5 * 24 * 3600000)) : 0;
    const monthsAtLvl = enrollment?.levelSince
      ? Math.floor((new Date(CONFIG.today) - new Date(enrollment.levelSince)) / (30 * 24 * 3600000)) : 0;

    // ---- Competition results ----
    const compResults = COMPETITION_RESULTS.filter(r => r.studentId === studentId);
    const medalEmoji = m => ({ gold:'🥇', silver:'🥈', bronze:'🥉' }[m] || '🎖');

    // ---- Promotion bars ----
    const rule = promotion?.rule;
    const classesPct  = rule ? Math.min(100, Math.round((promotion.actual.classesAttended / (rule.minClassesAtLevel || 1)) * 100)) : null;
    const monthsPct   = rule ? Math.min(100, Math.round((promotion.actual.monthsAtLevel   / (rule.minMonthsAtLevel  || 1)) * 100)) : null;
    const beltColor   = level?.color || '#0f172a';
    const beltText    = level?.textColor || '#ffffff';
    const isLight     = beltColor === '#f8fafc' || beltColor === '#ffffff';
    const levelName   = level ? t(level.name) : '—';
    const nextName    = promotion?.nextLevel ? t(promotion.nextLevel.name) : null;
    const today       = new Date().toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'numeric' });

    // ---- Week bar HTML ----
    const weekBarsHtml = weeks.map(w => {
      const pct = Math.round((w.count / maxWkCount) * 100);
      const bg  = w.count > 0 ? beltColor : '#e2e8f0';

    const classDate = new Date(cls.startsAt).toLocaleDateString('en-GB', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

    const cls = DB.class(classId);
    if (!cls) return `<div class="empty">Class not found</div>`;
    const inst = DB.instructor(cls.instructorId);
    const isCompleted = cls.status === 'completed';
    const bookings = BOOKINGS.filter(b => b.classId === cls.id && b.status === 'booked');
    const attendanceMap = ATTENDANCE.reduce((acc, a) => {
      if (a.classId === cls.id) acc[a.studentId] = a;
      return acc;

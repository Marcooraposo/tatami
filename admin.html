          <div class="faint" style="font-size:12px;margin-top:var(--sp-1)">${GRADING_SESSIONS.length} session${GRADING_SESSIONS.length !== 1 ? 's' : ''}</div>
        </div>
        <div class="card" style="flex:1;min-width:140px">
          <div style="font-size:22px;margin-bottom:var(--sp-2)">◉</div>
          <div style="font-size:28px;font-weight:700">${selectedCount}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-2)">Selected</div>
          <div class="faint" style="font-size:12px;margin-top:var(--sp-1)">for this session</div>
        </div>
        <div class="card" style="flex:1;min-width:140px;${beltTestRequests.length > 0 ? 'border:2px solid var(--accent)' : ''}">
          <div style="font-size:22px;margin-bottom:var(--sp-2)">🥋</div>
          <div style="font-size:28px;font-weight:700;color:${beltTestRequests.length > 0 ? 'var(--accent)' : 'var(--text)'}">${beltTestRequests.length}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-2)">Test requests</div>
          <div class="faint" style="font-size:12px;margin-top:var(--sp-1)">from students</div>
        </div>
      </div>

      ${beltTestRequests.length > 0 ? `
      <h3 class="h3" style="margin-bottom:var(--sp-3)">🥋 Student belt test requests</h3>
      <div class="card" style="padding:0;margin-bottom:var(--sp-5)">
        <div class="list">
          ${beltTestRequests.map(({ stu, enr, req, daysAgo }) => `
            <div class="list-row" style="cursor:pointer" onclick="go('students/${stu.id}')">
              <div class="avatar">${stu.initials}</div>
              <div style="flex:1">
                <div style="font-weight:600">${stu.name}</div>
                <div class="faint" style="font-size:12px">${stu.contact || ''}</div>
              </div>
              <div>${enr ? BeltChip(enr.gradingSystemId, enr.currentLevelId, enr.currentStripes) : ''}</div>
              <div style="font-size:12px;color:var(--text-muted);text-align:right;white-space:nowrap">
                ${daysAgo === 0 ? 'Today' : daysAgo === 1 ? 'Yesterday' : daysAgo + 'd ago'}
              </div>
              <div onclick="event.stopPropagation()">
                <button class="btn btn-sm" title="Dismiss request"
                  onclick="clearBeltTestRequest('${stu.id}')">✕ Dismiss</button>
              </div>
            </div>`).join('')}
        </div>
      </div>` : ''}

      <h3 class="h3" style="margin-bottom:var(--sp-3)">Promotion candidates</h3>
      <div class="card" style="padding:0;margin-bottom:var(--sp-5)">
        <div class="list">${readyRows}</div>
      </div>

      ${almostReadySection}

      <h3 class="h3" style="margin-bottom:var(--sp-3)">Past sessions</h3>
      ${sessionRows}
    `;
  }

  // ---------- Retention screen -----------------------------------------------

  // Adds a "Reached out" note to a student's contact log and persists.
  function retentionToggleFlagFilter(btn) {
    const list = document.getElementById('retention-list');
    if (!list) return;
    const active = btn.dataset.filterActive === '1';
    if (active) {
      btn.dataset.filterActive = '';
      btn.style.background = '';
      btn.style.color = '';
      list.querySelectorAll('.list-row').forEach(r => r.style.display = '');
    } else {
      btn.dataset.filterActive = '1';
      btn.style.background = 'var(--warn)';
      btn.style.color = '#fff';
      list.querySelectorAll('.list-row').forEach(r => {
        r.style.display = r.dataset.flagged === '1' ? '' : 'none';
      });
    }
  }

  function retentionAddNote(studentId, studentName) {
    // Delegates to the full contact-log form
    retentionShowContactForm(studentId);
  }

  function RetentionScreen() {
    const nowMs = new Date(CONFIG.today).getTime();
    const todayStr = new Date(CONFIG.today).toISOString().split('T')[0];

    // Load training holds from student-side localStorage
    let ALL_HOLDS = [];
    try { ALL_HOLDS = JSON.parse(localStorage.getItem('tatami_holds')) || []; } catch {}
    function getStudentActiveHold(studentId) {
      return ALL_HOLDS.find(h => h.studentId === studentId && h.status !== 'cancelled' && h.startDate <= todayStr && h.endDate >= todayStr);
    }
    function getStudentUpcomingHold(studentId) {
      return ALL_HOLDS.find(h => h.studentId === studentId && h.status !== 'cancelled' && h.startDate > todayStr);
    }

    const THRESHOLDS = [
      { days: 60, label: '60+ days', color: 'var(--danger)',  bg: '#fff1f2' },
      { days: 30, label: '30–59 days', color: 'var(--warn)',  bg: '#fff7ed' },
      { days: 14, label: '14–29 days', color: '#ca8a04',      bg: '#fefce8' },
    ];

    // For each student, find days since last attended class
    const studentStats = STUDENTS.map(stu => {
      const attended = ATTENDANCE.filter(a => a.studentId === stu.id && a.attended);
      const lastAttended = attended.reduce((latest, a) => {
        const cls = CLASSES.find(c => c.id === a.classId);
        if (!cls) return latest;
        const t = new Date(cls.startsAt).getTime();
        return t > latest ? t : latest;
      }, 0);
      const daysSince = lastAttended ? Math.floor((nowMs - lastAttended) / 86400000) : null;
      const enr = ENROLLMENTS.find(e => e.studentId === stu.id);
      const joinedDaysAgo = Math.floor((nowMs - new Date(stu.joinedAt).getTime()) / 86400000);
      const activeHold   = getStudentActiveHold(stu.id);
      const upcomingHold = getStudentUpcomingHold(stu.id);
      return { stu, enr, daysSince, totalAttended: attended.length, joinedDaysAgo, activeHold, upcomingHold };
    });

    // Only show students who joined >7 days ago and haven't attended in 14+ days (or never)
    const atRisk = studentStats
      .filter(s => s.joinedDaysAgo > 7 && (s.daysSince === null || s.daysSince >= 14))
      .sort((a, b) => (b.daysSince ?? 9999) - (a.daysSince ?? 9999));

    const active = studentStats.filter(s => s.daysSince !== null && s.daysSince < 14);

    function riskBand(daysSince) {
      if (daysSince === null || daysSince >= 60) return THRESHOLDS[0];
      if (daysSince >= 30) return THRESHOLDS[1];
      return THRESHOLDS[2];
    }

    // Build bulk-email mailto for all 30+ day lapsed students with a contact email
    const lapsedWithEmail = atRisk.filter(s => (s.daysSince ?? 999) >= 30 && s.stu.contact && s.stu.contact.includes('@'));
    const bulkBcc = lapsedWithEmail.map(s => encodeURIComponent(s.stu.contact)).join(',');
    const bulkSubject = encodeURIComponent('We miss you at ' + (ACADEMY.name || 'the academy') + '!');
    const bulkBody = encodeURIComponent(
      `Hi,\n\nWe noticed you haven't been in recently and wanted to check in.\n\n` +
      `We'd love to see you back on the mat. If anything has come up or you have any questions, feel free to reply to this email.\n\n` +
      `Your spot is waiting for you!\n\nSee you soon,\n${ACADEMY.name || 'The Team'}`
    );
    const bulkMailto = `mailto:?bcc=${bulkBcc}&subject=${bulkSubject}&body=${bulkBody}`;

    // Separate students on an active hold — they appear in their own section, not at-risk
    const onHoldIds = new Set(atRisk.filter(s => s.activeHold).map(s => s.stu.id));
    const atRiskNoHold = atRisk.filter(s => !s.activeHold);
    const onHoldStudents = atRisk.filter(s => s.activeHold);

    const rows = atRiskNoHold.map(({ stu, enr, daysSince, totalAttended, upcomingHold }) => {
      const band = riskBand(daysSince);
      const label = daysSince === null ? 'Never attended' : `${daysSince}d ago`;
      const firstName = stu.name.split(' ')[0];
      const emailSubject = encodeURIComponent(`Hey ${firstName}, we miss you!`);
      const emailBody = encodeURIComponent(
        `Hi ${firstName},\n\nWe noticed it's been a while since your last class and wanted to check in.\n\n` +
        `If you've been busy or something has come up, we completely understand. Your spot is always here when you're ready.\n\n` +
        `Let us know if there's anything we can do to help you get back on the mat!\n\nSee you soon 🥋\n${ACADEMY.name || 'The Team'}`
      );
      const mailtoHref = stu.contact && stu.contact.includes('@')
        ? `mailto:${encodeURIComponent(stu.contact)}?subject=${emailSubject}&body=${emailBody}`
        : null;

      const emailBtn = mailtoHref
        ? `<a href="${mailtoHref}"
             onclick="event.stopPropagation();retentionAddNote('${stu.id}', '${stu.name.replace(/'/g, "\\'")}')"
             style="text-decoration:none">
             <button class="btn btn-sm" title="Send re-engagement email" style="white-space:nowrap">✉ Email</button>
           </a>`
        : `<button class="btn btn-sm" disabled title="No email on file" style="opacity:0.4;white-space:nowrap">✉ Email</button>`;

      const noteBtn = `<button class="btn btn-sm" title="Log contact attempt"
        onclick="event.stopPropagation();retentionShowContactForm('${stu.id}')">📞 Log</button>`;

      const isFlagged = RETENTION_FLAGS.has(stu.id);
      const flagBtn = `<button class="btn btn-sm" title="${isFlagged ? 'Remove flag' : 'Flag for follow-up'}"
        onclick="event.stopPropagation();toggleRetentionFlag('${stu.id}')"
        style="font-size:14px;padding:2px 7px;${isFlagged ? 'background:var(--warn);color:#fff;border-color:var(--warn)' : 'opacity:0.4'}">🚩</button>`;

      return `
        <div id="retention-row-${stu.id}" class="list-row" data-flagged="${isFlagged ? '1' : '0'}" style="grid-template-columns:40px 1fr auto auto auto auto auto;cursor:pointer;${isFlagged ? 'background:#fffbeb' : ''}" onclick="go('students/${stu.id}')">
          <div class="avatar">${stu.initials}</div>
          <div class="rcf-name-col">
            <div style="font-weight:600">
              ${stu.name}
              ${isFlagged ? ' <span style="font-size:11px;color:var(--warn);font-weight:700">● Flagged</span>' : ''}
              ${upcomingHold ? ` <span style="font-size:11px;font-weight:700;color:#6366f1">⏳ Hold ${upcomingHold.startDate}–${upcomingHold.endDate}</span>` : ''}
            </div>
            <div class="faint" style="font-size:12px">${stu.contact || '<span style="color:var(--text-faint)">No email</span>'}</div>
            ${retentionContactBadge(stu.id)}
          </div>
          <div>${enr ? BeltChip(enr.gradingSystemId, enr.currentLevelId, enr.currentStripes) : ''}</div>
          <div style="font-size:12px;color:var(--text-muted);text-align:right">${totalAttended} classes total</div>
          <div>
            <span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;
              background:${band.bg};color:${band.color};white-space:nowrap">
              ${label}
            </span>
          </div>
          <div style="display:flex;gap:var(--sp-2);align-items:center" onclick="event.stopPropagation()">
            ${flagBtn}
            ${emailBtn}
            ${noteBtn}
          </div>
        </div>`;
    }).join('');

    const legendHtml = THRESHOLDS.map(t => `
      <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;margin-right:16px">
        <span style="width:10px;height:10px;border-radius:50%;background:${t.color}"></span>
        ${t.label}
      </span>`).join('');

    const bulkBtn = lapsedWithEmail.length > 0
      ? `<a href="${bulkMailto}" style="text-decoration:none">
           <button class="btn btn-secondary" title="Open pre-filled email to all 30+ day lapsed students">
             ✉ Email all lapsed (${lapsedWithEmail.length})
           </button>
         </a>`
      : '';

    const flaggedCount = atRisk.filter(s => RETENTION_FLAGS.has(s.stu.id)).length;

    // Build "On Hold" rows section
    const holdRows = onHoldStudents.map(({ stu, enr, activeHold }) => `
      <div class="list-row" style="grid-template-columns:40px 1fr auto auto;cursor:pointer" onclick="go('students/${stu.id}')">
        <div class="avatar">${stu.initials}</div>
        <div>
          <div style="font-weight:600">${stu.name}</div>
          <div style="font-size:12px;color:var(--text-muted)">
            🏖 ${activeHold.startDate} → ${activeHold.endDate}${activeHold.reason ? ` · ${activeHold.reason}` : ''}
          </div>
        </div>
        <div>${enr ? BeltChip(enr.gradingSystemId, enr.currentLevelId, enr.currentStripes) : ''}</div>
        <div>
          <span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;
            background:#ede9fe;color:#6d28d9;white-space:nowrap">
            🏖 On hold
          </span>
        </div>
      </div>`).join('');

    return `
      <div style="max-width:900px;margin:0 auto">
        <div class="row-between" style="margin-bottom:var(--sp-5)">
          <div>
            <h1 class="h1" style="margin-bottom:var(--sp-1)">Retention</h1>
            <p class="muted">Students who haven't attended in the last 14 days.</p>
          </div>
          <div style="display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap">
            ${bulkBtn}
            <div class="card" style="padding:var(--sp-3) var(--sp-4);display:flex;gap:var(--sp-5);align-items:center">
              <div style="text-align:center">
                <div style="font-size:22px;font-weight:700;color:var(--success)">${active.length}</div>
                <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Active</div>
              </div>
              <div style="text-align:center">
                <div style="font-size:22px;font-weight:700;color:var(--warn)">${atRiskNoHold.filter(s => (s.daysSince??999) >= 14 && (s.daysSince??999) < 60).length}</div>
                <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase">At risk</div>
              </div>
              <div style="text-align:center">
                <div style="font-size:22px;font-weight:700;color:var(--danger)">${atRiskNoHold.filter(s => (s.daysSince??999) >= 60).length}</div>
                <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Lapsed</div>
              </div>
              ${onHoldStudents.length > 0 ? `
              <div style="text-align:center;border-left:1px solid var(--border);padding-left:var(--sp-5)">
                <div style="font-size:22px;font-weight:700;color:#6d28d9">🏖 ${onHoldStudents.length}</div>
                <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase">On hold</div>
              </div>` : ''}
              <div style="text-align:center;border-left:1px solid var(--border);padding-left:var(--sp-5)">
                <div style="font-size:22px;font-weight:700;color:#b45309">🚩 ${flaggedCount}</div>
                <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Flagged</div>
              </div>
            </div>
          </div>
        </div>

        <div style="margin-bottom:var(--sp-4);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3)">
          <div>${legendHtml}</div>
          ${flaggedCount > 0
            ? `<button class="btn btn-sm" id="retention-flag-filter"
                 onclick="retentionToggleFlagFilter(this)"
                 style="font-size:12px">🚩 Show flagged only (${flaggedCount})</button>`
            : ''}
        </div>

        ${atRiskNoHold.length === 0
          ? `<div class="card"><div class="muted" style="padding:var(--sp-4);text-align:center">🎉 All students have attended recently.</div></div>`
          : `<div class="card" style="padding:0"><div class="list" id="retention-list">${rows}</div></div>`}

        ${onHoldStudents.length > 0 ? `
          <div style="margin-top:var(--sp-5)">
            <div class="row-between" style="margin-bottom:var(--sp-3)">
              <h2 style="font-size:15px;font-weight:700;margin:0">🏖 Students on training hold</h2>
              <span style="font-size:12px;color:var(--text-muted)">Excluded from at-risk list</span>
            </div>
            <div class="card" style="padding:0"><div class="list">${holdRows}</div></div>
          </div>` : ''}

        ${(() => {
          const cutoff = new Date(Date.now() - 30 * 86400000).toISOString();
          const recent = RETENTION_CONTACTS.filter(c => c.createdAt >= cutoff)
            .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
          if (!recent.length) return '';
          const outcomeGroups = {};
          recent.forEach(c => { (outcomeGroups[c.outcome] = outcomeGroups[c.outcome] || []).push(c); });
          const summaryChips = Object.entries(outcomeGroups).map(([outcome, list]) => {
            const style = RC_OUTCOME_STYLE[outcome] || RC_OUTCOME_STYLE.pending;
            return `<span style="font-size:12px;padding:3px 10px;border-radius:12px;font-weight:600;${style}">${RC_OUTCOME_LABEL[outcome]||outcome}: ${list.length}</span>`;
          }).join(' ');
          const contactRows = recent.slice(0, 20).map(c => {
            const stu  = STUDENTS.find(s => s.id === c.studentId);
            if (!stu) return '';
            const d    = new Date(c.createdAt);
            const daysAgo = Math.floor((Date.now() - d.getTime()) / 86400000);
            const when = daysAgo === 0 ? 'Today' : daysAgo === 1 ? 'Yesterday' : daysAgo + 'd ago';
            const style = RC_OUTCOME_STYLE[c.outcome] || RC_OUTCOME_STYLE.pending;
            return `
              <div class="list-row" style="grid-template-columns:40px 1fr auto auto auto;cursor:pointer" onclick="go('students/${c.studentId}')">
                <div class="avatar">${stu.initials}</div>
                <div>
                  <div style="font-weight:600;font-size:14px">${stu.name}</div>
                  ${c.notes ? `<div class="faint" style="font-size:12px">${c.notes}</div>` : ''}
                </div>
                <div style="font-size:12px;color:var(--text-muted)">${RC_METHOD_ICON[c.method]||'📞'} ${c.method}</div>
                <div><span style="font-size:11px;padding:2px 9px;border-radius:10px;font-weight:700;${style}">${RC_OUTCOME_LABEL[c.outcome]||c.outcome}</span></div>
                <div style="font-size:12px;color:var(--text-faint);white-space:nowrap">${when}</div>
              </div>`;
          }).join('');
          return `
            <div style="margin-top:var(--sp-6)">
              <div class="row-between" style="margin-bottom:var(--sp-3)">
                <h2 style="font-size:15px;font-weight:700;margin:0">📋 Recent outreach <span style="font-size:12px;font-weight:400;color:var(--text-muted)">(last 30 days)</span></h2>
                <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap">${summaryChips}</div>
              </div>
              <div class="card" style="padding:0"><div class="list">${contactRows}</div></div>
            </div>`;
        })()}
      </div>`;
  }

  // ---------- Instructor workload -------------------------------------------

  function InstructorScreen() {
    const today      = new Date(CONFIG.today);
    const todayIso   = CONFIG.today.toISOString();
    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1).toISOString();
    const monthEnd   = new Date(today.getFullYear(), today.getMonth() + 1, 0, 23, 59, 59).toISOString();
    const DOW_LABELS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

    const stats = INSTRUCTORS.map(inst => {
      const allClasses  = CLASSES.filter(c => c.instructorId === inst.id);
      const completed   = allClasses.filter(c => c.startsAt < todayIso);
      const upcoming    = allClasses.filter(c => c.startsAt >= todayIso);
      const thisMonth   = completed.filter(c => c.startsAt >= monthStart && c.startsAt <= monthEnd);
      const hoursThisMonth = thisMonth.reduce((sum, c) => sum + (c.durationMin || 60) / 60, 0);
      const hoursTaught    = completed.reduce((sum, c) => sum + (c.durationMin || 60) / 60, 0);

      let totalBooked = 0, totalAttended = 0;
      completed.forEach(c => {
        totalBooked   += BOOKINGS.filter(b => b.classId === c.id && b.status === 'booked').length;
        totalAttended += ATTENDANCE.filter(a => a.classId === c.id && a.attended).length;
      });
      const fillRate    = totalBooked > 0 ? Math.round(totalAttended / totalBooked * 100) : null;
      const templateDows = [...new Set(RECURRING_TEMPLATES.filter(rt => rt.instructorId === inst.id).map(rt => rt.dow))];
      const classTypes   = [...new Set(allClasses.map(c => c.classType))].join(', ');

      // 8-week sparkline: attended count per week
      const nowWeek = scheduleStartOfWeek(today);
      const sparkData = Array.from({length: 8}, (_, i) => {
        const wStart = new Date(nowWeek.getTime() - (7 - i) * 7 * 86400000);
        const wEnd   = new Date(wStart.getTime() + 7 * 86400000);
        const wClasses = completed.filter(c => c.startsAt >= wStart.toISOString() && c.startsAt < wEnd.toISOString());
        return ATTENDANCE.filter(a => wClasses.some(c => c.id === a.classId) && a.attended).length;
      });

      return { inst, completed, upcoming, thisMonth, hoursThisMonth, hoursTaught, totalAttended, fillRate, templateDows, classTypes, sparkData };
    });

    const totalHoursThisMonth     = stats.reduce((s, r) => s + r.hoursThisMonth, 0);
    const totalClassesThisMonth   = stats.reduce((s, r) => s + r.thisMonth.length, 0);
    const totalAttendedThisMonth  = stats.reduce((s, r) => {
      const ids = r.thisMonth.map(c => c.id);
      return s + ATTENDANCE.filter(a => ids.includes(a.classId) && a.attended).length;
    }, 0);

    function InstructorCard(s) {
      const { inst, completed, upcoming, thisMonth, hoursThisMonth, hoursTaught, totalAttended, fillRate, templateDows, classTypes, sparkData } = s;
      const payRate      = getPayRate(inst.id);
      const monthPayCents = Math.round(hoursThisMonth * payRate * 100);
      const maxSpark  = Math.max(...sparkData, 1);
      const sparkBars = sparkData.map((v, i) => {
        const h = Math.max(Math.round((v / maxSpark) * 32), 2);
        return `<div style="width:8px;height:${h}px;background:${i===7?'var(--accent)':'var(--border)'};border-radius:2px;align-self:flex-end" title="${v} attended"></div>`;
      }).join('');

      const dowDots = DOW_LABELS.map((label, dow) => {
        const active = templateDows.includes(dow);
        return `<span style="width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:${active?'var(--accent)':'var(--bg-alt)'};color:${active?'white':'var(--text-muted)'}">${label}</span>`;
      }).join('');

      const fillColor = fillRate === null ? 'var(--text-muted)' : fillRate >= 70 ? 'var(--success)' : fillRate >= 40 ? 'var(--warn)' : 'var(--danger)';

      return `
        <div class="card" style="margin-bottom:var(--sp-4);cursor:pointer" onclick="go('instructors/${inst.id}')">
          <div style="display:flex;gap:var(--sp-5);align-items:flex-start;flex-wrap:wrap">
            <div style="display:flex;gap:var(--sp-3);align-items:center;min-width:170px">
              <div class="avatar" style="width:44px;height:44px;font-size:16px;flex-shrink:0">${inst.initials}</div>
              <div>
                <div style="font-weight:700;font-size:15px">${inst.name}</div>
                ${classTypes ? `<div class="faint" style="font-size:12px;margin-top:2px">${classTypes}</div>` : ''}
                <div style="display:flex;gap:3px;margin-top:6px">${dowDots}</div>
              </div>
            </div>
            <div style="flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:var(--sp-3)">
              <div style="text-align:center;padding:var(--sp-2) var(--sp-3);background:var(--bg-alt);border-radius:var(--radius)">
                <div style="font-size:22px;font-weight:700">${completed.length}</div>
                <div style="font-size:10px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Taught</div>
              </div>
              <div style="text-align:center;padding:var(--sp-2) var(--sp-3);background:var(--bg-alt);border-radius:var(--radius)">
                <div style="font-size:22px;font-weight:700">${Math.round(hoursTaught)}</div>
                <div style="font-size:10px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Hours</div>
              </div>
              <div style="text-align:center;padding:var(--sp-2) var(--sp-3);background:var(--bg-alt);border-radius:var(--radius)">
                <div style="font-size:22px;font-weight:700">${upcoming.length}</div>
                <div style="font-size:10px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Upcoming</div>
              </div>
              <div style="text-align:center;padding:var(--sp-2) var(--sp-3);background:var(--bg-alt);border-radius:var(--radius)">
                <div style="font-size:22px;font-weight:700;color:${fillColor}">${fillRate !== null ? fillRate + '%' : '—'}</div>
                <div style="font-size:10px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Avg fill</div>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
              <div style="display:flex;align-items:flex-end;gap:3px;height:36px">${sparkBars}</div>
              <div style="font-size:10px;color:var(--text-muted)">8-wk attendance</div>
            </div>
          </div>
          <div style="margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--border);display:flex;gap:var(--sp-5);flex-wrap:wrap;align-items:center">
            ${thisMonth.length ? `
              <span style="font-size:12px;color:var(--text-muted)">This month:</span>
              <span style="font-size:12px"><strong>${thisMonth.length}</strong> classes</span>
              <span style="font-size:12px"><strong>${hoursThisMonth.toFixed(1)}</strong> hours</span>
              <span style="font-size:12px;color:var(--danger)"><strong>€${(monthPayCents/100).toFixed(0)}</strong> payroll</span>
            ` : `<span style="font-size:12px;color:var(--text-muted)">No classes this month</span>`}
            <span style="margin-left:auto;display:flex;align-items:center;gap:var(--sp-2)">
              <span style="font-size:11px;color:var(--text-muted)">Pay rate:</span>
              <input type="number" min="0" step="1"
                style="width:60px;font-size:12px;padding:2px 6px;border:1px solid var(--border);border-radius:6px;text-align:right"
                value="${payRate}"
                onchange="savePayRate('${inst.id}', this.value)" />
              <span style="font-size:11px;color:var(--text-muted)">€/hr</span>
            </span>
          </div>
        </div>`;
    }

    return `
      <div style="max-width:960px;margin:0 auto">
        <div class="row-between" style="margin-bottom:var(--sp-5)">
          <div>
            <h1 class="h1" style="margin-bottom:var(--sp-1)">${tr('screen.instructors')}</h1>
            <p class="muted">Workload and attendance summary per instructor.</p>
          </div>
        </div>
        <div style="display:flex;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-6)">
          <div class="card" style="flex:1;min-width:120px;text-align:center">
            <div style="font-size:28px;font-weight:700">${INSTRUCTORS.length}</div>
            <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;margin-top:var(--sp-1)">Instructors</div>
          </div>
          <div class="card" style="flex:1;min-width:120px;text-align:center">
            <div style="font-size:28px;font-weight:700">${totalClassesThisMonth}</div>
            <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;margin-top:var(--sp-1)">Classes this month</div>
          </div>
          <div class="card" style="flex:1;min-width:120px;text-align:center">
            <div style="font-size:28px;font-weight:700">${Math.round(totalHoursThisMonth)}</div>
            <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;margin-top:var(--sp-1)">Hours this month</div>
          </div>
          <div class="card" style="flex:1;min-width:120px;text-align:center">
            <div style="font-size:28px;font-weight:700">${totalAttendedThisMonth}</div>
            <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;margin-top:var(--sp-1)">Check-ins this month</div>
          </div>
        </div>
        ${stats.map(s => InstructorCard(s)).join('')}
      </div>`;
  }

  // ---------- Instructor Detail -----------------------------------------------

  function InstructorDetail(instId) {
    const inst = INSTRUCTORS.find(i => i.id === instId);
    if (!inst) return `<div class="card"><p class="muted">Instructor not found.</p><a href="#/instructors">← Back</a></div>`;

    const today      = new Date(CONFIG.today);
    const todayIso   = CONFIG.today.toISOString();
    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1).toISOString();
    const monthEnd   = new Date(today.getFullYear(), today.getMonth() + 1, 0, 23, 59, 59).toISOString();

    const allClasses     = CLASSES.filter(c => c.instructorId === instId).sort((a,b) => b.startsAt.localeCompare(a.startsAt));
    const past           = allClasses.filter(c => c.startsAt < todayIso);
    const upcoming       = allClasses.filter(c => c.startsAt >= todayIso).reverse(); // soonest first
    const thisMonth      = past.filter(c => c.startsAt >= monthStart && c.startsAt <= monthEnd);
    const hoursTaught    = past.reduce((s, c) => s + (c.durationMin || 60) / 60, 0);
    const hoursThisMonth = thisMonth.reduce((s, c) => s + (c.durationMin || 60) / 60, 0);

    let totalBooked = 0, totalAttended = 0;
    past.forEach(c => {
      totalBooked   += BOOKINGS.filter(b => b.classId === c.id && b.status === 'booked').length;
      totalAttended += ATTENDANCE.filter(a => a.classId === c.id && a.attended).length;
    });
    const fillRate = totalBooked > 0 ? Math.round(totalAttended / totalBooked * 100) : null;
    const fillColor = fillRate === null ? 'var(--text-muted)' : fillRate >= 70 ? 'var(--success)' : fillRate >= 40 ? 'var(--warn)' : 'var(--danger)';

    const payRate       = getPayRate(instId);
    const monthPayCents = Math.round(hoursThisMonth * payRate * 100);

    // Ratings from CLASS_RATINGS
    const ratedClassIds = past.map(c => c.id);
    let allRatings = [];
    ratedClassIds.forEach(cid => {
      const r = (CLASS_RATINGS[cid] || []);
      r.forEach(rv => allRatings.push({ ...rv, classId: cid }));
    });
    const avgRating = allRatings.length ? (allRatings.reduce((s, r) => s + r.stars, 0) / allRatings.length).toFixed(1) : null;
    const starCounts = [1,2,3,4,5].map(n => allRatings.filter(r => r.stars === n).length);
    const recentComments = allRatings.filter(r => r.comment).sort((a,b) => (b.ratedAt||'').localeCompare(a.ratedAt||'')).slice(0,8);

    // Class types taught
    const classTypes = [...new Set(allClasses.map(c => c.classType))];

    // Recurring slots
    const templates = RECURRING_TEMPLATES.filter(rt => rt.instructorId === instId);
    const DOW_LABELS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    // 8-week sparkline
    const nowWeek   = scheduleStartOfWeek(today);
    const sparkData = Array.from({length: 8}, (_, i) => {
      const wStart = new Date(nowWeek.getTime() - (7 - i) * 7 * 86400000);
      const wEnd   = new Date(wStart.getTime() + 7 * 86400000);
      const wCls   = past.filter(c => c.startsAt >= wStart.toISOString() && c.startsAt < wEnd.toISOString());
      return ATTENDANCE.filter(a => wCls.some(c => c.id === a.classId) && a.attended).length;
    });
    const maxSpark = Math.max(...sparkData, 1);
    const sparkBars = sparkData.map((v, i) => {
      const h = Math.max(Math.round((v / maxSpark) * 48), 3);
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
        <div style="font-size:9px;color:${i===7?'var(--accent)':'var(--text-faint)'}">${v||''}</div>
        <div style="width:100%;height:${h}px;background:${i===7?'var(--accent)':'var(--border)'};border-radius:2px"></div>
      </div>`;
    }).join('');

    // Recent classes table (last 15)
    const recentClasses = past.slice(0, 15);
    const classRows = recentClasses.map(c => {
      const bk = BOOKINGS.filter(b => b.classId === c.id && b.status === 'booked').length;
      const at = ATTENDANCE.filter(a => a.classId === c.id && a.attended).length;
      const d  = new Date(c.startsAt);
      const dateStr = d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
      const statusBadge = c.status === 'completed'
        ? `<span class="badge" style="background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0">✓ Done</span>`
        : c.status === 'cancelled'
        ? `<span class="badge" style="background:#fff1f2;color:#dc2626;border:1px solid #fecaca">Cancelled</span>`
        : `<span class="badge badge-info">Upcoming</span>`;
      return `<tr style="border-bottom:1px solid var(--border)" onclick="go('classes/${c.id}')" style="cursor:pointer">
        <td style="padding:var(--sp-2) var(--sp-3);font-size:13px">${dateStr}</td>
        <td style="padding:var(--sp-2) var(--sp-3);font-size:13px;font-weight:600">
          <a href="#/classes/${c.id}" style="color:var(--accent);text-decoration:none" onclick="event.stopPropagation()">${c.classType}</a>
        </td>
        <td style="padding:var(--sp-2) var(--sp-3);font-size:13px">${statusBadge}</td>
        <td style="padding:var(--sp-2) var(--sp-3);font-size:13px;text-align:center">${c.status === 'completed' ? at : bk}</td>
        <td style="padding:var(--sp-2) var(--sp-3);font-size:13px;text-align:center">${c.capacity || '—'}</td>
      </tr>`;
    }).join('');

    // Upcoming classes
    const upcomingRows = upcoming.slice(0, 8).map(c => {
      const bk = BOOKINGS.filter(b => b.classId === c.id && b.status === 'booked').length;
      const d  = new Date(c.startsAt);
      const dateStr  = d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
      const timeStr  = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
      const daysTo   = Math.ceil((d.getTime() - today.getTime()) / 86400000);
      const countdown = daysTo === 0 ? 'Today' : daysTo === 1 ? 'Tomorrow' : `in ${daysTo}d`;
      return `<div class="list-row" onclick="go('classes/${c.id}')" style="cursor:pointer">
        <div>
          <div style="font-weight:600;font-size:13px">${c.classType}</div>
          <div class="faint" style="font-size:12px">${dateStr} · ${timeStr} · ${c.durationMin}min</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:12px;color:var(--accent)">${countdown}</div>
          <div class="faint" style="font-size:11px">${bk}/${c.capacity} booked</div>
        </div>
      </div>`;
    }).join('');

    // Recurring schedule
    const tplRows = templates.map(rt => {
      const dow = DOW_LABELS[rt.dow] || '?';
      return `<div style="display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-2) 0;border-bottom:1px solid var(--border);font-size:13px">
        <span style="min-width:80px;font-weight:600;color:var(--accent)">${dow}</span>
        <span>${rt.startsAt}</span>
        <span style="font-size:11px;padding:2px 8px;background:var(--surface-alt);border-radius:10px">${rt.classType}</span>
        <span class="faint">${rt.durationMin}min · cap ${rt.capacity}</span>
      </div>`;
    }).join('') || `<div class="muted" style="font-size:13px;padding:var(--sp-2) 0">No recurring slots assigned.</div>`;

    // Ratings star bars
    const maxStarCount = Math.max(...starCounts, 1);
    const starRows = [5,4,3,2,1].map(n => {
      const count = starCounts[n-1];
      const pct   = Math.round(count / allRatings.length * 100) || 0;
      return `<div style="display:flex;align-items:center;gap:var(--sp-2);font-size:12px">
        <span style="min-width:20px;font-weight:600">${n}★</span>
        <div style="flex:1;height:8px;background:var(--surface-alt);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${n>=4?'#f59e0b':n===3?'var(--warn)':'var(--danger)'};border-radius:4px"></div>
        </div>
        <span style="min-width:24px;color:var(--text-muted)">${count}</span>
      </div>`;
    }).join('');

    return `
      <div style="max-width:900px;margin:0 auto">
        <div class="row-between" style="margin-bottom:var(--sp-5)">
          <div style="display:flex;gap:var(--sp-3);align-items:center">
            <button class="btn btn-secondary" onclick="go('instructors')" style="font-size:13px">← Instructors</button>
            <div class="avatar" style="width:48px;height:48px;font-size:18px">${inst.initials}</div>
            <div>
              <h1 class="h1" style="margin:0">${inst.name}</h1>
              <div class="faint" style="font-size:13px">${classTypes.join(' · ') || 'No classes yet'}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:var(--sp-2)">
            <span style="font-size:12px;color:var(--text-muted)">Pay rate:</span>
            <input id="inst-pay-${instId}" type="number" min="0" step="1"
              style="width:65px;font-size:13px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;text-align:right"
              value="${payRate}"
              onchange="savePayRate('${instId}', this.value)" />
            <span style="font-size:12px;color:var(--text-muted)">€/hr</span>
          </div>
        </div>

        <!-- Stat cards -->
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-5)">
          <div class="card" style="text-align:center;padding:var(--sp-3)">
            <div style="font-size:26px;font-weight:700">${past.length}</div>
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:600">Classes taught</div>
          </div>
          <div class="card" style="text-align:center;padding:var(--sp-3)">
            <div style="font-size:26px;font-weight:700">${Math.round(hoursTaught)}</div>
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:600">Hours total</div>
          </div>
          <div class="card" style="text-align:center;padding:var(--sp-3)">
            <div style="font-size:26px;font-weight:700;color:${fillColor}">${fillRate !== null ? fillRate + '%' : '—'}</div>
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:600">Avg fill rate</div>
          </div>
          <div class="card" style="text-align:center;padding:var(--sp-3)">
            <div style="font-size:26px;font-weight:700">${upcoming.length}</div>
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:600">Upcoming</div>
          </div>
          <div class="card" style="text-align:center;padding:var(--sp-3)">
            <div style="font-size:26px;font-weight:700;color:var(--danger)">€${(monthPayCents/100).toFixed(0)}</div>
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:600">Payroll this mo</div>
          </div>
          ${avgRating ? `<div class="card" style="text-align:center;padding:var(--sp-3)">
            <div style="font-size:26px;font-weight:700;color:#f59e0b">${avgRating}★</div>
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:600">Avg rating</div>
          </div>` : ''}
        </div>

        <!-- 8-week sparkline -->
        <div class="card" style="margin-bottom:var(--sp-4)">
          <div style="font-weight:600;font-size:13px;margin-bottom:var(--sp-3)">Attendance — last 8 weeks</div>
          <div style="display:flex;gap:4px;align-items:flex-end;height:60px">
            ${sparkBars}
          </div>
        </div>

        <div class="grid-2">
          <div class="stack">

            <!-- Upcoming classes -->
            <div class="card">
              <h3 class="card-title" style="margin-bottom:var(--sp-3)">Upcoming classes (${upcoming.length})</h3>
              ${upcoming.length === 0
                ? `<div class="muted" style="font-size:13px">No upcoming classes scheduled.</div>`
                : upcomingRows}
              ${upcoming.length > 8 ? `<div class="faint" style="font-size:12px;margin-top:var(--sp-2)">+${upcoming.length-8} more</div>` : ''}
            </div>

            <!-- Recurring schedule -->
            <div class="card">
              <h3 class="card-title" style="margin-bottom:var(--sp-2)">Recurring schedule</h3>
              ${tplRows}
            </div>

          </div>
          <div class="stack">

            <!-- Ratings -->
            <div class="card">
              <h3 class="card-title" style="margin-bottom:var(--sp-3)">Student ratings</h3>
              ${allRatings.length === 0
                ? `<div class="muted" style="font-size:13px">No ratings yet.</div>`
                : `<div style="display:flex;gap:var(--sp-4);align-items:center;margin-bottom:var(--sp-3)">
                    <div style="font-size:40px;font-weight:700;color:#f59e0b;line-height:1">${avgRating}</div>
                    <div style="flex:1">
                      <div style="font-size:11px;color:var(--text-muted);margin-bottom:var(--sp-2)">${allRatings.length} rating${allRatings.length!==1?'s':''}</div>
                      <div class="stack" style="gap:4px">${starRows}</div>
                    </div>
                  </div>
                  ${recentComments.length ? `
                    <div style="border-top:1px solid var(--border);padding-top:var(--sp-3)">
                      <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:var(--sp-2)">Recent comments</div>
                      <div class="stack" style="gap:var(--sp-2)">
                        ${recentComments.map(r => {
                          const cls = CLASSES.find(c => c.id === r.classId);
                          const clsLabel = cls ? cls.classType : 'Class';
                          return `<div style="background:var(--surface-alt);border-radius:6px;padding:var(--sp-2) var(--sp-3)">
                            <div style="font-size:11px;color:var(--text-muted);margin-bottom:2px">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)} · ${clsLabel}</div>
                            <div style="font-size:13px">"${r.comment}"</div>
                          </div>`;
                        }).join('')}
                      </div>
                    </div>` : ''}`}
            </div>

          </div>
        </div>

        <!-- Class history -->
        <div class="card" style="margin-top:var(--sp-4);padding:0;overflow:hidden">
          <div style="padding:var(--sp-4) var(--sp-4) 0;font-weight:600;font-size:14px">Recent class history</div>
          ${recentClasses.length === 0
            ? `<div class="muted" style="padding:var(--sp-4)">No classes yet.</div>`
            : `<div style="overflow-x:auto">
              <table style="width:100%;border-collapse:collapse;font-size:13px">
                <thead>
                  <tr style="border-bottom:1px solid var(--border)">
                    <th style="text-align:left;padding:var(--sp-2) var(--sp-3);font-size:11px;color:var(--text-muted);font-weight:600">Date</th>
                    <th style="text-align:left;padding:var(--sp-2) var(--sp-3);font-size:11px;color:var(--text-muted);font-weight:600">Class</th>
                    <th style="text-align:left;padding:var(--sp-2) var(--sp-3);font-size:11px;color:var(--text-muted);font-weight:600">Status</th>
                    <th style="text-align:center;padding:var(--sp-2) var(--sp-3);font-size:11px;color:var(--text-muted);font-weight:600">Attended</th>
                    <th style="text-align:center;padding:var(--sp-2) var(--sp-3);font-size:11px;color:var(--text-muted);font-weight:600">Capacity</th>
                  </tr>
                </thead>
                <tbody>${classRows}</tbody>
              </table>
            </div>
            ${past.length > 15 ? `<div class="faint" style="font-size:12px;padding:var(--sp-3) var(--sp-4)">Showing 15 of ${past.length} classes</div>` : ''}`}
        </div>
      </div>`;
  }

  // ---------- Objectives (weekly + per-class) --------------------------------
  //
  // WEEKLY_PLAN  — one per week; defines the focus for the whole week
  //   { id, weekKey, sections: [{ sectionId, itemIds: [] }] }
  //
  // CLASS_OBJECTIVES — one per class instance; derived from weekly plan,
  //   filtered by audience + complexity; can be overridden per class
  //   Stored on cls.objectiveItemIds (array of CURRICULUM_ITEMS ids)

  const OBJECTIVES_KEY  = 'tatami_weekly_plan';
  let WEEKLY_PLANS      = [];

  function loadObjectives() {
    try { WEEKLY_PLANS = JSON.parse(localStorage.getItem(OBJECTIVES_KEY)) || []; } catch { WEEKLY_PLANS = []; }
  }
  function saveWeeklyPlans() { try { localStorage.setItem(OBJECTIVES_KEY, JSON.stringify(WEEKLY_PLANS)); } catch {} }

  // Sunday of the week as 'YYYY-MM-DD' — matches scheduleStartOfWeek()
  function weekKey(date) {
    const d = new Date(date);
    d.setDate(d.getDate() - d.getDay()); // go back to Sunday
    d.setHours(0,0,0,0);
    return d.toISOString().slice(0, 10);
  }

  function getWeeklyPlan(wk) {
    return WEEKLY_PLANS.find(p => p.weekKey === wk) || null;
  }
  function ensureWeeklyPlan(wk) {
    if (!getWeeklyPlan(wk)) WEEKLY_PLANS.push({ id: 'wp-' + Date.now(), weekKey: wk, sections: [] });
    return getWeeklyPlan(wk);
  }

  // Complexity filter by audience + classType
  function allowedComplexity(audience, classType) {
    if (audience === 'Kids')        return ['beginner'];
    if (audience === 'Competition') return ['intermediate','advanced'];
    if (classType === 'Advanced')   return ['intermediate','advanced'];
    if (classType === 'Open Class') return ['beginner','intermediate'];
    if (audience === 'Girls')       return ['beginner','intermediate'];
    return ['beginner']; // Fundamentals / Adults default
  }

  // Auto-suggest a weekly plan (section rotation by week number)
  function autoFillWeeklyPlan(wk) {
    const wkNum = Math.floor(new Date(wk).getTime() / (7 * 24 * 60 * 60 * 1000));
    // Rotate through all sections
    const allSections = CURRICULUM_SECTIONS.filter(s => s.sportId === 'sport-bjj');
    const primary   = allSections[wkNum % allSections.length];
    const secondary = allSections[(wkNum + 1) % allSections.length];
    const plan = ensureWeeklyPlan(wk);
    plan.sections = [
      { sectionId: primary.id,   itemIds: CURRICULUM_ITEMS.filter(i => i.sectionId === primary.id).slice(0, 3).map(i => i.id) },
      { sectionId: secondary.id, itemIds: CURRICULUM_ITEMS.filter(i => i.sectionId === secondary.id).slice(0, 2).map(i => i.id) },
    ];
    saveWeeklyPlans();
    distributeWeeklyPlan(wk);
    renderApp();
  }

  // Push weekly plan items to all class instances in that week, filtered by complexity.
  // Also materializes virtual slots into real CLASSES entries so they become clickable.
  function distributeWeeklyPlan(wk) {
    const plan = getWeeklyPlan(wk);
    if (!plan) return;
    const allItemIds = plan.sections.flatMap(s => s.itemIds);
    const weekStartMs = new Date(wk).getTime();
    const weekEndMs   = weekStartMs + 7 * 24 * 60 * 60 * 1000;

    // Use getSlotsForRange so virtual template slots are included
    const slots = getSlotsForRange(weekStartMs, weekEndMs);

    slots.forEach(slot => {
      if (slot.status === 'cancelled') return;

      let cls = slot;

      // Materialize virtual slots → real CLASSES entries with stable IDs
      if (slot._virtual) {
        const rt = RECURRING_TEMPLATES.find(r => r.id === slot._templateId);
        if (!rt) return;
        const stableId = 'cls-virt-' + slot._templateId + '-' + slot.startsAt.slice(0, 10);
        const alreadyReal = CLASSES.find(c => c.id === stableId);
        if (alreadyReal) {
          cls = alreadyReal;
        } else {
          cls = {
            id: stableId,
            sportId: 'sport-bjj',
            classType: rt.classType,
            startsAt: slot.startsAt,
            durationMin: rt.durationMin,
            instructorId: rt.instructorId,
            capacity: rt.capacity,
            status: 'scheduled',
            plannedItemIds: [],
            _templateId: rt.id,
          };
          CLASSES.push(cls);
        }
      }

      const audience = getClassAudience(cls);
      const allowed  = allowedComplexity(audience, cls.classType);
      const filtered = allItemIds.filter(id => {
        const item = CURRICULUM_ITEMS.find(i => i.id === id);
        return item && allowed.includes(item.complexity);
      });
      cls.plannedItemIds = filtered;
    });
    persistData();
  }

  // Weekly plan section mutations
  function weeklyPlanToggleItem(wk, sectionId, itemId) {
    const plan = ensureWeeklyPlan(wk);
    let sec = plan.sections.find(s => s.sectionId === sectionId);
    if (!sec) { sec = { sectionId, itemIds: [] }; plan.sections.push(sec); }
    const idx = sec.itemIds.indexOf(itemId);
    if (idx > -1) sec.itemIds.splice(idx, 1); else sec.itemIds.push(itemId);
    // Remove section if no items
    plan.sections = plan.sections.filter(s => s.itemIds.length > 0);
    saveWeeklyPlans();
    document.getElementById('content').innerHTML = Schedule();
  }

  function saveAndApplyWeeklyPlan(wk) {
    distributeWeeklyPlan(wk);
    const plan = getWeeklyPlan(wk);
    if (plan) { plan.applied = true; saveWeeklyPlans(); }
    document.getElementById('content').innerHTML = Schedule();
  }

  function editWeeklyPlan(wk) {
    const plan = getWeeklyPlan(wk);
    if (plan) { plan.applied = false; saveWeeklyPlans(); }
    document.getElementById('content').innerHTML = Schedule();
  }

  function autoFillClassObjective(classId) {
    const cls = CLASSES.find(c => c.id === classId);
    if (!cls) return;
    const wk = weekKey(cls.startsAt);
    const plan = getWeeklyPlan(wk);
    if (!plan) return;
    const audience = getClassAudience(cls);
    const allowed  = allowedComplexity(audience, cls.classType);
    const allItemIds = plan.sections.flatMap(s => s.itemIds);
    cls.plannedItemIds = allItemIds.filter(id => {
      const item = CURRICULUM_ITEMS.find(i => i.id === id);
      return item && allowed.includes(item.complexity);
    });
    persistData();
    renderApp();
  }

  // ---------- Weekly plan card (rendered inside Schedule) ------------------

  function WeeklyPlanCard(wk) {
    const plan = getWeeklyPlan(wk);
    const wkLabel = new Date(wk).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    const allItemIds = plan ? plan.sections.flatMap(s => s.itemIds) : [];
    const isApplied = plan?.applied === true;
    const complexityColor = { beginner: 'var(--success)', intermediate: 'var(--accent)', advanced: 'var(--warn)' };

    // ── READ-ONLY VIEW (after Save & apply) ───────────────────────────────────
    if (isApplied) {
      const selectedBySection = {};
      allItemIds.forEach(id => {
        const item = CURRICULUM_ITEMS.find(i => i.id === id);
        if (!item) return;
        if (!selectedBySection[item.sectionId]) selectedBySection[item.sectionId] = [];
        selectedBySection[item.sectionId].push(item);
      });

      const readonlySections = Object.entries(selectedBySection).map(([secId, items]) => {
        const sec = CURRICULUM_SECTIONS.find(s => s.id === secId);
        const chips = items.map(item => `
          <span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;
            font-size:12px;font-weight:500;border:1.5px solid var(--accent);
            background:var(--accent-bg,#eff6ff);color:var(--accent);margin:0 4px 6px 0">
            <span style="width:6px;height:6px;border-radius:50%;background:${complexityColor[item.complexity]};flex-shrink:0"></span>
            ${t(item.name)}
          </span>`).join('');
        return `
          <div style="margin-bottom:var(--sp-3)">
            <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:var(--sp-2)">${sec ? t(sec.name) : secId}</div>
            <div style="display:flex;flex-wrap:wrap">${chips}</div>
          </div>`;
      }).join('');

      return `
        <div class="card" style="margin-bottom:var(--sp-5)">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--sp-4)">
            <div style="display:flex;align-items:center;gap:var(--sp-3)">
              <h3 class="card-title" style="margin:0">Weekly focus — ${wkLabel}</h3>
              <span style="font-size:11px;font-weight:600;color:var(--success);background:#f0fdf4;border:1px solid #bbf7d0;border-radius:20px;padding:2px 10px">✓ Applied</span>
            </div>
            <button class="btn btn-secondary" style="font-size:12px;padding:5px 12px;white-space:nowrap;margin-left:var(--sp-4)"
              onclick="editWeeklyPlan('${wk}')">Edit</button>
          </div>
          ${allItemIds.length > 0 ? readonlySections : `<p style="font-size:13px;color:var(--text-muted)">No techniques selected.</p>`}
          <div style="padding:var(--sp-3) 0 0;border-top:1px solid var(--border)">
            <span style="font-size:12px;color:var(--text-muted)">${allItemIds.length} technique${allItemIds.length !== 1 ? 's' : ''} distributed to classes this week · click a class to view its objective</span>
          </div>
        </div>`;
    }

    // ── EDIT VIEW ────────────────────────────────────────────────────────────
    const sectionRows = CURRICULUM_SECTIONS.filter(s => s.sportId === 'sport-bjj').map(sec => {
      const items = CURRICULUM_ITEMS.filter(i => i.sectionId === sec.id);

      const itemChips = items.map(item => {
        const selected = allItemIds.includes(item.id);
        return `<span onclick="weeklyPlanToggleItem('${wk}','${sec.id}','${item.id}')" style="
          display:inline-flex;align-items:center;gap:4px;
          padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;
          border:1.5px solid ${selected ? 'var(--accent)' : 'var(--border)'};
          background:${selected ? 'var(--accent-bg,#eff6ff)' : 'var(--surface)'};
          color:${selected ? 'var(--accent)' : 'var(--text-muted)'};
          margin:0 4px 6px 0;transition:all .12s">
          <span style="width:6px;height:6px;border-radius:50%;background:${complexityColor[item.complexity]};flex-shrink:0"></span>
          ${t(item.name)}
        </span>`;
      }).join('');

      return `
        <div style="margin-bottom:var(--sp-3)">
          <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:var(--sp-2)">${t(sec.name)}</div>
          <div style="display:flex;flex-wrap:wrap">${itemChips}</div>
        </div>`;
    }).join('');

    const legendItems = [
      { color: 'var(--success)', label: 'Beginner' },
      { color: 'var(--accent)',  label: 'Intermediate' },
      { color: 'var(--warn)',    label: 'Advanced' },
    ].map(l => `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);margin-right:12px">
      <span style="width:8px;height:8px;border-radius:50%;background:${l.color}"></span>${l.label}</span>`).join('');

    return `
      <div class="card" style="margin-bottom:var(--sp-5)">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--sp-4)">
          <div>
            <h3 class="card-title" style="margin:0 0 var(--sp-1)">Weekly focus — ${wkLabel}</h3>
            <div style="font-size:12px;color:var(--text-muted)">Select techniques from the curriculum. When you're happy, hit Save &amp; apply to push them to all classes this week.</div>
          </div>
          <div style="display:flex;gap:var(--sp-2);margin-left:var(--sp-4);flex-shrink:0">
            <button class="btn btn-secondary" style="font-size:12px;padding:5px 12px;white-space:nowrap"
              onclick="autoFillWeeklyPlan('${wk}')">✦ Auto-fill</button>
            <button class="btn btn-primary" style="font-size:12px;padding:5px 14px;white-space:nowrap"
              onclick="saveAndApplyWeeklyPlan('${wk}')" ${allItemIds.length === 0 ? 'disabled' : ''}>
              Save &amp; apply
            </button>
          </div>
        </div>
        <div style="margin-bottom:var(--sp-3)">${legendItems}</div>
        ${sectionRows}
        <div style="padding:var(--sp-3) 0 0;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:12px;color:var(--text-muted)">
            ${allItemIds.length > 0 ? `${allItemIds.length} technique${allItemIds.length !== 1 ? 's' : ''} selected` : 'No techniques selected yet'}
          </span>
          ${allItemIds.length > 0 ? `<span style="font-size:11px;color:var(--text-faint)">Filtered by audience &amp; complexity when applied</span>` : ''}
        </div>
      </div>`;
  }

  // ---------- Class objective card (rendered inside ClassDetail) -----------
  // Single source of truth: cls.plannedItemIds

  function ClassObjectiveCard(cls) {
    const wk = weekKey(cls.startsAt);
    const weeklyPlan = getWeeklyPlan(wk);
    const classItemIds = cls.plannedItemIds || [];
    const isCancelled = cls.status === 'cancelled';
    const canEdit = !isCancelled;
    const wkLabel = new Date(wk).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    const complexityColor = { beginner: 'var(--success)', intermediate: 'var(--accent)', advanced: 'var(--warn)' };

    // Items grouped by section
    const bySection = {};
    classItemIds.forEach(id => {
      const item = CURRICULUM_ITEMS.find(i => i.id === id);
      if (!item) return;
      if (!bySection[item.sectionId]) bySection[item.sectionId] = [];
      bySection[item.sectionId].push(item);
    });

    const sectionBlocks = Object.entries(bySection).map(([secId, items]) => {
      const sec = CURRICULUM_SECTIONS.find(s => s.id === secId);
      const itemRows = items.map(item => `
        <div style="display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) 0">
          <span style="width:8px;height:8px;border-radius:50%;background:${complexityColor[item.complexity]};flex-shrink:0"></span>
          <span style="flex:1;font-size:13px">${t(item.name)}</span>
          ${canEdit ? `<button onclick="removeItemFromClass('${cls.id}','${item.id}')"
            style="background:none;border:none;cursor:pointer;color:var(--text-faint);font-size:14px;padding:0 2px">×</button>` : ''}
        </div>`).join('');
      return `
        <div style="margin-bottom:var(--sp-3)">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:var(--sp-1)">${sec ? t(sec.name) : secId}</div>
          ${itemRows}
        </div>`;
    }).join('');

    const addableItems = CURRICULUM_ITEMS.filter(i => !classItemIds.includes(i.id));
    const pickerOpts = CURRICULUM_SECTIONS.filter(s => s.sportId === 'sport-bjj').map(sec => {
      const secItems = addableItems.filter(i => i.sectionId === sec.id);
      if (!secItems.length) return '';
      const opts = secItems.map(i => `<option value="${i.id}">${t(i.name)} (${i.complexity})</option>`).join('');
      return `<optgroup label="${t(sec.name)}">${opts}</optgroup>`;
    }).filter(Boolean).join('');

    return `
      <div class="card" style="margin-bottom:var(--sp-4)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3)">
          <div>
            <h3 class="card-title" style="margin:0">Objective</h3>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px">
              Week of ${wkLabel}
              ${weeklyPlan ? ` · <a onclick="go('schedule')" style="cursor:pointer;color:var(--accent)">Edit weekly focus →</a>` : ''}
            </div>
          </div>
          ${canEdit && weeklyPlan ? `
            <button class="btn btn-secondary" style="font-size:12px;padding:4px 10px"
              onclick="autoFillClassObjective('${cls.id}')">✦ Auto-fill from week</button>
          ` : ''}
        </div>

        ${classItemIds.length > 0
          ? sectionBlocks
          : `<div class="faint" style="font-size:13px;margin-bottom:var(--sp-3)">
               No techniques planned yet.
               ${weeklyPlan ? 'Use auto-fill or add from the suggestions below.' : 'Go to <a onclick="go(\'schedule\')" style="cursor:pointer;color:var(--accent)">Schedule</a> to set this week\'s focus.'}
             </div>`}

        ${canEdit && pickerOpts ? `
          <div style="display:flex;gap:var(--sp-2);margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--border)">
            <select id="cls-obj-picker" class="input" style="flex:1;font-size:13px;padding:6px 10px">
              <option value="">+ Add technique…</option>
              ${pickerOpts}
            </select>
            <button class="btn btn-secondary" style="font-size:12px;padding:6px 12px" onclick="
              const v = document.getElementById('cls-obj-picker').value;
              if (v) addItemToClass('${cls.id}', v);
            ">Add</button>
          </div>` : ''}
      </div>`;
  }

  // ---------- Student notes / contact log -----------------------------------
  // Persisted as { [studentId]: [{ id, type, text, createdAt }] } under tatami_student_notes

  const STUDENT_NOTES_KEY = 'tatami_student_notes';
  let STUDENT_NOTES = {};

  function loadStudentNotes() {
    try { STUDENT_NOTES = JSON.parse(localStorage.getItem(STUDENT_NOTES_KEY)) || {}; } catch { STUDENT_NOTES = {}; }
  }
  function saveStudentNotes() {
    try { localStorage.setItem(STUDENT_NOTES_KEY, JSON.stringify(STUDENT_NOTES)); } catch {}
  }

  // ---------- Student injury log -------------------------------------------
  // Persisted as array of injury objects under tatami_injuries
  // Each entry: { id, studentId, date, type, bodyPart, status, notes, loggedAt }

  const INJURIES_KEY = 'tatami_injuries';

  function loadStudentInjuries() {
    try {
      const saved = JSON.parse(localStorage.getItem(INJURIES_KEY));
      if (Array.isArray(saved) && saved.length) {
        // Merge into STUDENT_INJURIES (avoid duplicates by id)
        const existingIds = new Set(STUDENT_INJURIES.map(i => i.id));
        saved.forEach(s => { if (!existingIds.has(s.id)) STUDENT_INJURIES.push(s); });
        // Overwrite seed items with saved state (status may have changed)
        saved.forEach(s => {
          const idx = STUDENT_INJURIES.findIndex(i => i.id === s.id);
          if (idx !== -1) STUDENT_INJURIES[idx] = s;
        });
      }
    } catch {}
  }
  function persistInjuries() {
    try { localStorage.setItem(INJURIES_KEY, JSON.stringify(STUDENT_INJURIES)); } catch {}
  }

  function _injuryTypeColor(type) {
    const map = { sprain: '#f59e0b', strain: '#f97316', fracture: '#ef4444', bruise: '#8b5cf6', soreness: '#3b82f6', other: '#6b7280' };
    return map[type] || '#6b7280';
  }
  function _injuryStatusBadge(status) {
    return status === 'active'
      ? `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fef2f2;color:#ef4444">⚠ Active</span>`
      : `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#f0fdf4;color:#16a34a">✓ Recovered</span>`;
  }

  function addInjury(studentId) {
    const dateEl    = document.getElementById('inj-date-' + studentId);
    const typeEl    = document.getElementById('inj-type-' + studentId);
    const partEl    = document.getElementById('inj-part-' + studentId);
    const notesEl   = document.getElementById('inj-notes-' + studentId);
    if (!dateEl || !dateEl.value || !typeEl || !partEl || !partEl.value.trim()) return;
    STUDENT_INJURIES.push({
      id:        'inj-' + Date.now(),
      studentId,
      date:      dateEl.value,
      type:      typeEl.value,
      bodyPart:  partEl.value.trim(),
      status:    'active',
      notes:     notesEl ? notesEl.value.trim() : '',
      loggedAt:  new Date().toISOString()
    });
    persistInjuries();
    const el = document.getElementById('injury-card-' + studentId);
    if (el) el.outerHTML = InjuryCard(studentId);
  }

  function resolveInjury(injuryId, studentId) {
    const inj = STUDENT_INJURIES.find(i => i.id === injuryId);
    if (inj) { inj.status = 'recovered'; persistInjuries(); }
    const el = document.getElementById('injury-card-' + studentId);
    if (el) el.outerHTML = InjuryCard(studentId);
  }

  function deleteInjury(injuryId, studentId) {
    const idx = STUDENT_INJURIES.findIndex(i => i.id === injuryId);
    if (idx !== -1) { STUDENT_INJURIES.splice(idx, 1); persistInjuries(); }
    const el = document.getElementById('injury-card-' + studentId);
    if (el) el.outerHTML = InjuryCard(studentId);
  }

  function InjuryCard(studentId) {
    const injuries = STUDENT_INJURIES
      .filter(i => i.studentId === studentId)
      .sort((a, b) => b.loggedAt.localeCompare(a.loggedAt));
    const activeCount = injuries.filter(i => i.status === 'active').length;

    const rows = injuries.map(inj => `
      <div style="display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--border)">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:4px">
            <span style="font-weight:600;font-size:14px;color:${_injuryTypeColor(inj.type)}">${inj.bodyPart}</span>
            <span style="font-size:12px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--text-muted);text-transform:capitalize">${inj.type}</span>
            ${_injuryStatusBadge(inj.status)}
          </div>
          <div style="font-size:12px;color:var(--text-muted)">Logged ${inj.date}${inj.notes ? ' · ' + inj.notes : ''}</div>
        </div>
        <div style="display:flex;gap:var(--sp-2);flex-shrink:0">
          ${inj.status === 'active' ? `<button class="btn btn-secondary" style="font-size:11px;padding:3px 10px" onclick="resolveInjury('${inj.id}','${studentId}')">✓ Resolved</button>` : ''}
          <button class="btn btn-secondary" style="font-size:11px;padding:3px 8px;color:var(--danger)" onclick="deleteInjury('${inj.id}','${studentId}')">✕</button>
        </div>
      </div>`).join('');

    const today = new Date().toISOString().split('T')[0];
    return `
      <div class="card" style="margin-top:var(--sp-4)" id="injury-card-${studentId}">
        <div class="row-between" style="margin-bottom:var(--sp-4)">
          <h3 class="card-title" style="margin:0">🩹 Injury log${activeCount ? ` <span style="font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fef2f2;color:#ef4444;vertical-align:middle">${activeCount} active</span>` : ''}</h3>
        </div>
        ${rows || `<div class="muted" style="margin-bottom:var(--sp-4)">No injuries logged.</div>`}
        <div style="margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--border)">
          <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:var(--sp-2)">Log new injury</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--sp-2);margin-bottom:var(--sp-2)">
            <input  id="inj-date-${studentId}"  type="date"   class="input" style="font-size:12px;padding:4px 8px" value="${today}">
            <select id="inj-type-${studentId}"  class="input" style="font-size:12px;padding:4px 8px">
              <option value="sprain">Sprain</option>
              <option value="strain">Strain</option>
              <option value="bruise">Bruise</option>
              <option value="soreness">Soreness</option>
              <option value="fracture">Fracture</option>
              <option value="other">Other</option>
            </select>
            <input  id="inj-part-${studentId}" type="text"   class="input" style="font-size:12px;padding:4px 8px" placeholder="Body part (e.g. Left knee)">
          </div>
          <div style="display:flex;gap:var(--sp-2)">
            <input id="inj-notes-${studentId}" type="text" class="input" style="flex:1;font-size:12px;padding:4px 8px" placeholder="Notes (optional)">
            <button class="btn" style="font-size:12px;padding:4px 14px" onclick="addInjury('${studentId}')">+ Log</button>
          </div>
        </div>
      </div>`;
  }

  // ---------- Retention flags ----------------------------------------------
  // Persisted as a Set of studentIds under tatami_retention_flags

  const RETENTION_FLAGS_KEY = 'tatami_retention_flags';
  let RETENTION_FLAGS = new Set();

  function loadRetentionFlags() {
    try { RETENTION_FLAGS = new Set(JSON.parse(localStorage.getItem(RETENTION_FLAGS_KEY)) || []); } catch { RETENTION_FLAGS = new Set(); }
  }
  function saveRetentionFlags() {
    try { localStorage.setItem(RETENTION_FLAGS_KEY, JSON.stringify([...RETENTION_FLAGS])); } catch {}
  }
  function toggleRetentionFlag(studentId) {
    if (RETENTION_FLAGS.has(studentId)) RETENTION_FLAGS.delete(studentId);
    else RETENTION_FLAGS.add(studentId);
    saveRetentionFlags();
    // Re-render just the retention screen in-place
    const content = document.getElementById('content');
    if (content) content.innerHTML = RetentionScreen();
  }

  // ---------- Retention contact log ----------------------------------------
  // Per-student log of outreach attempts with method, notes, and outcome.

  const RETENTION_CONTACTS_KEY = 'tatami_retention_contacts';
  let RETENTION_CONTACTS = [];

  function loadRetentionContacts() {
    try { RETENTION_CONTACTS = JSON.parse(localStorage.getItem(RETENTION_CONTACTS_KEY)) || []; } catch { RETENTION_CONTACTS = []; }
  }
  function saveRetentionContacts() {
    try { localStorage.setItem(RETENTION_CONTACTS_KEY, JSON.stringify(RETENTION_CONTACTS)); } catch {}
  }

  function retentionGetLastContact(studentId) {
    const list = RETENTION_CONTACTS.filter(c => c.studentId === studentId);
    if (!list.length) return null;
    return list.reduce((a, b) => a.createdAt > b.createdAt ? a : b);
  }

  const RC_METHOD_ICON  = { call: '📞', email: '✉', text: '💬', 'in-person': '👋' };
  const RC_OUTCOME_LABEL = { 'coming-back': 'Coming back', returned: 'Returned', 'no-response': 'No response', lost: 'Lost', pending: 'Pending' };
  const RC_OUTCOME_STYLE = {
    'coming-back': 'background:#dcfce7;color:#15803d',
    'returned':    'background:#dcfce7;color:#15803d',
    'no-response': 'background:#fef3c7;color:#b45309',
    'lost':        'background:#fee2e2;color:#b91c1c',
    'pending':     'background:#f1f5f9;color:#64748b',
  };

  function retentionContactBadge(studentId) {
    const last = retentionGetLastContact(studentId);
    if (!last) return '';
    const daysAgo = Math.floor((Date.now() - new Date(last.createdAt).getTime()) / 86400000);
    const icon    = RC_METHOD_ICON[last.method] || '📞';
    const style   = RC_OUTCOME_STYLE[last.outcome] || RC_OUTCOME_STYLE.pending;
    const oLabel  = last.outcome === 'pending'
      ? (daysAgo === 0 ? 'Contacted today' : daysAgo === 1 ? 'Contacted yesterday' : `Contacted ${daysAgo}d ago`)
      : RC_OUTCOME_LABEL[last.outcome] || last.outcome;
    return `<span id="rcf-badge-${studentId}" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;margin-top:3px;${style}">${icon} ${oLabel}</span>`;
  }

  function retentionShowContactForm(studentId) {
    document.querySelectorAll('.rcf-form').forEach(el => el.remove());
    const row = document.getElementById('retention-row-' + studentId);
    if (!row) return;
    const contacts = RETENTION_CONTACTS.filter(c => c.studentId === studentId)
      .sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 5);
    const historyHtml = contacts.map(c => {
      const d = new Date(c.createdAt);
      return `<div style="font-size:12px;color:var(--text-muted);padding:4px 0;border-bottom:1px solid var(--border)">
        ${RC_METHOD_ICON[c.method]||'📞'} ${d.toLocaleDateString()} &nbsp;·&nbsp;
        <span style="font-weight:600">${RC_OUTCOME_LABEL[c.outcome]||c.outcome}</span>
        ${c.notes ? `<span style="color:var(--text-faint)"> — ${c.notes}</span>` : ''}
      </div>`;
    }).join('');
    const formHtml = `
      <div class="rcf-form" style="padding:var(--sp-3) var(--sp-4) var(--sp-3) 64px;background:var(--bg-alt);border-bottom:2px solid var(--accent)">
        <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:var(--sp-2);letter-spacing:.03em">LOG CONTACT</div>
        <div style="display:flex;gap:var(--sp-3);align-items:flex-end;flex-wrap:wrap">
          <div>
            <label style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">METHOD</label>
            <select id="rcf-method-${studentId}" class="form-input" style="font-size:13px;padding:5px 8px;min-width:140px">
              <option value="call">📞 Call</option>
              <option value="email">✉ Email</option>
              <option value="text">💬 Text / WhatsApp</option>
              <option value="in-person">👋 In-person</option>
            </select>
          </div>
          <div style="flex:1;min-width:160px">
            <label style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">NOTES (optional)</label>
            <input type="text" id="rcf-notes-${studentId}" class="form-input" style="font-size:13px;padding:5px 8px;width:100%" placeholder="Left voicemail, said coming back next week…">
          </div>
          <div>
            <label style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">OUTCOME</label>
            <select id="rcf-outcome-${studentId}" class="form-input" style="font-size:13px;padding:5px 8px;min-width:150px">
              <option value="pending">Pending follow-up</option>
              <option value="no-response">No response</option>
              <option value="coming-back">Coming back 👍</option>
              <option value="lost">Lost</option>
            </select>
          </div>
          <div style="display:flex;gap:var(--sp-2)">
            <button class="btn btn-primary" style="font-size:13px;padding:5px 14px" onclick="retentionSaveContact('${studentId}')">Save</button>
            <button class="btn" style="font-size:13px;padding:5px 12px" onclick="this.closest('.rcf-form').remove()">Cancel</button>
          </div>
        </div>
        ${historyHtml ? `<div style="margin-top:var(--sp-3);border-top:1px solid var(--border);padding-top:var(--sp-2)">${historyHtml}</div>` : ''}
      </div>`;
    row.insertAdjacentHTML('afterend', formHtml);
    document.getElementById('rcf-notes-' + studentId)?.focus();
  }

  function retentionSaveContact(studentId) {
    const method  = document.getElementById('rcf-method-'  + studentId)?.value || 'call';
    const notes   = document.getElementById('rcf-notes-'   + studentId)?.value.trim() || '';
    const outcome = document.getElementById('rcf-outcome-' + studentId)?.value || 'pending';
    RETENTION_CONTACTS.push({ id: 'rc-' + Date.now(), studentId, method, notes, outcome, createdAt: new Date().toISOString() });
    saveRetentionContacts();

    // Mirror to student contact log
    if (!STUDENT_NOTES[studentId]) STUDENT_NOTES[studentId] = [];
    STUDENT_NOTES[studentId].unshift({
      id: 'note-rc-' + Date.now(),
      type: RC_METHOD_ICON[method] || '📞',
      text: `Retention reach-out · ${RC_OUTCOME_LABEL[outcome] || outcome}${notes ? ': ' + notes : ''}`,
      createdAt: new Date().toISOString(),
    });
    saveStudentNotes();

    document.querySelector('.rcf-form')?.remove();
    // Update badge in-place
    const badgeEl = document.getElementById('rcf-badge-' + studentId);
    const newBadge = document.createElement('span');
    newBadge.outerHTML; // flush
    if (badgeEl) {
      badgeEl.outerHTML = retentionContactBadge(studentId);
    } else {
      const row = document.getElementById('retention-row-' + studentId);
      const nameDiv = row?.querySelector('.rcf-name-col');
      if (nameDiv) nameDiv.insertAdjacentHTML('beforeend', retentionContactBadge(studentId));
    }

    const stu = STUDENTS.find(s => s.id === studentId);
    showToast('Contact logged for ' + (stu?.name.split(' ')[0] || studentId));
  }

  // ---------- Homework / drill assignments ---------------------------------

  const HOMEWORK_KEY = 'tatami_homework';
  let STUDENT_HOMEWORK = {}; // { [studentId]: [{ id, itemId, assignedAt, dueDate, note, practicedAt }] }

  function loadHomework() {
    try { STUDENT_HOMEWORK = JSON.parse(localStorage.getItem(HOMEWORK_KEY)) || {}; } catch { STUDENT_HOMEWORK = {}; }
  }
  function saveHomework() {
    try { localStorage.setItem(HOMEWORK_KEY, JSON.stringify(STUDENT_HOMEWORK)); } catch {}
  }

  function assignHomework(studentId) {
    const itemId  = document.getElementById('hw-item-' + studentId)?.value;
    const dueDate = document.getElementById('hw-due-' + studentId)?.value;
    const note    = document.getElementById('hw-note-' + studentId)?.value.trim() || '';
    if (!itemId) return;
    if (!STUDENT_HOMEWORK[studentId]) STUDENT_HOMEWORK[studentId] = [];
    STUDENT_HOMEWORK[studentId].push({
      id: 'hw-' + Date.now(),
      itemId,
      assignedAt: CONFIG.today.toISOString().slice(0, 10),
      dueDate: dueDate || null,
      note,
      practicedAt: null,
    });
    saveHomework();
    const el = document.getElementById('homework-card-' + studentId);
    if (el) el.outerHTML = HomeworkCard(studentId);
  }

  function dismissHomework(studentId, hwId) {
    if (!STUDENT_HOMEWORK[studentId]) return;
    STUDENT_HOMEWORK[studentId] = STUDENT_HOMEWORK[studentId].filter(h => h.id !== hwId);
    saveHomework();
    const el = document.getElementById('homework-card-' + studentId);
    if (el) el.outerHTML = HomeworkCard(studentId);
  }

  function HomeworkCard(studentId) {
    const allHw  = (STUDENT_HOMEWORK[studentId] || []).filter(h => !h.dismissedAt);
    const active = allHw.filter(h => !h.practicedAt);
    const done   = allHw.filter(h =>  h.practicedAt);
    const today  = CONFIG.today.toISOString().slice(0, 10);

    // Group curriculum items by section for the select
    const sections = CURRICULUM_SECTIONS.map(sec => {
      const items = CURRICULUM_ITEMS.filter(i => i.sectionId === sec.id);
      if (!items.length) return '';
      return `<optgroup label="${sec.name?.en || sec.id}">
        ${items.map(i => `<option value="${i.id}">${i.name?.en || i.id}</option>`).join('')}
      </optgroup>`;
    }).join('');

    function hwRow(hw) {
      const item    = CURRICULUM_ITEMS.find(i => i.id === hw.itemId);
      const sec     = item ? CURRICULUM_SECTIONS.find(s => s.id === item.sectionId) : null;
      const overdue = hw.dueDate && hw.dueDate < today && !hw.practicedAt;
      const dueTxt  = hw.dueDate
        ? `<span style="font-size:11px;color:${overdue ? 'var(--danger,#dc2626)' : 'var(--text-muted)'};font-weight:${overdue?'700':'400'}">
            ${overdue ? '⚠ Overdue · ' : ''}Due ${hw.dueDate}
          </span>`
        : '';
      const practicedBadge = hw.practicedAt

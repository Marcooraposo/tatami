        ? `<span style="font-size:11px;color:var(--green,#16a34a);font-weight:600">✓ Practised ${hw.practicedAt}</span>`
        : '';
      return `
        <div style="display:flex;align-items:flex-start;gap:10px;padding:var(--sp-3) 0;border-bottom:1px solid var(--border)">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px">${item?.name?.en || hw.itemId}</div>
            ${sec ? `<div style="font-size:11px;color:var(--text-muted)">${sec.name?.en || sec.id}</div>` : ''}
            ${hw.note ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px;font-style:italic">"${hw.note}"</div>` : ''}
            <div style="margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              ${dueTxt}${practicedBadge}
            </div>
          </div>
          <button class="btn btn-sm btn-secondary" style="font-size:11px;padding:3px 10px;flex-shrink:0"
            onclick="dismissHomework('${studentId}','${hw.id}')">× Remove</button>
        </div>`;
    }

    return `
      <div class="card" id="homework-card-${studentId}" style="margin-top:var(--sp-4)">
        <h3 class="card-title" style="margin-bottom:var(--sp-3)">📚 Homework</h3>

        <!-- Assign form -->
        <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:flex-end;margin-bottom:var(--sp-4);padding-bottom:var(--sp-4);border-bottom:1px solid var(--border)">
          <div style="flex:2;min-width:160px">
            <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:4px">TECHNIQUE</div>
            <select id="hw-item-${studentId}" class="input" style="font-size:12px;padding:6px 8px;width:100%">
              <option value="">— Pick technique —</option>
              ${sections}
            </select>
          </div>
          <div style="min-width:130px">
            <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:4px">DUE DATE</div>
            <input id="hw-due-${studentId}" type="date" class="input" style="font-size:12px;padding:6px 8px">
          </div>
          <div style="flex:2;min-width:140px">
            <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:4px">NOTE</div>
            <input id="hw-note-${studentId}" class="input" type="text" placeholder="e.g. focus on hip movement"
              style="font-size:12px;padding:6px 8px;width:100%">
          </div>
          <button class="btn btn-primary" style="font-size:12px;padding:6px 16px;white-space:nowrap"
            onclick="assignHomework('${studentId}')">+ Assign</button>
        </div>

        <!-- Active homework -->
        ${active.length
          ? active.map(hwRow).join('')
          : `<div style="font-size:13px;color:var(--text-muted);padding:var(--sp-2) 0">No active homework. Assign a technique above.</div>`}

        <!-- Done items (collapsed) -->
        ${done.length ? `
          <details style="margin-top:var(--sp-3)">
            <summary style="font-size:12px;color:var(--text-muted);cursor:pointer;user-select:none">
              ✓ ${done.length} completed
            </summary>
            <div style="opacity:.7">${done.map(hwRow).join('')}</div>
          </details>` : ''}
      </div>`;
  }

  // ---------- Student technique mastery ------------------------------------

  const MASTERY_KEY = 'tatami_student_mastery';
  let STUDENT_MASTERY = {}; // { [studentId]: string[] } — array of mastered itemIds

  function loadStudentMastery() {
    try { STUDENT_MASTERY = JSON.parse(localStorage.getItem(MASTERY_KEY)) || {}; } catch { STUDENT_MASTERY = {}; }
  }
  function persistStudentMastery() {
    try { localStorage.setItem(MASTERY_KEY, JSON.stringify(STUDENT_MASTERY)); } catch {}
  }

  function toggleMastery(studentId, itemId) {
    const current = new Set(STUDENT_MASTERY[studentId] || []);
    if (current.has(itemId)) current.delete(itemId); else current.add(itemId);
    STUDENT_MASTERY[studentId] = [...current];
    persistStudentMastery();
    const el = document.getElementById('mastery-card-' + studentId);
    if (el) el.outerHTML = MasteryCard(studentId);
  }

  // ---- Competition Results -----------------------------------------------

  function _medalEmoji(medal) {
    return medal === 'gold' ? '🥇' : medal === 'silver' ? '🥈' : medal === 'bronze' ? '🥉' : '—';
  }

  function _placementColor(medal) {
    return medal === 'gold' ? '#f59e0b' : medal === 'silver' ? '#94a3b8' : medal === 'bronze' ? '#b45309' : 'var(--text-muted)';
  }

  function logCompResult(eventId) {
    const studentSel = document.getElementById('cr-student-' + eventId);
    const divisionEl = document.getElementById('cr-division-' + eventId);
    const placementEl= document.getElementById('cr-placement-' + eventId);
    const notesEl    = document.getElementById('cr-notes-' + eventId);
    if (!studentSel || !studentSel.value || !divisionEl.value.trim() || !placementEl.value) return;
    const placement = placementEl.value;
    const medalMap  = { '1st': 'gold', '2nd': 'silver', '3rd': 'bronze' };
    const medal     = medalMap[placement] || 'none';
    COMPETITION_RESULTS.push({
      id:        'cr-' + Date.now(),
      eventId,
      studentId: studentSel.value,
      division:  divisionEl.value.trim(),
      placement,
      medal,
      notes:     notesEl ? notesEl.value.trim() : '',
      loggedAt:  new Date().toISOString()
    });
    persistData();
    document.getElementById('content').innerHTML = EventDetail(eventId);
  }

  function deleteCompResult(resultId, eventId) {
    const idx = COMPETITION_RESULTS.findIndex(r => r.id === resultId);
    if (idx !== -1) { COMPETITION_RESULTS.splice(idx, 1); persistData(); }
    document.getElementById('content').innerHTML = EventDetail(eventId);
  }

  function CompetitionHistoryCard(studentId) {
    const results = COMPETITION_RESULTS
      .filter(r => r.studentId === studentId)
      .sort((a, b) => b.loggedAt.localeCompare(a.loggedAt));
    if (!results.length) return '';
    const golds   = results.filter(r => r.medal === 'gold').length;
    const silvers = results.filter(r => r.medal === 'silver').length;
    const bronzes = results.filter(r => r.medal === 'bronze').length;
    const rows = results.map(r => {
      const evt = EVENTS.find(e => e.id === r.eventId);
      return `
        <div style="display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-2) 0;border-bottom:1px solid var(--border)">
          <div style="font-size:22px;line-height:1;flex-shrink:0;padding-top:2px">${_medalEmoji(r.medal)}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:14px;color:${_placementColor(r.medal)}">${r.placement}</div>
            <div style="font-size:13px;color:var(--text-body)">${r.division}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${evt ? evt.title + ' · ' + evt.date : r.eventId}</div>
            ${r.notes ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px;font-style:italic">${r.notes}</div>` : ''}
          </div>
        </div>`;
    }).join('');
    return `
      <div class="card" style="margin-top:var(--sp-4)" id="comp-history-${studentId}">
        <div class="row-between" style="margin-bottom:var(--sp-4)">
          <h3 class="card-title" style="margin:0">🏆 Competition history</h3>
          <div style="display:flex;gap:var(--sp-3);font-size:13px">
            ${golds   ? `<span title="Gold">${_medalEmoji('gold')} ${golds}</span>`   : ''}
            ${silvers ? `<span title="Silver">${_medalEmoji('silver')} ${silvers}</span>` : ''}
            ${bronzes ? `<span title="Bronze">${_medalEmoji('bronze')} ${bronzes}</span>` : ''}
            <span style="color:var(--text-muted)">${results.length} result${results.length !== 1 ? 's' : ''}</span>
          </div>
        </div>
        ${rows}
      </div>`;
  }

  function MasteryCard(studentId) {
    const mastered = new Set(STUDENT_MASTERY[studentId] || []);
    const sections = DB.sectionsBySport('sport-bjj');
    const totalItems = CURRICULUM_ITEMS.length;
    const masteredCount = CURRICULUM_ITEMS.filter(i => mastered.has(i.id)).length;
    const pct = totalItems > 0 ? Math.round(masteredCount / totalItems * 100) : 0;
    const complexityColor = { beginner: '#10b981', intermediate: '#f59e0b', advanced: '#ef4444' };

    const sectionRows = sections.map(sec => {
      const items = DB.itemsBySection(sec.id);
      const secMastered = items.filter(i => mastered.has(i.id)).length;
      return `
        <div style="margin-bottom:var(--sp-4)">
          <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--sp-2)">
            ${t(sec.name)} <span style="font-weight:400;font-size:11px">${secMastered}/${items.length}</span>
          </div>
          ${items.map(item => {
            const done = mastered.has(item.id);
            const cc = complexityColor[item.complexity] || '#888';
            return `
              <label style="display:flex;align-items:center;gap:var(--sp-2);cursor:pointer;padding:3px 0">
                <input type="checkbox" ${done ? 'checked' : ''}
                       onchange="toggleMastery('${studentId}','${item.id}')"
                       style="accent-color:var(--accent);width:15px;height:15px;flex-shrink:0">
                <span style="flex:1;font-size:13px;${done ? 'color:var(--text-muted);text-decoration:line-through' : ''}">${t(item.name)}</span>
                <span style="font-size:10px;font-weight:600;color:${cc};background:${cc}18;padding:2px 6px;border-radius:4px">${item.complexity}</span>
              </label>`;
          }).join('')}
        </div>`;
    }).join('');

    return `
      <div id="mastery-card-${studentId}" class="card" style="margin-top:var(--sp-4)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3)">
          <h3 class="card-title" style="margin:0">🏅 Technique mastery</h3>
          <span style="font-size:13px;color:var(--text-muted)">${masteredCount} / ${totalItems} &nbsp;·&nbsp; ${pct}%</span>
        </div>
        <div style="background:var(--surface-alt);border-radius:4px;height:6px;margin-bottom:var(--sp-5);overflow:hidden">
          <div style="height:6px;background:var(--accent);width:${pct}%;transition:width .3s"></div>
        </div>
        ${sectionRows}
      </div>`;
  }

  const NOTE_TYPES = [
    { value: 'note',    label: '📝 Note',    color: 'var(--text-muted)' },
    { value: 'call',    label: '📞 Call',    color: '#10b981' },
    { value: 'email',   label: '✉️ Email',   color: 'var(--accent)' },
    { value: 'concern', label: '⚠ Concern', color: '#f59e0b' },
  ];

  function _noteRow(studentId, n) {
    const tp = NOTE_TYPES.find(nt => nt.value === n.type) || NOTE_TYPES[0];
    const date = new Date(n.createdAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    return `
      <div style="display:flex;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--border);align-items:flex-start">
        <span style="font-size:11px;font-weight:700;color:${tp.color};white-space:nowrap;padding-top:2px">${tp.label}</span>
        <div style="flex:1">
          <div style="font-size:13px">${escHtml(n.text)}</div>
          <div style="font-size:11px;color:var(--text-faint);margin-top:4px">${date}</div>
        </div>
        <button class="btn" style="font-size:11px;padding:2px 8px;color:var(--text-faint)"
                onclick="deleteStudentNote('${studentId}','${n.id}')">×</button>
      </div>`;
  }

  function _renderNotesList(studentId) {
    const notes = (STUDENT_NOTES[studentId] || []).slice().reverse();
    const list = document.getElementById('student-notes-list-' + studentId);
    if (!list) return;
    list.innerHTML = notes.length
      ? notes.map(n => _noteRow(studentId, n)).join('')
      : `<div class="muted" style="font-size:13px">No notes yet.</div>`;
  }

  // ---------- Student details card (DOB, weight, emergency contact) ----------

  function StudentDetailsCard(studentId) {
    const stu = DB.student(studentId);
    if (!stu) return '';

    function ageStr(dob) {
      if (!dob) return null;
      const today = new Date(CONFIG.today);
      const b = new Date(dob);
      let age = today.getFullYear() - b.getFullYear();
      if (today.getMonth() < b.getMonth() || (today.getMonth() === b.getMonth() && today.getDate() < b.getDate())) age--;
      return age + ' yrs';
    }

    const age = ageStr(stu.dob);
    const dobDisplay   = stu.dob   ? new Date(stu.dob).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + (age ? ` (${age})` : '') : '—';
    const weightDisplay = stu.weightKg ? stu.weightKg + ' kg' : '—';
    const ecDisplay    = stu.emergencyContact || '—';
    const notesDisplay = stu.notes || '—';

    return `
      <div class="card" style="margin-top:var(--sp-4)" id="details-card-${studentId}">
        <div class="row-between" style="margin-bottom:var(--sp-3)">
          <h3 class="card-title" style="margin:0">👤 Student details</h3>
          <button class="btn" style="font-size:12px;padding:4px 12px" onclick="openStudentDetailsEdit('${studentId}')">Edit</button>
        </div>
        <div id="details-view-${studentId}" style="display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-3) var(--sp-5)">
          ${_detailField('Date of birth', dobDisplay)}
          ${_detailField('Weight', weightDisplay)}
          ${_detailField('Emergency contact', ecDisplay)}
          ${_detailField('Notes', notesDisplay)}
          ${stu.contact ? _detailField('Contact', stu.contact) : ''}
        </div>
        <div id="details-form-${studentId}" style="display:none">
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-3)">
            <label style="font-size:13px;color:var(--text-muted)">Date of birth
              <input id="sd-dob-${studentId}" type="date" class="input" style="margin-top:4px;width:100%" value="${stu.dob || ''}">
            </label>
            <label style="font-size:13px;color:var(--text-muted)">Weight (kg)
              <input id="sd-weight-${studentId}" type="number" class="input" style="margin-top:4px;width:100%" value="${stu.weightKg || ''}" placeholder="e.g. 75">
            </label>
            <label style="font-size:13px;color:var(--text-muted)">Contact (email / phone)
              <input id="sd-contact-${studentId}" class="input" style="margin-top:4px;width:100%" value="${escHtml(stu.contact || '')}" placeholder="email or phone">
            </label>
            <label style="font-size:13px;color:var(--text-muted)">Emergency contact
              <input id="sd-emg-${studentId}" class="input" style="margin-top:4px;width:100%" value="${escHtml(stu.emergencyContact || '')}" placeholder="Name · phone">
            </label>
            <label style="font-size:13px;color:var(--text-muted);grid-column:1/-1">Notes
              <textarea id="sd-notes-${studentId}" class="input" rows="2" style="margin-top:4px;width:100%;resize:vertical">${escHtml(stu.notes || '')}</textarea>
            </label>
          </div>
          <div style="display:flex;gap:var(--sp-2);margin-top:var(--sp-3)">
            <button class="btn btn-primary" style="font-size:13px" onclick="saveStudentDetails('${studentId}')">Save</button>
            <button class="btn btn-secondary" style="font-size:13px" onclick="closeStudentDetailsEdit('${studentId}')">Cancel</button>
          </div>
        </div>
      </div>`;
  }

  function _detailField(label, value) {
    return `
      <div>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:3px">${label}</div>
        <div style="font-size:14px;color:${value === '—' ? 'var(--text-faint)' : 'var(--text)'}">${escHtml(value)}</div>
      </div>`;
  }

  function openStudentDetailsEdit(studentId) {
    const view = document.getElementById('details-view-' + studentId);
    const form = document.getElementById('details-form-' + studentId);
    if (view) view.style.display = 'none';
    if (form) form.style.display = '';
  }

  function closeStudentDetailsEdit(studentId) {
    const view = document.getElementById('details-view-' + studentId);
    const form = document.getElementById('details-form-' + studentId);
    if (view) view.style.display = '';
    if (form) form.style.display = 'none';
  }

  function saveStudentDetails(studentId) {
    const stu = DB.student(studentId);
    if (!stu) return;
    const dob     = document.getElementById('sd-dob-' + studentId)?.value || '';
    const weight  = parseFloat(document.getElementById('sd-weight-' + studentId)?.value) || null;
    const contact = document.getElementById('sd-contact-' + studentId)?.value.trim() || '';
    const emg     = document.getElementById('sd-emg-' + studentId)?.value.trim() || '';
    const notes   = document.getElementById('sd-notes-' + studentId)?.value.trim() || '';
    stu.dob              = dob;
    stu.weightKg         = weight;
    stu.contact          = contact;
    stu.emergencyContact = emg;
    stu.notes            = notes;
    persistData();
    // Re-render just the card without full page reload
    const card = document.getElementById('details-card-' + studentId);

  // ---------- Bulk class booking card ----------------------------------------
  function bulkBookStudent(studentId, classType) {
    const nowMs = new Date(CONFIG.today).getTime();
    const upcoming = CLASSES.filter(c => {
      if (c.status === 'cancelled' || c.status === 'completed') return false;
      if (c.classType !== classType) return false;
      const t = new Date(c.startsAt).getTime();
      return t > nowMs;
    });
    let booked = 0;
    upcoming.forEach(cls => {
      const alreadyBooked = BOOKINGS.find(b => b.classId === cls.id && b.studentId === studentId && b.status === 'booked');
      if (alreadyBooked) return;
      const cap = cls.capacity || 99;
      const filled = BOOKINGS.filter(b => b.classId === cls.id && b.status === 'booked').length;
      if (filled >= cap) return;
      BOOKINGS.push({ id: 'bk-' + Date.now() + '-' + booked, classId: cls.id, studentId, status: 'booked', bookedAt: new Date().toISOString() });
      booked++;
    });
    persistData();
    const card = document.getElementById('bulk-booking-card-' + studentId);
    if (card) card.outerHTML = BulkBookingCard(studentId);
    showToast(booked > 0 ? `Booked into ${booked} upcoming ${classType} class${booked !== 1 ? 'es' : ''}` : `Already booked into all upcoming ${classType} classes`);
  }

  function BulkBookingCard(studentId) {
    const nowMs = new Date(CONFIG.today).getTime();
    // Find distinct class types from upcoming classes
    const types = [...new Set(
      CLASSES
        .filter(c => c.status !== 'cancelled' && c.status !== 'completed' && new Date(c.startsAt).getTime() > nowMs)
        .map(c => c.classType)
    )].sort();

    if (types.length === 0) return '';

    const typeRows = types.map(ct => {
      const upcomingForType = CLASSES.filter(c =>
        c.classType === ct && c.status !== 'cancelled' && c.status !== 'completed' && new Date(c.startsAt).getTime() > nowMs
      );
      const alreadyBooked = upcomingForType.filter(c =>
        BOOKINGS.some(b => b.classId === c.id && b.studentId === studentId && b.status === 'booked')
      ).length;
      const available = upcomingForType.length - alreadyBooked;
      const allDone = available === 0;
      return `
        <div style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0;border-bottom:1px solid var(--border)">
          <div style="flex:1">
            <div style="font-size:13px;font-weight:600">${ct}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px">
              ${alreadyBooked}/${upcomingForType.length} booked
              ${available > 0 ? `· <span style="color:var(--accent)">${available} available</span>` : '· <span style="color:var(--success,#16a34a)">all booked ✓</span>'}
            </div>
          </div>
          <button class="btn btn-sm" style="white-space:nowrap;${allDone ? 'opacity:0.4' : ''}"
            ${allDone ? 'disabled' : `onclick="bulkBookStudent('${studentId}', '${ct.replace(/'/g,"\\'")}')"`}>
            ${allDone ? '✓ Done' : '+ Book all'}
          </button>
        </div>`;
    }).join('');

    return `
      <div class="card" style="margin-top:var(--sp-4)" id="bulk-booking-card-${studentId}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3)">
          <h3 class="card-title" style="margin:0">📅 Bulk class booking</h3>
          <span style="font-size:12px;color:var(--text-muted)">Book into all upcoming slots</span>
        </div>
        ${typeRows}
        <div style="height:var(--sp-1)"></div>
      </div>`;
  }

  function StudentNotesCard(studentId) {
    const notes = (STUDENT_NOTES[studentId] || []).slice().reverse();
    return `

        <h3 class="card-title" style="margin-bottom:var(--sp-3)">📋 Contact log</h3>
        <div style="display:flex;gap:var(--sp-2);margin-bottom:var(--sp-3)">
          <select id="new-note-type-${studentId}" class="input" style="font-size:12px;padding:4px 8px;width:auto">

          <input id="new-note-text-${studentId}" class="input" type="text"

          <button class="btn btn-primary" style="font-size:12px;padding:4px 14px"
                  onclick="addStudentNote('${studentId}')">Add</button>
        </div>
        <div id="student-notes-list-${studentId}">

  function addStudentNote(studentId) {
    const input  = document.getElementById('new-note-text-' + studentId);

    const text = input?.value.trim();
    if (!text) return;
    if (!STUDENT_NOTES[studentId]) STUDENT_NOTES[studentId] = [];

    if (!STUDENT_NOTES[studentId]) return;
    STUDENT_NOTES[studentId] = STUDENT_NOTES[studentId].filter(n => n.id !== noteId);

  // ---------- Session notes -------------------------------------------------
  // Persisted as { [classId]: { text, updatedAt } } under tatami_session_notes

  const SESSION_NOTES_KEY = 'tatami_session_notes';
  let SESSION_NOTES = {};

  function loadSessionNotes() {
    try { SESSION_NOTES = JSON.parse(localStorage.getItem(SESSION_NOTES_KEY)) || {}; } catch { SESSION_NOTES = {}; }

  function saveSessionNotes() {
    try { localStorage.setItem(SESSION_NOTES_KEY, JSON.stringify(SESSION_NOTES)); } catch {}

  // ---------- Class ratings (read-only — written by student.html) -------------
  // Format: { [classId]: [{ studentId, stars, comment, ratedAt }] }

  const CLASS_RATINGS_KEY = 'tatami_class_ratings';
  let CLASS_RATINGS = {};

  function loadClassRatings() {
    try { CLASS_RATINGS = JSON.parse(localStorage.getItem(CLASS_RATINGS_KEY)) || {}; } catch { CLASS_RATINGS = {}; }
  }

  function ClassRatingsCard(classId) {
    const ratings = CLASS_RATINGS[classId] || [];
    if (ratings.length === 0) return '';

    const avg = ratings.reduce((s, r) => s + r.stars, 0) / ratings.length;
    const fullStars = Math.round(avg);
    const starsDisplay = '★'.repeat(fullStars) + '☆'.repeat(5 - fullStars);

    const rows = ratings.map(r => {
      const student = STUDENTS.find(s => s.id === r.studentId);
      const name = student?.name || 'Student';
      const stars = '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars);
      return `
        <div style="display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--border)">

            <div style="font-size:18px;color:#f59e0b;margin:2px 0;letter-spacing:1px">${stars}</div>
            ${r.comment ? `<div style="font-size:12px;color:var(--text-body);margin-top:3px">"${escHtml(r.comment)}"</div>` : ''}
          </div>
          <div style="font-size:11px;color:var(--text-muted);white-space:nowrap">${(r.ratedAt||'').slice(0,10)}</div>
        </div>`;
    }).join('');

    return `
      <div class="card" style="margin-top:var(--sp-4)">
        <div class="row-between" style="margin-bottom:var(--sp-3)">
          <h3 class="card-title" style="margin:0">⭐ Student ratings</h3>
          <div style="display:flex;align-items:center;gap:var(--sp-2)">
            <span style="font-size:20px;color:#f59e0b;letter-spacing:1px">${starsDisplay}</span>
            <span style="font-size:18px;font-weight:700">${avg.toFixed(1)}</span>
            <span style="font-size:13px;color:var(--text-muted)">(${ratings.length})</span>
          </div>
        </div>
        <div>${rows}</div>
      </div>`;

  function SessionNotesCard(classId) {
    const note = SESSION_NOTES[classId] || { text: '', updatedAt: null };
    const saved = note.updatedAt
      ? `<span class="muted" style="font-size:11px">Saved ${new Date(note.updatedAt).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })}</span>`
      : '';
    return `
      <div class="card" style="margin-top:var(--sp-4)">
        <div class="row-between" style="margin-bottom:var(--sp-3)">
          <h3 class="card-title" style="margin:0">📝 Session notes</h3>
          ${saved}
        </div>
        <textarea id="session-notes-${classId}"
          style="width:100%;box-sizing:border-box;min-height:110px;font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:var(--sp-3);resize:vertical;outline:none"
          placeholder="What was covered? Any student highlights or concerns to follow up on…"
          oninput="sessionNotesDirty('${classId}')">${escHtml(note.text)}</textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:var(--sp-2)">
          <button id="session-notes-save-${classId}" class="btn btn-primary" style="font-size:12px;padding:4px 14px;opacity:0.4;pointer-events:none"
            onclick="saveSessionNote('${classId}')">Save</button>
        </div>
      </div>`;
  }

  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function sessionNotesDirty(classId) {
    const btn = document.getElementById('session-notes-save-' + classId);
    if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
  }

  function saveSessionNote(classId) {
    const ta = document.getElementById('session-notes-' + classId);
    if (!ta) return;
    SESSION_NOTES[classId] = { text: ta.value, updatedAt: new Date().toISOString() };
    saveSessionNotes();
    // Update the saved timestamp in-place without full re-render
    const card = ta.closest('.card');
    const existing = card.querySelector('span.muted');
    const newSpan = `<span class="muted" style="font-size:11px">Saved ${new Date().toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })}</span>`;
    if (existing) existing.outerHTML = newSpan;
    else card.querySelector('.row-between').insertAdjacentHTML('beforeend', newSpan);
    const btn = document.getElementById('session-notes-save-' + classId);
    if (btn) { btn.style.opacity = '0.4'; btn.style.pointerEvents = 'none'; }
  }

  // ---------- Class cancellation --------------------------------------------

  function cancelClass(classId) {
    const cls = CLASSES.find(c => c.id === classId);
    if (!cls) return;
    const bookedBookings = BOOKINGS.filter(b => b.classId === classId && b.status === 'booked');
    const bookedStudents = bookedBookings.map(b => DB.student(b.studentId)).filter(Boolean);
    const msg = bookedStudents.length > 0
      ? `Cancel this class? ${bookedStudents.length} student${bookedStudents.length !== 1 ? 's' : ''} will lose their booking.`
      : 'Cancel this class?';
    if (!confirm(msg)) return;
    cls.status = 'cancelled';
    bookedBookings.forEach(b => { b.status = 'cancelled'; });
    persistData();
    // If students were booked, surface a notification composer
    if (bookedStudents.length > 0) {
      pendingCancellationNotice = { cls: { ...cls }, students: bookedStudents };
    } else {
      pendingCancellationNotice = null;
    }
    renderApp();
  }

  function reinstateClass(classId) {
    const cls = CLASSES.find(c => c.id === classId);
    if (!cls) return;
    cls.status = 'scheduled';
    persistData();
    renderApp();
  }

  // ---------- Cancellation Notification Composer ----------------------------

  function dismissCancellationNotice() {
    pendingCancellationNotice = null;
    renderApp();
  }

  function openCancellationMailto() {
    if (!pendingCancellationNotice) return;
    const { cls, students } = pendingCancellationNotice;
    const emails = students.map(s => s.contact).filter(c => c && c.includes('@'));
    const clsDate = new Date(cls.startsAt).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    const clsTime = new Date(cls.startsAt).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    const subject = encodeURIComponent(`Class cancellation — ${cls.classType} on ${clsDate}`);
    const body = encodeURIComponent(document.getElementById('cancel-notify-body').value);
    const bcc = emails.map(encodeURIComponent).join(',');
    window.location.href = `mailto:?bcc=${bcc}&subject=${subject}&body=${body}`;
  }

  function copyCancellationEmails() {
    if (!pendingCancellationNotice) return;
    const emails = pendingCancellationNotice.students.map(s => s.contact).filter(c => c && c.includes('@'));
    navigator.clipboard.writeText(emails.join(', ')).then(() => {
      const btn = document.getElementById('copy-cancel-emails-btn');
      if (btn) { btn.textContent = '✓ Copied!'; setTimeout(() => { btn.textContent = 'Copy emails'; }, 2000); }
    });
  }

  function CancellationNoticeCard() {
    if (!pendingCancellationNotice) return '';
    const { cls, students } = pendingCancellationNotice;
    const clsDate = new Date(cls.startsAt).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    const clsTime = new Date(cls.startsAt).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    const withEmail = students.filter(s => s.contact && s.contact.includes('@'));
    const noEmail   = students.filter(s => !s.contact || !s.contact.includes('@'));
    const defaultBody =
`Hi,

We're writing to let you know that the ${cls.classType} class scheduled for ${clsDate} at ${clsTime} has been cancelled.

We apologise for any inconvenience. Please check the schedule for other available sessions.

Best regards,
${CONFIG.academyName || 'The Team'}`;

    return `
      <div class="card" style="border-color:#f59e0b;background:#fffbeb;margin-bottom:var(--sp-4)">
        <div class="row-between" style="margin-bottom:var(--sp-3)">
          <div>
            <h3 class="card-title" style="margin:0;color:#92400e">📧 Notify students about cancellation</h3>
            <div style="font-size:13px;color:#92400e;margin-top:4px">
              ${students.length} student${students.length !== 1 ? 's' : ''} had booked this class
              ${withEmail.length > 0 ? `· ${withEmail.length} with email address` : ''}
              ${noEmail.length > 0 ? `· <span style="color:var(--danger)">${noEmail.length} without email</span>` : ''}
            </div>
          </div>
          <button class="btn btn-secondary" style="font-size:12px" onclick="dismissCancellationNotice()">Dismiss ×</button>
        </div>

        <textarea id="cancel-notify-body" class="form-input" rows="8" style="font-family:monospace;font-size:12px;resize:vertical;margin-bottom:var(--sp-3)">${defaultBody}</textarea>

        <div class="row" style="gap:var(--sp-3);flex-wrap:wrap">
          ${withEmail.length > 0
            ? `<button class="btn btn-primary" onclick="openCancellationMailto()">✉ Open in mail client (${withEmail.length})</button>`
            : `<span style="font-size:13px;color:var(--text-muted)">No students have email addresses on file</span>`}
          ${withEmail.length > 0
            ? `<button id="copy-cancel-emails-btn" class="btn btn-secondary" onclick="copyCancellationEmails()">Copy emails</button>`
            : ''}
        </div>

        ${noEmail.length > 0 ? `
          <div style="margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid #fde68a">
            <div style="font-size:12px;color:#92400e;font-weight:600;margin-bottom:var(--sp-2)">⚠ No email on file — contact manually:</div>
            <div style="display:flex;flex-wrap:wrap;gap:var(--sp-2)">
              ${noEmail.map(s => `<span style="font-size:12px;background:#fef3c7;border:1px solid #fde68a;border-radius:4px;padding:2px 8px">${s.name}${s.contact ? ' · ' + s.contact : ''}</span>`).join('')}
            </div>
          </div>` : ''}
      </div>
    `;
  }

  function completeClass(classId) {
    const cls = CLASSES.find(c => c.id === classId);
    if (!cls) return;
    cls.status = 'completed';
    persistData();
    renderApp();
  }

  function batchCompletePastClasses() {
    const nowMs = new Date(CONFIG.today).setHours(0, 0, 0, 0);
    const toClose = CLASSES.filter(c => c.status === 'scheduled' && new Date(c.startsAt).getTime() < nowMs);
    if (!toClose.length) return;
    toClose.forEach(c => { c.status = 'completed'; });
    persistData();
    renderApp();
    // Show a brief toast-style confirmation
    const msg = document.createElement('div');
    msg.textContent = `✓ Closed out ${toClose.length} past class${toClose.length !== 1 ? 'es' : ''}`;
    Object.assign(msg.style, { position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%)',
      background:'var(--success,#059669)', color:'#fff', padding:'8px 18px', borderRadius:'8px',
      fontWeight:'600', fontSize:'14px', zIndex:'9999', boxShadow:'0 4px 16px rgba(0,0,0,.15)' });
    document.body.appendChild(msg);
    setTimeout(() => msg.remove(), 2500);
  }

  // ---------- Events --------------------------------------------------------

    { id: 'belt-test',  label: 'Belt Test',   icon: '🥋', color: '#8b5cf6' },

    { id: 'open-mat',   label: 'Open Mat',    icon: '🟢', color: '#10b981' },
    { id: 'social',     label: 'Social',      icon: '🎉', color: '#ec4899' },

    return EVENT_TYPES.find(t => t.id === typeId) || { label: typeId, icon: '📅', color: '#6b7280' };
  }

  function deleteEvent(evtId) {
    if (!confirm('Delete this event?')) return;
    const idx = EVENTS.findIndex(e => e.id === evtId);
    if (idx !== -1) { EVENTS.splice(idx, 1); persistData(); go('events'); }
  }

  function registerStudentToEvent(evtId, stuId) {
    const evt = EVENTS.find(e => e.id === evtId);
    if (!evt) return;
    if (evt.registeredStudentIds.includes(stuId)) return;
    if (evt.capacity && evt.registeredStudentIds.length >= evt.capacity) return;
    evt.registeredStudentIds.push(stuId);
    persistData();
    document.getElementById('content').innerHTML = EventDetail(evtId);
  }

  function unregisterStudentFromEvent(evtId, stuId) {
    const evt = EVENTS.find(e => e.id === evtId);
    if (!evt) return;
    evt.registeredStudentIds = evt.registeredStudentIds.filter(id => id !== stuId);
    persistData();
    document.getElementById('content').innerHTML = EventDetail(evtId);
  }

  function saveNewEvent() {
    const title    = document.getElementById('evt-title').value.trim();
    const type     = document.getElementById('evt-type').value;
    const date     = document.getElementById('evt-date').value;
    const time     = document.getElementById('evt-time').value;
    const duration = parseInt(document.getElementById('evt-duration').value, 10) || 60;
    const location = document.getElementById('evt-location').value.trim();
    const capacity = parseInt(document.getElementById('evt-capacity').value, 10) || 0;
    const notes    = document.getElementById('evt-notes').value.trim();

    if (!title) { alert('Title is required'); return; }
    if (!date)  { alert('Date is required');  return; }

    const evt = {
      id: 'evt-' + Date.now(),
      title, type, date, time: time || '09:00', durationMin: duration,
      location, capacity: capacity || null, notes,
      registeredStudentIds: [],
      createdAt: new Date().toISOString()
    };
    EVENTS.push(evt);
    persistData();
    go('events/' + evt.id);

    const recs = computeClassRecommendations(cls.id, 6);
    const audience = getClassAudience(cls);
    const isCancelled = cls.status === 'cancelled';
    const isPast = new Date(cls.startsAt) < new Date(CONFIG.today);
    // Walk-in students: attended but not in BOOKINGS (checked in via kiosk without a booking)
    const bookedStudentIds = new Set(bookings.map(b => b.studentId));
    const walkInStudents = Object.values(attendanceMap)
      .filter(a => a.attended && !bookedStudentIds.has(a.studentId))
      .map(a => DB.student(a.studentId))
      .filter(Boolean);
    const attendedCount = bookings.filter(b => attendanceMap[b.studentId]?.attended).length
      + walkInStudents.length;
    // Find the matching template so objectives are shared across the week

    return `
      <div style="margin-bottom:var(--sp-4)">
        <a class="muted" style="cursor:pointer;text-decoration:none" onclick="go('classes')">${t(UI.labels.backToClasses)}</a>
      </div>

      <div class="card" style="margin-bottom:var(--sp-4)">
        <div class="row-between">
          <div>
            <h1 class="h1" style="margin-bottom:var(--sp-1)">${cls.classType}</h1>
            <div class="row" style="gap:var(--sp-3); flex-wrap:wrap;align-items:center">
              <span class="muted">${formatClassTime(cls.startsAt)}</span>
              <span class="muted">·</span>
              <span class="muted">${t(UI.labels.instructor)}:
                ${!isCompleted && !isCancelled
                  ? `<select style="font-size:13px;border:1px solid var(--border);border-radius:var(--r-sm);padding:2px 6px;margin-left:4px;font-family:var(--font);color:var(--text);background:var(--surface)"
                       onchange="updateClassInstructor('${cls.id}', this.value)">
                       ${INSTRUCTORS.map(i => `<option value="${i.id}" ${i.id === cls.instructorId ? 'selected' : ''}>${i.name}</option>`).join('')}
                     </select>`
                  : ` ${inst?.name || '—'}`}
              </span>
              <span class="muted">·</span>
              <span class="muted">${bookings.length}/${cls.capacity} ${t(UI.labels.bookedStudents).toLowerCase()}${(() => { const wl = WAITLIST.filter(w => w.classId === cls.id); return wl.length ? ` · <span style="color:#92400e;font-weight:600">⏳ ${wl.length} waiting</span>` : ''; })()}</span>
              <span class="muted">·</span>
              <span class="tag tag-basics">${audience}</span>
              <span class="muted">·</span>
              <span class="tag tag-${isCancelled ? 'danger' : isCompleted ? 'basics' : 'intermediate'}"
                style="${isCancelled ? 'background:var(--danger-bg);color:var(--danger)' : ''}">
                ${isCancelled ? 'Cancelled' : isCompleted ? t(UI.labels.completed) : t(UI.labels.scheduled)}
              </span>
            </div>
          </div>
          <div style="display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center">
            ${isCompleted ? `<span style="font-size:13px;color:var(--text-muted);font-weight:600">✓ ${attendedCount}/${bookings.length} attended</span>` : ''}
            ${bookings.length > 0 ? `<button class="btn btn-secondary" style="font-size:13px" onclick="printClassRoster('${cls.id}')">🖨 Print roster</button>` : ''}
            ${(() => {
              if (isCompleted || isCancelled || bookings.length === 0) return '';
              const studs = bookings.map(b => STUDENTS.find(s => s.id === b.studentId)).filter(Boolean);
              const withEmail = studs.filter(s => s.contact && s.contact.includes('@'));
              if (withEmail.length === 0) return '';
              const bcc = withEmail.map(s => encodeURIComponent(s.contact)).join(',');
              const classDateStr = new Date(cls.startsAt).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
              const classTimeStr = new Date(cls.startsAt).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
              const instName = inst?.name || 'your instructor';
              const subj = encodeURIComponent(`Reminder: ${cls.classType} — ${classDateStr}`);
              const body = encodeURIComponent(
                `Hi everyone,\n\nJust a quick reminder about your upcoming class:\n\n` +
                `📅 ${cls.classType}\n` +
                `🗓  ${classDateStr} at ${classTimeStr}\n` +
                `⏱  ${cls.durationMin} minutes\n` +
                `👤 Instructor: ${instName}\n\n` +
                `See you on the mat!\n\n${ACADEMY.name || 'The Team'}`
              );
              return `<a href="mailto:?bcc=${bcc}&subject=${subj}&body=${body}" style="text-decoration:none">
                <button class="btn btn-secondary" style="font-size:13px" title="Send reminder to ${withEmail.length} booked student${withEmail.length !== 1 ? 's' : ''} with email">
                  📢 Notify (${withEmail.length})
                </button>
              </a>`;
            })()}
            ${!isCompleted && !isCancelled && isPast ? `<button class="btn btn-primary" style="font-size:13px" onclick="completeClass('${cls.id}')">✓ Close out class</button>` : ''}
            ${!isCompleted && !isCancelled ? `<button class="btn btn-secondary" style="color:var(--danger);border-color:var(--danger)" onclick="cancelClass('${cls.id}')">Cancel class</button>` : ''}
            ${isCancelled ? `<button class="btn btn-secondary" onclick="reinstateClass('${cls.id}')">↩ Reinstate</button>` : ''}
          </div>
        </div>
      </div>

      ${pendingCancellationNotice?.cls?.id === cls.id ? CancellationNoticeCard() : ''}

      <div class="grid-2">
        <div class="stack">
          ${ClassObjectiveCard(cls)}

          <div class="card" style="background:#fff7ed; border-color:#fed7aa">
            <h3 class="card-title" style="color:#9a3412">★ ${t(UI.labels.recommendedAdditions)}</h3>
            <div class="faint" style="font-size:12px; margin-bottom:var(--sp-3)">${t(UI.labels.recommendBasedOn)}</div>
            <div class="stack-tight">
              ${recs.recommendations.length === 0
                ? `<div class="muted">${recs.bookedCount === 0 ? t(UI.labels.noBookings) : '—'}</div>`
                : recs.recommendations.map(r => RecommendationRow({...r, classId: cls.id})).join('')}
            </div>
          </div>
        </div>

        <div class="stack">
          <div class="card">
            <div class="row-between" style="margin-bottom:var(--sp-3)">
              <h3 class="card-title" style="margin:0">${t(UI.labels.roster)}</h3>
              ${isCompleted && bookings.length > 0 && attendedCount < bookings.length + walkInStudents.length
                ? `<button class="btn btn-secondary" style="font-size:12px;padding:4px 12px"
                     onclick="markAllAttended('${cls.id}')">✓ Mark all present</button>`
                : ''}
            </div>
            ${bookings.length === 0 && walkInStudents.length === 0
              ? `<div class="muted">${t(UI.labels.noBookings)}</div>`
              : `<div class="stack-tight">
                  ${bookings.map(b => RosterRow(b.studentId, cls, attendanceMap[b.studentId])).join('')}
                  ${walkInStudents.map(stu => WalkInRosterRow(stu, cls)).join('')}
                </div>`}
          </div>

          ${!isCompleted && !isCancelled ? (() => {
            const bookedIds = new Set(bookings.map(b => b.studentId));
            const classWaitlist = WAITLIST.filter(w => w.classId === cls.id);
            const waitlistedIds = new Set(classWaitlist.map(w => w.studentId));
            const enrolled = ENROLLMENTS.filter(e => e.sportId === cls.sportId);
            const unbookedStudents = enrolled
              .map(e => DB.student(e.studentId))
              .filter(stu => stu && !bookedIds.has(stu.id));
            const atCapacity = bookings.length >= cls.capacity;

            // Waitlist queue card (shown when there are waitlisted students)
            const waitlistCard = classWaitlist.length > 0 ? (() => {
              const rows = classWaitlist.map((w, idx) => {
                const stu = DB.student(w.studentId);
                if (!stu) return '';
                const enr = DB.enrollment(stu.id, cls.sportId);
                return `
                  <div class="row-between" style="padding:var(--sp-2) 0;border-bottom:1px solid var(--border)">
                    <div class="row" style="gap:var(--sp-3)">
                      <div style="min-width:20px;text-align:center;font-size:12px;font-weight:700;color:var(--text-muted)">#${idx+1}</div>
                      <div class="avatar" style="width:32px;height:32px;font-size:12px">${stu.initials}</div>
                      <div>
                        <div style="font-weight:500;font-size:13px">${stu.name}</div>
                        <div style="margin-top:2px">${enr ? BeltChip(enr.gradingSystemId, enr.currentLevelId, enr.currentStripes) : ''}</div>
                      </div>
                    </div>
                    <div style="display:flex;gap:var(--sp-2);align-items:center">
                      ${!atCapacity ? `<button class="btn btn-primary" style="font-size:12px;padding:4px 10px"
                        onclick="removeFromWaitlist('${cls.id}','${stu.id}');bookStudent('${cls.id}','${stu.id}')">
                        ↑ Book now
                      </button>` : ''}
                      <button class="btn btn-secondary" style="font-size:12px;padding:4px 10px;color:var(--text-muted)"
                        onclick="removeFromWaitlist('${cls.id}','${stu.id}')">Remove</button>
                    </div>
                  </div>`;
              }).join('');
              return `
                <div class="card" style="border-color:#fed7aa;background:#fff7ed">
                  <div class="row-between" style="margin-bottom:var(--sp-3)">
                    <h3 class="card-title" style="margin:0;color:#9a3412">⏳ Waitlist</h3>
                    <span class="muted" style="font-size:12px">${classWaitlist.length} waiting · auto-promoted when a spot opens</span>
                  </div>
                  <div class="stack-tight">${rows}</div>
                </div>`;
            })() : '';

            // Add students card
            const addCard = (() => {
              if (unbookedStudents.length === 0 && classWaitlist.length === 0) return '';
              const rows = unbookedStudents.map(stu => {
                const enr = DB.enrollment(stu.id, cls.sportId);
                const onWaitlist = waitlistedIds.has(stu.id);
                return `
                  <div class="row-between" style="padding:var(--sp-2) 0;border-bottom:1px solid var(--border)">
                    <div class="row" style="gap:var(--sp-3)">
                      <div class="avatar" style="width:32px;height:32px;font-size:12px">${stu.initials}</div>
                      <div>
                        <div style="font-weight:500;font-size:13px">${stu.name}</div>
                        <div style="margin-top:2px">${enr ? BeltChip(enr.gradingSystemId, enr.currentLevelId, enr.currentStripes) : ''}</div>
                      </div>
                    </div>
                    ${onWaitlist
                      ? `<span style="font-size:12px;color:#92400e;background:#fef3c7;padding:3px 8px;border-radius:4px;font-weight:600">⏳ Waitlisted</span>`
                      : atCapacity
                        ? `<button class="btn btn-secondary" style="font-size:12px;padding:4px 10px;color:#92400e;border-color:#fed7aa;background:#fff7ed"
                             onclick="addToWaitlist('${cls.id}','${stu.id}')">+ Waitlist</button>`
                        : `<button class="btn btn-secondary" style="font-size:12px;padding:4px 12px"
                             onclick="bookStudent('${cls.id}','${stu.id}')">+ Book</button>`}
                  </div>`;
              }).join('');
              if (!rows) return '';
              return `
                <div class="card">
                  <div class="row-between" style="margin-bottom:var(--sp-3)">
                    <h3 class="card-title" style="margin:0">Add students</h3>
                    <span class="muted" style="font-size:12px">${bookings.length}/${cls.capacity} booked${atCapacity ? ' · <span style="color:#92400e;font-weight:600">Full</span>' : ''}</span>
                  </div>
                  <div class="stack-tight">${rows}</div>
                </div>`;
            })();

            return waitlistCard + addCard;
          })() : ''}
        </div>
      </div>

      ${AbsenteesCard(classId)}
      ${SessionNotesCard(classId)}
      ${ClassRatingsCard(classId)}
    `;
  }

  function AbsenteesCard(classId) {
    const cls = DB.class(classId);
    if (!cls || cls.status !== 'completed') return '';

    const bookings = BOOKINGS.filter(b => b.classId === cls.id && b.status === 'booked');
    if (bookings.length === 0) return '';

    const attendanceMap = ATTENDANCE.reduce((acc, a) => {
      if (a.classId === cls.id) acc[a.studentId] = a;
      return acc;
    }, {});

    const absentees = bookings
      .filter(b => !attendanceMap[b.studentId]?.attended)
      .map(b => DB.student(b.studentId))
      .filter(Boolean);

    if (absentees.length === 0) return '';

    const classDateStr = new Date(cls.startsAt).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    const classTimeStr = new Date(cls.startsAt).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });

    const rows = absentees.map(stu => {
      const enr = DB.enrollment(stu.id, cls.sportId);
      const firstName = stu.name.split(' ')[0];
      const hasEmail = stu.contact && stu.contact.includes('@');
      const emailSubject = encodeURIComponent(`Missed you at ${cls.classType} — ${classDateStr}`);
      const emailBody = encodeURIComponent(
        `Hi ${firstName},\n\nWe missed you at ${cls.classType} on ${classDateStr} at ${classTimeStr}.\n\n` +
        `Hope everything is okay — if you have any questions or need to reschedule, just reply to this message.\n\n` +
        `See you on the mat soon 🥋\n${ACADEMY.name || 'The Team'}`
      );
      const emailBtn = hasEmail
        ? `<a href="mailto:${encodeURIComponent(stu.contact)}?subject=${emailSubject}&body=${emailBody}"
               style="text-decoration:none" onclick="event.stopPropagation()">
             <button class="btn btn-sm" style="font-size:11px;padding:2px 8px;white-space:nowrap">✉ Email</button>
           </a>`
        : `<button class="btn btn-sm" disabled style="font-size:11px;padding:2px 8px;opacity:0.35;white-space:nowrap">✉ Email</button>`;

      return `
        <div class="row-between" style="padding:var(--sp-2) 0;border-bottom:1px solid var(--border);cursor:pointer"
             onclick="go('students/${stu.id}')">
          <div class="row" style="gap:var(--sp-3)">
            <div class="avatar" style="width:32px;height:32px;font-size:12px">${stu.initials}</div>
            <div>
              <div style="font-weight:500;font-size:13px">${stu.name}</div>
              <div style="margin-top:2px">${enr ? BeltChip(enr.gradingSystemId, enr.currentLevelId, enr.currentStripes) : ''}</div>
            </div>
          </div>
          <div onclick="event.stopPropagation()">${emailBtn}</div>
        </div>`;
    }).join('');

    // Build bulk email mailto for all absentees with email
    const absenteesWithEmail = absentees.filter(s => s.contact && s.contact.includes('@'));
    const bulkBcc = absenteesWithEmail.map(s => encodeURIComponent(s.contact)).join(',');
    const bulkSubject = encodeURIComponent(`Missed you at ${cls.classType} — ${classDateStr}`);
    const bulkBody = encodeURIComponent(
      `Hi everyone,\n\nWe missed you at ${cls.classType} on ${classDateStr} at ${classTimeStr}.\n\n` +
      `Hope you're all doing well. If there's anything we can help with, just reply to this message.\n\n` +
      `See you on the mat soon 🥋\n${ACADEMY.name || 'The Team'}`
    );
    const bulkBtn = absenteesWithEmail.length > 1
      ? `<a href="mailto:?bcc=${bulkBcc}&subject=${bulkSubject}&body=${bulkBody}" style="text-decoration:none">
           <button class="btn btn-sm" style="font-size:11px;padding:2px 10px">✉ Email all (${absenteesWithEmail.length})</button>
         </a>`
      : '';

    return `
      <div class="card" style="margin-top:var(--sp-4);border-left:3px solid var(--warn,#f59e0b)">
        <div class="row-between" style="margin-bottom:var(--sp-3)">
          <h3 class="card-title" style="margin:0;color:var(--warn,#b45309)">
            ⚠ Absent (${absentees.length})
          </h3>
          ${bulkBtn}
        </div>
        <div class="stack-tight">${rows}</div>
      </div>`;
  }

  function updateClassInstructor(classId, instructorId) {
    const cls = CLASSES.find(c => c.id === classId);
    if (cls) { cls.instructorId = instructorId; persistData(); renderApp(); }
  }

  function addItemToClass(classId, itemId) {
    const cls = CLASSES.find(c => c.id === classId);
    if (!cls) return;
    if (cls.plannedItemIds.includes(itemId)) return;
    cls.plannedItemIds.push(itemId);
    persistData();
    renderApp();
  }

  function removeItemFromClass(classId, itemId) {
    const cls = CLASSES.find(c => c.id === classId);
    if (!cls) return;
    cls.plannedItemIds = cls.plannedItemIds.filter(id => id !== itemId);
    persistData();
    renderApp();
  }

  function RecommendationRow(r) {
    const benefitPct = Math.round(r.pct * 100);
    const alreadyInPlan = r.classId && CLASSES.find(c => c.id === r.classId)?.plannedItemIds.includes(r.item.id);
    return `
      <div style="padding:var(--sp-2) 0; border-bottom:1px solid #fed7aa">
        <div class="row-between" style="margin-bottom:var(--sp-1)">
          <div>
            <div style="font-weight:500">${t(r.item.name)}</div>
            <div class="faint" style="font-size:12px">${t(r.section.name)}</div>
          </div>
          <div class="row" style="gap:var(--sp-2)">
            ${SectionTag(r.section)}
            ${alreadyInPlan
              ? `<span style="font-size:12px;color:var(--success);font-weight:600">✓ Added</span>`
              : `<button class="btn btn-secondary btn-sm" onclick="addItemToClass('${r.classId}','${r.item.id}')">${t(UI.labels.addToPlan)}</button>`}
          </div>
        </div>
        <div class="faint" style="font-size:12px">
          <strong style="color:#9a3412">${r.gapStudents} ${t(UI.labels.of)} ${r.totalBooked}</strong>
          ${t(UI.labels.students)} ${t(UI.labels.wouldBenefit)} (${benefitPct}%)
        </div>
      </div>
    `;
  }

  function bookStudent(classId, studentId) {
    const existing = BOOKINGS.find(b => b.classId === classId && b.studentId === studentId);
    if (existing) {
      existing.status = 'booked';
    } else {
      BOOKINGS.push({ id: 'bk-' + Date.now(), classId, studentId, status: 'booked', bookedAt: new Date().toISOString() });
    }
    persistData();
    renderApp();
  }

  function unbookStudent(classId, studentId) {
    const existing = BOOKINGS.find(b => b.classId === classId && b.studentId === studentId);
    if (!existing) return;
    existing.status = 'cancelled';
    // Auto-promote first person on the waitlist
    const next = WAITLIST.find(w => w.classId === classId);
    if (next) {
      WAITLIST.splice(WAITLIST.indexOf(next), 1);
      const wb = BOOKINGS.find(b => b.classId === classId && b.studentId === next.studentId);
      if (wb) {
        wb.status = 'booked';
      } else {
        BOOKINGS.push({ id: 'bk-' + Date.now(), classId, studentId: next.studentId, status: 'booked', bookedAt: new Date().toISOString() });
      }
    }
    persistData();
    renderApp();
  }

  function addToWaitlist(classId, studentId) {
    const already = WAITLIST.find(w => w.classId === classId && w.studentId === studentId);
    if (already) return;
    WAITLIST.push({ id: 'wl-' + Date.now(), classId, studentId, addedAt: new Date().toISOString() });
    persistData();
    renderApp();
  }

  function removeFromWaitlist(classId, studentId) {
    const idx = WAITLIST.findIndex(w => w.classId === classId && w.studentId === studentId);
    if (idx !== -1) { WAITLIST.splice(idx, 1); persistData(); renderApp(); }
  }

  function toggleAttendance(classId, studentId, checked) {
    const existing = ATTENDANCE.find(a => a.classId === classId && a.studentId === studentId);
    if (existing) {
      existing.attended = checked;
      existing.markedAt = new Date().toISOString();
    } else {
      ATTENDANCE.push({ classId, studentId, attended: checked, markedAt: new Date().toISOString() });
    }
    persistAttendance();
  }

  function markAllAttended(classId) {
    const bookedStudents = BOOKINGS.filter(b => b.classId === classId && b.status === 'booked');
    bookedStudents.forEach(b => {
      const existing = ATTENDANCE.find(a => a.classId === classId && a.studentId === b.studentId);
      if (existing) {
        existing.attended = true;
        existing.markedAt = new Date().toISOString();
      } else {
        ATTENDANCE.push({ classId, studentId: b.studentId, attended: true, markedAt: new Date().toISOString() });
      }
    });
    persistData();
    renderApp();
  }

  function RosterRow(studentId, cls, attendance) {
    const stu = DB.student(studentId);
    const enr = DB.enrollment(stu.id, cls.sportId);
    const isCompleted = cls.status === 'completed';
    const attended = attendance?.attended;
    return `
      <div class="row-between" style="padding:var(--sp-3) 0; border-bottom:1px solid var(--border); cursor:pointer" onclick="go('students/${stu.id}')">
        <div class="row" style="gap:var(--sp-3)">
          <div class="avatar">${stu.initials}</div>
          <div>
            <div style="font-weight:500">${stu.name}</div>
            <div style="margin-top:2px">${BeltChip(enr.gradingSystemId, enr.currentLevelId, enr.currentStripes)}</div>
          </div>
        </div>
        ${isCompleted
          ? `<div onclick="event.stopPropagation()">
              <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px">
                <input type="checkbox" ${attended ? 'checked' : ''}
                  onchange="toggleAttendance('${cls.id}', '${studentId}', this.checked)" />
                <span class="muted">${t(UI.labels.attended)}</span>
              </label>
            </div>`
          : `<div onclick="event.stopPropagation()">
              <button class="btn btn-secondary" style="font-size:12px;padding:4px 10px;color:var(--text-muted)"
                onclick="unbookStudent('${cls.id}', '${studentId}')">Remove</button>
            </div>`}
      </div>
    `;
  }

  // Walk-in row: student attended via kiosk but had no booking
  function WalkInRosterRow(stu, cls) {
    const enr = DB.enrollment(stu.id, cls.sportId);
    return `
      <div class="row-between" style="padding:var(--sp-3) 0; border-bottom:1px solid var(--border); cursor:pointer" onclick="go('students/${stu.id}')">
        <div class="row" style="gap:var(--sp-3)">
          <div class="avatar">${stu.initials}</div>
          <div>
            <div style="font-weight:500">${stu.name}</div>
            <div style="margin-top:2px;display:flex;align-items:center;gap:6px">
              ${enr ? BeltChip(enr.gradingSystemId, enr.currentLevelId, enr.currentStripes) : ''}
              <span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#fef3c7;color:#92400e">Walk-in</span>
            </div>
          </div>
        </div>
        <span style="font-size:13px;font-weight:600;color:#16a34a">✓ Attended</span>
      </div>`;
  }

  // ---------- Screen: Org Setup Wizard --------------------------------------

  function OrgSetupWizard() {
    const steps = ['Org Details', 'Martial Arts', 'Curriculum', 'Gym Rules'];
    const stepBar = steps.map((label, i) => {
      const n = i + 1;
      const active = n === wizardState.step;
      const done   = n < wizardState.step;
      return `
        <div style="display:flex;align-items:center;gap:var(--sp-2)">
          <div style="width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
               background:${done ? 'var(--success)' : active ? 'var(--primary)' : 'var(--surface-alt)'};
               color:${done || active ? '#fff' : 'var(--text-muted)'}">
            ${done ? '✓' : n}
          </div>
          <span style="font-size:13px;font-weight:${active ? 600 : 400};color:${active ? 'var(--text)' : 'var(--text-muted)'}">

          </span>
          ${n < steps.length ? `<span style="color:var(--border-strong);margin:0 var(--sp-2)">›</span>` : ''}
        </div>
      `;
    }).join('');

    let body = '';
    if (wizardState.step === 1) body = WizardStep1();
    if (wizardState.step === 2) body = WizardStep2();
    if (wizardState.step === 3) body = WizardStep3();
    if (wizardState.step === 4) body = WizardStep4();

    return `
      <div style="max-width:680px;margin:0 auto">
        <h1 class="h1" style="margin-bottom:var(--sp-2)">Org Setup</h1>

          <div style="display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-1)">${stepBar}</div>
        </div>

        ${body}
      </div>
    `;
  }

  // ---------- Screen: Curriculum (v2 — Supabase-backed) ---------------------
  // Modules inline (no sidebar). Filters: category, complexity, type, ruleset,
  // context, status, search. View/Admin mode. Reads live from Supabase.

  // Curriculum i18n — translates the controlled vocabulary (module names,
  // categories, complexity, ruleset, context) and UI chrome. Technique names,
  // descriptions and key-details are free-text content and shown as stored.
  const CURRIC_I18N = {
    module: {
      'mod-standing': { en:'Standing & Takedowns', pt:'Em Pé & Quedas' },
      'mod-passing':  { en:'Guard Passing',        pt:'Passagem de Guarda' },
      'mod-side':     { en:'Side Control Battle',  pt:'Cem Quilos' },
      'mod-mount':    { en:'Mount Battle',         pt:'Montada' },

      'mod-subs':     { en:'Submissions',          pt:'Finalizações' },
      'mod-concepts': { en:'Concepts',             pt:'Conceitos' },
      'mod-drills':   { en:'Drills',               pt:'Exercícios' }
    },
    category: {
      'Escape':{en:'Escape',pt:'Saída'}, 'Sweep':{en:'Sweep',pt:'Raspagem'},
      'Submission':{en:'Submission',pt:'Finalização'}, 'Guard Pass':{en:'Guard Pass',pt:'Passagem'},
      'Takedown':{en:'Takedown',pt:'Queda'}, 'Control':{en:'Control',pt:'Controlo'},
      'Transition':{en:'Transition',pt:'Transição'}, 'Guard Retention':{en:'Guard Retention',pt:'Retenção de Guarda'},
      'Concept':{en:'Concept',pt:'Conceito'}, 'Drill':{en:'Drill',pt:'Exercício'}
    },
    complexity: {
      'Beginner':{en:'Beginner',pt:'Iniciante'}, 'Intermediate':{en:'Intermediate',pt:'Intermédio'},
      'Advanced':{en:'Advanced',pt:'Avançado'}, 'Expert':{en:'Expert',pt:'Especialista'}
    },
    ruleset: { 'Both':{en:'Both',pt:'Ambos'}, 'Gi':{en:'Gi',pt:'Gi'}, 'No-Gi':{en:'No-Gi',pt:'No-Gi'} },
    context: { 'Self-Defense':{en:'Self-Defense',pt:'Defesa Pessoal'}, 'Sport':{en:'Sport',pt:'Desporto'}, 'Both':{en:'Both',pt:'Ambos'} },
    legtier: { 'None':{en:'None',pt:'Nenhuma'}, 'Basic':{en:'Basic',pt:'Básica'}, 'Advanced':{en:'Advanced',pt:'Avançada'} },
    ui: {
      master:        {en:'Master Curriculum', pt:'Currículo Base'},
      techniques:    {en:'techniques',        pt:'técnicas'},
      sport:         {en:'Sport',             pt:'Modalidade'},
      curriculum:    {en:'Curriculum',        pt:'Currículo'},
      allCategories: {en:'All categories',    pt:'Todas as categorias'},
      allComplexity: {en:'All complexity',    pt:'Toda a complexidade'},
      allTypes:      {en:'All types',         pt:'Todos os tipos'},
      allRulesets:   {en:'All rulesets',      pt:'Todas as regras'},
      allContexts:   {en:'All contexts',      pt:'Todos os contextos'},
      active:        {en:'Active',            pt:'Ativas'},
      activeHidden:  {en:'Active + hidden',   pt:'Ativas + ocultas'},
      hiddenOnly:    {en:'Hidden only',       pt:'Apenas ocultas'},
      hidden:        {en:'Hidden',            pt:'Oculta'},
      search:        {en:'Search techniques…',pt:'Procurar técnicas…'},
      clear:         {en:'Clear',             pt:'Limpar'},
      reconfigure:   {en:'✦ Build / Reconfigure', pt:'✦ Construir / Reconfigurar'},
      settings:      {en:'⚙ Settings',        pt:'⚙ Definições'},
      view:          {en:'View',              pt:'Ver'},
      admin:         {en:'Admin',             pt:'Admin'},
      hide:          {en:'Hide',              pt:'Ocultar'},
      restore:       {en:'Restore',           pt:'Restaurar'},
      restoreAll:    {en:'Restore all',       pt:'Restaurar todas'},
      allHidden:     {en:'All techniques in this module are hidden.', pt:'Todas as técnicas deste módulo estão ocultas.'},
      noMatch:       {en:'No techniques match the current filters.',  pt:'Nenhuma técnica corresponde aos filtros.'},
      colName:       {en:'Name',pt:'Nome'}, colCategory:{en:'Category',pt:'Categoria'},
      colType:       {en:'Type',pt:'Tipo'}, colComplexity:{en:'Complexity',pt:'Complexidade'},
      colRuleset:    {en:'Ruleset',pt:'Regras'}, colContext:{en:'Context',pt:'Contexto'},
      colStatus:     {en:'Status',pt:'Estado'}
    }
  };
  // ct: translate a controlled value; falls back to the raw value if no entry.
  function ct(group, value) {
    const entry = CURRIC_I18N[group] && CURRIC_I18N[group][value];
    return entry ? t(entry) : (value || '');
  }
  // moduleName: localized module name from a module row (DB name is English).
  function moduleName(m) { if (!m) return ''; const tr = ct('module', m.id); return tr === m.id ? m.name : tr; }

  const CV2 = {
    loaded: false,
    sports: [],
    configs: [],             // curriculum_configs rows
    modules: [],
    techniques: [],          // all techniques (all sports)
    membership: {},          // techniqueId -> curriculum_techniques row (when a curriculum is active)
    sportId: null,
    curriculumId: null,
    mode: 'view',
    collapsed: {},
    filters: { category: '', complexity: '', type: '', ruleset: '', context: '', status: 'active', search: '' }
  };

  function CurriculumBuilder() {
    // Return a shell synchronously; fill it asynchronously from Supabase.
    setTimeout(loadCurriculumV2, 0);
    return `
      <div class="cv2" data-mode="${CV2.mode}">
        <div class="row-between" style="margin-bottom:var(--sp-4)">
          <div>
            <h1 class="h1" id="cv2Title">Curriculum</h1>
            <div class="muted" id="cv2Summary" style="font-size:13px">Loading…</div>
          </div>
          <div class="row" style="gap:var(--sp-2)">
            <div class="cv2-seg" id="cv2Mode">
              <button data-mode="view" class="${CV2.mode==='view'?'on':''}">${ct('ui','view')}</button>
              <button data-mode="admin" class="${CV2.mode==='admin'?'on':''}">${ct('ui','admin')}</button>
            </div>
            <button class="btn btn-primary" onclick="go('curriculum-wizard')">${ct('ui','reconfigure')}</button>
            <button class="btn btn-secondary" onclick="go('settings')">${ct('ui','settings')}</button>
          </div>
        </div>
        <div class="cv2-bar" style="margin-bottom:var(--sp-3)">
          <label style="font-size:12px;color:var(--text-muted);font-weight:600">${ct('ui','sport')}</label>
          <select id="cv2Sport"></select>
          <label style="font-size:12px;color:var(--text-muted);font-weight:600;margin-left:var(--sp-3)">${ct('ui','curriculum')}</label>
          <select id="cv2Curriculum"></select>
        </div>
        <div class="cv2-bar">
          <select id="cv2Category"><option value="">${ct('ui','allCategories')}</option></select>
          <select id="cv2Complexity"><option value="">${ct('ui','allComplexity')}</option></select>
          <select id="cv2Type"><option value="">${ct('ui','allTypes')}</option></select>
          <select id="cv2Ruleset"><option value="">${ct('ui','allRulesets')}</option></select>
          <select id="cv2Context"><option value="">${ct('ui','allContexts')}</option></select>
          <select id="cv2Status">
            <option value="active">${ct('ui','active')}</option>
            <option value="">${ct('ui','activeHidden')}</option>
            <option value="hidden">${ct('ui','hiddenOnly')}</option>
          </select>
          <input id="cv2Search" type="search" placeholder="${ct('ui','search')}" />
          <span class="spacer"></span>
          <button class="btn btn-secondary" id="cv2Clear" style="font-size:12px">${ct('ui','clear')}</button>
        </div>
        <div id="cv2Content"><div class="cv2-empty">Loading curriculum…</div></div>
      </div>
    `;
  }

  async function loadCurriculumV2() {
    const content = document.getElementById('cv2Content');
    if (!content) return; // navigated away
    if (!CV2.loaded) {
      try {
        const [mods, techs, sports, configs] = await Promise.all([
          sb.from('modules').select('*').order('default_order'),
          sb.from('techniques').select('*').order('number'),
          sb.from('sports').select('*'),
          sb.from('curriculum_configs').select('*').order('created_at')
        ]);
        if (mods.error || techs.error || sports.error) throw (mods.error || techs.error || sports.error);
        CV2.modules = mods.data || [];
        CV2.techniques = techs.data || [];
        CV2.sports = sports.data || [];
        CV2.configs = configs.data || [];
        // Fallback: if the sports table is empty, derive sports from the
        // techniques' sport_id (or default to BJJ) so the page still works.
        if (!CV2.sports.length) {
          const ids = [...new Set(CV2.techniques.map(t => t.sport_id).filter(Boolean))];
          CV2.sports = (ids.length ? ids : ['sport-bjj']).map(id => ({
            id, name: id === 'sport-bjj'
              ? { en: 'Brazilian Jiu-Jitsu', pt: 'Jiu-Jitsu Brasileiro' } : { en: id }
          }));
        }
        CV2.sportId = CV2.sportId || CV2.sports[0]?.id || null;
        CV2.loaded = true;
      } catch (e) {
        content.innerHTML = `<div class="cv2-empty">Couldn't load curriculum.<br>
          <span class="muted">Run migrations 003–005 in Supabase, then reload.</span></div>`;
        return;
      }
    }
    // Shell is recreated on every navigation, so always (re)populate + bind.
    buildCV2Filters();
    populateCV2Scope();
    bindCV2();
    renderCV2();
  }

  // Populate the Sport + Curriculum selectors
  function populateCV2Scope() {
    const sportSel = document.getElementById('cv2Sport');
    if (sportSel) {
      sportSel.innerHTML = CV2.sports
        .map(s => `<option value="${s.id}">${t(s.name)}</option>`).join('');
      sportSel.value = CV2.sportId || '';
    }
    populateCV2Curriculum();
  }

  function populateCV2Curriculum() {
    const sel = document.getElementById('cv2Curriculum');
    if (!sel) return;
    const forSport = CV2.configs.filter(c => (c.sport_id || 'sport-bjj') === CV2.sportId);
    sel.innerHTML = `<option value="">${ct('ui','master')}</option>` +
      forSport.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    sel.value = CV2.curriculumId || '';
  }

  async function loadCV2Membership() {
    CV2.membership = {};
    if (!CV2.curriculumId) return;
    const { data } = await sb.from('curriculum_techniques')
      .select('*').eq('curriculum_id', CV2.curriculumId);
    (data || []).forEach(r => { CV2.membership[r.technique_id] = r; });
  }

  function cv2Rows() {
    return CV2.techniques
      .filter(t => (t.sport_id || 'sport-bjj') === CV2.sportId)
      .filter(t => !CV2.curriculumId || CV2.membership[t.id])
      .map(t => {
        const m = CV2.membership[t.id];
        return {
          tech: t,
          moduleId: m ? (m.module_id || t.default_module_id) : t.default_module_id,
          hidden: m ? m.is_hidden : false,
          order: m ? m.sequence_order : t.number
        };
      });
  }

  function cv2Passes(row) {
    const f = CV2.filters, t = row.tech;
    if (f.category && t.category !== f.category) return false;
    if (f.complexity && t.complexity !== f.complexity) return false;
    if (f.type && t.type !== f.type) return false;
    if (f.ruleset && t.ruleset !== f.ruleset) return false;
    if (f.context && t.context !== f.context) return false;
    if (f.status === 'active' && row.hidden) return false;
    if (f.status === 'hidden' && !row.hidden) return false;
    if (f.search) {
      const q = f.search.toLowerCase();
      if (!(t.name.toLowerCase().includes(q) || (t.type||'').toLowerCase().includes(q))) return false;
    }
    return true;
  }

  function buildCV2Filters() {
    const uniq = (k) => [...new Set(CV2.techniques.map(t => t[k]).filter(Boolean))].sort();
    const fill = (id, vals, group) => { const s = document.getElementById(id); if (!s) return;
      vals.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = group ? ct(group, v) : v; s.appendChild(o); }); };
    fill('cv2Category', uniq('category'), 'category');
    fill('cv2Complexity', ['Beginner','Intermediate','Advanced','Expert'], 'complexity');
    fill('cv2Type', uniq('type'));
    fill('cv2Ruleset', uniq('ruleset'), 'ruleset');
    fill('cv2Context', uniq('context'), 'context');
  }

  function bindCV2() {
    const map = { cv2Category:'category', cv2Complexity:'complexity', cv2Type:'type',
      cv2Ruleset:'ruleset', cv2Context:'context', cv2Status:'status' };
    Object.entries(map).forEach(([id, key]) => {
      const el = document.getElementById(id); if (el) el.onchange = e => { CV2.filters[key] = e.target.value; renderCV2(); };
    });
    const search = document.getElementById('cv2Search');
    if (search) search.oninput = e => { CV2.filters.search = e.target.value; renderCV2(); };
    const clear = document.getElementById('cv2Clear');
    if (clear) clear.onclick = () => {
      CV2.filters = { category:'', complexity:'', type:'', ruleset:'', context:'', status:'active', search:'' };
      ['cv2Category','cv2Complexity','cv2Type','cv2Ruleset','cv2Context'].forEach(id => { const e = document.getElementById(id); if (e) e.value=''; });
      const st = document.getElementById('cv2Status'); if (st) st.value='active';
      if (search) search.value=''; renderCV2();
    };
    const sportSel = document.getElementById('cv2Sport');
    if (sportSel) sportSel.onchange = e => {
      CV2.sportId = e.target.value;
      CV2.curriculumId = null;
      CV2.membership = {};
      populateCV2Curriculum();
      renderCV2();
    };
    const curSel = document.getElementById('cv2Curriculum');
    if (curSel) curSel.onchange = async e => {
      CV2.curriculumId = e.target.value || null;
      await loadCV2Membership();
      renderCV2();
    };
    const mode = document.getElementById('cv2Mode');
    if (mode) mode.querySelectorAll('button').forEach(b => b.onclick = () => {
      CV2.mode = b.dataset.mode;
      document.querySelector('.cv2').dataset.mode = CV2.mode;
      mode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    });
  }

  function renderCV2() {
    const content = document.getElementById('cv2Content');
    if (!content) return;
    const rows = cv2Rows();
    const cfg = CV2.configs.find(c => c.id === CV2.curriculumId);
    document.getElementById('cv2Title').textContent = cfg ? cfg.name : ct('ui','master');
    const sportName = CV2.sports.find(s => s.id === CV2.sportId);
    const bits = [sportName ? t(sportName.name) : null, cfg?.type_summary, `${rows.length} ${ct('ui','techniques')}`].filter(Boolean);
    document.getElementById('cv2Summary').textContent = bits.join(' · ');

    const byModule = {};
    rows.forEach(r => { (byModule[r.moduleId] = byModule[r.moduleId] || []).push(r); });

    const filtersActive = !!(CV2.filters.category || CV2.filters.complexity || CV2.filters.type ||
      CV2.filters.ruleset || CV2.filters.context || CV2.filters.search || CV2.filters.status !== 'active');

    content.innerHTML = '';
    let any = false;
    CV2.modules.forEach(m => {
      const list = (byModule[m.id] || []);
      if (!list.length) return;
      const visible = list.filter(cv2Passes);
      if (!visible.length && filtersActive) return;
      any = true;

      const counts = { Beginner:0, Intermediate:0, Advanced:0, Expert:0 };
      visible.forEach(r => counts[r.tech.complexity] = (counts[r.tech.complexity]||0)+1);
      const tot = visible.length || 1;
      const bar = ['Beginner','Intermediate','Advanced','Expert']
        .map(k => counts[k] ? `<span class="cb-${k}" style="width:${counts[k]/tot*100}%" title="${k}: ${counts[k]}"></span>` : '').join('');

      const sec = document.createElement('section');
      sec.className = 'cv2-mod' + (CV2.collapsed[m.id] ? ' collapsed' : '');
      sec.innerHTML = `
        <div class="cv2-head">
          <span class="chev">▾</span>
          <span class="mname">${moduleName(m)}</span>
          <span class="cv2-badge">${visible.length}</span>
          <span class="mspacer"></span>
          <span class="cv2-cbar">${bar}</span>
        </div>
        <div class="cv2-body"></div>`;
      sec.querySelector('.cv2-head').onclick = () => {
        CV2.collapsed[m.id] = !CV2.collapsed[m.id]; renderCV2();
      };
      const body = sec.querySelector('.cv2-body');
      if (!visible.length) {
        body.innerHTML = `<div style="padding:var(--sp-4);color:var(--text-faint);display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3)">
          <span>${ct('ui','allHidden')}</span>
          <button class="btn btn-secondary cv2-admin" data-restore="${m.id}" style="font-size:12px">${ct('ui','restoreAll')}</button></div>`;
      } else {
        visible.sort((a,b) => a.order - b.order);
        body.innerHTML = `<table class="cv2-tbl">
          <thead><tr><th>${ct('ui','colName')}</th><th>${ct('ui','colCategory')}</th><th>${ct('ui','colType')}</th><th>${ct('ui','colComplexity')}</th><th>${ct('ui','colRuleset')}</th><th>${ct('ui','colContext')}</th><th>${ct('ui','colStatus')}</th><th></th></tr></thead>
          <tbody>${visible.map(cv2RowHtml).join('')}</tbody></table>`;
      }
      content.appendChild(sec);
    });

    if (!any) {
      content.innerHTML = `<div class="cv2-empty">${ct('ui','noMatch')}</div>`;
    }
    content.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => cv2ToggleHidden(b.dataset.toggle));
    content.querySelectorAll('[data-restore]').forEach(b => b.onclick = () => cv2RestoreModule(b.dataset.restore));
  }

  function cv2RowHtml(r) {
    const t = r.tech;
    return `<tr class="${r.hidden ? 'cv2-row-hidden' : ''}">
      <td><span class="cv2-name" onclick="go('curriculum-tech/${t.slug}')">${t.name}</span></td>
      <td>${ct('category', t.category)}</td>
      <td>${t.type || '—'}</td>
      <td><span class="cv2-pill c-${t.complexity}">${ct('complexity', t.complexity)}</span></td>
      <td><span class="cv2-pill">${ct('ruleset', t.ruleset)}</span></td>
      <td><span class="cv2-pill">${ct('context', t.context)}</span></td>
      <td>${r.hidden ? `<span class="cv2-pill">${ct('ui','hidden')}</span>` : `<span class="cv2-pill c-Beginner">${ct('ui','active')}</span>`}</td>
      <td><button class="btn btn-secondary cv2-admin" data-toggle="${t.id}" style="font-size:12px">${r.hidden ? ct('ui','restore') : ct('ui','hide')}</button></td>
    </tr>`;
  }

  async function cv2ToggleHidden(techId) {
    const m = CV2.membership[techId];
    if (!CV2.curriculumId || !m) { showToast('Hiding needs an active curriculum (run the wizard).'); return; }
    const next = !m.is_hidden;
    m.is_hidden = next; renderCV2();
    const { error } = await sb.from('curriculum_techniques').update({ is_hidden: next }).eq('id', m.id);
    if (error) {
      m.is_hidden = !next; renderCV2();
      const ro = error.code === '42501' || /policy|permission|row-level/i.test(error.message || '');
      showToast(ro ? 'This is a read-only demo — changes are not saved.' : 'Failed to save.');
    }
  }

  async function cv2RestoreModule(moduleId) {
    if (!CV2.curriculumId) return;
    const rows = Object.values(CV2.membership).filter(m => (m.module_id||'') === moduleId && m.is_hidden);
    rows.forEach(m => m.is_hidden = false); renderCV2();
    await sb.from('curriculum_techniques').update({ is_hidden: false }).in('id', rows.map(m => m.id));
  }

  // ---------- Curriculum Wizard (5 screens) --------------------------------
  // 1 Academy profile · 2 Philosophy · 3 Student profile · 4 Preview · 5 Sequence
  // Output: curriculum_configs + curriculum_techniques rows in Supabase.

  const WIZ = {
    step: 1,
    loaded: false,
    modules: [],
    techniques: [],
    answers: {
      name: '', location: '', language: 'en',
      focus: 'Mixed', legLock: 'Moderate', takedowns: 'Moderate', ruleset: 'Both',
      students: ['Adult recreational']
    },
    userInclude: new Set(),  // re-added techniques (override filter exclusion)
    userExclude: new Set(),  // removed techniques
    userHide: new Set(),     // explicitly hidden
    userShow: new Set(),     // explicitly shown (override auto-hide)
    moduleOrder: [],         // ordered module ids
    showExcluded: false,
    saving: false
  };

  function CurriculumWizard() {
    setTimeout(initWizard, 0);
    return `<div id="wizRoot"><div class="cv2-empty" style="padding:var(--sp-7)">Loading…</div></div>`;
  }

  async function initWizard() {
    if (!WIZ.loaded) {
      // Reuse curriculum data if already loaded, else fetch.
      if (CV2.loaded && CV2.techniques.length) {
        WIZ.modules = CV2.modules; WIZ.techniques = CV2.techniques;
      } else {
        const [mods, techs] = await Promise.all([
          sb.from('modules').select('*').order('default_order'),
          sb.from('techniques').select('*').order('number')
        ]);
        if (mods.error || techs.error) {
          const r = document.getElementById('wizRoot');
          if (r) r.innerHTML = `<div class="cv2-empty">Couldn't load technique data. Run migrations 003–005 first.</div>`;
          return;
        }
        WIZ.modules = mods.data || []; WIZ.techniques = techs.data || [];
      }
      WIZ.moduleOrder = WIZ.modules.map(m => m.id);
      WIZ.answers.name = (ACADEMY && ACADEMY.name) || '';
      WIZ.loaded = true;
    }
    renderWizard();
  }

  // --- Filtering logic -------------------------------------------------------
  function wizBaseExcluded(t) {
    const a = WIZ.answers;
    if (a.focus === 'Self-Defense' && t.context === 'Sport') return true;
    if (a.ruleset === 'Gi only'    && t.ruleset === 'No-Gi') return true;
    if (a.ruleset === 'No-Gi only' && t.ruleset === 'Gi')    return true;
    if (a.legLock !== 'Full'       && t.leg_lock_tier === 'Advanced') return true;
    return false;
  }
  function wizExcluded(t) {
    if (WIZ.userInclude.has(t.id)) return false;
    if (WIZ.userExclude.has(t.id)) return true;
    return wizBaseExcluded(t);
  }
  function wizAutoHidden(t) {
    return WIZ.answers.takedowns === 'Minimal' && t.wrestling_dependency === true;
  }
  function wizHidden(t) {
    if (WIZ.userShow.has(t.id)) return false;
    if (WIZ.userHide.has(t.id)) return true;
    return wizAutoHidden(t);
  }
  function wizIncludedTechs() { return WIZ.techniques.filter(t => !wizExcluded(t)); }

  function wizTypeSummary() {
    const a = WIZ.answers;
    const focusMap = { 'Self-Defense':'Self-Defense', 'Sport Gi':'Sport Gi', 'Sport No-Gi':'Sport No-Gi', 'MMA Base':'MMA Base', 'Mixed':'Mixed' };
    return `${focusMap[a.focus] || a.focus} — ${a.legLock} Leg Locks`;
  }

  // --- Render ----------------------------------------------------------------
  function renderWizard() {
    const root = document.getElementById('wizRoot');
    if (!root) return;
    const steps = [tr('wiz.step.academy'), tr('wiz.step.philosophy'), tr('wiz.step.students'), tr('wiz.step.preview'), tr('wiz.step.sequence')];
    const stepper = steps.map((s, i) => {
      const n = i + 1, on = n === WIZ.step, done = n < WIZ.step;
      return `<div style="display:flex;align-items:center;gap:var(--sp-2)">
        <span style="width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
          font-size:12px;font-weight:700;border:1px solid ${on||done?'var(--primary)':'var(--border-strong)'};
          background:${on?'var(--primary)':done?'var(--surface-alt)':'var(--surface)'};
          color:${on?'#fff':'var(--text-muted)'}">${done?'✓':n}</span>
        <span style="font-size:12px;font-weight:${on?'700':'500'};color:${on?'var(--text)':'var(--text-muted)'}">${s}</span>
        ${n<steps.length?'<span style="width:24px;height:1px;background:var(--border);margin:0 4px"></span>':''}
      </div>`;
    }).join('');

    root.innerHTML = `
      <div class="row-between" style="margin-bottom:var(--sp-4)">
        <h1 class="h1">${tr('wiz.title')}</h1>
        <button class="btn btn-secondary" onclick="go('curriculum')">Cancel</button>
      </div>
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-5)">${stepper}</div>
      <div id="wizBody"></div>`;

    const body = document.getElementById('wizBody');
    if (WIZ.step === 1) body.innerHTML = wizScreen1();
    else if (WIZ.step === 2) body.innerHTML = wizScreen2();
    else if (WIZ.step === 3) body.innerHTML = wizScreen3();
    else if (WIZ.step === 4) body.innerHTML = wizScreen4();
    else body.innerHTML = wizScreen5();
    wizBindCommon();
  }

  function wizNav(backLabel, nextLabel, nextFn, nextDisabled) {
    return `<div class="row-between" style="margin-top:var(--sp-5)">
      <button class="btn btn-secondary" onclick="wizBack()" ${WIZ.step===1?'style="visibility:hidden"':''}>← ${backLabel||'Back'}</button>
      <button class="btn btn-primary" id="wizNext" ${nextDisabled?'disabled style="opacity:.4;cursor:not-allowed"':''}>${nextLabel||'Next →'}</button>
    </div>`;
  }
  function wizBindCommon() {
    const n = document.getElementById('wizNext');
    if (n && !n.disabled) n.onclick = () => wizNext();
  }
  window.wizBack = () => { if (WIZ.step > 1) { WIZ.step--; renderWizard(); } };
  window.wizNext = () => {
    if (WIZ.step === 3) { // validate before preview
      if (!wizIncludedTechs().length) { showToast('These settings exclude every technique. Loosen a filter.'); return; }
    }
    if (WIZ.step < 5) { WIZ.step++; renderWizard(); }
    else wizSave();
  };

  // Screen 1 — Academy profile
  function wizScreen1() {
    const a = WIZ.answers;
    return `
      <div class="card" style="max-width:560px">
        <h3 class="card-title" style="margin-bottom:var(--sp-4)">${tr('wiz.academyProfile')}</h3>
        <label style="display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:4px">Academy name</label>
        <input class="input" id="wizName" value="${a.name.replace(/"/g,'&quot;')}" placeholder="Iron Roots Academy"
          style="width:100%;margin-bottom:var(--sp-4)" oninput="WIZ.answers.name=this.value;wizUpdateNext()" />
        <label style="display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:4px">Location</label>
        <input class="input" id="wizLoc" value="${a.location.replace(/"/g,'&quot;')}" placeholder="Lisbon, Portugal"
          style="width:100%;margin-bottom:var(--sp-4)" oninput="WIZ.answers.location=this.value" />
        <label style="display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:4px">Primary language</label>
        <select class="input" id="wizLang" style="width:100%" onchange="WIZ.answers.language=this.value">
          <option value="en" ${a.language==='en'?'selected':''}>English</option>
          <option value="pt" ${a.language==='pt'?'selected':''}>Português</option>
        </select>
      </div>
      ${wizNav('Back', 'Next →', null, !a.name.trim())}`;
  }
  window.wizUpdateNext = () => {
    const n = document.getElementById('wizNext');
    if (!n) return;
    const ok = WIZ.answers.name.trim().length > 0;
    n.disabled = !ok; n.style.cssText = ok ? '' : 'opacity:.4;cursor:not-allowed';
    if (ok) n.onclick = () => wizNext();
  };

  // Card selector helper
  function wizCards(field, options) {
    return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp-3)">
      ${options.map(o => {
        const sel = WIZ.answers[field] === o.value;
        return `<div onclick="WIZ.answers['${field}']='${o.value}';renderWizard()"
          style="cursor:pointer;border:1.5px solid ${sel?'var(--primary)':'var(--border)'};border-radius:var(--r-md);
          padding:var(--sp-4);background:${sel?'var(--surface-alt)':'var(--surface)'}">
          <div style="font-size:20px;margin-bottom:var(--sp-2)">${o.icon||'•'}</div>
          <div style="font-weight:600;font-size:13px;margin-bottom:2px">${o.label}</div>
          <div style="font-size:11px;color:var(--text-muted)">${o.desc||''}</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // Screen 2 — Philosophy
  function wizScreen2() {
    return `
      <div class="stack" style="gap:var(--sp-5)">
        <div><h3 class="card-title" style="margin-bottom:var(--sp-3)">${tr('wiz.primaryFocus')}</h3>
          ${wizCards('focus', [
            { value:'Self-Defense', label:'Self-Defense', icon:'🛡', desc:'Practical, situational' },
            { value:'Sport Gi', label:'Sport Gi', icon:'🥋', desc:'Competition with the gi' },
            { value:'Sport No-Gi', label:'Sport No-Gi', icon:'🤼', desc:'Grappling without the gi' },
            { value:'MMA Base', label:'MMA Base', icon:'🥊', desc:'Striking-aware grappling' },
            { value:'Mixed', label:'Mixed', icon:'⚖️', desc:'A balance of everything' }
          ])}</div>
        <div><h3 class="card-title" style="margin-bottom:var(--sp-3)">${tr('wiz.legLockStance')}</h3>
          ${wizCards('legLock', [
            { value:'Conservative', label:'Conservative', icon:'🦶', desc:'Ankle locks only' },
            { value:'Moderate', label:'Moderate', icon:'🦵', desc:'+ toe holds' },
            { value:'Full', label:'Full', icon:'🔥', desc:'Including heel hooks' }
          ])}</div>
        <div><h3 class="card-title" style="margin-bottom:var(--sp-3)">${tr('wiz.takedowns')}</h3>
          ${wizCards('takedowns', [
            { value:'Minimal', label:'Minimal', icon:'🤏', desc:'Pull guard, hide wrestling' },
            { value:'Moderate', label:'Moderate', icon:'👍', desc:'Core takedowns' },
            { value:'Wrestling-integrated', label:'Wrestling-integrated', icon:'🤼', desc:'Heavy stand-up' }
          ])}</div>
        <div><h3 class="card-title" style="margin-bottom:var(--sp-3)">${tr('wiz.ruleset')}</h3>
          ${wizCards('ruleset', [
            { value:'Gi only', label:'Gi only', icon:'🥋', desc:'Exclude No-Gi techniques' },
            { value:'No-Gi only', label:'No-Gi only', icon:'🩳', desc:'Exclude Gi techniques' },
            { value:'Both', label:'Both', icon:'🔁', desc:'Keep everything' }
          ])}</div>
      </div>
      ${wizNav()}`;
  }

  // Screen 3 — Student profile (multi-select)
  function wizScreen3() {
    const opts = [
      { value:'Adult recreational', icon:'🧑', desc:'Hobbyists, fitness' },
      { value:'Competitors', icon:'🏆', desc:'Tournament-focused' },
      { value:'Kids', icon:'🧒', desc:'Youth classes' },
      { value:"Women's self-defense", icon:'🛡', desc:'Self-defense emphasis' }
    ];
    return `
      <h3 class="card-title" style="margin-bottom:var(--sp-2)">${tr('wiz.whoTrains')}</h3>
      <p class="muted" style="font-size:13px;margin-bottom:var(--sp-4)">Select all that apply. This shapes module ordering and emphasis, not which techniques are included.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--sp-3)">
        ${opts.map(o => {
          const sel = WIZ.answers.students.includes(o.value);
          return `<div onclick="wizToggleStudent('${o.value.replace(/'/g,"\\'")}')"
            style="cursor:pointer;border:1.5px solid ${sel?'var(--primary)':'var(--border)'};border-radius:var(--r-md);
            padding:var(--sp-4);background:${sel?'var(--surface-alt)':'var(--surface)'}">
            <div style="font-size:20px;margin-bottom:var(--sp-2)">${o.icon}</div>
            <div style="font-weight:600;font-size:13px;margin-bottom:2px">${o.value} ${sel?'✓':''}</div>
            <div style="font-size:11px;color:var(--text-muted)">${o.desc}</div>
          </div>`;
        }).join('')}
      </div>
      ${wizNav('Back','Next →', null, false)}`;
  }
  window.wizToggleStudent = (v) => {
    const arr = WIZ.answers.students;
    const i = arr.indexOf(v);
    if (i >= 0) arr.splice(i, 1); else arr.push(v);
    renderWizard();
  };

  // Screen 4 — Preview
  function wizScreen4() {
    const byModule = {};
    WIZ.techniques.forEach(t => {
      const mid = t.default_module_id || 'mod-concepts';
      (byModule[mid] = byModule[mid] || []).push(t);
    });
    const totalIncluded = wizIncludedTechs().length;
    const totalExcluded = WIZ.techniques.length - totalIncluded;

    const cards = WIZ.moduleOrder.map(mid => {
      const m = WIZ.modules.find(x => x.id === mid); if (!m) return '';
      const all = byModule[mid] || [];
      const inc = all.filter(t => !wizExcluded(t));
      const exc = all.filter(t => wizExcluded(t));
      if (!all.length) return '';
      const counts = { Beginner:0, Intermediate:0, Advanced:0, Expert:0 };
      inc.forEach(t => counts[t.complexity] = (counts[t.complexity]||0)+1);
      const tot = inc.length || 1;
      const bar = ['Beginner','Intermediate','Advanced','Expert']
        .map(k => counts[k] ? `<span class="cb-${k}" style="width:${counts[k]/tot*100}%"></span>` : '').join('');
      const rows = (WIZ.showExcluded ? all : inc).map(t => {
        const ex = wizExcluded(t), hid = !ex && wizHidden(t);
        return `<div style="display:flex;align-items:center;gap:var(--sp-3);padding:6px var(--sp-3);
          border-top:1px solid var(--border);${ex?'opacity:.5':''}">
          <span style="flex:1;font-size:13px;${hid?'text-decoration:line-through;color:var(--text-faint)':''}">${t.name}</span>
          <span class="cv2-pill" style="font-size:10px">${t.type || ct('category', t.category)}</span>
          <span class="cv2-pill c-${t.complexity}" style="font-size:10px">${ct('complexity', t.complexity)}</span>
          ${ex
            ? `<button class="btn btn-secondary" style="font-size:11px;padding:2px 8px" onclick="wizAdd('${t.id}')">+ Add</button>`
            : `<button class="btn btn-secondary" style="font-size:11px;padding:2px 8px" onclick="wizHide('${t.id}')">${hid?'Show':'Hide'}</button>`}
        </div>`;
      }).join('');
      return `<div class="cv2-mod" style="margin-bottom:var(--sp-3)">
        <div style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4)">
          <span class="mname" style="font-weight:600">${moduleName(m)}</span>
          <span class="cv2-badge">${inc.length}${exc.length?` · ${exc.length} excluded`:''}</span>
          <span style="flex:1"></span>
          <span class="cv2-cbar">${bar}</span>
        </div>
        <div>${rows}</div>
      </div>`;
    }).join('');

    return `
      <div class="row-between" style="margin-bottom:var(--sp-4)">
        <div>
          <h3 class="card-title">${tr('wiz.preview')}</h3>
          <div class="muted" style="font-size:13px">${wizTypeSummary()} · <strong>${totalIncluded}</strong> techniques${totalExcluded?` · ${totalExcluded} excluded`:''}</div>
        </div>
        <label style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" ${WIZ.showExcluded?'checked':''} onchange="WIZ.showExcluded=this.checked;renderWizard()"> ${tr('wiz.showExcluded')}
        </label>
      </div>
      ${cards || '<div class="cv2-empty">No techniques.</div>'}
      ${wizNav('Back','Next →', null, totalIncluded===0)}`;
  }
  window.wizAdd  = (id) => { WIZ.userExclude.delete(id); WIZ.userInclude.add(id); renderWizard(); };
  window.wizHide = (id) => {
    if (wizHidden(WIZ.techniques.find(t=>t.id===id))) { WIZ.userHide.delete(id); WIZ.userShow.add(id); }
    else { WIZ.userShow.delete(id); WIZ.userHide.add(id); }
    renderWizard();
  };

  // Screen 5 — Module sequencing
  function wizScreen5() {
    const rows = WIZ.moduleOrder.map((mid, i) => {
      const m = WIZ.modules.find(x => x.id === mid); if (!m) return '';
      const inc = WIZ.techniques.filter(t => (t.default_module_id||'mod-concepts') === mid && !wizExcluded(t)).length;
      return `<div style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);
        border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);margin-bottom:var(--sp-2)">
        <span style="font-size:12px;color:var(--text-faint);width:20px">${i+1}</span>
        <span style="flex:1;font-weight:600;font-size:14px">${moduleName(m)}</span>
        <span class="cv2-badge">${inc}</span>

    }).join('');

    const j = i + dir;
    if (j < 0 || j >= WIZ.moduleOrder.length) return;

  // --- Save ------------------------------------------------------------------
  async function wizSave() {
    if (WIZ.saving) return;
    WIZ.saving = true; renderWizard();
    const sportId = (CV2.sportId) || 'sport-bjj';
    const cfgRow = {
      academy_id: (ACADEMY && ACADEMY.id) || null,
      sport_id: sportId,
      name: WIZ.answers.name.trim() || 'New Curriculum',
      type_summary: wizTypeSummary(),
      wizard_answers: WIZ.answers
    };
    let { data: cfg, error: cErr } = await sb.from('curriculum_configs').insert(cfgRow).select().single();
    // Fallback if migration 005 (sport_id column) hasn't been run yet.
    if (cErr && /sport_id/.test(cErr.message || '')) {
      const { sport_id, ...noSport } = cfgRow;
      ({ data: cfg, error: cErr } = await sb.from('curriculum_configs').insert(noSport).select().single());
    }
    if (cErr || !cfg) {
      WIZ.saving = false; renderWizard();
      const ro = cErr && (cErr.code === '42501' || /policy|permission|row-level/i.test(cErr.message || ''));
      showToast(ro ? 'This is a read-only demo — changes are not saved.' : 'Save failed: ' + (cErr?.message || 'unknown'));
      return;
    }

    const included = wizIncludedTechs();
    let seq = 0;
    const orderIndex = {}; WIZ.moduleOrder.forEach((id, i) => orderIndex[id] = i);
    included.sort((a, b) =>
      (orderIndex[a.default_module_id] ?? 99) - (orderIndex[b.default_module_id] ?? 99) ||
      (a.number||0) - (b.number||0));
    const ctRows = included.map(t => ({
      curriculum_id: cfg.id,
      technique_id: t.id,
      module_id: t.default_module_id,
      sequence_order: seq++,
      is_hidden: wizHidden(t)
    }));
    const { error: ctErr } = await sb.from('curriculum_techniques').insert(ctRows);
    if (ctErr) { WIZ.saving = false; renderWizard(); showToast('Saved config but techniques failed: ' + ctErr.message); return; }

    // Refresh curriculum page state and navigate there with the new curriculum active.
    CV2.configs.push(cfg);
    CV2.curriculumId = cfg.id;
    CV2.sportId = sportId;
    await loadCV2Membership().catch(() => {});
    WIZ.saving = false;
    showToast('Curriculum created ✓');
    go('curriculum');
  }

  async function loadTechniquePage() {
    const root = document.getElementById('tpRoot');
    if (!root) return;
    const { data: tech, error } = await sb.from('techniques').select('*').eq('slug', TP.slug).single();
    if (error || !tech) { root.innerHTML = `<div class="cv2-empty">Technique not found. <a onclick="go('curriculum')" style="cursor:pointer;color:var(--accent)">Back to curriculum</a></div>`; return; }
    TP.tech = tech;

    const [modRes, sibRes, relRes] = await Promise.all([
      tech.default_module_id ? sb.from('modules').select('*').eq('id', tech.default_module_id).single() : Promise.resolve({ data: null }),
      sb.from('techniques').select('id,name,slug,number').eq('default_module_id', tech.default_module_id || '').order('number'),
      sb.from('technique_relationships').select('*').eq('technique_id', tech.id)
    ]);
    TP.module = modRes.data || null;
    TP.siblings = sibRes.data || [];
    const rels = relRes.data || [];
    const relIds = rels.map(r => r.related_technique_id);
    let relTechs = [];
    if (relIds.length) {
      const { data } = await sb.from('techniques').select('id,name,slug').in('id', relIds);
      relTechs = data || [];
    }
    const nameOf = (id) => relTechs.find(x => x.id === id);
    TP.prereqs = rels.filter(r => r.relationship_type === 'prerequisite').map(r => nameOf(r.related_technique_id)).filter(Boolean);
    TP.chains  = rels.filter(r => r.relationship_type === 'chains_to').map(r => nameOf(r.related_technique_id)).filter(Boolean);
    renderTechniquePage();
  }

  async function tpSaveField(field) {
    const el = document.getElementById('tpEdit');
    if (!el) return;
    const val = el.value;
    const { error } = await sb.from('techniques').update({ [field]: val }).eq('id', TP.tech.id);
    if (error) { showToast('Save failed: ' + error.message); return; }
    TP.tech[field] = val; TP.editing = null;
    // keep curriculum cache fresh
    const cached = CV2.techniques.find(x => x.id === TP.tech.id); if (cached) cached[field] = val;
    showToast('Saved ✓'); renderTechniquePage();
  }

  async function tpAddRel(type) {
    // Build a quick picker from the technique list (reuse CV2 cache or fetch).
    let list = CV2.techniques;
    if (!list || !list.length) { const { data } = await sb.from('techniques').select('id,name,slug').order('number'); list = data || []; }
    const options = list.filter(x => x.id !== TP.tech.id);
    const name = prompt(`Add ${type === 'prerequisite' ? 'prerequisite' : 'chain'} — type part of a technique name:`);
    if (!name) return;
    const match = options.find(x => x.name.toLowerCase().includes(name.toLowerCase()));
    if (!match) { showToast('No matching technique found.'); return; }
    const { error } = await sb.from('technique_relationships').insert({
      technique_id: TP.tech.id, related_technique_id: match.id, relationship_type: type
    });
    if (error) { showToast('Failed: ' + error.message); return; }
    showToast(`Linked ${match.name} ✓`);
    loadTechniquePage();
  }

  };

  function isMinor(dob) {
    if (!dob) return false;
    return (Date.now() - new Date(dob)) / (1000 * 60 * 60 * 24 * 365.25) < 18;
  }

  function collectStudentWizardForm() {
    const d = studentWizardState.details;
    ['name','dob','email','phone','emergencyName','emergencyPhone'].forEach((key, i) => {
      const el = document.getElementById(['sw-name','sw-dob','sw-email','sw-phone','sw-emg-name','sw-emg-phone'][i]);
      if (el) d[key] = el.value;
    });
    const genderEl = document.getElementById('sw-gender'); if (genderEl) d.gender = genderEl.value;
    const competesEl = document.getElementById('sw-competes'); if (competesEl) d.competes = competesEl.checked;
    ['name','phone','email'].forEach(key => {
      const el = document.getElementById('sw-guardian-' + key);
      if (el) studentWizardState.guardian[key] = el.value;
    });
    const sig = document.getElementById('sw-signature');
    if (sig) studentWizardState.signature = sig.value;
  }

  function studentWizardNext() {
    collectStudentWizardForm();
    if (studentWizardState.step === 1 && !isMinor(studentWizardState.details.dob)) {
      studentWizardState.step = 3; // skip guardian step for adults
    } else {
      studentWizardState.step = Math.min(studentWizardState.step + 1, 4);
    }
    renderApp();
  }

  function studentWizardBack() {
    collectStudentWizardForm();
    if (studentWizardState.step === 3 && !isMinor(studentWizardState.details.dob)) {
      studentWizardState.step = 1;
    } else {
      studentWizardState.step = Math.max(studentWizardState.step - 1, 1);
    }
    renderApp();
  }

  function studentWizardSelectMembership(id) {
    studentWizardState.membership = id;
    renderApp();
  }

  function studentWizardSave() {
    collectStudentWizardForm();
    const sig = studentWizardState.signature.trim();
    const expected = studentWizardState.details.name.trim();
    if (!sig || sig.toLowerCase() !== expected.toLowerCase()) {
      alert('Please type your full name exactly to sign the T&C.');
      return;
    }
    const id = 'stu-' + Date.now();
    const name = expected;
    const initials = name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const newStudent = {
      id, name, initials,
      dob: studentWizardState.details.dob,
      gender: studentWizardState.details.gender || '',
      competes: !!studentWizardState.details.competes,
      contact: studentWizardState.details.email || studentWizardState.details.phone,
      emergencyContact: `${studentWizardState.details.emergencyName} · ${studentWizardState.details.emergencyPhone}`,
      joinedAt: new Date().toISOString(),
      notes: studentWizardState.guardian.name ? `Guardian: ${studentWizardState.guardian.name}` : ''
    };
    // Auto-assign audience tags from age / gender / competition interest.
    newStudent.tags = deriveStudentTags(newStudent);
    STUDENTS.push(newStudent);
    const sc = ACADEMY.sportConfigs[0] || {};
    ENROLLMENTS.push({
      studentId: id,
      sportId:        sc.sportId        || 'sport-bjj',

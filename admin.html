  // ---------- Screen: Schedule ---------------------------------------------

  // Returns the audience for a class (real or virtual) by matching its template.
  function getClassAudience(cls) {
    if (cls._templateId) {
      return RECURRING_TEMPLATES.find(r => r.id === cls._templateId)?.audience || 'Adults';
    }
    // Match by classType + instructorId
    return RECURRING_TEMPLATES.find(r => r.classType === cls.classType && r.instructorId === cls.instructorId)?.audience
      || RECURRING_TEMPLATES.find(r => r.classType === cls.classType)?.audience
      || 'Adults';
  }

  // ---------- Schedule helpers ----------------------------------------------

  // Returns class slots (real or virtual) for a ms date range, driven by RECURRING_TEMPLATES.
  function getSlotsForRange(startMs, endMs) {
    const slots = [];
    for (let dayMs = startMs; dayMs < endMs; dayMs += 24 * 60 * 60 * 1000) {
      const dayDate = new Date(dayMs);
      const dow = dayDate.getDay();
      RECURRING_TEMPLATES.filter(rt => rt.dow === dow).forEach(rt => {
        const [h, min] = rt.time.split(':').map(Number);
        const slotDate = new Date(dayMs);
        slotDate.setHours(h, min, 0, 0);
        const existing = CLASSES.find(c => {
          const cd = new Date(c.startsAt);
          return cd.getFullYear() === slotDate.getFullYear()
            && cd.getMonth()     === slotDate.getMonth()
            && cd.getDate()      === slotDate.getDate()
            && cd.getHours()     === h
            && c.classType       === rt.classType;
        });
        slots.push(existing || {
          id: null, _virtual: true, _templateId: rt.id,
          startsAt: slotDate.toISOString(),
          classType: rt.classType, instructorId: rt.instructorId,
          durationMin: rt.durationMin, capacity: rt.capacity,
          status: slotDate < CONFIG.today ? 'completed' : 'scheduled',
          plannedItemIds: [],
        });
      });
    }
    return slots.sort((a, b) => new Date(a.startsAt) - new Date(b.startsAt));
  }

  let scheduleWeekOffset = 0; // 0 = current week, -1 = last week, +1 = next week
  let scheduleView = 'week';   // 'week' | 'month'
  let scheduleMonthOffset = 0; // 0 = current month, -1 = last, +1 = next

  // Special events (tournaments, seminars, belt tests, open mats) on a given day.
  function eventsForDate(dateStr) {
    return (typeof EVENTS !== 'undefined' ? EVENTS : []).filter(e => e.date === dateStr);
  }
  // Visual style per event type.
  const EVENT_TYPE_STYLE = {
    'tournament': { bg:'#fef3c7', border:'#f59e0b', label:'🏆' },
    'seminar':    { bg:'#ede9fe', border:'#8b5cf6', label:'🎓' },
    'belt-test':  { bg:'#dcfce7', border:'#16a34a', label:'🥋' },
    'open-mat':   { bg:'#dbeafe', border:'#3b82f6', label:'🤼' }
  };
  function eventChip(e, compact) {
    const st = EVENT_TYPE_STYLE[e.type] || { bg:'var(--surface-alt)', border:'var(--border-strong)', label:'📌' };
    const time = e.time ? `${e.time} ` : '';
    return `<div onclick="event.stopPropagation();go('events/${e.id}')" title="${(e.title||'').replace(/"/g,'&quot;')}"
      style="cursor:pointer;background:${st.bg};border:1px solid ${st.border};border-left:3px solid ${st.border};
      border-radius:var(--r-sm);padding:${compact?'1px 5px':'var(--sp-2) var(--sp-3)'};margin-bottom:var(--sp-1);
      font-size:${compact?'10px':'11px'};line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
      ${st.label} ${compact ? '' : `<span style="font-weight:700">${time}</span>`}${e.title}</div>`;
  }

  function scheduleStartOfWeek(date) {
    const d = new Date(date);
    const day = d.getDay(); // 0=Sun
    d.setDate(d.getDate() - day);
    d.setHours(0,0,0,0);
    return d;
  }

  function scheduleViewToggle() {
    return `<div class="cv2-seg">
      <button class="${scheduleView==='week'?'on':''}" onclick="scheduleView='week';renderApp()"
        style="font:inherit;font-size:12px;padding:6px 12px;border:none;cursor:pointer;background:${scheduleView==='week'?'var(--primary)':'var(--surface)'};color:${scheduleView==='week'?'#fff':'var(--text-muted)'}">${tr('sched.week')}</button>
      <button class="${scheduleView==='month'?'on':''}" onclick="scheduleView='month';renderApp()"
        style="font:inherit;font-size:12px;padding:6px 12px;border:none;cursor:pointer;background:${scheduleView==='month'?'var(--primary)':'var(--surface)'};color:${scheduleView==='month'?'#fff':'var(--text-muted)'}">${tr('sched.month')}</button>
    </div>`;
  }

  function Schedule() {
    if (scheduleView === 'month') return ScheduleMonth();
    const todayMs = new Date(CONFIG.today).setHours(0,0,0,0);
    const weekStart = scheduleStartOfWeek(new Date(todayMs + scheduleWeekOffset * 7 * 24 * 60 * 60 * 1000));
    const weekEnd   = new Date(weekStart.getTime() + 7 * 24 * 60 * 60 * 1000);

    const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // Build array of 7 day buckets — driven by RECURRING_TEMPLATES via getSlotsForRange
    const days = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(weekStart.getTime() + i * 24 * 60 * 60 * 1000);
      return { date: d, classes: [] };
    });

    getSlotsForRange(weekStart.getTime(), weekEnd.getTime()).forEach(slot => {
      const dow = new Date(slot.startsAt).getDay();
      days[dow].classes.push(slot);
    });

    const weekLabel = `${DAY_NAMES[0]} ${weekStart.getDate()} ${MONTH_NAMES[weekStart.getMonth()]} — ${DAY_NAMES[6]} ${new Date(weekEnd.getTime()-1).getDate()} ${MONTH_NAMES[new Date(weekEnd.getTime()-1).getMonth()]} ${weekStart.getFullYear()}`;

    const isCurrentWeek = scheduleWeekOffset === 0;

    const dayColumns = days.map((day, i) => {
      const isToday = day.date.getTime() === todayMs;
      const isPast  = day.date.getTime() < todayMs;
      const dayLabel = `${DAY_NAMES[i]}<br><span style="font-size:18px;font-weight:700">${day.date.getDate()}</span>`;

      const classCards = day.classes.length === 0
        ? `<div style="color:var(--text-faint);font-size:12px;padding:var(--sp-2) 0;text-align:center">—</div>`
        : day.classes.map(cls => {
            const bookings = cls.id ? BOOKINGS.filter(b => b.classId === cls.id && b.status === 'booked').length : 0;
            const attended = cls.id ? ATTENDANCE.filter(a => a.classId === cls.id && a.attended).length : 0;
            const isCompleted  = cls.status === 'completed';
            const isCancelled  = cls.status === 'cancelled';
            const isVirtual    = !!cls._virtual;
            const inst = DB.instructor(cls.instructorId);
            const timeStr = new Date(cls.startsAt).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
            const clickHandler = cls.id ? `onclick="go('classes/${cls.id}')"` : '';
            const bgColor = isCancelled ? 'var(--danger-bg)' : isCompleted ? 'var(--surface-alt)' : isToday ? '#eff6ff' : 'var(--surface)';
            const borderColor = isCancelled ? 'var(--danger)' : isCompleted ? 'var(--text-faint)' : 'var(--accent)';
            return `
              <div ${clickHandler} style="
                cursor:${cls.id ? 'pointer' : 'default'};
                background:${bgColor};
                border:1px solid ${isCancelled ? '#fecaca' : isCompleted ? 'var(--border)' : isToday ? '#bfdbfe' : 'var(--border)'};
                border-left:3px solid ${isVirtual ? 'var(--border-strong)' : borderColor};
                border-radius:var(--r-sm);
                padding:var(--sp-2) var(--sp-3);
                margin-bottom:var(--sp-2);
                opacity:${isVirtual && isCompleted ? '0.45' : isCancelled ? '0.7' : '1'};
                transition:background .15s">
                <div style="font-weight:700;font-size:12px;color:${isCancelled ? 'var(--danger)' : isCompleted ? 'var(--text-muted)' : 'var(--accent)'}">${timeStr}</div>
                <div style="font-weight:600;font-size:12px;margin-top:2px;${isCancelled ? 'text-decoration:line-through;color:var(--text-muted)' : ''}">${cls.classType}</div>
                <div style="margin-top:3px"><span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;background:var(--surface-alt);color:var(--text-muted)">${getClassAudience(cls)}</span></div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${inst?.name || '—'}</div>
                <div style="font-size:11px;color:var(--text-faint);margin-top:4px">
                  ${isCancelled ? '<span style="color:var(--danger);font-weight:600">Cancelled</span>'
                    : isCompleted ? (isVirtual ? 'no record' : `${attended} attended`)
                    : (isVirtual ? `cap. ${cls.capacity}` : `${bookings}/${cls.capacity} booked`)}
                </div>
              </div>`;
          }).join('');

      const dayDateStr = day.date.toISOString().slice(0, 10);
      const closureBanner = isClosure(dayDateStr)
        ? `<div style="font-size:10px;font-weight:600;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:4px;padding:3px 6px;margin-bottom:var(--sp-2);text-align:center;line-height:1.3">🚫 ${closureLabel(dayDateStr)}</div>`
        : '';

      const dayEvents = eventsForDate(dayDateStr).map(e => eventChip(e)).join('');

      return `
        <div style="flex:1;min-width:0;border-right:1px solid var(--border);padding:0 var(--sp-2)">
          <div style="
            text-align:center;padding:var(--sp-2) 0 var(--sp-3);
            font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
            color:${isToday ? 'var(--accent)' : isPast ? 'var(--text-faint)' : 'var(--text-muted)'};
            border-bottom:2px solid ${isToday ? 'var(--accent)' : 'transparent'};
            margin-bottom:var(--sp-3)">
            ${dayLabel}
          </div>
          ${closureBanner}
          ${dayEvents}
          ${classCards}
        </div>`;
    }).join('');

    // Weekly summary stats
    const totalClasses = days.reduce((n, d) => n + d.classes.length, 0);
    const totalBooked  = days.reduce((n, d) => n + d.classes.reduce((m, c) => m + BOOKINGS.filter(b => b.classId === c.id && b.status === 'booked').length, 0), 0);
    const completedCount = days.reduce((n, d) => n + d.classes.filter(c => c.status === 'completed').length, 0);

    return `
      <div class="row-between" style="margin-bottom:var(--sp-4)">
        <h1 class="h1">${t(UI.nav.schedule)}</h1>
        <div class="row" style="gap:var(--sp-2)">
          ${scheduleViewToggle()}
          <button class="btn btn-secondary" onclick="scheduleWeekOffset--;renderApp()">← Prev</button>
          ${!isCurrentWeek ? `<button class="btn btn-secondary" onclick="scheduleWeekOffset=0;renderApp()">Today</button>` : ''}
          <button class="btn btn-secondary" onclick="scheduleWeekOffset++;renderApp()">Next →</button>
          <button class="btn btn-secondary" onclick="printWeeklySchedule()" title="Print this week's schedule">🖨 Print</button>
          <button class="btn btn-secondary" onclick="exportScheduleICS()" title="Export to calendar app (.ics)">📅 ICS</button>
          ${(function(){ const n = CLASSES.filter(c => c.status === 'scheduled' && new Date(c.startsAt).getTime() < new Date(CONFIG.today).setHours(0,0,0,0)).length; return n > 0 ? `<button class="btn btn-secondary" onclick="batchCompletePastClasses()" title="Mark all past scheduled classes as completed" style="color:var(--success,#059669);border-color:var(--success,#059669)">✓ Close out past (${n})</button>` : ''; })()}
        </div>
      </div>

      <div class="row" style="gap:var(--sp-4);margin-bottom:var(--sp-4);flex-wrap:wrap">
        <div class="card" style="flex:1;min-width:140px;padding:var(--sp-3) var(--sp-4)">
          <div style="font-size:22px;font-weight:700">${totalClasses}</div>
          <div style="font-size:12px;font-weight:600;margin-top:var(--sp-1)">Classes</div>
          <div class="faint" style="font-size:11px">${completedCount} completed</div>
        </div>
        <div class="card" style="flex:1;min-width:140px;padding:var(--sp-3) var(--sp-4)">
          <div style="font-size:22px;font-weight:700">${totalBooked}</div>
          <div style="font-size:12px;font-weight:600;margin-top:var(--sp-1)">Bookings</div>
          <div class="faint" style="font-size:11px">across all classes</div>
        </div>
        <div class="card" style="flex:2;min-width:200px;padding:var(--sp-3) var(--sp-4)">
          <div style="font-size:13px;font-weight:600">${weekLabel}</div>
          <div class="faint" style="font-size:11px;margin-top:var(--sp-1)">
            ${isCurrentWeek ? 'Current week' : scheduleWeekOffset < 0 ? `${Math.abs(scheduleWeekOffset)} week${Math.abs(scheduleWeekOffset)>1?'s':''} ago` : `${scheduleWeekOffset} week${scheduleWeekOffset>1?'s':''} ahead`}
          </div>
        </div>
      </div>

      ${WeeklyPlanCard(weekKey(weekStart))}

      <div class="card" style="padding:var(--sp-3)">
        <div style="display:flex;gap:0;overflow-x:auto">
          ${dayColumns}
        </div>
      </div>
    `;
  }

  // ---------- Schedule: month overview -------------------------------------

  function ScheduleMonth() {
    const today = new Date(CONFIG.today); today.setHours(0,0,0,0);
    const todayMs = today.getTime();
    const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    const monthDate = new Date(today.getFullYear(), today.getMonth() + scheduleMonthOffset, 1);
    const monthIdx = monthDate.getMonth();
    const gridStart = scheduleStartOfWeek(new Date(monthDate));        // Sunday on/before the 1st
    const gridEnd   = new Date(gridStart.getTime() + 42 * 86400000);   // 6 weeks

    // Bucket class slots by date string.
    const slotsByDate = {};
    getSlotsForRange(gridStart.getTime(), gridEnd.getTime()).forEach(s => {
      const k = new Date(s.startsAt).toISOString().slice(0,10);
      (slotsByDate[k] = slotsByDate[k] || []).push(s);
    });

    const weekRows = [];
    for (let w = 0; w < 6; w++) {
      const cells = [];
      for (let d = 0; d < 7; d++) {
        const cellDate = new Date(gridStart.getTime() + (w*7 + d) * 86400000);
        const dateStr = cellDate.toISOString().slice(0,10);
        const inMonth = cellDate.getMonth() === monthIdx;
        const isToday = cellDate.getTime() === todayMs;
        const dayClasses = slotsByDate[dateStr] || [];
        const dayEvents = eventsForDate(dateStr);
        // offset (in weeks) from the current week, so a click opens that week.
        const wkOffset = Math.round((scheduleStartOfWeek(new Date(cellDate)).getTime() - scheduleStartOfWeek(new Date(today)).getTime()) / (7*86400000));
        cells.push(`
          <div onclick="scheduleWeekOffset=${wkOffset};scheduleView='week';renderApp()" style="
            min-height:96px;border:1px solid var(--border);border-radius:var(--r-sm);padding:4px 6px;cursor:pointer;
            background:${isToday ? '#eff6ff' : inMonth ? 'var(--surface)' : 'var(--surface-alt)'};
            ${isToday ? 'box-shadow:inset 0 0 0 1px var(--accent)' : ''};opacity:${inMonth?'1':'.55'};overflow:hidden">
            <div style="font-size:12px;font-weight:${isToday?'700':'600'};color:${isToday?'var(--accent)':'var(--text-muted)'};margin-bottom:3px">${cellDate.getDate()}</div>
            ${dayEvents.map(e => eventChip(e, true)).join('')}
            ${dayClasses.length ? `<div style="font-size:10px;color:var(--text-faint);margin-top:2px">${dayClasses.length} class${dayClasses.length>1?'es':''}</div>` : ''}
          </div>`);
      }
      weekRows.push(`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px">${cells.join('')}</div>`);
    }

    const isCurrentMonth = scheduleMonthOffset === 0;
    const monthLabel = `${MONTH_NAMES[monthIdx]} ${monthDate.getFullYear()}`;

    return `

  // ---------- ICS Calendar Export ------------------------------------------

  function exportScheduleICS() {
    const todayMs = new Date(CONFIG.today).setHours(0,0,0,0);
    const weekStart = scheduleStartOfWeek(new Date(todayMs + scheduleWeekOffset * 7 * 24 * 60 * 60 * 1000));
    const weekEnd   = new Date(weekStart.getTime() + 7 * 24 * 60 * 60 * 1000);

    const slots = getSlotsForRange(weekStart.getTime(), weekEnd.getTime());

    // Format a Date as ICS datetime string: YYYYMMDDTHHmmssZ (UTC)
    function icsDate(ms) {
      const d = new Date(ms);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
    }

    // Escape special chars for iCal text fields
    function icsEsc(str) {
      return String(str || '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
    }

    const now = icsDate(Date.now());
    const academyName = icsEsc(ACADEMY.name);

    const events = slots
      .filter(cls => cls.status !== 'cancelled')
      .map(cls => {
        const inst = DB.instructor(cls.instructorId);
        const startMs = new Date(cls.startsAt).getTime();
        const endMs   = startMs + (cls.durationMins || 60) * 60 * 1000;
        const bookings = cls.id ? BOOKINGS.filter(b => b.classId === cls.id && b.status === 'booked').length : 0;
        const summary  = icsEsc(`${cls.classType}${inst ? ' · ' + inst.name : ''}`);
        const desc     = icsEsc([
          cls.classType,
          inst ? `Instructor: ${inst.name}` : '',
          cls.capacity ? `Capacity: ${bookings}/${cls.capacity}` : '',
          cls.id ? `ID: ${cls.id}` : '(template slot)'
        ].filter(Boolean).join('\\n'));
        const uid = cls.id ? `${cls.id}@tatami` : `tpl-${cls._templateId || 'x'}-${startMs}@tatami`;

        return [
          'BEGIN:VEVENT',
          `UID:${uid}`,
          `DTSTAMP:${now}`,
          `DTSTART:${icsDate(startMs)}`,
          `DTEND:${icsDate(endMs)}`,
          `SUMMARY:${summary}`,
          `DESCRIPTION:${desc}`,
          `LOCATION:${academyName}`,
          cls.status === 'completed' ? 'STATUS:CONFIRMED' : 'STATUS:CONFIRMED',
          'END:VEVENT'
        ].join('\r\n');
      });

    if (!events.length) {
      alert('No classes this week to export.');
      return;
    }

    const icsBody = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Tatami//Schedule//EN',
      `X-WR-CALNAME:${academyName} Schedule`,
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      ...events,
      'END:VCALENDAR'
    ].join('\r\n');

    // Week label for filename: YYYY-Www
    const weekNum = (() => {
      const jan4 = new Date(weekStart.getFullYear(), 0, 4);
      const startOfWeek1 = new Date(jan4.getTime() - (jan4.getDay() || 7 - 1) * 86400000);
      return Math.ceil((weekStart - startOfWeek1) / (7 * 86400000)) + 1;
    })();
    const filename = `tatami-schedule-${weekStart.getFullYear()}-W${String(weekNum).padStart(2,'0')}.ics`;

    const blob = new Blob([icsBody], { type: 'text/calendar;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

    }).filter(Boolean);

    // Revenue this month — parse monthly price from plan string, sum across members
    function parseMonthlyCents(priceStr) {
      const num = parseFloat((priceStr || '').replace(/[^0-9.]/g, ''));
      if (!num) return 0;
      if (/yr|year/i.test(priceStr)) return Math.round((num / 12) * 100);
      return Math.round(num * 100);
    }
    const planPriceMap = {};
    MEMBERSHIP_PLANS.forEach(p => { planPriceMap[p.id] = parseMonthlyCents(p.price); });
    const mrrCents = ENROLLMENTS.reduce((sum, e) => sum + (planPriceMap[e.membership] || 0), 0);
    const mrrStr = '€' + (mrrCents / 100).toFixed(0);

    // 4-week attendance trend — last 4 Sun-Sat weeks, count attended records
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
    const weeks = Array.from({ length: 4 }, (_, i) => {
      const wkStart = todayMs - (3 - i) * WEEK_MS - new Date(CONFIG.today).getDay() * 86400000;
      const wkEnd = wkStart + WEEK_MS;
      const count = ATTENDANCE.filter(a => {
        if (!a.attended) return false;
        const cls = CLASSES.find(c => c.id === a.classId);
        if (!cls) return false;
        const t = new Date(cls.startsAt).getTime();
        return t >= wkStart && t < wkEnd;
      }).length;
      const label = i === 3 ? 'This wk' : i === 2 ? 'Last wk' : `-${3-i}wk`;
      return { label, count };
    });
    const maxCount = Math.max(...weeks.map(w => w.count), 1);

    // Upcoming birthdays — next 14 days (month/day only, year-agnostic)
    const today = new Date(CONFIG.today);
    const upcomingBirthdays = STUDENTS.map(stu => {
      if (!stu.dob) return null;
      const dob = new Date(stu.dob);
      const bday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());

      if (daysUntil < 0) {
        const bdayNext = new Date(today.getFullYear() + 1, dob.getMonth(), dob.getDate());
        daysUntil = Math.round((bdayNext - today) / 86400000);
      }
      if (daysUntil > 14) return null;
      // birthdayPassed = already happened this calendar year → next occurrence is next year
      const birthdayPassed = dob.getMonth() < today.getMonth() ||

    const dashOverdue = generateInvoices(3).filter(function(i) { return !i.isCurrentMonth && i.status === 'overdue'; });
    if (dashOverdue.length > 0) {
      dashActionItems.push({ icon: '💳', label: dashOverdue.length + ' overdue invoice' + (dashOverdue.length !== 1 ? 's' : '') + ' from previous months', sub: null, onclick: "go('billing')" });
    }

    // Missed check-ins — students booked for a completed class in the last 2 days but no attendance record
    (function() {
      const twoDaysAgoMs = todayMs - 2 * 86400000;
      const recentCompleted = CLASSES.filter(function(c) {
        const t = new Date(c.startsAt).getTime();
        return c.status === 'completed' && t >= twoDaysAgoMs && t < todayMs;
      });
      const missedByStudent = {};
      recentCompleted.forEach(function(cls) {
        BOOKINGS.filter(function(b) { return b.classId === cls.id && b.status === 'booked'; }).forEach(function(b) {
          const attended = ATTENDANCE.find(function(a) { return a.classId === cls.id && a.studentId === b.studentId && a.attended; });
          if (!attended) {
            if (!missedByStudent[b.studentId]) missedByStudent[b.studentId] = 0;
            missedByStudent[b.studentId]++;
          }
        });
      });
      const missedEntries = Object.entries(missedByStudent);
      if (missedEntries.length > 0) {
        if (missedEntries.length === 1) {
          const stu = STUDENTS.find(function(s) { return s.id === missedEntries[0][0]; });
          if (stu) dashActionItems.push({ icon: '👻', label: stu.name + ' missed a booked class — consider reaching out', sub: null, onclick: "go('students/" + stu.id + "')" });
        } else {
          dashActionItems.push({ icon: '👻', label: missedEntries.length + ' students missed booked classes in the last 2 days', sub: null, onclick: "go('retention')" });
        }
      }
    })();

    let actionItemsCard = '';
    if (dashActionItems.length > 0) {
      const rowsHtml = dashActionItems.map(function(item) {
        return '<div onclick="' + item.onclick + '" style="cursor:pointer;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);background:var(--surface-alt)" onmouseenter="this.style.background=\'var(--border)\'" onmouseleave="this.style.background=\'var(--surface-alt)\'">'
          + '<span style="font-size:16px;width:24px;text-align:center">' + item.icon + '</span>'
          + '<span style="font-size:13px;flex:1">' + item.label + '</span>'
          + (item.sub ? '<span class="faint" style="font-size:11px">' + item.sub + '</span>' : '')
          + '<span style="color:var(--text-muted);font-size:16px">›</span>'
          + '</div>';
      }).join('');
      actionItemsCard = '<div class="card" style="margin-bottom:var(--sp-5);border-left:3px solid var(--accent)">'
        + '<div style="font-size:13px;font-weight:700;margin-bottom:var(--sp-3)">⚡ Action items <span style="background:var(--accent);color:#fff;border-radius:20px;padding:1px 8px;font-size:11px;margin-left:4px">' + dashActionItems.length + '</span></div>'
        + '<div style="display:flex;flex-direction:column;gap:var(--sp-2)">' + rowsHtml + '</div>'
        + '</div>';
    }

    // ---- Weekly digest mailto ----
    const digestWeekStart = todayMs - new Date(CONFIG.today).getDay() * 86400000;
    const digestWeekEnd   = digestWeekStart + 7 * 24 * 60 * 60 * 1000;
    const digestClasses   = CLASSES.filter(c => {
      const t = new Date(c.startsAt).getTime();
      return t >= digestWeekStart && t < digestWeekEnd && c.status !== 'cancelled';
    });
    const digestCheckIns  = ATTENDANCE.filter(a => {
      if (!a.attended) return false;
      const cls = CLASSES.find(c => c.id === a.classId);
      if (!cls) return false;
      const t = new Date(cls.startsAt).getTime();
      return t >= digestWeekStart && t < digestWeekEnd;
    }).length;
    const digestNewStudents = STUDENTS.filter(s => {
      const t = new Date(s.joinedAt).getTime();
      return t >= digestWeekStart && t < digestWeekEnd;
    });
    const digestAtRisk = STUDENTS.filter(stu => {
      const attended = ATTENDANCE.filter(a => a.studentId === stu.id && a.attended);
      const last = attended.reduce((max, a) => {
        const cls = CLASSES.find(c => c.id === a.classId);
        const t = cls ? new Date(cls.startsAt).getTime() : 0;
        return t > max ? t : max;
      }, 0);
      const days = last ? Math.floor((todayMs - last) / 86400000) : null;
      return days === null || days >= 30;
    });
    const digestWeekLabel = new Date(digestWeekStart).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
      + ' – ' + new Date(digestWeekEnd - 1).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    const digestFillRate = digestClasses.length > 0
      ? Math.round(digestClasses.reduce((sum, c) => {
          const booked = BOOKINGS.filter(b => b.classId === c.id && b.status === 'booked').length;
          return sum + booked / (c.capacity || 20);
        }, 0) / digestClasses.length * 100)
      : 0;
    const digestBody = [
      `Weekly Academy Digest — ${digestWeekLabel}`,
      ``,
      `Hi,`,
      ``,
      `Here's a summary of this week at ${ACADEMY.name || 'the academy'}:`,
      ``,
      `📊 CLASSES`,
      `  • Classes held / scheduled: ${digestClasses.length}`,
      `  • Total check-ins: ${digestCheckIns}`,
      `  • Avg fill rate: ${digestFillRate}%`,
      ``,
      `👥 STUDENTS`,
      `  • Active students: ${activeStudents}`,
      `  • New this week: ${digestNewStudents.length > 0 ? digestNewStudents.map(s => s.name).join(', ') : 'None'}`,
      `  • At risk (30+ days inactive): ${digestAtRisk.length}`,
      ``,
      `💰 FINANCE`,
      `  • MRR: ${mrrStr}`,
      promotionReady.length > 0
        ? `\n🥋 PROMOTIONS\n  • Ready for promotion: ${promotionReady.map(p => p.stu.name).join(', ')}`
        : ``,
      ``,
      `View full dashboard: ${window.location.origin}${window.location.pathname}`,
      ``,
      `— Tatami Academy Management`,
    ].filter(l => l !== undefined).join('\n');
    const digestSubject = encodeURIComponent(`${ACADEMY.name || 'Academy'} — Weekly Digest ${digestWeekLabel}`);
    const digestMailto = `mailto:?subject=${digestSubject}&body=${encodeURIComponent(digestBody)}`;

    return `
      <div class="row-between" style="margin-bottom:var(--sp-4)">
        <h1 class="h1">${t(UI.nav.dashboard)}</h1>
        <a href="${digestMailto}" class="btn btn-secondary" style="font-size:12px;text-decoration:none" title="Open a pre-filled weekly summary email">📋 Weekly digest</a>
      </div>

      ${todayStrip}

      <div style="display:flex;flex-wrap:wrap;gap:var(--sp-4);margin-bottom:var(--sp-5)">
        ${StatCard('◉', 'Active students', activeStudents, 'Total enrolled', "go('students')")}
        ${StatCard('◷', 'Classes this week', classesThisWeek.length, classesThisWeek.filter(c=>c.status==='completed').length + ' completed', "go('schedule')")}
        ${StatCard('▶', 'Next class', nextClassVal, nextClassSub, nextClass?.id ? `go('classes/${nextClass.id}')` : null)}
        ${StatCard('€', 'MRR', mrrStr, activeStudents + ' members', "go('memberships')")}
      </div>

      ${upcomingBirthdays.length > 0 ? `
      <div class="card" style="margin-bottom:var(--sp-5)">
        <div style="font-size:13px;font-weight:700;margin-bottom:var(--sp-3)">🎂 Upcoming birthdays</div>
        ${birthdayRows}
      </div>` : ''}

      ${actionItemsCard}

      <div style="display:flex;gap:var(--sp-4);margin-bottom:var(--sp-5);flex-wrap:wrap">
        <!-- Attendance trend -->
        <div class="card" style="flex:1;min-width:220px">
          <div style="font-size:13px;font-weight:700;margin-bottom:var(--sp-3)">Attendance — last 4 weeks</div>
          <div style="display:flex;gap:8px;align-items:flex-end;height:72px">
            ${trendBars}
          </div>
        </div>
        <!-- Promotion ready summary -->
        <div class="card" style="flex:1;min-width:220px;cursor:pointer" onclick="go('students')">
          <div style="font-size:13px;font-weight:700;margin-bottom:var(--sp-3)">★ Promotion ready</div>
          ${promotionReady.length === 0
            ? `<div class="muted" style="font-size:13px">No students currently meet criteria.</div>`
            : promotionReady.slice(0,3).map(({stu,promo}) => `
                <div style="display:flex;align-items:center;gap:8px;padding:4px 0">
                  <div class="avatar" style="width:28px;height:28px;font-size:11px">${stu.initials}</div>
                  <span style="font-size:13px;font-weight:600">${stu.name}</span>
                  <span style="font-size:12px;color:var(--text-muted)">→ ${t(promo.nextLevel.name)}</span>
                </div>`).join('')}
          ${promotionReady.length > 3 ? `<div class="faint" style="font-size:12px;margin-top:4px">+${promotionReady.length-3} more</div>` : ''}
        </div>
      </div>

      <h3 class="h3" style="margin-bottom:var(--sp-3)">Classes this week</h3>
      <div class="card" style="padding:0">
        <div class="list">${weekClassRows}</div>
      </div>
    `;
  }

  // ---------- Screen: Memberships -------------------------------------------

  function MembershipsList() {
    // Build a lookup: studentId → enrollment membership plan
    const membershipMap = {};
    ENROLLMENTS.forEach(e => {
      if (!membershipMap[e.studentId]) membershipMap[e.studentId] = e.membership || 'plan-monthly';
    });

    // Group students by plan
    const byPlan = {};
    MEMBERSHIP_PLANS.forEach(p => { byPlan[p.id] = []; });
    STUDENTS.forEach(stu => {
      const plan = membershipMap[stu.id] || 'plan-monthly';
      if (!byPlan[plan]) byPlan[plan] = [];
      byPlan[plan].push(stu);
    });

    const planCards = MEMBERSHIP_PLANS.map(plan => {
      const members = byPlan[plan.id] || [];
      const rows = members.length === 0
        ? `<div class="muted" style="padding:var(--sp-3) 0;font-size:13px">No students on this plan.</div>`
        : members.map(stu => {
            const enr = DB.enrollment(stu.id, 'sport-bjj');
            const currentPlan = membershipMap[stu.id] || 'plan-monthly';
            const planOpts = MEMBERSHIP_PLANS.map(p =>
              `<option value="${p.id}" ${currentPlan === p.id ? 'selected' : ''}>${p.label} — ${p.price}</option>`
            ).join('');
            return `
              <div class="list-row" style="grid-template-columns:40px 1fr 1fr auto auto;cursor:pointer"
                   onclick="go('students/${stu.id}')">
                <div class="avatar">${stu.initials}</div>
                <div>
                  <div style="font-weight:600">${stu.name}</div>
                  <div class="faint" style="font-size:12px">${stu.contact}</div>
                </div>
                <div>${enr ? BeltChip(enr.gradingSystemId, enr.currentLevelId, enr.currentStripes) : ''}</div>
                <div class="muted" style="font-size:12px">${stu.joinedAt ? 'Joined ' + timeAgo(stu.joinedAt) : ''}</div>
                <div onclick="event.stopPropagation()">
                  <select class="input" style="font-size:12px;padding:4px 8px"
                          onchange="changeMembership('${stu.id}', this.value)">
                    ${planOpts}
                  </select>
                </div>
              </div>`;
          }).join('');

      return `
        <div class="card" style="margin-bottom:var(--sp-4)">
          <div class="row-between" style="margin-bottom:var(--sp-3)">
            <div>
              <div style="font-size:17px;font-weight:700">${plan.label}
                <span style="font-size:14px;color:var(--accent);margin-left:var(--sp-2)">${plan.price}</span>
              </div>
              <div class="muted" style="font-size:12px;margin-top:var(--sp-1)">${plan.desc}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:28px;font-weight:700;line-height:1">${members.length}</div>
              <div style="font-size:11px;color:var(--text-muted)">student${members.length !== 1 ? 's' : ''}</div>
            </div>
          </div>
          <div class="list" style="border:1px solid var(--border);border-radius:var(--r-md);padding:0">
            ${rows}
          </div>
        </div>`;
    }).join('');

    const total = STUDENTS.length;
    const mrr = MEMBERSHIP_PLANS.reduce((sum, plan) => {
      const count = (byPlan[plan.id] || []).length;
      // parse price to a monthly number for a rough MRR estimate
      const match = plan.price.match(/[\$€](\d+)/);
      const monthly = match ? parseInt(match[1]) : 0;
      const isAnnual = plan.price.includes('/yr');
      return sum + count * (isAnnual ? Math.round(monthly / 12) : monthly);
    }, 0);

    // ── Renewal tracking ───────────────────────────────────────────────────────
    const today = CONFIG.today;
    const todayMs = today.getTime();

    // For each student, compute the next renewal date and urgency
    const renewalItems = [];
    const upsellItems  = [];

    STUDENTS.forEach(stu => {
      const plan = membershipMap[stu.id] || 'plan-monthly';
      if (!stu.joinedAt) return;
      const joinedMs = new Date(stu.joinedAt).getTime();
      const monthsActive = (todayMs - joinedMs) / (1000 * 60 * 60 * 24 * 30.44);

      if (plan === 'plan-annual') {
        // Find next anniversary date
        const joinedDate = new Date(stu.joinedAt);
        let next = new Date(joinedDate);
        while (next.getTime() <= todayMs) {
          next = new Date(next.getFullYear() + 1, next.getMonth(), next.getDate());
        }
        const daysUntil = Math.round((next.getTime() - todayMs) / 86400000);
        if (daysUntil <= 60) {
          renewalItems.push({ stu, plan, daysUntil, nextDate: next });
        }
      } else if (monthsActive >= 11) {
        // Long-tenure monthly/unlimited — nudge toward annual
        const enr = DB.enrollment(stu.id, 'sport-bjj');
        upsellItems.push({ stu, plan, monthsActive: Math.floor(monthsActive), enr });
      }
    });

    // Sort: soonest first
    renewalItems.sort((a, b) => a.daysUntil - b.daysUntil);
    upsellItems.sort((a, b) => b.monthsActive - a.monthsActive);

    function renewalUrgencyBadge(days) {
      if (days <= 7)  return `<span style="background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">⚠ ${days}d</span>`;
      if (days <= 30) return `<span style="background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">${days}d</span>`;
      return          `<span style="background:#f0fdf4;color:#15803d;border:1px solid #86efac;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">${days}d</span>`;
    }

    const renewalRows = renewalItems.map(({ stu, daysUntil, nextDate }) => {
      const d = nextDate;
      const dateStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
      return `
        <div class="list-row" style="grid-template-columns:40px 1fr auto auto;cursor:pointer" onclick="go('students/${stu.id}')">
          <div class="avatar">${stu.initials}</div>
          <div>
            <div style="font-weight:600">${stu.name}</div>
            <div class="faint" style="font-size:12px">Annual renewal · ${dateStr}</div>
          </div>
          ${renewalUrgencyBadge(daysUntil)}
          <span style="color:var(--text-faint);font-size:18px">›</span>
        </div>`;
    }).join('');

    const upsellRows = upsellItems.slice(0, 5).map(({ stu, plan, monthsActive, enr }) => {
      const planLabel = MEMBERSHIP_PLANS.find(p => p.id === plan)?.label || plan;
      return `
        <div class="list-row" style="grid-template-columns:40px 1fr auto auto;cursor:pointer" onclick="go('students/${stu.id}')">
          <div class="avatar">${stu.initials}</div>
          <div>
            <div style="font-weight:600">${stu.name}</div>
            <div class="faint" style="font-size:12px">${planLabel} · ${monthsActive} months active</div>
          </div>
          <span style="background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600">Annual?</span>
          <span style="color:var(--text-faint);font-size:18px">›</span>
        </div>`;
    }).join('');

    const renewalCard = (renewalItems.length + upsellItems.length) === 0 ? '' : `
      <div class="card" style="margin-bottom:var(--sp-5);border-left:3px solid var(--accent)">
        <div style="font-size:15px;font-weight:700;margin-bottom:var(--sp-3)">🔔 Renewals & upgrades</div>

        ${renewalItems.length > 0 ? `
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:var(--sp-2)">Annual renewals due</div>
          <div class="list" style="border:1px solid var(--border);border-radius:var(--r-md);padding:0;margin-bottom:${upsellItems.length > 0 ? 'var(--sp-4)' : '0'}">
            ${renewalRows}
          </div>
        ` : ''}

        ${upsellItems.length > 0 ? `
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:var(--sp-2)">Annual upgrade opportunities</div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:var(--sp-2)">Long-tenured monthly/unlimited members — switching to annual saves them 2 months.</div>
          <div class="list" style="border:1px solid var(--border);border-radius:var(--r-md);padding:0">
            ${upsellRows}
          </div>
        ` : ''}
      </div>`;

    return `
      <div class="row-between" style="margin-bottom:var(--sp-5)">
        <h1 class="h1">${t(UI.nav.memberships)}</h1>
        <button class="btn" onclick="go('memberships/plans')">Edit plans →</button>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:var(--sp-4);margin-bottom:var(--sp-5)">
        <div class="card" style="flex:1;min-width:140px;padding:var(--sp-3) var(--sp-4)">
          <div style="font-size:22px;font-weight:700">${total}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Total members</div>
        </div>
        <div class="card" style="flex:1;min-width:140px;padding:var(--sp-3) var(--sp-4)">
          <div style="font-size:22px;font-weight:700">$${mrr}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Est. MRR</div>
          <div class="faint" style="font-size:11px">approximate</div>
        </div>
        ${MEMBERSHIP_PLANS.map(p => {
          const count = (byPlan[p.id] || []).length;
          return `
            <div class="card" style="flex:1;min-width:140px;padding:var(--sp-3) var(--sp-4)">
              <div style="font-size:22px;font-weight:700">${count}</div>
              <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">${p.label}</div>
              <div class="faint" style="font-size:11px">${p.price}</div>
            </div>`;
        }).join('')}
        <div class="card" style="flex:1;min-width:140px;padding:var(--sp-3) var(--sp-4);${renewalItems.length > 0 ? 'border-left:3px solid var(--accent)' : ''}">
          <div style="font-size:22px;font-weight:700;color:${renewalItems.length > 0 ? 'var(--accent)' : 'inherit'}">${renewalItems.length}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Renewals due</div>
          <div class="faint" style="font-size:11px">next 60 days</div>
        </div>
      </div>


      ${planCards}
    `;
  }

  // ---------- Screen: New class form ----------------------------------------

  const CLASS_TYPES = ['Fundamentals', 'Open Class', 'Advanced', 'Sparring', 'Private'];

  const DAYS_OF_WEEK = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  // Recurring class templates — the "schedule" that generates individual class instances
  const AUDIENCES = ['Adults', 'Kids', 'Girls', 'Competition'];

  // RECURRING_TEMPLATES is now defined in data.js (shared with student.html)

  let newClassState = {
    date: '', time: '19:00', durationMin: 60,
    classType: 'Fundamentals', instructorId: '', capacity: 20, audienceTags: []
  };

  function collectNewClassForm() {
    ['date','time','classType','instructorId'].forEach(key => {
      const el = document.getElementById('nc-' + key);
      if (el) newClassState[key] = el.value;
    });
    const dur = document.getElementById('nc-durationMin');
    if (dur) newClassState.durationMin = parseInt(dur.value) || 60;
    const cap = document.getElementById('nc-capacity');
    if (cap) newClassState.capacity = parseInt(cap.value) || 20;
    newClassState.audienceTags = [...document.querySelectorAll('input[data-nc-aud]:checked')].map(c => c.value);
  }

  function saveNewClass() {
    collectNewClassForm();
    const { date, time, classType, instructorId, durationMin, capacity, audienceTags } = newClassState;
    if (!date) { alert('Please set a date.'); return; }
    if (!instructorId) { alert('Please select an instructor.'); return; }
    const startsAt = new Date(`${date}T${time}:00`).toISOString();
    const id = 'cls-' + Date.now();
    CLASSES.push({ id, startsAt, durationMin, classType, instructorId,
      sportId: 'sport-bjj', capacity, audienceTags: audienceTags || [], plannedItemIds: [], status: 'scheduled' });
    persistData();
    newClassState = { date: '', time: '19:00', durationMin: 60,
      classType: 'Fundamentals', instructorId: '', capacity: 20, audienceTags: [] };
    go('classes/' + id);
  }

  function savePromotionRules() {
    const grading = DB.grading(ACADEMY.sportConfigs[0]?.gradingSystemId);
    if (!grading) return;

    const levels = grading.levels;
    const newRules = {};

    for (let i = 0; i < levels.length - 1; i++) {
      const from = levels[i];
      const to   = levels[i + 1];
      const key  = `${from.id}-to-${to.id}`;

      const months  = parseInt(document.getElementById(`pr-months-${key}`)?.value)  || 0;
      const classes = parseInt(document.getElementById(`pr-classes-${key}`)?.value) || 0;
      const stripes = parseInt(document.getElementById(`pr-stripes-${key}`)?.value) || 0;
      const basics  = parseFloat(document.getElementById(`pr-basics-${key}`)?.value) || 0;

      // Only save if at least one field is non-zero
      if (months || classes || stripes || basics) {
        newRules[key] = {
          minMonthsAtLevel:      months,
          minClassesAtLevel:     classes,
          minStripes:            stripes,
          minBasicsCoveragePct:  basics / 100,
        };
      }
    }

    grading.promotionRules = newRules;
    persistPromotionRules();

    // Show toast
    const toast = document.getElementById('promo-rules-toast');
    if (toast) {
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }
  }

  // ---------- Backup / Restore / Factory Reset --------------------------------

  function backupData() {
    // Collect all tatami_* localStorage keys plus the main data key
    const backup = { _version: 1, _exportedAt: new Date().toISOString(), keys: {} };
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith('tatami') || k === DATA_KEY)) {
        try { backup.keys[k] = JSON.parse(localStorage.getItem(k)); }
        catch { backup.keys[k] = localStorage.getItem(k); }
      }
    }
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tatami-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast('Backup downloaded ✓');
  }

  function restoreFromBackup(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const backup = JSON.parse(e.target.result);
        if (!backup || !backup.keys) { showToast('Invalid backup file'); return; }
        if (!confirm('This will overwrite all current data. Are you sure?')) { input.value = ''; return; }
        Object.entries(backup.keys).forEach(([k, v]) => {
          localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v));
        });
        loadPersistedData();
        loadPersistedData(); // run twice to ensure all secondary keys (notes, billing, etc.) are loaded
        renderApp();
        showToast('Backup restored ✓');
      } catch(err) {
        showToast('Failed to restore: ' + err.message);
      }
      input.value = '';
    };
    reader.readAsText(file);
  }

  function factoryReset() {
    if (!confirm('This will permanently delete ALL your data — students, classes, attendance, billing, and settings. There is no undo. Continue?')) return;
    if (!confirm('Are you absolutely sure? This cannot be undone.')) return;
    // Remove all tatami_* keys
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith('tatami') || k === DATA_KEY)) toRemove.push(k);
    }
    toRemove.forEach(k => localStorage.removeItem(k));
    // Reload page to reinitialise from seed data
    window.location.reload();
  }

    const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: `tatami-billing-${monthKey}.csv` });

  function exportStudentsCSV() {
    const header = ['Name', 'Contact', 'DOB', 'Belt', 'Stripes', 'Membership', 'Joined', 'Classes Attended', 'Last Attended'];
    const rows = STUDENTS.map(stu => {
      const enr = DB.enrollment(stu.id, 'sport-bjj');
      const level = enr ? DB.level(enr.gradingSystemId, enr.currentLevelId) : null;
      const belt = level ? t(level.name) : '';

      const plan = MEMBERSHIP_PLANS.find(p => p.id === (enr?.membership || 'plan-monthly'));

      const classIds = CLASSES.map(c => c.id);

      }
      return [stu.name, stu.contact || '', stu.dob || '', belt, stripes, plan?.label || '', stu.joinedAt || '', totalAttended, lastDate];

    const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');

  // ---------- Student CSV import ---------------------------------------------
  // Accepts files with header row. Recognised columns (case-insensitive):
  //   Name (required), Contact / Email, DOB / Date of birth, Membership / Plan
  // Rows whose contact email already exists are skipped (dedup by email).
  function importStudentsCSV(input) {
    const file = input.files[0];
    if (!file) return;

    function parseCSVRow(line) {
      const result = []; let inQ = false, field = '';
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"' && !inQ) { inQ = true; continue; }
        if (ch === '"' && inQ) { if (line[i + 1] === '"') { field += '"'; i++; } else inQ = false; continue; }
        if (ch === ',' && !inQ) { result.push(field.trim()); field = ''; continue; }
        field += ch;
      }
      result.push(field.trim());
      return result;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const lines = e.target.result.trim().split(/\r?\n/);
      if (lines.length < 2) { showToast('CSV has no data rows'); input.value = ''; return; }

      const header = parseCSVRow(lines[0]).map(h => h.toLowerCase().replace(/[^a-z]/g, ''));
      const col = key => header.findIndex(h => key.some(k => h.includes(k)));
      const nameIdx = col(['name']);
      const emailIdx = col(['contact', 'email', 'phone']);
      const dobIdx   = col(['dob', 'birth', 'date']);
      const planIdx  = col(['member', 'plan', 'membership']);

      if (nameIdx === -1) { showToast('CSV must have a Name column'); input.value = ''; return; }

      const existingEmails = new Set(STUDENTS.map(s => (s.contact || '').toLowerCase()).filter(Boolean));
      const gradingSystem = GRADING_SYSTEMS.find(g => g.sportId === 'sport-bjj');
      const today = new Date(CONFIG.today).toISOString().slice(0, 10);
      let added = 0, skipped = 0;

      for (let i = 1; i < lines.length; i++) {
        const row = parseCSVRow(lines[i]);
        const name = (row[nameIdx] || '').trim();
        if (!name) { skipped++; continue; }

        const contact = emailIdx >= 0 ? (row[emailIdx] || '').trim() : '';
        if (contact && existingEmails.has(contact.toLowerCase())) { skipped++; continue; }

        const dob = dobIdx >= 0 ? (row[dobIdx] || '').trim() || null : null;
        const planRaw = planIdx >= 0 ? (row[planIdx] || '') : '';
        let planId = 'plan-monthly';
        if (/unlimited/i.test(planRaw)) planId = 'plan-unlimited';
        else if (/annual|year/i.test(planRaw)) planId = 'plan-annual';

        const id = 'stu-imp-' + Date.now() + '-' + i;
        const initials = name.split(/\s+/).map(w => w[0] || '').join('').toUpperCase().slice(0, 2) || '?';

        STUDENTS.push({ id, name, initials, dob, weightKg: null, joinedAt: today, contact });

        if (gradingSystem) {
          ENROLLMENTS.push({
            id: 'enr-' + id,
            studentId: id,
            sportId: 'sport-bjj',
            gradingSystemId: gradingSystem.id,
            currentLevelId: gradingSystem.levels[0]?.id || null,
            currentStripes: 0,
            levelSince: today,
            lastPromotionAt: null,
            membership: planId,
          });
        }

        if (contact) existingEmails.add(contact.toLowerCase());
        added++;
      }

      input.value = ''; // reset so same file can trigger again
      if (added > 0) {
        persistData();
        showToast(`Imported ${added} student${added !== 1 ? 's' : ''}${skipped ? ` · ${skipped} skipped` : ''}`);
        renderApp();
      } else {
        showToast(skipped > 0 ? `${skipped} row${skipped !== 1 ? 's' : ''} skipped — already exist or empty` : 'No valid rows found');
      }
    };
    reader.onerror = () => { showToast('Could not read file'); input.value = ''; };
    reader.readAsText(file);
  }

  // Parse a plan price string to a number of cents (monthly equivalent)
  function parsePlanCents(priceStr) {
    const num = parseFloat((priceStr || '').replace(/[^0-9.]/g, ''));
    if (!num) return 0;
    if (/yr|year/i.test(priceStr)) return Math.round((num / 12) * 100);
    return Math.round(num * 100);
  }

  // Generate invoice objects for the last N months (current + N-1 prior)
  function generateInvoices(monthsBack = 3) {
    const billingState = loadBillingState();
    const today = new Date(CONFIG.today);
    const invoices = [];

    for (let m = monthsBack - 1; m >= 0; m--) {
      const d = new Date(today.getFullYear(), today.getMonth() - m, 1);
      const monthKey = d.toISOString().slice(0, 7); // 'YYYY-MM'
      const dueDate  = new Date(d.getFullYear(), d.getMonth() + 1, 1); // 1st of next month
      const isCurrentMonth = m === 0;

      STUDENTS.forEach(stu => {
        const enr = ENROLLMENTS.find(e => e.studentId === stu.id);
        const planId = enr?.membership || 'plan-monthly';
        const plan = MEMBERSHIP_PLANS.find(p => p.id === planId) || MEMBERSHIP_PLANS[0];
        const amountCents = parsePlanCents(plan.price);
        const invId = `inv-${stu.id}-${monthKey}`;

        // Determine status: current month defaults to outstanding; past months default to paid
        let status;
        if (billingState[invId] !== undefined) {
          status = billingState[invId]; // persisted override
        } else {
          status = isCurrentMonth ? 'outstanding' : 'paid';
        }

        // Simulate 1 overdue per cycle: oldest student in previous month
        if (!isCurrentMonth && m === monthsBack - 1 && stu.id === STUDENTS[STUDENTS.length - 1]?.id) {
          if (billingState[invId] === undefined) status = 'overdue';
        }

        invoices.push({ id: invId, studentId: stu.id, student: stu, plan, amountCents, monthKey, dueDate, status, isCurrentMonth });
      });
    }
    return invoices;
  }

  // ---------- Expense tracker ------------------------------------------------
  const EXPENSES_KEY = 'tatami_expenses_v1';
  const EXPENSE_CATEGORIES = [
    { id: 'rent',       label: 'Rent / Space',      icon: '🏠' },
    { id: 'instructor', label: 'Instructor Pay',     icon: '👤' },
    { id: 'utilities',  label: 'Utilities',          icon: '💡' },

  // ---------- Instructor Pay Rates ------------------------------------------

  const INSTRUCTOR_PAY_KEY = 'tatami_pay_rates';
  let PAY_RATES = {}; // { [instId]: ratePerHour (number) }

  function loadPayRates() {
    try {
      const saved = JSON.parse(localStorage.getItem(INSTRUCTOR_PAY_KEY));
      if (saved && typeof saved === 'object') PAY_RATES = saved;
    } catch {}
  }

  function getPayRate(instId) {
    if (PAY_RATES[instId] !== undefined) return PAY_RATES[instId];
    const inst = INSTRUCTORS.find(i => i.id === instId);
    return inst?.payRate ?? 25;
  }

  function savePayRate(instId, rate) {
    const r = parseFloat(rate);
    if (isNaN(r) || r < 0) return;
    PAY_RATES[instId] = Math.round(r * 100) / 100;
    try { localStorage.setItem(INSTRUCTOR_PAY_KEY, JSON.stringify(PAY_RATES)); } catch {}
    document.getElementById('content').innerHTML = InstructorScreen();
  }
  window.savePayRate = savePayRate;

  let EXPENSES = [];

  function loadExpenses() {
    try {
      const saved = JSON.parse(localStorage.getItem(EXPENSES_KEY));
      if (Array.isArray(saved)) EXPENSES = saved;
    } catch {}
  }

  function saveExpenses() {
    try { localStorage.setItem(EXPENSES_KEY, JSON.stringify(EXPENSES)); } catch {}
  }

  function addExpense() {
    const cat   = document.getElementById('exp-cat').value;
    const amt   = parseFloat(document.getElementById('exp-amt').value);
    const desc  = document.getElementById('exp-desc').value.trim();
    const date  = document.getElementById('exp-date').value;
    if (!cat || !amt || amt <= 0 || !date) return;
    const catObj = EXPENSE_CATEGORIES.find(c => c.id === cat);
    EXPENSES.push({
      id:    'exp-' + Date.now(),
      cat,
      catLabel: catObj?.label || cat,
      icon:  catObj?.icon || '📦',
      amountCents: Math.round(amt * 100),
      desc:  desc || catObj?.label || cat,
      date,
      monthKey: date.slice(0, 7),
    });
    saveExpenses();
    document.getElementById('content').innerHTML = BillingScreen();
  }

  function deleteExpense(id) {
    const idx = EXPENSES.findIndex(e => e.id === id);
    if (idx !== -1) { EXPENSES.splice(idx, 1); saveExpenses(); }
    document.getElementById('content').innerHTML = BillingScreen();
  }

  function BillingScreen() {
    const invoices = generateInvoices(3);
    const today = new Date(CONFIG.today);
    const currentMonthKey = today.toISOString().slice(0, 7);
    const currentMonthLabel = today.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

    // Stats
    const outstanding = invoices.filter(i => i.status === 'outstanding');
    const overdue     = invoices.filter(i => i.status === 'overdue');
    const paid        = invoices.filter(i => i.status === 'paid');
    const mrrCents    = STUDENTS.reduce((sum, stu) => {
      const enr  = ENROLLMENTS.find(e => e.studentId === stu.id);
      const plan = MEMBERSHIP_PLANS.find(p => p.id === (enr?.membership || 'plan-monthly')) || MEMBERSHIP_PLANS[0];
      return sum + parsePlanCents(plan.price);
    }, 0);
    const outstandingCents = outstanding.reduce((s, i) => s + i.amountCents, 0);
    const overdueCents     = overdue.reduce((s, i) => s + i.amountCents, 0);
    const collectedCents   = paid.filter(i => i.monthKey === currentMonthKey).reduce((s, i) => s + i.amountCents, 0);

    // Expenses for current month
    const currentExpenses  = EXPENSES.filter(e => e.monthKey === currentMonthKey);
    const totalExpCents    = currentExpenses.reduce((s, e) => s + e.amountCents, 0);

    // Payroll for current month (instructor hours × pay rate)
    const monthStart = today.toISOString().slice(0, 7) + '-01';
    const monthEndDate = new Date(today.getFullYear(), today.getMonth() + 1, 1);
    const monthEndIso = monthEndDate.toISOString();
    const payrollRows = INSTRUCTORS.map(inst => {
      const thisMonthClasses = CLASSES.filter(c =>
        c.instructorId === inst.id &&
        c.startsAt >= monthStart &&
        c.startsAt < monthEndIso &&
        c.startsAt < today.toISOString()
      );
      const hours = thisMonthClasses.reduce((s, c) => s + (c.durationMin || 60) / 60, 0);
      const rate  = getPayRate(inst.id);
      const cents = Math.round(hours * rate * 100);
      return { inst, hours, rate, cents, classCount: thisMonthClasses.length };
    });
    const totalPayrollCents = payrollRows.reduce((s, r) => s + r.cents, 0);
    const netCents         = mrrCents - totalExpCents - totalPayrollCents;
    const netColor         = netCents >= 0 ? 'var(--success)' : 'var(--danger)';

    // Expense breakdown by category
    const expByCat = {};
    currentExpenses.forEach(e => {
      if (!expByCat[e.cat]) expByCat[e.cat] = { label: e.catLabel, icon: e.icon, cents: 0 };
      expByCat[e.cat].cents += e.amountCents;
    });

    function fmtEur(cents) { return '€' + (cents / 100).toFixed(0); }
    function statusBadge(status) {
      const map = {
        paid:        { bg: '#f0fdf4', color: 'var(--success)',  label: 'Paid' },
        outstanding: { bg: '#eff6ff', color: 'var(--accent)',   label: 'Outstanding' },
        overdue:     { bg: '#fff1f2', color: 'var(--danger)',   label: 'Overdue' },

      return `<span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:${s.bg};color:${s.color};white-space:nowrap">${s.label}</span>`;
    }

    // Group invoices by month, most recent first
    const byMonth = {};
    invoices.forEach(inv => {
      if (!byMonth[inv.monthKey]) byMonth[inv.monthKey] = [];
      byMonth[inv.monthKey].push(inv);
    });
    const monthKeys = Object.keys(byMonth).sort().reverse();

    const monthSections = monthKeys.map(mk => {
      const d = new Date(mk + '-01');
      const label = d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
      const rows = byMonth[mk].map(inv => {
        const canPay = inv.status !== 'paid';

            </div>

              <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Collected</div>
            </div>
            <div style="text-align:center">
              <div style="font-size:22px;font-weight:700;color:var(--warn)">${fmtEur(outstandingCents)}</div>

              <svg width="22" height="22" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M13.976 9.15c-2.172-.806-3.356-1.426-3.356-2.409 0-.831.683-1.305 1.901-1.305 2.227 0 4.515.858 6.09 1.631l.89-5.494C18.252.975 15.697 0 12.165 0 9.667 0 7.589.654 6.104 1.872 4.56 3.147 3.757 4.992 3.757 7.218c0 4.039 2.467 5.76 6.476 7.219 2.585.92 3.445 1.574 3.445 2.583 0 .98-.84 1.545-2.354 1.545-1.875 0-4.965-.921-6.99-2.109l-.9 5.555C5.175 22.99 8.385 24 11.714 24c2.641 0 4.843-.624 6.328-1.813 1.664-1.305 2.525-3.236 2.525-5.732 0-4.128-2.524-5.851-6.591-7.305z"/></svg>

            <button class="btn" style="font-size:13px;padding:8px 16px" onclick="this.closest('.card').style.display='none'">Dismiss</button>

        <!-- Payroll summary -->
        <div style="margin-bottom:var(--sp-5)">
          <div class="row-between" style="margin-bottom:var(--sp-3)">
            <div style="font-size:15px;font-weight:700">👥 Payroll — ${currentMonthLabel}</div>
            <button class="btn btn-secondary" style="font-size:12px;padding:4px 12px" onclick="go('instructors')">Edit pay rates →</button>
          </div>
          <div class="card" style="padding:0">
            ${payrollRows.length === 0
              ? `<div class="muted" style="padding:var(--sp-4) var(--sp-5);font-size:13px">No instructors found.</div>`
              : payrollRows.map(r => `
                  <div class="list-row" style="grid-template-columns:40px 1fr auto auto auto;align-items:center;gap:var(--sp-3)">
                    <div class="avatar">${r.inst.initials}</div>
                    <div>
                      <div style="font-weight:600">${r.inst.name}</div>
                      <div style="font-size:11px;color:var(--text-muted)">${r.classCount} classes · ${r.hours.toFixed(1)} hrs · €${r.rate}/hr</div>
                    </div>
                    <div style="font-size:13px;color:var(--text-muted)">${r.hours.toFixed(1)} hrs</div>
                    <div style="font-weight:700;font-size:15px;color:var(--danger)">-${fmtEur(r.cents)}</div>
                    <div style="font-size:12px;color:var(--text-muted);width:60px;text-align:right">
                      ${r.cents > 0 ? Math.round(r.cents / Math.max(mrrCents, 1) * 100) + '% rev' : '—'}
                    </div>
                  </div>`).join('')}
            <div style="padding:var(--sp-3) var(--sp-4) var(--sp-3);display:flex;justify-content:flex-end;border-top:1px solid var(--border)">
              <div style="font-size:14px;font-weight:700;color:var(--danger)">Total payroll: ${fmtEur(totalPayrollCents)}</div>
            </div>
          </div>
        </div>

        <!-- Expense tracker -->
        <div style="margin-bottom:var(--sp-5)">
          <div class="row-between" style="margin-bottom:var(--sp-3)">
            <div style="font-size:15px;font-weight:700">💸 Expenses — ${currentMonthLabel}</div>
          </div>

          <!-- P&L summary -->
          <div class="card" style="display:flex;gap:var(--sp-5);flex-wrap:wrap;margin-bottom:var(--sp-3);padding:var(--sp-4) var(--sp-5)">
            <div style="text-align:center;flex:1;min-width:100px">
              <div style="font-size:22px;font-weight:700;color:var(--accent)">${fmtEur(mrrCents)}</div>
              <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Revenue (MRR)</div>
            </div>
            <div style="text-align:center;flex:1;min-width:100px">
              <div style="font-size:22px;font-weight:700;color:var(--danger)">${fmtEur(totalExpCents)}</div>
              <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Expenses</div>
            </div>
            <div style="text-align:center;flex:1;min-width:100px">
              <div style="font-size:22px;font-weight:700;color:var(--danger)">${fmtEur(totalPayrollCents)}</div>
              <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Payroll</div>
            </div>
            <div style="text-align:center;flex:1;min-width:100px;padding-left:var(--sp-4);border-left:2px solid var(--border)">
              <div style="font-size:26px;font-weight:800;color:${netColor}">${netCents >= 0 ? '+' : ''}${fmtEur(netCents)}</div>
              <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase">Net profit</div>
            </div>
            ${Object.values(expByCat).length ? `
              <div style="flex:2;min-width:200px;border-left:2px solid var(--border);padding-left:var(--sp-4)">
                <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:var(--sp-2)">By category</div>
                ${Object.values(expByCat).map(cat => {
                  const pct = totalExpCents > 0 ? Math.round(cat.cents / totalExpCents * 100) : 0;
                  return `
                    <div style="display:flex;align-items:center;gap:var(--sp-2);margin-bottom:4px">
                      <span style="width:16px">${cat.icon}</span>
                      <span style="font-size:12px;flex:1">${cat.label}</span>
                      <span style="font-size:12px;font-weight:600">${fmtEur(cat.cents)}</span>
                      <span style="font-size:11px;color:var(--text-muted);width:30px;text-align:right">${pct}%</span>
                    </div>`;
                }).join('')}
              </div>` : ''}
          </div>

          <!-- Expense list -->
          <div class="card" style="padding:0;margin-bottom:var(--sp-3)">
            ${currentExpenses.length === 0
              ? `<div class="muted" style="padding:var(--sp-4) var(--sp-5);font-size:13px">No expenses logged for ${currentMonthLabel} yet.</div>`
              : currentExpenses.map(e => `
                  <div class="list-row" style="grid-template-columns:28px 1fr auto auto;align-items:center;gap:var(--sp-3)">
                    <span style="font-size:18px">${e.icon}</span>
                    <div>
                      <div style="font-weight:600;font-size:14px">${e.desc}</div>
                      <div style="font-size:11px;color:var(--text-muted)">${e.catLabel} · ${e.date}</div>
                    </div>
                    <div style="font-weight:700;font-size:15px;color:var(--danger)">-${fmtEur(e.amountCents)}</div>
                    <button class="btn btn-secondary" style="font-size:11px;padding:3px 10px" onclick="deleteExpense('${e.id}')">✕</button>
                  </div>`).join('')}
          </div>

          <!-- Add expense form -->
          <div class="card" style="padding:var(--sp-4) var(--sp-5)">
            <div style="font-size:13px;font-weight:700;margin-bottom:var(--sp-3)">+ Log an expense</div>
            <div style="display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:flex-end">
              <div style="flex:1;min-width:140px">
                <label style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">CATEGORY</label>
                <select id="exp-cat" class="input" style="width:100%">
                  ${EXPENSE_CATEGORIES.map(c => `<option value="${c.id}">${c.icon} ${c.label}</option>`).join('')}
                </select>
              </div>
              <div style="flex:1;min-width:140px">
                <label style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">DESCRIPTION</label>
                <input id="exp-desc" class="input" style="width:100%" placeholder="e.g. June rent" />
              </div>
              <div style="min-width:110px">
                <label style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">AMOUNT (€)</label>
                <input id="exp-amt" class="input" type="number" min="0" step="0.01" style="width:100%" placeholder="0.00" />
              </div>
              <div style="min-width:130px">
                <label style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">DATE</label>
                <input id="exp-date" class="input" type="date" style="width:100%" value="${currentMonthKey + '-01'}" />
              </div>
              <button class="btn btn-primary" style="padding:8px 20px;white-space:nowrap" onclick="addExpense()">Add expense</button>
            </div>
          </div>
        </div>

        ${monthSections}
      </div>`;
  }

  // ---------- Grading session screen ----------------------------------------

  function GradingScreen() {
    const sportId = 'sport-bjj';
    const grading = DB.grading(ACADEMY.sportConfigs[0]?.gradingSystemId);

    // Belt test requests — read from shared localStorage key (written by student.html)
    const beltTestRequests = (() => {
      try {
        const notes = JSON.parse(localStorage.getItem('tatami_student_notes') || '{}');
        const results = [];
        Object.entries(notes).forEach(([studentId, studentNotes]) => {
          const req = (studentNotes || []).find(n => n.type === '🥋' && n.text && n.text.includes('belt test'));
          if (!req) return;
          const stu = DB.student(studentId);
          if (!stu) return;
          const daysAgo = Math.floor((new Date(CONFIG.today).getTime() - new Date(req.createdAt).getTime()) / 86400000);
          if (daysAgo > 60) return; // ignore very stale requests
          const enr = ENROLLMENTS.find(e => e.studentId === studentId);
          results.push({ stu, enr, req, daysAgo });
        });
        return results.sort((a, b) => new Date(b.req.createdAt) - new Date(a.req.createdAt));
      } catch { return []; }
    })();

    function clearBeltTestRequest(studentId) {
      try {
        const notes = JSON.parse(localStorage.getItem('tatami_student_notes') || '{}');
        if (notes[studentId]) {
          notes[studentId] = notes[studentId].filter(n => !(n.type === '🥋' && n.text && n.text.includes('belt test')));
          localStorage.setItem('tatami_student_notes', JSON.stringify(notes));
        }
      } catch {}
      document.getElementById('content').innerHTML = GradingScreen();
    }
    window.clearBeltTestRequest = clearBeltTestRequest;

    // Gather all promotion-ready students
    const ready = STUDENTS.map(stu => {
      const promo = computePromotionStatus(stu.id, sportId);
      if (!promo?.ready) return null;
      const enr = DB.enrollment(stu.id, sportId);
      return { stu, promo, enr };
    }).filter(Boolean);

    const allIds = ready.map(r => r.stu.id);
    const noneSelected = gradingSelectedIds.size === 0;
    const selectedCount = [...gradingSelectedIds].filter(id => allIds.includes(id)).length;

    // Group past sessions
    const sessionRows = GRADING_SESSIONS.map(sess => {
      const promoted = sess.results.map(res => {
        const stu = DB.student(res.studentId);
        const fromLevel = grading?.levels.find(l => l.id === res.fromLevelId);
        const toLevel   = grading?.levels.find(l => l.id === res.toLevelId);
        if (!stu) return '';
        return `
          <div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)">
            <div class="avatar" style="width:28px;height:28px;font-size:11px">${stu.initials}</div>
            <span style="font-size:13px;font-weight:600;flex:1">${stu.name}</span>
            <span style="font-size:12px;color:var(--text-muted)">${t(fromLevel?.name || {en:'?'})} → ${t(toLevel?.name || {en:'?'})}</span>
            ${BeltChip(enrSystemId(res.studentId), res.toLevelId, 0)}
            <button class="btn" style="font-size:11px;padding:3px 10px;margin-left:4px"
              onclick="printCertificate('${res.studentId}','${sportId}','${res.toLevelId}','${sess.date}')">🎓</button>
          </div>`;
      }).join('');
      return `
        <div class="card" style="margin-bottom:var(--sp-3)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-3)">
            <div style="font-weight:700">Grading — ${sess.date}</div>
            <div style="display:flex;gap:var(--sp-2);align-items:center">
              <span class="tag tag-basics">${sess.results.length} promoted</span>
              <button class="btn" style="font-size:12px;padding:3px 10px"
                onclick="${sess.results.map(r=>`printCertificate('${r.studentId}','${sportId}','${r.toLevelId}','${sess.date}')`).join(';')}">
                🎓 All certificates
              </button>
            </div>
          </div>
          ${promoted}
        </div>`;
    }).join('') || `<div class="muted" style="padding:var(--sp-3) 0">No grading sessions recorded yet.</div>`;

    function enrSystemId(studentId) {
      return ENROLLMENTS.find(e => e.studentId === studentId && e.sportId === sportId)?.gradingSystemId || 'gs-bjj';
    }

    const readyRows = ready.length === 0
      ? `<div class="muted" style="padding:var(--sp-4) 0">No students currently meet promotion criteria.</div>`
      : ready.map(({ stu, promo, enr }) => {
          const checked = gradingSelectedIds.has(stu.id);
          return `
            <div class="list-row" style="gap:var(--sp-3);cursor:pointer" onclick="gradingToggle('${stu.id}')">
              <input type="checkbox" ${checked ? 'checked' : ''} onclick="event.stopPropagation();gradingToggle('${stu.id}')"
                     style="width:16px;height:16px;accent-color:var(--accent);flex-shrink:0">
              <div class="avatar">${stu.initials}</div>
              <div style="flex:1">
                <div style="font-weight:600">${stu.name}</div>
                <div class="faint" style="font-size:12px">${stu.contact}</div>
              </div>
              <div>${BeltChip(enr.gradingSystemId, enr.currentLevelId, enr.currentStripes)}</div>
              <div style="font-size:13px;color:var(--text-muted)">→ ${t(promo.nextLevel.name)}</div>
            </div>`;
        }).join('');

    // "Almost ready" — students ≥75% toward next promotion but not yet fully ready.
    // Uses same logic as computePromotionStatus (totalAttended for class count).
    const almostReady = STUDENTS
      .filter(stu => !stu.inactive && !ready.find(r => r.stu.id === stu.id))
      .map(stu => {
        const promo = computePromotionStatus(stu.id, sportId);
        if (!promo || promo.reason === 'top-level' || promo.reason === 'no-rule') return null;
        if (promo.ready) return null; // already in "ready" list
        const { rule, actual, level: currLvl, nextLevel: nextLvl } = promo;
        const enr = ENROLLMENTS.find(e => e.studentId === stu.id && e.sportId === sportId);
        const classPct  = (rule.minClassesAtLevel  > 0) ? Math.min(100, Math.round((actual.classesAttended / rule.minClassesAtLevel)  * 100)) : 100;
        const monthPct  = (rule.minMonthsAtLevel   > 0) ? Math.min(100, Math.round((actual.monthsAtLevel   / rule.minMonthsAtLevel)   * 100)) : 100;
        const coverPct  = (rule.minBasicsCoveragePct > 0) ? Math.min(100, Math.round((actual.basicsPct / rule.minBasicsCoveragePct) * 100)) : 100;
        const overallPct = Math.round((classPct + monthPct + coverPct) / 3);
        if (overallPct < 75) return null;
        return { stu, enr, currLvl, nextLvl, classPct, monthPct, coverPct, overallPct,
                 classesAttended: actual.classesAttended, classReq: rule.minClassesAtLevel || 0,
                 monthsAtLevel: actual.monthsAtLevel, monthReq: rule.minMonthsAtLevel || 0 };
      })
      .filter(Boolean)
      .sort((a, b) => b.overallPct - a.overallPct);

    const almostReadySection = almostReady.length === 0 ? '' : `
      <h3 class="h3" style="margin-bottom:var(--sp-3)">◎ In progress (75%+)</h3>
      <div class="card" style="padding:0;margin-bottom:var(--sp-5)">
        <div class="list">
          ${almostReady.map(({ stu, enr, currLvl, nextLvl, classPct, monthPct, overallPct, classesAttended, classReq, monthsAtLevel, monthReq }) => {
            const barColor = overallPct >= 90 ? '#f59e0b' : 'var(--accent)';
            const classLabel = classReq > 0 ? `${classesAttended}/${classReq} classes` : null;
            const monthLabel = monthReq > 0 ? `${monthsAtLevel}/${monthReq} mo` : null;
            const subLabel = [classLabel, monthLabel].filter(Boolean).join(' · ');
            return `
              <div class="list-row" style="cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4)"
                   onclick="go('students/${stu.id}')">
                <div style="display:flex;align-items:center;gap:var(--sp-3)">
                  <div class="avatar">${stu.initials}</div>
                  <div style="flex:1;min-width:0">
                    <div style="font-weight:600">${stu.name}</div>
                    <div style="font-size:12px;color:var(--text-muted)">
                      ${subLabel}
                      <span style="margin-left:8px;font-weight:700;color:${barColor}">${overallPct}%</span>
                    </div>
                  </div>
                  <div style="display:flex;align-items:center;gap:var(--sp-2)">
                    ${BeltChip(enr.gradingSystemId, enr.currentLevelId, enr.currentStripes)}
                    <span style="font-size:12px;color:var(--text-muted)">→ ${t(nextLvl.name)}</span>
                  </div>
                </div>
                <div style="height:5px;background:var(--surface-alt);border-radius:3px;overflow:hidden;margin:0 0 var(--sp-1)">
                  <div style="height:100%;width:${Math.min(overallPct, 100)}%;background:${barColor};border-radius:3px;transition:width .4s"></div>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>`;

    return `
      <div class="row-between" style="margin-bottom:var(--sp-5)">
        <h1 class="h1">★ Grading Session</h1>
        <div style="display:flex;gap:var(--sp-2)">
          ${ready.length > 0 ? `<button class="btn" onclick="gradingSelectAll(${JSON.stringify(allIds)})">Select all</button>` : ''}
          <button class="btn btn-primary" ${noneSelected || selectedCount === 0 ? 'disabled' : ''}
                  onclick="runGradingSession()"
                  style="${noneSelected || selectedCount === 0 ? 'opacity:.4;cursor:not-allowed' : ''}">
            Run grading${selectedCount > 0 ? ` (${selectedCount})` : ''} →
          </button>
        </div>
      </div>

      <div style="display:flex;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-5)">
        <div class="card" style="flex:1;min-width:140px">
          <div style="font-size:22px;margin-bottom:var(--sp-2)">★</div>
          <div style="font-size:28px;font-weight:700">${ready.length}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-2)">Ready to promote</div>
        </div>
        <div class="card" style="flex:1;min-width:140px">
          <div style="font-size:22px;margin-bottom:var(--sp-2)">✓</div>
          <div style="font-size:28px;font-weight:700">${GRADING_SESSIONS.reduce((n,s)=>n+s.results.length,0)}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-2)">Total promoted</div>

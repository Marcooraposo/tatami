  function attendanceLogFilter(field, value) {
    attendanceLogState[field] = value;
    if (field !== 'page') attendanceLogState.page = 1;
    document.getElementById('attendance-log-root').innerHTML = _attendanceLogInner();
  }

  function attendanceLogMore() {
    attendanceLogState.page++;
    document.getElementById('attendance-log-root').innerHTML = _attendanceLogInner();
  }

  function _attendanceLogInner() {
    const { query, classType, days, page } = attendanceLogState;
    const PAGE_SIZE = 50;

    // Build cutoff date
    const cutoff = days === 0 ? null : new Date(new Date(CONFIG.today).getTime() - days * 86400000);

    // Collect class types for filter dropdown
    const allTypes = [...new Set(CLASSES.map(c => c.classType).filter(Boolean))].sort();

    // Build enriched rows: join ATTENDANCE → CLASSES → STUDENTS
    const rows = [];
    ATTENDANCE.forEach(a => {
      if (!a.attended) return;
      const cls = CLASSES.find(c => c.id === a.classId);
      if (!cls) return;
      const clsDate = new Date(cls.startsAt);
      if (cutoff && clsDate < cutoff) return;
      if (classType && cls.classType !== classType) return;
      const stu = STUDENTS.find(s => s.id === a.studentId);
      if (!stu) return;
      if (query) {
        const q = query.toLowerCase();
        if (!stu.name.toLowerCase().includes(q) && !cls.classType.toLowerCase().includes(q)) return;
      }
      rows.push({ a, cls, stu, clsDate });
    });

    // Sort newest first
    rows.sort((x, y) => y.clsDate - x.clsDate);

    // Stats
    const totalCheckIns  = rows.length;
    const uniqueStudents = new Set(rows.map(r => r.stu.id)).size;
    const classIds       = [...new Set(rows.map(r => r.cls.id))];
    const avgPerClass    = classIds.length ? (totalCheckIns / classIds.length).toFixed(1) : '—';
    const dayCountMap    = {};
    const DAY_NAMES      = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    rows.forEach(r => {
      const d = DAY_NAMES[r.clsDate.getDay()];
      dayCountMap[d] = (dayCountMap[d] || 0) + 1;
    });
    const busiestDay = Object.keys(dayCountMap).length
      ? Object.entries(dayCountMap).sort((a,b) => b[1]-a[1])[0][0]
      : '—';

    // Pagination
    const total   = rows.length;
    const shown   = rows.slice(0, page * PAGE_SIZE);
    const hasMore = total > shown.length;

    // Enrollment lookup for belt
    function beltFor(stuId) {
      const enr = ENROLLMENTS.find(e => e.studentId === stuId);
      if (!enr) return '';
      return BeltChip(enr.gradingId || 'bjj', enr.currentLevelId, enr.currentStripes || 0);
    }

    const dateRangeOpts = [
      { label: '7 days',  val: 7  },
      { label: '30 days', val: 30 },
      { label: '90 days', val: 90 },
      { label: 'All time',val: 0  },
    ];

    const typeOptions = allTypes.map(tp =>
      `<option value="${tp}" ${classType === tp ? 'selected' : ''}>${tp}</option>`
    ).join('');

    const tableRows = shown.map(r => {
      const dateFmt = r.clsDate.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
      const timeFmt = r.clsDate.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
      return `
        <tr>
          <td style="white-space:nowrap;color:var(--text-muted);font-size:13px">${dateFmt}</td>
          <td><span class="badge badge-neutral">${r.cls.classType || '—'}</span></td>
          <td><a href="#/students/${r.stu.id}" style="color:var(--accent);font-weight:600;text-decoration:none;font-size:14px">${r.stu.name}</a></td>
          <td>${beltFor(r.stu.id)}</td>
          <td style="color:var(--text-muted);font-size:13px">${timeFmt}</td>
        </tr>`;
    }).join('');

    return `
      <div class="stat-grid" style="margin-bottom:20px">
        <div class="stat-card">
          <div class="stat-value">${totalCheckIns.toLocaleString()}</div>
          <div class="stat-label">Check-ins</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${uniqueStudents}</div>
          <div class="stat-label">Unique students</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${avgPerClass}</div>
          <div class="stat-label">Avg per class</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${busiestDay}</div>
          <div class="stat-label">Busiest day</div>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px">
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
          <input
            id="alog-q"
            type="text"
            class="form-input"
            placeholder="Search student or class…"
            value="${query.replace(/"/g,'&quot;')}"
            oninput="attendanceLogFilter('query', this.value)"
            style="flex:1;min-width:180px;max-width:280px"
          />
          <select
            class="form-input"
            onchange="attendanceLogFilter('classType', this.value)"
            style="min-width:140px"
          >
            <option value="" ${!classType ? 'selected' : ''}>All class types</option>
            ${typeOptions}
          </select>
          <div style="display:flex;gap:6px">
            ${dateRangeOpts.map(o => `
              <button
                class="btn ${days === o.val ? 'btn-primary' : 'btn-secondary'}"
                onclick="attendanceLogFilter('days', ${o.val})"
                style="padding:6px 12px;font-size:13px"
              >${o.label}</button>
            `).join('')}
          </div>
        </div>
      </div>

      ${total === 0 ? `
        <div class="empty">
          <div class="empty-title">No attendance records match your filters</div>
          <div class="muted">Try expanding the date range or clearing the search.</div>
        </div>
      ` : `
        <div class="card" style="padding:0;overflow:hidden">
          <div style="overflow-x:auto">
            <table style="width:100%;border-collapse:collapse">
              <thead>
                <tr style="background:var(--surface-alt);text-align:left">
                  <th style="padding:10px 16px;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em">Date</th>
                  <th style="padding:10px 16px;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em">Class</th>
                  <th style="padding:10px 16px;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em">Student</th>
                  <th style="padding:10px 16px;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em">Belt</th>
                  <th style="padding:10px 16px;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em">Time</th>
                </tr>
              </thead>
              <tbody>
                ${tableRows.replace(/<tr>/g, '<tr style="border-top:1px solid var(--border)">').replace(/^<tr style[^>]*>/, '<tr>')}
              </tbody>
            </table>
          </div>
          <div style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);background:var(--surface-alt)">
            <span class="muted" style="font-size:13px">Showing ${shown.length} of ${total} records</span>
            ${hasMore ? `<button class="btn btn-secondary" onclick="attendanceLogMore()" style="font-size:13px">Load more</button>` : ''}
          </div>
        </div>
      `}
    `;
  }

  function exportAttendanceCSV() {
    const { query, classType, days } = attendanceLogState;
    const cutoff = days === 0 ? null : new Date(new Date(CONFIG.today).getTime() - days * 86400000);

    const rows = [];
    ATTENDANCE.forEach(a => {
      if (!a.attended) return;
      const cls = CLASSES.find(c => c.id === a.classId);
      if (!cls) return;
      const clsDate = new Date(cls.startsAt);
      if (cutoff && clsDate < cutoff) return;
      if (classType && cls.classType !== classType) return;
      const stu = STUDENTS.find(s => s.id === a.studentId);
      if (!stu) return;
      if (query) {
        const q = query.toLowerCase();
        if (!stu.name.toLowerCase().includes(q) && !cls.classType.toLowerCase().includes(q)) return;
      }
      const enr = ENROLLMENTS.find(e => e.studentId === stu.id);
      const level = enr ? DB.level(enr.gradingSystemId, enr.currentLevelId) : null;
      const belt = level ? t(level.name) : '';
      const instructor = INSTRUCTORS.find(i => i.id === cls.instructorId);
      rows.push({
        date: clsDate.toISOString().slice(0, 10),
        time: clsDate.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }),
        classType: cls.classType || '',
        instructor: instructor?.name || '',
        studentName: stu.name,
        studentEmail: stu.contact || '',
        belt,
        stripes: enr ? enr.currentStripes : 0,
      });
    });

    rows.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));

    const header = ['Date', 'Time', 'Class Type', 'Instructor', 'Student Name', 'Student Email', 'Belt', 'Stripes'];
    const csvRows = rows.map(r => [r.date, r.time, r.classType, r.instructor, r.studentName, r.studentEmail, r.belt, r.stripes]);
    const csv = [header, ...csvRows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const dateStr = new Date(CONFIG.today).toISOString().slice(0, 10);
    const a = Object.assign(document.createElement('a'), { href: url, download: `tatami-attendance-${dateStr}.csv` });
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }

    const allRatings = [];
    for (const [classId, ratings] of Object.entries(CLASS_RATINGS)) {
      const cls = CLASSES.find(c => c.id === classId) || null;
      for (const r of (ratings || [])) {
        allRatings.push({ ...r, cls, classId });

    const avgAll    = allRatings.reduce((s, r) => s + r.stars, 0) / total;
    const positivePct = Math.round(allRatings.filter(r => r.stars >= 4).length / total * 100);
    const lowCount  = allRatings.filter(r => r.stars <= 2).length;
    const withCommentCount = allRatings.filter(r => r.comment).length;

    // --- Star distribution ---
    const starDistHtml = [5, 4, 3, 2, 1].map(s => {
      const count = allRatings.filter(r => r.stars === s).length;
      const pct   = Math.round(count / total * 100);
      return `

          <span style="font-size:11px;color:#f59e0b">★</span>
          <div style="flex:1;height:8px;background:var(--surface-alt);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:#f59e0b;border-radius:4px;transition:width .3s"></div>
          </div>
          <div style="font-size:12px;color:var(--text-muted);width:26px;text-align:right">${count}</div>
        </div>`;
    }).join('');

    const fullStars = Math.round(avgAll);

    // --- By class type ---
    const byType = {};
    for (const r of allRatings) {
      const key = r.cls?.classType || 'Unknown';
      if (!byType[key]) byType[key] = { sum: 0, n: 0 };
      byType[key].sum += r.stars; byType[key].n++;
    }
    const typeRows = Object.entries(byType)
      .map(([type, d]) => ({ type, avg: d.sum / d.n, n: d.n }))
      .sort((a, b) => b.avg - a.avg)
      .map(({ type, avg, n }) => {
        const s = Math.round(avg);
        const col = avg >= 4.5 ? 'var(--green,#16a34a)' : avg >= 3.5 ? '#f59e0b' : 'var(--red,#dc2626)';
        return `<tr>
          <td style="padding:8px var(--sp-3);font-size:13px;font-weight:600">${escHtml(type)}</td>
          <td style="padding:8px var(--sp-3);font-size:15px;color:#f59e0b">${'★'.repeat(s)}${'☆'.repeat(5-s)}</td>
          <td style="padding:8px var(--sp-3);font-size:14px;font-weight:700;color:${col}">${avg.toFixed(1)}</td>
          <td style="padding:8px var(--sp-3);font-size:12px;color:var(--text-muted)">${n} rating${n!==1?'s':''}</td>
        </tr>`;
      }).join('');

    // --- By instructor ---
    const byInst = {};
    for (const r of allRatings) {
      if (!r.cls) continue;
      const inst = INSTRUCTORS.find(i => i.id === r.cls.instructorId);
      const name = inst?.name || 'Unknown';
      const initials = inst?.initials || '?';
      if (!byInst[name]) byInst[name] = { sum: 0, n: 0, initials };
      byInst[name].sum += r.stars; byInst[name].n++;
    }
    const instHtml = Object.entries(byInst)
      .map(([name, d]) => ({ name, initials: d.initials, avg: d.sum / d.n, n: d.n }))
      .sort((a, b) => b.avg - a.avg)
      .map(({ name, initials, avg, n }) => {
        const col = avg >= 4.5 ? 'var(--green,#16a34a)' : avg >= 3.5 ? '#f59e0b' : 'var(--red,#dc2626)';
        return `
          <div style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--border)">
            <div class="avatar" style="width:36px;height:36px;font-size:12px">${initials}</div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600">${escHtml(name)}</div>
              <div style="font-size:16px;color:#f59e0b;letter-spacing:1px">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:20px;font-weight:700;color:${col}">${avg.toFixed(1)}</div>
              <div style="font-size:11px;color:var(--text-muted)">${n} review${n!==1?'s':''}</div>
            </div>
          </div>`;
      }).join('');

    // --- Recent comments ---
    const comments = allRatings
      .filter(r => r.comment)
      .sort((a, b) => (b.ratedAt||'').localeCompare(a.ratedAt||''))
      .slice(0, 12);

    const commentHtml = comments.length === 0
      ? `<div class="muted" style="font-size:13px">No written comments yet.</div>`
      : comments.map(r => {
          const stu  = STUDENTS.find(s => s.id === r.studentId);
          const stars = '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars);
          const clsLink = r.cls
            ? `<a href="#/classes/${r.cls.id}" style="font-size:11px;color:var(--accent);text-decoration:none">${escHtml(r.cls.classType)} · ${(r.cls.startsAt||'').slice(0,10)}</a>`
            : '';
          return `
            <div style="padding:var(--sp-3) 0;border-bottom:1px solid var(--border)">
              <div style="display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:4px">
                <span style="font-size:14px;color:#f59e0b;letter-spacing:1px">${stars}</span>
                <span style="font-size:12px;font-weight:600">${escHtml(stu?.name||'Student')}</span>
                ${clsLink ? `<span class="muted" style="font-size:11px">·</span>${clsLink}` : ''}
                <span style="margin-left:auto;font-size:11px;color:var(--text-muted)">${(r.ratedAt||'').slice(0,10)}</span>
              </div>
              <div style="font-size:13px;color:var(--text-body);font-style:italic">"${escHtml(r.comment)}"</div>
            </div>`;
        }).join('');

    return `
      <div style="max-width:860px;margin:0 auto">
        <h1 class="h1" style="margin-bottom:var(--sp-1)">⭐ Class Feedback</h1>
        <p class="muted" style="font-size:13px;margin-bottom:var(--sp-5)">Aggregate view of all student class ratings.</p>

        <div class="stat-grid" style="margin-bottom:var(--sp-5)">
          <div class="stat-card">
            <div class="stat-label">Overall avg</div>
            <div class="stat-value" style="color:#f59e0b">${avgAll.toFixed(1)} ★</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total ratings</div>
            <div class="stat-value">${total}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">4–5 ★ positive</div>
            <div class="stat-value" style="color:var(--green,#16a34a)">${positivePct}%</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Low (≤2 ★)</div>
            <div class="stat-value" style="${lowCount>0?'color:var(--red,#dc2626)':''}">${lowCount}</div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);margin-bottom:var(--sp-4)">
          <div class="card">
            <h3 class="card-title" style="margin-bottom:var(--sp-4)">Rating distribution</h3>
            <div style="display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-4)">
              <div style="font-size:48px;font-weight:700;color:#f59e0b;line-height:1">${avgAll.toFixed(1)}</div>
              <div>
                <div style="font-size:20px;color:#f59e0b;letter-spacing:2px">${'★'.repeat(fullStars)}${'☆'.repeat(5-fullStars)}</div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:3px">${total} rating${total!==1?'s':''} · ${withCommentCount} with comments</div>
              </div>
            </div>
            ${starDistHtml}
          </div>

          <div class="card">
            <h3 class="card-title" style="margin-bottom:var(--sp-3)">Avg by class type</h3>
            ${Object.keys(byType).length === 0
              ? `<div class="muted" style="font-size:13px">No data yet.</div>`
              : `<table style="width:100%;border-collapse:collapse"><tbody>${typeRows}</tbody></table>`}
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)">
          <div class="card">
            <h3 class="card-title" style="margin-bottom:var(--sp-2)">Avg by instructor</h3>
            ${Object.keys(byInst).length === 0
              ? `<div class="muted" style="font-size:13px">No data yet.</div>`
              : instHtml}
          </div>

          <div class="card">
            <h3 class="card-title" style="margin-bottom:var(--sp-2)">Recent comments</h3>
            ${commentHtml}
          </div>
        </div>
      </div>
    `;
  }

  // ---------- Family Groups -------------------------------------------------

  const FAMILY_GROUPS_KEY = 'tatami_families';
  let FAMILY_GROUPS = [];

  const _FG_SEEDS = [
    { id: 'fg-1', name: 'Santos Family',   memberIds: ['s-2', 's-3'], discountPct: 10, notes: 'Siblings — train together Mon/Wed', createdAt: '2025-06-01' },
    { id: 'fg-2', name: 'Oliveira Family', memberIds: ['s-5', 's-4'], discountPct: 10, notes: '',                                   createdAt: '2026-02-15' },
  ];

  function loadFamilyGroups() {
    try {
      const saved = JSON.parse(localStorage.getItem(FAMILY_GROUPS_KEY));
      if (Array.isArray(saved)) {
        FAMILY_GROUPS.splice(0, FAMILY_GROUPS.length, ...saved);
      } else {
        FAMILY_GROUPS.splice(0, FAMILY_GROUPS.length, ..._FG_SEEDS);
      }
    } catch(e) { FAMILY_GROUPS.splice(0, FAMILY_GROUPS.length, ..._FG_SEEDS); }
  }

  function saveFamilyGroups() {
    try { localStorage.setItem(FAMILY_GROUPS_KEY, JSON.stringify(FAMILY_GROUPS)); } catch(e) {}
  }

  let fgDraft = null;       // null = closed, 'new' = new-group form, 'fg-X' = adding member
  let fgEditId = null;      // id of group being name/discount-edited

  function fgOpenNew() {
    fgDraft = 'new';
    document.getElementById('content').innerHTML = FamiliesScreen();
  }
  function fgCloseNew() {
    fgDraft = null;
    document.getElementById('content').innerHTML = FamiliesScreen();
  }
  function fgSaveNew() {
    const name = document.getElementById('fg-name')?.value?.trim();
    if (!name) { showToast('Please enter a group name'); return; }
    const discount = parseInt(document.getElementById('fg-discount')?.value || '0');
    const notes = document.getElementById('fg-notes')?.value?.trim() || '';
    FAMILY_GROUPS.push({ id: 'fg-' + Date.now(), name, memberIds: [], discountPct: discount, notes, createdAt: new Date().toISOString().split('T')[0] });
    saveFamilyGroups();
    fgDraft = null;
    document.getElementById('content').innerHTML = FamiliesScreen();
    showToast('Family group created ✓');
  }

  function fgDelete(id) {
    if (!confirm('Delete this family group?')) return;
    const idx = FAMILY_GROUPS.findIndex(g => g.id === id);
    if (idx === -1) return;
    FAMILY_GROUPS.splice(idx, 1);
    saveFamilyGroups();
    document.getElementById('content').innerHTML = FamiliesScreen();
    showToast('Group deleted');
  }

  function fgStartEdit(id) {
    fgEditId = id;
    document.getElementById('content').innerHTML = FamiliesScreen();
  }
  function fgCancelEdit() {
    fgEditId = null;
    document.getElementById('content').innerHTML = FamiliesScreen();
  }
  function fgSaveEdit(id) {
    const g = FAMILY_GROUPS.find(x => x.id === id);
    if (!g) return;
    const name = document.getElementById('fge-name-' + id)?.value?.trim();
    if (!name) { showToast('Name required'); return; }
    g.name = name;
    g.discountPct = parseInt(document.getElementById('fge-discount-' + id)?.value || '0');
    g.notes = document.getElementById('fge-notes-' + id)?.value?.trim() || '';
    saveFamilyGroups();
    fgEditId = null;
    document.getElementById('content').innerHTML = FamiliesScreen();
    showToast('Group updated ✓');
  }

  function fgOpenAddMember(id) {
    fgDraft = id;
    document.getElementById('content').innerHTML = FamiliesScreen();
  }
  function fgCloseAddMember() {
    fgDraft = null;
    document.getElementById('content').innerHTML = FamiliesScreen();
  }
  function fgAddMember(groupId) {
    const g = FAMILY_GROUPS.find(x => x.id === groupId);
    if (!g) return;
    const studentId = document.getElementById('fgm-student-' + groupId)?.value;
    if (!studentId) { showToast('Select a student'); return; }
    if (g.memberIds.includes(studentId)) { showToast('Already in this group'); return; }
    // Remove from any other group
    FAMILY_GROUPS.forEach(other => {
      if (other.id !== groupId) {
        const i = other.memberIds.indexOf(studentId);
        if (i !== -1) other.memberIds.splice(i, 1);
      }
    });
    g.memberIds.push(studentId);
    saveFamilyGroups();
    fgDraft = null;
    document.getElementById('content').innerHTML = FamiliesScreen();
  }
  function fgRemoveMember(groupId, studentId) {
    const g = FAMILY_GROUPS.find(x => x.id === groupId);
    if (!g) return;
    const i = g.memberIds.indexOf(studentId);
    if (i !== -1) g.memberIds.splice(i, 1);
    saveFamilyGroups();
    document.getElementById('content').innerHTML = FamiliesScreen();
  }

  function FamiliesScreen() {
    const PLAN_PRICE = { 'plan-monthly': 80, 'plan-unlimited': 120, 'plan-annual': 100 };

    // Stats
    const totalGroups = FAMILY_GROUPS.length;
    const allMemberIds = [...new Set(FAMILY_GROUPS.flatMap(g => g.memberIds))];
    const totalMembers = allMemberIds.length;
    const familyMRR = allMemberIds.reduce((sum, sid) => {
      const enr = DB.enrollment(sid, 'sport-bjj');
      return sum + (PLAN_PRICE[enr?.membership] || 0);
    }, 0);
    const avgDiscount = totalGroups ? Math.round(FAMILY_GROUPS.reduce((s,g) => s + (g.discountPct||0), 0) / totalGroups) : 0;

    // Students not yet in any group (for add-member select)
    const membersInAnyGroup = new Set(FAMILY_GROUPS.flatMap(g => g.memberIds));
    const unassigned = STUDENTS.filter(s => !membersInAnyGroup.has(s.id));

    const newForm = fgDraft === 'new' ? `
      <div class="card" style="margin-bottom:var(--sp-4);border:2px solid var(--accent)">
        <div style="font-weight:700;font-size:15px;margin-bottom:var(--sp-4)">New family group</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-3)">
          <div>
            <label style="font-size:12px;color:var(--text-muted)">Group name *</label>
            <input id="fg-name" class="input" placeholder="e.g. Silva Family" style="width:100%;margin-top:4px" />
          </div>
          <div>
            <label style="font-size:12px;color:var(--text-muted)">Family discount %</label>
            <input id="fg-discount" class="input" type="number" min="0" max="50" value="10" style="width:100%;margin-top:4px" />
          </div>
        </div>
        <div style="margin-bottom:var(--sp-3)">
          <label style="font-size:12px;color:var(--text-muted)">Notes</label>
          <input id="fg-notes" class="input" placeholder="Optional notes" style="width:100%;margin-top:4px" />
        </div>
        <div style="display:flex;gap:var(--sp-3)">
          <button class="btn btn-primary" onclick="fgSaveNew()">Create group</button>
          <button class="btn" onclick="fgCloseNew()">Cancel</button>
        </div>
      </div>` : '';

    const groupCards = FAMILY_GROUPS.map(g => {
      const members = g.memberIds.map(id => {
        const stu = DB.student(id);
        if (!stu) return null;
        const enr = DB.enrollment(id, 'sport-bjj');
        return { stu, enr };
      }).filter(Boolean);

      const groupMRR = members.reduce((s, { enr }) => s + (PLAN_PRICE[enr?.membership] || 0), 0);
      const isEditing = fgEditId === g.id;
      const isAddingMember = fgDraft === g.id;

      // available students to add (not in any group)
      const availableForGroup = STUDENTS.filter(s => !s && false); // computed fresh below
      const takenIds = new Set(FAMILY_GROUPS.flatMap(x => x.memberIds));
      const available = STUDENTS.filter(s => !takenIds.has(s.id) || g.memberIds.includes(s.id))
                                 .filter(s => !g.memberIds.includes(s.id));

      const memberRows = members.map(({ stu, enr }) => `
        <div style="display:flex;align-items:center;gap:var(--sp-3);padding:8px 0;border-bottom:1px solid var(--border)">
          <div class="avatar" style="width:32px;height:32px;font-size:12px;flex-shrink:0">${stu.initials}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:14px;cursor:pointer" onclick="go('students/${stu.id}')">${stu.name}</div>
            <div style="font-size:11px;color:var(--text-muted)">${stu.contact}</div>
          </div>
          <div>${BeltChip(enr.gradingSystemId, enr.currentLevelId, enr.currentStripes)}</div>
          <div style="font-size:13px;color:var(--text-muted);min-width:40px;text-align:right">€${PLAN_PRICE[enr?.membership]||0}/mo</div>
          <button class="btn" style="font-size:11px;padding:2px 8px;color:#ef4444;border-color:#fca5a5" onclick="fgRemoveMember('${g.id}','${stu.id}')">✕</button>
        </div>`).join('');

      const editForm = isEditing ? `
        <div style="margin-top:var(--sp-3);padding:var(--sp-3);background:var(--surface-alt);border-radius:8px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-2)">
            <div>
              <label style="font-size:12px;color:var(--text-muted)">Name</label>
              <input id="fge-name-${g.id}" class="input" value="${g.name}" style="width:100%;margin-top:4px" />
            </div>
            <div>
              <label style="font-size:12px;color:var(--text-muted)">Discount %</label>
              <input id="fge-discount-${g.id}" class="input" type="number" min="0" max="50" value="${g.discountPct||0}" style="width:100%;margin-top:4px" />
            </div>
          </div>
          <div style="margin-bottom:var(--sp-2)">
            <label style="font-size:12px;color:var(--text-muted)">Notes</label>
            <input id="fge-notes-${g.id}" class="input" value="${g.notes||''}" style="width:100%;margin-top:4px" />
          </div>
          <div style="display:flex;gap:var(--sp-2)">
            <button class="btn btn-primary" style="font-size:12px;padding:4px 12px" onclick="fgSaveEdit('${g.id}')">Save</button>
            <button class="btn" style="font-size:12px;padding:4px 12px" onclick="fgCancelEdit()">Cancel</button>
          </div>
        </div>` : '';

      const addMemberForm = isAddingMember && available.length ? `
        <div style="margin-top:var(--sp-3);padding:var(--sp-3);background:var(--surface-alt);border-radius:8px;display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap">
          <select id="fgm-student-${g.id}" class="input" style="font-size:13px;padding:4px 10px;width:auto">
            <option value="">— Select student —</option>
            ${available.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
          </select>
          <button class="btn btn-primary" style="font-size:12px;padding:4px 12px" onclick="fgAddMember('${g.id}')">Add</button>
          <button class="btn" style="font-size:12px;padding:4px 12px" onclick="fgCloseAddMember()">Cancel</button>
        </div>` :
        isAddingMember && !available.length ? `
        <div style="margin-top:var(--sp-3);padding:var(--sp-3);background:var(--surface-alt);border-radius:8px;display:flex;gap:var(--sp-2);align-items:center">
          <span style="font-size:13px;color:var(--text-muted)">All students are already in a group.</span>
          <button class="btn" style="font-size:12px;padding:4px 12px" onclick="fgCloseAddMember()">Close</button>
        </div>` : '';

      return `
        <div class="card" style="margin-bottom:var(--sp-4)">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-3)">
            <div>
              <div style="font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px">
                👪 ${g.name}
                ${g.discountPct ? `<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f0fdf4;color:#16a34a">${g.discountPct}% off</span>` : ''}
              </div>
              ${g.notes ? `<div style="font-size:12px;color:var(--text-muted);margin-top:3px">${g.notes}</div>` : ''}
              <div style="font-size:12px;color:var(--text-muted);margin-top:4px">
                ${members.length} member${members.length !== 1 ? 's' : ''} · €${groupMRR}/mo combined · since ${g.createdAt}
              </div>
            </div>
            <div style="display:flex;gap:var(--sp-2);flex-shrink:0">
              <button class="btn" style="font-size:12px;padding:4px 10px" onclick="fgStartEdit('${g.id}')">✎ Edit</button>
              <button class="btn" style="font-size:12px;padding:4px 10px;color:#ef4444;border-color:#fca5a5" onclick="fgDelete('${g.id}')">✕</button>
            </div>
          </div>
          ${editForm}
          ${memberRows || '<div style="font-size:13px;color:var(--text-muted);padding:8px 0">No members yet — add students below.</div>'}
          ${addMemberForm || (!isEditing ? `<div style="margin-top:var(--sp-3)">
            <button class="btn btn-secondary" style="font-size:12px;padding:4px 12px" onclick="fgOpenAddMember('${g.id}')">+ Add member</button>
          </div>` : '')}
        </div>`;
    }).join('');

    const emptyState = FAMILY_GROUPS.length === 0 && fgDraft !== 'new'
      ? `<div class="card" style="text-align:center;padding:var(--sp-6);color:var(--text-muted)">No family groups yet. Create one to link members and track family discounts.</div>`
      : '';

    return `
      <div class="row-between" style="margin-bottom:var(--sp-5)">
        <h1 class="h1">Families</h1>
        <button class="btn btn-primary" onclick="fgOpenNew()">+ New family group</button>
      </div>

      <div class="stats-row" style="margin-bottom:var(--sp-5)">
        <div class="stat-card">
          <div class="stat-val">${totalGroups}</div>
          <div class="stat-lbl">Groups</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">${totalMembers}</div>
          <div class="stat-lbl">Members</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">€${familyMRR}</div>
          <div class="stat-lbl">Family MRR</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">${avgDiscount}%</div>
          <div class="stat-lbl">Avg discount</div>
        </div>
      </div>

      ${newForm}
      ${groupCards}
      ${emptyState}
    `;
  }

  // ---------- Class Packages / Punch Cards ---------------------------------

  const PACKAGES_KEY = 'tatami_packages_v1';

  // Mutable arrays (overwritten on load)
  let PKG_TYPES    = CLASS_PACKAGE_TYPE_SEEDS.map(p => ({...p}));
  let STU_PACKAGES = STUDENT_PACKAGE_SEEDS.map(p => ({...p}));

  function loadPackages() {
    try {
      const saved = JSON.parse(localStorage.getItem(PACKAGES_KEY));
      if (saved && Array.isArray(saved.types) && Array.isArray(saved.purchases)) {
        PKG_TYPES.splice(0,    PKG_TYPES.length,    ...saved.types);
        STU_PACKAGES.splice(0, STU_PACKAGES.length, ...saved.purchases);
      }
    } catch(e) { /* use seeds */ }
  }

  function savePackages() {
    try { localStorage.setItem(PACKAGES_KEY, JSON.stringify({ types: PKG_TYPES, purchases: STU_PACKAGES })); }
    catch(e) {}
  }

  // Helpers
  function pkgType(id)   { return PKG_TYPES.find(p => p.id === id); }
  function pkgActive(sp) {
    if (sp.classesUsed >= (pkgType(sp.packageTypeId)?.classCount || 0)) return false;
    return new Date(sp.expiresAt) >= new Date(CONFIG.today.toISOString().slice(0,10));
  }
  function pkgRemaining(sp) {
    const t = pkgType(sp.packageTypeId);
    return t ? Math.max(0, t.classCount - sp.classesUsed) : 0;
  }
  function pkgStatusLabel(sp) {
    const t = pkgType(sp.packageTypeId);
    if (!t) return 'Unknown';
    const expired = new Date(sp.expiresAt) < new Date(CONFIG.today.toISOString().slice(0,10));
    if (sp.classesUsed >= t.classCount) return 'Used up';
    if (expired) return 'Expired';
    const daysLeft = Math.round((new Date(sp.expiresAt) - new Date(CONFIG.today.toISOString().slice(0,10))) / 86400000);
    if (daysLeft <= 7) return `Exp. in ${daysLeft}d`;
    return 'Active';
  }
  function pkgStatusColor(sp) {
    const lbl = pkgStatusLabel(sp);
    if (lbl === 'Active') return '#16a34a';
    if (lbl.startsWith('Exp. in')) return '#d97706';
    return '#94a3b8';
  }

  // Package sell state
  let pkgSellOpen    = false;
  let pkgTypeFormOpen = false;  // editing/new package type
  let pkgTypeDraft   = null;    // { id?, name, classCount, price, validityDays, active }

  window.pkgSellToggle = function() {
    pkgSellOpen = !pkgSellOpen;
    document.getElementById('content').innerHTML = PackagesScreen();
  };

  window.pkgSellSubmit = function() {
    const stuId = document.getElementById('pkg-sell-student')?.value;
    const typeId = document.getElementById('pkg-sell-type')?.value;
    const notes  = document.getElementById('pkg-sell-notes')?.value?.trim() || '';
    if (!stuId || !typeId) { showToast('Select a student and package type'); return; }
    const type = pkgType(typeId);
    if (!type) return;
    const todayStr = CONFIG.today.toISOString().slice(0,10);
    const expDate = new Date(CONFIG.today);
    expDate.setDate(expDate.getDate() + type.validityDays);
    STU_PACKAGES.push({
      id: 'sp-' + Date.now(),
      studentId: stuId,
      packageTypeId: typeId,
      purchasedAt: todayStr,
      expiresAt: expDate.toISOString().slice(0,10),
      classesUsed: 0,
      notes,
    });
    savePackages();
    pkgSellOpen = false;
    showToast(`Package sold to ${STUDENTS.find(s => s.id === stuId)?.name || ''}`);
    document.getElementById('content').innerHTML = PackagesScreen();
  };

  window.pkgUseClass = function(spId) {
    const sp = STU_PACKAGES.find(p => p.id === spId);
    if (!sp) return;
    const type = pkgType(sp.packageTypeId);
    if (!type || sp.classesUsed >= type.classCount) { showToast('No classes remaining'); return; }
    sp.classesUsed++;
    savePackages();
    document.getElementById('content').innerHTML = PackagesScreen();
  };

  window.pkgDelete = function(spId) {
    const idx = STU_PACKAGES.findIndex(p => p.id === spId);
    if (idx !== -1) { STU_PACKAGES.splice(idx, 1); savePackages(); }
    document.getElementById('content').innerHTML = PackagesScreen();
  };

  window.pkgTypeFormToggle = function(editId) {
    if (editId) {
      const t = pkgType(editId);
      pkgTypeDraft = t ? {...t} : null;
    } else {
      pkgTypeDraft = { id: null, name: '', classCount: 10, price: 75, validityDays: 60, active: true };
    }
    pkgTypeFormOpen = true;
    document.getElementById('content').innerHTML = PackagesScreen();
  };

  window.pkgTypeFormCancel = function() {
    pkgTypeFormOpen = false;
    pkgTypeDraft = null;
    document.getElementById('content').innerHTML = PackagesScreen();
  };

  window.pkgTypeSave = function() {
    const name = document.getElementById('pktf-name')?.value.trim();
    const classCount = parseInt(document.getElementById('pktf-count')?.value) || 0;
    const price = parseFloat(document.getElementById('pktf-price')?.value) || 0;
    const validityDays = parseInt(document.getElementById('pktf-validity')?.value) || 30;
    if (!name || classCount < 1 || price < 0) { showToast('Check the form fields'); return; }
    if (pkgTypeDraft?.id) {
      const existing = pkgType(pkgTypeDraft.id);
      if (existing) { existing.name = name; existing.classCount = classCount; existing.price = price; existing.validityDays = validityDays; }
    } else {
      PKG_TYPES.push({ id: 'pkg-' + Date.now(), name, classCount, price, validityDays, active: true });
    }

    pkgTypeFormOpen = false;
    pkgTypeDraft = null;
    showToast('Package type saved');
    document.getElementById('content').innerHTML = PackagesScreen();
  };

  window.pkgTypeToggleActive = function(typeId) {
    const t = pkgType(typeId);
    if (t) { t.active = !t.active; savePackages(); }

  };

      .reduce((s, sp) => s + (pkgType(sp.packageTypeId)?.classCount || 0), 0);
    const revenueMonth = STU_PACKAGES
      .filter(sp => sp.purchasedAt.slice(0,7) === todayStr.slice(0,7))

    const newTypeRow = (pkgTypeFormOpen && !pkgTypeDraft?.id) ? `

    const activeTypes = PKG_TYPES.filter(pt => pt.active);
    const sellForm = pkgSellOpen ? `

        <h3 style="margin:0 0 var(--sp-3)">Sell a package</h3>

    const purchaseRows = sortedPurchases.map(sp => {
      const stu  = STUDENTS.find(s => s.id === sp.studentId);

      const remaining = pkgRemaining(sp);
      const status = pkgStatusLabel(sp);
      const color  = pkgStatusColor(sp);
      const isActive = pkgActive(sp);
      // mini bar showing used/remaining
      const usedPct = type.classCount > 0 ? Math.round((sp.classesUsed / type.classCount) * 100) : 100;
      const miniBar = `
        <div style="display:flex;align-items:center;gap:6px">

            <div style="width:${usedPct}%;height:100%;background:${isActive?'var(--accent)':'#94a3b8'};border-radius:3px"></div>

      return `<tr style="border-bottom:1px solid var(--border)">

        <td style="padding:8px">${miniBar}</td>
        <td style="padding:8px">
          <span style="font-size:11px;font-weight:600;color:${color};background:${color}18;padding:2px 8px;border-radius:10px">${status}</span>
        </td>
        <td style="padding:8px;white-space:nowrap">
          ${isActive ? `<button class="btn btn-secondary" style="font-size:11px;padding:3px 8px" onclick="pkgUseClass('${sp.id}')">− Use class</button>` : ''}
          <button class="btn btn-secondary" style="font-size:11px;padding:3px 8px;margin-left:4px;color:#dc2626" onclick="pkgDelete('${sp.id}')">✕</button>
        </td>

    const purchasesSection = `
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3)">
          <h2 class="h2" style="margin:0">Student purchases</h2>
          ${!pkgSellOpen ? `<button class="btn btn-primary" onclick="pkgSellToggle()">+ Sell package</button>` : ''}
        </div>
        ${sortedPurchases.length === 0 ? `<p class="muted" style="text-align:center;padding:var(--sp-6)">No packages sold yet.</p>` : `
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
              <tr style="border-bottom:1px solid var(--border)">
                <th style="text-align:left;padding:6px 8px;color:var(--text-muted);font-weight:600">Student</th>
                <th style="text-align:left;padding:6px 8px;color:var(--text-muted);font-weight:600">Package</th>
                <th style="text-align:left;padding:6px 8px;color:var(--text-muted);font-weight:600">Purchased</th>
                <th style="text-align:left;padding:6px 8px;color:var(--text-muted);font-weight:600">Expires</th>
                <th style="text-align:left;padding:6px 8px;color:var(--text-muted);font-weight:600">Progress</th>
                <th style="text-align:left;padding:6px 8px;color:var(--text-muted);font-weight:600">Status</th>
                <th style="padding:6px 8px"></th>
              </tr>

            <tbody>${purchaseRows}</tbody>

    return `
      <div style="max-width:960px;margin:0 auto">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4)">
          <div>
            <h1 class="h1" style="margin-bottom:var(--sp-1)">Class Packages</h1>
            <p class="muted" style="font-size:13px">Punch cards and class packs — a flexible alternative to monthly memberships.</p>
          </div>
        </div>
        ${stats}
        ${typesSection}
        ${sellForm}
        ${purchasesSection}
      </div>`;
  }

  // ---------- Renewal Tracker -----------------------------------------------
  // Tracks whether each student has paid their membership for the current period.
  // Monthly/Unlimited → period key = 'YYYY-MM' (billing day anchored to joinedAt day)
  // Annual           → period key = 'YYYY'
  // Record schema: { id, studentId, period, planId, amount, paidAt }

  const RENEWALS_KEY = 'tatami_renewals_v1';
  let RENEWAL_RECORDS = [];

  function loadRenewalRecords() {
    try {
      const saved = JSON.parse(localStorage.getItem(RENEWALS_KEY));
      if (Array.isArray(saved)) RENEWAL_RECORDS.splice(0, RENEWAL_RECORDS.length, ...saved);
    } catch(e) {}
  }
  function saveRenewalRecords() {
    try { localStorage.setItem(RENEWALS_KEY, JSON.stringify(RENEWAL_RECORDS)); } catch(e) {}
  }

  function renewalPeriodKey(planId, referenceDate) {
    const d = referenceDate || CONFIG.today;
    const iso = (d instanceof Date ? d : new Date(d)).toISOString();
    return planId === 'plan-annual' ? iso.slice(0, 4) : iso.slice(0, 7);
  }

  function renewalDayOfMonth(student) {
    // The day-of-month they originally joined — their billing anchor day
    return parseInt((student.joinedAt || '2025-01-01').slice(8, 10), 10);
  }

  function renewalIsPaid(studentId, planId) {
    const period = renewalPeriodKey(planId);
    return RENEWAL_RECORDS.some(r => r.studentId === studentId && r.period === period);
  }

  function markRenewalPaid(studentId) {
    const enr  = ENROLLMENTS.find(e => e.studentId === studentId);
    if (!enr) return;
    const planId = enr.membership || 'plan-monthly';
    const period = renewalPeriodKey(planId);
    // Idempotent — don't add duplicate
    if (renewalIsPaid(studentId, planId)) return;
    const plan   = MEMBERSHIP_PLANS.find(p => p.id === planId);
    const amount = plan ? plan.price : '—';
    RENEWAL_RECORDS.push({
      id:        'ren-' + Date.now() + '-' + studentId,
      studentId, period, planId, amount,
      paidAt:    CONFIG.today.toISOString().slice(0, 10),
    });
    saveRenewalRecords();
    document.getElementById('content').innerHTML = RenewalTrackerScreen();
  }

  function unmarkRenewalPaid(studentId) {
    const enr   = ENROLLMENTS.find(e => e.studentId === studentId);
    if (!enr) return;
    const planId = enr.membership || 'plan-monthly';
    const period = renewalPeriodKey(planId);
    const idx = RENEWAL_RECORDS.findIndex(r => r.studentId === studentId && r.period === period);
    if (idx >= 0) RENEWAL_RECORDS.splice(idx, 1);
    saveRenewalRecords();
    document.getElementById('content').innerHTML = RenewalTrackerScreen();
  }

  window.markRenewalPaid   = markRenewalPaid;
  window.unmarkRenewalPaid = unmarkRenewalPaid;

  function RenewalTrackerScreen() {
    const today     = CONFIG.today;
    const todayISO  = today.toISOString().slice(0, 10);
    const todayDay  = today.getDate();

    // Build a renewal record per active student
    const activeStudents = STUDENTS.filter(s => !s.inactive);
    const rows = activeStudents.map(stu => {
      const enr    = ENROLLMENTS.find(e => e.studentId === stu.id);
      if (!enr) return null;
      const planId = enr.membership || 'plan-monthly';
      const plan   = MEMBERSHIP_PLANS.find(p => p.id === planId);
      const paid   = renewalIsPaid(stu.id, planId);
      const billingDay = renewalDayOfMonth(stu);
      const isAnnual   = planId === 'plan-annual';

      // Determine if due / overdue / upcoming
      let dueLabel, dueStatus; // 'paid' | 'due' | 'overdue' | 'upcoming'
      if (paid) {
        dueStatus = 'paid';
        dueLabel  = 'Paid';
      } else if (isAnnual) {
        // Annual: due when anniversary month = current month
        const joinMonth = parseInt((stu.joinedAt || '2025-01-01').slice(5, 7), 10);
        const nowMonth  = today.getMonth() + 1;
        if (joinMonth === nowMonth) {
          dueStatus = todayDay >= billingDay ? 'due' : 'upcoming';
        } else if (joinMonth < nowMonth) {
          // Their anniversary was earlier this year — already overdue for the year
          dueStatus = 'overdue';
        } else {
          dueStatus = 'upcoming';
        }
        dueLabel = isAnnual ? `Annual – due ${String(billingDay).padStart(2,'0')}/${String(joinMonth).padStart(2,'0')}` : '';
      } else {
        // Monthly/Unlimited: billing day this month
        if (todayDay > billingDay + 5) {
          dueStatus = 'overdue'; // more than 5 days past billing day → overdue
        } else if (todayDay >= billingDay) {
          dueStatus = 'due';
        } else {
          dueStatus = 'upcoming';
        }
        const daysUntil = billingDay - todayDay;
        dueLabel = dueStatus === 'upcoming'
          ? `Due in ${daysUntil}d (${String(billingDay).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')})`
          : `Due ${String(billingDay).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}`;
      }

      return { stu, enr, plan, planId, paid, billingDay, dueStatus, dueLabel, isAnnual };
    }).filter(Boolean);

    const overdue  = rows.filter(r => r.dueStatus === 'overdue');
    const due      = rows.filter(r => r.dueStatus === 'due');
    const upcoming = rows.filter(r => r.dueStatus === 'upcoming');
    const paid     = rows.filter(r => r.dueStatus === 'paid');

    // Revenue collected this month from marked-as-paid records
    const currentPeriod = renewalPeriodKey('plan-monthly');
    const collectedThisMonth = RENEWAL_RECORDS.filter(r => r.period === currentPeriod);

    function parseCents(priceStr) {
      const n = parseFloat((priceStr || '').replace(/[^0-9.]/g, ''));
      if (!n) return 0;
      if (/yr|year/i.test(priceStr)) return Math.round(n / 12 * 100);
      return Math.round(n * 100);
    }
    const collectedCents = collectedThisMonth.reduce((sum, r) => {
      const plan = MEMBERSHIP_PLANS.find(p => p.id === r.planId);
      return sum + parseCents(plan?.price);
    }, 0);
    const collectedStr = '€' + (collectedCents / 100).toFixed(0);

    // Expected MRR
    const mrrCents = rows.reduce((sum, r) => sum + parseCents(r.plan?.price), 0);
    const mrrStr2  = '€' + (mrrCents / 100).toFixed(0);
    const collPct  = mrrCents > 0 ? Math.round(collectedCents / mrrCents * 100) : 0;

    function studentBadge(r) {
      const belt = getBeltLevel(r.enr?.currentLevelId);
      return `
        <div style="display:flex;align-items:center;gap:10px">
          <div class="avatar" style="width:32px;height:32px;font-size:11px">${r.stu.initials}</div>
          <div>
            <a href="#/students/${r.stu.id}" style="font-weight:600;font-size:13px;color:var(--accent);text-decoration:none">${r.stu.name}</a>
            ${belt ? `<div style="font-size:11px;color:var(--text-muted)">${belt.label}</div>` : ''}
          </div>
        </div>`;
    }

    function planBadge(r) {
      const colors = {
        'plan-monthly':   ['#eff6ff','#2563eb'],
        'plan-unlimited': ['#f5f3ff','#7c3aed'],
        'plan-annual':    ['#fefce8','#b45309'],
      };
      const [bg, fg] = colors[r.planId] || ['#f3f4f6','#374151'];
      return `<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:${bg};color:${fg}">${r.plan?.label || r.planId}</span>`;
    }

    function actionBtns(r) {
      if (r.paid) {
        return `
          <span style="font-size:12px;color:#15803d;font-weight:600">✓ Paid</span>
          <button class="btn btn-secondary" style="font-size:11px;padding:2px 8px;margin-left:8px"
            onclick="unmarkRenewalPaid('${r.stu.id}')">Undo</button>`;
      }
      const email = r.stu.contact?.includes('@') ? r.stu.contact : null;
      const mailLink = email
        ? `<a href="mailto:${email}?subject=Membership renewal&body=Hi ${r.stu.name.split(' ')[0]},%0A%0AJust a quick reminder that your ${r.plan?.label || 'membership'} renewal is due.%0A%0AThanks!"
             style="font-size:11px;color:var(--accent);text-decoration:none;margin-left:8px">✉ Email</a>`
        : '';
      return `
        <button class="btn btn-primary" style="font-size:11px;padding:3px 12px"
          onclick="markRenewalPaid('${r.stu.id}')">✓ Mark paid</button>
        ${mailLink}`;
    }

    function sectionTable(title, sectionRows, color) {
      if (!sectionRows.length) return '';
      const tableRows = sectionRows.map(r => `
        <tr style="border-bottom:1px solid var(--border)">
          <td style="padding:var(--sp-3) var(--sp-4)">${studentBadge(r)}</td>
          <td style="padding:var(--sp-3) var(--sp-2)">${planBadge(r)}</td>
          <td style="padding:var(--sp-3) var(--sp-2);font-size:12px;color:var(--text-muted)">${r.plan?.price || '—'}</td>
          <td style="padding:var(--sp-3) var(--sp-2);font-size:12px;color:${color}">${r.dueLabel}</td>
          <td style="padding:var(--sp-3) var(--sp-4);text-align:right;white-space:nowrap">${actionBtns(r)}</td>
        </tr>`).join('');
      return `
        <div class="card" style="padding:0;overflow:hidden;margin-bottom:var(--sp-4)">
          <div style="font-size:13px;font-weight:700;padding:var(--sp-3) var(--sp-4);
            border-bottom:1px solid var(--border);color:${color}">
            ${title} <span style="font-size:12px;font-weight:400;color:var(--text-muted)">(${sectionRows.length})</span>
          </div>
          <div style="overflow-x:auto">
            <table style="width:100%;border-collapse:collapse;font-size:13px">
              <thead>
                <tr style="background:var(--surface-alt)">
                  <th style="text-align:left;padding:var(--sp-2) var(--sp-4);font-size:11px;font-weight:600;color:var(--text-muted)">Student</th>
                  <th style="text-align:left;padding:var(--sp-2) var(--sp-2);font-size:11px;font-weight:600;color:var(--text-muted)">Plan</th>
                  <th style="text-align:left;padding:var(--sp-2) var(--sp-2);font-size:11px;font-weight:600;color:var(--text-muted)">Amount</th>
                  <th style="text-align:left;padding:var(--sp-2) var(--sp-2);font-size:11px;font-weight:600;color:var(--text-muted)">Due date</th>
                  <th style="text-align:right;padding:var(--sp-2) var(--sp-4);font-size:11px;font-weight:600;color:var(--text-muted)">Action</th>
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        </div>`;
    }

    // Collection progress bar
    const progBar = `
      <div style="margin-top:var(--sp-2)">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:4px">
          <span>Collected ${collectedStr} of ${mrrStr2} expected</span><span>${collPct}%</span>
        </div>
        <div style="height:8px;border-radius:4px;background:var(--surface-alt);overflow:hidden">
          <div style="height:100%;width:${collPct}%;background:${collPct >= 80 ? '#16a34a' : collPct >= 50 ? '#d97706' : '#dc2626'};border-radius:4px;transition:width .4s"></div>
        </div>
      </div>`;

    return `
      <div style="max-width:960px;margin:0 auto">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4)">
          <div>
            <h1 class="h1" style="margin-bottom:var(--sp-1)">Renewal Tracker</h1>
            <p class="muted" style="font-size:13px">Track membership payments and follow up with members due for renewal.</p>
          </div>
        </div>

        <div class="stat-grid" style="margin-bottom:var(--sp-3)">
          <div class="stat-card" style="${overdue.length ? 'border-left:3px solid #dc2626' : ''}">
            <div class="stat-label">Overdue</div>
            <div class="stat-value" style="color:${overdue.length ? '#dc2626' : 'var(--text)'}">${overdue.length}</div>
          </div>
          <div class="stat-card" style="${due.length ? 'border-left:3px solid #d97706' : ''}">
            <div class="stat-label">Due now</div>
            <div class="stat-value" style="color:${due.length ? '#d97706' : 'var(--text)'}">${due.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Due soon</div>
            <div class="stat-value">${upcoming.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Paid this month</div>
            <div class="stat-value" style="color:#15803d">${paid.length}</div>
          </div>
        </div>

        <div class="card" style="margin-bottom:var(--sp-5);padding:var(--sp-4)">
          <div style="font-weight:600;font-size:14px;margin-bottom:var(--sp-2)">Monthly collection progress</div>
          ${progBar}
        </div>

        ${sectionTable('🔴 Overdue', overdue, '#dc2626')}
        ${sectionTable('🟡 Due now', due, '#d97706')}
        ${sectionTable('🕐 Upcoming', upcoming, 'var(--text-muted)')}
        ${sectionTable('✅ Paid this month', paid, '#15803d')}

        ${rows.length === 0 ? `<div class="card muted" style="text-align:center;padding:var(--sp-6)">No active students found.</div>` : ''}
      </div>`;
  }

  // ---------- Screen: New Student Onboarding Pipeline ----------------------
  // Tracks all students who joined in the last 90 days through 5 stages of
  // successful onboarding: Enrolled → Docs signed → First class → Regular → Established

  const ONBOARDING_STAGES = [
    { id: 'enrolled',   label: 'Enrolled',       icon: '📝', color: '#6b7280', desc: 'Added to the system' },
    { id: 'docs',       label: 'Docs signed',    icon: '📋', color: '#d97706', desc: 'All waivers complete' },
    { id: 'first',      label: 'First class',    icon: '🥋', color: '#2563eb', desc: 'Attended ≥1 class' },
    { id: 'regular',    label: 'Getting regular',icon: '🔥', color: '#9333ea', desc: 'Attended ≥3 classes' },
    { id: 'established',label: 'Established',    icon: '🏠', color: '#16a34a', desc: '30+ days, still active' },
  ];

  function _onboardingStage(s, enr) {
    const totalAttended = ATTENDANCE.filter(a => a.studentId === s.id && a.attended).length;
    const joinedDaysAgo = Math.floor((new Date(CONFIG.today) - new Date(s.joinedAt || enr?.joinedAt || CONFIG.today)) / 86400000);
    const docsOk = waiverComplete(s.id);

    // Last 30 days attendance
    const thirtyDaysAgo = new Date(CONFIG.today);
    thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
    const recentAttended = ATTENDANCE.filter(a => {
      if (a.studentId !== s.id || !a.attended) return false;
      const cls = DB.class(a.classId);
      return cls && new Date(cls.startsAt) >= thirtyDaysAgo;
    }).length;

    if (joinedDaysAgo >= 30 && totalAttended >= 3 && recentAttended >= 1) return 'established';
    if (totalAttended >= 3) return 'regular';
    if (totalAttended >= 1) return 'first';
    if (docsOk) return 'docs';
    return 'enrolled';
  }

  function OnboardingPipelineScreen() {
    const today = new Date(CONFIG.today);
    const ninetyDaysAgo = new Date(CONFIG.today);
    ninetyDaysAgo.setDate(ninetyDaysAgo.getDate() - 90);

    // Collect new students (joined in last 90 days, not inactive)
    const newStudents = STUDENTS.filter(s => {
      if (s.inactive) return false;
      const enr = ENROLLMENTS.find(e => e.studentId === s.id);
      const joinDate = s.joinedAt || enr?.joinedAt;
      if (!joinDate) return false;
      return new Date(joinDate) >= ninetyDaysAgo;
    }).map(s => {
      const enr = ENROLLMENTS.find(e => e.studentId === s.id);
      const joinDate = s.joinedAt || enr?.joinedAt;
      const daysAgo = Math.floor((today - new Date(joinDate)) / 86400000);
      const totalAttended = ATTENDANCE.filter(a => a.studentId === s.id && a.attended).length;
      const docsOk = waiverComplete(s.id);
      const stage = _onboardingStage(s, enr);
      const belt = enr ? getBeltLevel(enr.currentLevelId) : null;
      return { s, enr, joinDate, daysAgo, totalAttended, docsOk, stage, belt };
    }).sort((a, b) => a.daysAgo - b.daysAgo); // newest first

    // Stat counts per stage
    const byStage = {};
    ONBOARDING_STAGES.forEach(st => { byStage[st.id] = newStudents.filter(r => r.stage === st.id); });

    // Action-needed: enrolled with no docs + no classes after 7 days
    const needsAttention = newStudents.filter(r => r.stage === 'enrolled' && r.daysAgo >= 7);
    const neverTrained   = newStudents.filter(r => ['enrolled','docs'].includes(r.stage));

    // Stage header for pipeline columns
    function stageColumn(stageObj) {
      const items = byStage[stageObj.id] || [];
      if (items.length === 0) return `
        <div style="min-width:200px;max-width:240px;flex-shrink:0">
          <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px 8px 0 0;
               background:var(--surface-alt);border:1px solid var(--border);border-bottom:3px solid ${stageObj.color}">
            <span style="font-size:16px">${stageObj.icon}</span>
            <div>
              <div style="font-size:12px;font-weight:700;color:${stageObj.color}">${stageObj.label}</div>
              <div style="font-size:10px;color:var(--text-muted)">${stageObj.desc}</div>
            </div>
            <span style="margin-left:auto;font-size:12px;font-weight:700;color:var(--text-muted)">0</span>
          </div>
          <div style="padding:24px 12px;text-align:center;font-size:12px;color:var(--text-faint);
               border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:var(--surface)">
            None here
          </div>
        </div>`;

      const cards = items.map(r => {
        const attn = r.stage === 'enrolled' && r.daysAgo >= 7;
        const contact = r.s.contact ? `<div style="font-size:11px;color:var(--text-muted);margin-top:1px">${r.s.contact.slice(0,28)}${r.s.contact.length > 28 ? '…' : ''}</div>` : '';
        const docsBadge = r.docsOk
          ? `<span style="font-size:10px;color:#16a34a">📋 ✓</span>`
          : `<span style="font-size:10px;color:#dc2626">📋 ✗</span>`;
        const classBadge = `<span style="font-size:10px;color:var(--text-muted)">🥋 ${r.totalAttended}</span>`;
        const daysBadge = r.daysAgo === 0
          ? `<span style="font-size:10px;background:#eff6ff;color:#2563eb;padding:1px 6px;border-radius:10px">Today</span>`
          : `<span style="font-size:10px;color:var(--text-muted)">Day ${r.daysAgo}</span>`;
        return `
          <div style="background:var(--surface);border:1px solid ${attn ? '#fca5a5' : 'var(--border)'};
               border-left:3px solid ${stageObj.color};
               border-radius:6px;padding:10px 12px;margin-bottom:8px;
               ${attn ? 'background:#fff7f7;' : ''}">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <div class="avatar" style="width:28px;height:28px;font-size:10px;flex-shrink:0">${r.s.initials}</div>
              <div style="flex:1;min-width:0">
                <a href="#/students/${r.s.id}" style="font-weight:600;font-size:12px;color:var(--accent);text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.s.name}</a>
                ${contact}
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              ${r.belt ? `<span style="font-size:10px;background:${r.belt.color}22;color:${r.belt.color};padding:1px 6px;border-radius:10px;font-weight:600">${r.belt.label}</span>` : ''}
              ${daysBadge}
              ${docsBadge}
              ${classBadge}
              ${attn ? `<span style="font-size:10px;background:#fef2f2;color:#dc2626;padding:1px 6px;border-radius:10px;font-weight:600">⚠ Needs follow-up</span>` : ''}
            </div>
            <div style="display:flex;gap:8px;margin-top:8px">
              <a href="#/students/${r.s.id}" style="font-size:10px;color:var(--accent);text-decoration:none;padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface-alt)">Profile →</a>
              ${!r.docsOk ? `<a href="#/waivers" style="font-size:10px;color:#d97706;text-decoration:none;padding:2px 8px;border:1px solid #fcd34d;border-radius:4px;background:#fffbeb">Docs</a>` : ''}
              ${r.s.contact?.includes('@')
                ? `<a href="mailto:${r.s.contact}?subject=Welcome to ${ACADEMY.name}!&body=Hi ${r.s.name.split(' ')[0]},%0A%0AWelcome aboard! We%27re excited to have you training with us.%0A%0ASee you on the mat!%0A${ACADEMY.name}"
                     style="font-size:10px;color:var(--text-muted);text-decoration:none;padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface-alt)">✉</a>`
                : ''}
            </div>
          </div>`;
      }).join('');

      return `
        <div style="min-width:200px;max-width:240px;flex-shrink:0">
          <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px 8px 0 0;
               background:var(--surface-alt);border:1px solid var(--border);border-bottom:3px solid ${stageObj.color}">
            <span style="font-size:16px">${stageObj.icon}</span>
            <div>
              <div style="font-size:12px;font-weight:700;color:${stageObj.color}">${stageObj.label}</div>
              <div style="font-size:10px;color:var(--text-muted)">${stageObj.desc}</div>
            </div>
            <span style="margin-left:auto;font-size:13px;font-weight:700;color:${stageObj.color}">${items.length}</span>
          </div>
          <div style="padding:10px;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:var(--surface);min-height:80px">
            ${cards}
          </div>
        </div>`;
    }

    // Funnel progress bar across stages
    const totalNew = newStudents.length;
    const funnelBar = ONBOARDING_STAGES.map((st, i) => {
      const count = (byStage[st.id] || []).length;
      const pct = totalNew > 0 ? Math.round(count / totalNew * 100) : 0;
      return `
        <div style="flex:1;text-align:center">
          <div style="font-size:20px;font-weight:800;color:${st.color}">${count}</div>
          <div style="font-size:10px;font-weight:600;color:${st.color};margin-bottom:4px">${st.icon} ${st.label}</div>
          <div style="height:6px;border-radius:3px;background:${st.color}22;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${st.color};border-radius:3px;transition:width .4s"></div>
          </div>
          <div style="font-size:10px;color:var(--text-muted);margin-top:3px">${pct}%</div>
        </div>
        ${i < ONBOARDING_STAGES.length - 1 ? `<div style="font-size:16px;color:var(--text-faint);align-self:flex-start;margin-top:8px">›</div>` : ''}`;
    }).join('');

    return `
      <div style="max-width:1200px;margin:0 auto">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4)">
          <div>
            <h1 class="h1" style="margin-bottom:var(--sp-1)">🚀 Onboarding Pipeline</h1>
            <p class="muted" style="font-size:13px">Track new students (last 90 days) through their first weeks of training.</p>
          </div>
        </div>

        <!-- Stat cards -->
        <div class="stat-grid" style="margin-bottom:var(--sp-4)">
          <div class="stat-card">
            <div class="stat-label">New students (90d)</div>
            <div class="stat-value">${totalNew}</div>
          </div>
          <div class="stat-card" style="${neverTrained.length ? 'border-left:3px solid #2563eb' : ''}">
            <div class="stat-label">Yet to train</div>
            <div class="stat-value" style="color:${neverTrained.length ? '#2563eb' : 'var(--text)'}">${neverTrained.length}</div>
          </div>
          <div class="stat-card" style="${needsAttention.length ? 'border-left:3px solid #dc2626' : ''}">
            <div class="stat-label">Needs follow-up (7d+, no class)</div>
            <div class="stat-value" style="color:${needsAttention.length ? '#dc2626' : 'var(--text)'}">${needsAttention.length}</div>
          </div>
          <div class="stat-card" style="border-left:3px solid #16a34a">
            <div class="stat-label">Established (30d+)</div>
            <div class="stat-value" style="color:#16a34a">${(byStage['established'] || []).length}</div>
          </div>
        </div>

        ${totalNew === 0
          ? `<div class="card" style="text-align:center;padding:var(--sp-8)">
               <div style="font-size:48px;margin-bottom:var(--sp-3)">🚀</div>
               <div style="font-weight:600;font-size:16px;margin-bottom:var(--sp-2)">No new students in the last 90 days</div>
               <p class="muted" style="font-size:13px">When students join, they'll appear here so you can track their progress.</p>
               <a href="#/prospects" style="display:inline-block;margin-top:var(--sp-4)" class="btn">View Prospects →</a>
             </div>`
          : `<!-- Funnel summary bar -->
             <div class="card" style="margin-bottom:var(--sp-5);padding:var(--sp-4)">
               <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:var(--sp-3)">Onboarding funnel · last 90 days</div>
               <div style="display:flex;align-items:flex-start;gap:8px">${funnelBar}</div>
             </div>

             <!-- Kanban pipeline -->
             <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:var(--sp-4);align-items:flex-start">
               ${ONBOARDING_STAGES.map(stageColumn).join('')}
             </div>`}
      </div>
    `;
  }

  // ---------- Holiday / Closure Calendar ------------------------------------

  const CLOSURES_KEY = 'tatami_closures';
  // Schema: { id, date: 'YYYY-MM-DD', label }
  let CLOSURES = [
    { id: 'cl-1', date: '2026-07-04', label: 'Independence Day (gym closed)' },
    { id: 'cl-2', date: '2026-08-15', label: 'Summer break — week 1 start' },
    { id: 'cl-3', date: '2026-08-16', label: 'Summer break — week 1' },
    { id: 'cl-4', date: '2026-08-17', label: 'Summer break — week 1' },
    { id: 'cl-5', date: '2026-08-18', label: 'Summer break — week 1' },
    { id: 'cl-6', date: '2026-08-19', label: 'Summer break — week 1' },
    { id: 'cl-7', date: '2026-12-25', label: 'Christmas Day' },
    { id: 'cl-8', date: '2026-12-26', label: 'Boxing Day' },
  ];

  function loadClosures() {
    try {
      const saved = JSON.parse(localStorage.getItem(CLOSURES_KEY));
      if (Array.isArray(saved)) CLOSURES = saved;
    } catch {}
  }
  function saveClosures() {
    try { localStorage.setItem(CLOSURES_KEY, JSON.stringify(CLOSURES)); } catch {}
  }

  /** Returns true if the given 'YYYY-MM-DD' string is a closure day */
  function isClosure(dateStr) {
    return CLOSURES.some(c => c.date === dateStr);
  }

  /** Returns the closure label for a date, or null */
  function closureLabel(dateStr) {
    return CLOSURES.find(c => c.date === dateStr)?.label || null;
  }

  // Closure form state
  let _closureDate = '';
  let _closureLabel = '';
  let _closureEditId = null;

  function addClosure() {
    const d = (document.getElementById('closure-date') || {}).value;
    const l = (document.getElementById('closure-label') || {}).value.trim();
    if (!d) { alert('Please select a date.'); return; }
    if (!l) { alert('Please enter a label.'); return; }
    CLOSURES.push({ id: 'cl-' + Date.now(), date: d, label: l });
    CLOSURES.sort((a, b) => a.date.localeCompare(b.date));
    saveClosures();
    _closureDate = '';
    _closureLabel = '';
    document.getElementById('content').innerHTML = ClosuresScreen();
  }

  function deleteClosure(id) {
    CLOSURES = CLOSURES.filter(c => c.id !== id);
    saveClosures();
    document.getElementById('content').innerHTML = ClosuresScreen();
  }

  function openClosureEdit(id) {
    _closureEditId = id;
    document.getElementById('content').innerHTML = ClosuresScreen();
  }

  function saveClosureEdit(id) {
    const d = (document.getElementById('edit-closure-date-' + id) || {}).value;
    const l = (document.getElementById('edit-closure-label-' + id) || {}).value.trim();
    if (!d || !l) { alert('Date and label are required.'); return; }
    const c = CLOSURES.find(x => x.id === id);
    if (c) { c.date = d; c.label = l; }
    CLOSURES.sort((a, b) => a.date.localeCompare(b.date));
    saveClosures();
    _closureEditId = null;
    document.getElementById('content').innerHTML = ClosuresScreen();
  }

  function ClosuresScreen() {
    const today = new Date().toISOString().slice(0, 10);
    const upcoming = CLOSURES.filter(c => c.date >= today);
    const past     = CLOSURES.filter(c => c.date < today);

    // Count real CLASSES that land on a closure date
    const affectedClasses = CLASSES.filter(c => {
      const dateStr = new Date(c.startsAt).toISOString().slice(0, 10);
      return isClosure(dateStr) && c.status === 'scheduled';
    });

    function closureRow(c) {
      const isPast = c.date < today;
      const dObj = new Date(c.date + 'T00:00:00');
      const dateFmt = dObj.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      const clsOnDay = CLASSES.filter(x => new Date(x.startsAt).toISOString().slice(0,10) === c.date && x.status === 'scheduled').length;

      if (_closureEditId === c.id) {
        return `
          <tr>
            <td colspan="4" style="padding:var(--sp-3);background:var(--surface-alt)">
              <div style="display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap">
                <input id="edit-closure-date-${c.id}" type="date" class="form-input" value="${c.date}" style="width:160px">
                <input id="edit-closure-label-${c.id}" type="text" class="form-input" value="${c.label}" placeholder="Label" style="flex:1;min-width:160px">
                <button class="btn btn-primary" onclick="saveClosureEdit('${c.id}')">Save</button>
                <button class="btn btn-secondary" onclick="_closureEditId=null;document.getElementById('content').innerHTML=ClosuresScreen()">Cancel</button>
              </div>
            </td>
          </tr>`;
      }

      return `
        <tr style="${isPast ? 'opacity:0.55' : ''}">
          <td style="padding:var(--sp-2) var(--sp-3);font-weight:600;white-space:nowrap">
            ${isPast ? '' : '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:6px"></span>'}
            ${dateFmt}
          </td>
          <td style="padding:var(--sp-2) var(--sp-3)">${c.label}</td>
          <td style="padding:var(--sp-2) var(--sp-3);text-align:center">
            ${clsOnDay > 0
              ? `<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:#fef2f2;color:var(--danger)">${clsOnDay} class${clsOnDay !== 1 ? 'es' : ''} affected</span>`
              : `<span style="font-size:11px;color:var(--text-faint)">—</span>`}
          </td>
          <td style="padding:var(--sp-2) var(--sp-3);text-align:right;white-space:nowrap">
            <button class="btn btn-secondary" style="padding:3px 10px;font-size:12px" onclick="openClosureEdit('${c.id}')">✏</button>
            <button class="btn btn-secondary" style="padding:3px 10px;font-size:12px;color:var(--danger)" onclick="if(confirm('Delete this closure?'))deleteClosure('${c.id}')">✕</button>
          </td>
        </tr>`;
    }

    return `
      <div class="row-between" style="margin-bottom:var(--sp-4)">
        <h1 class="h1">🗓 Holiday Calendar</h1>
      </div>

      <!-- Stat cards -->
      <div class="row" style="gap:var(--sp-4);margin-bottom:var(--sp-4);flex-wrap:wrap">
        ${StatCard('🗓', 'Upcoming closures', upcoming.length, 'days marked closed', '')}
        ${StatCard('⚠', 'Scheduled classes affected', affectedClasses.length, 'on closure dates', '')}
        ${StatCard('📅', 'Past closures this record', past.length, 'historical', '')}
        ${StatCard('📋', 'Total days recorded', CLOSURES.length, 'all time', '')}
      </div>

      ${affectedClasses.length > 0 ? `
        <div class="card" style="margin-bottom:var(--sp-4);padding:var(--sp-4);border-left:3px solid var(--danger);background:#fef2f2">
          <div style="font-weight:700;margin-bottom:var(--sp-2)">⚠ ${affectedClasses.length} scheduled class${affectedClasses.length !== 1 ? 'es fall' : ' falls'} on a closure day</div>
          <div style="font-size:13px;color:var(--text-muted)">These classes were generated before the closure was added. Consider cancelling them or checking the schedule.</div>
          <div style="margin-top:var(--sp-2)">
            ${affectedClasses.map(c => {
              const dateStr = new Date(c.startsAt).toISOString().slice(0,10);
              const dFmt = new Date(c.startsAt).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
              const timeStr = new Date(c.startsAt).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
              return `<div style="font-size:12px;padding:2px 0">
                <a onclick="go('classes/${c.id}')" style="cursor:pointer;color:var(--accent)">${dFmt} ${timeStr} · ${c.classType}</a>
                <span style="color:var(--text-muted);margin-left:6px">— ${closureLabel(dateStr)}</span>
              </div>`;
            }).join('')}
          </div>
        </div>` : ''}

      <!-- Add new closure -->
      <div class="card" style="margin-bottom:var(--sp-4);padding:var(--sp-4)">
        <div style="font-weight:600;margin-bottom:var(--sp-3)">+ Add closure / holiday</div>
        <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:flex-end">
          <div>
            <div style="font-size:12px;font-weight:600;margin-bottom:4px">Date</div>
            <input id="closure-date" type="date" class="form-input" style="width:160px" min="${today}">
          </div>
          <div style="flex:1;min-width:200px">
            <div style="font-size:12px;font-weight:600;margin-bottom:4px">Label</div>
            <input id="closure-label" type="text" class="form-input" placeholder="e.g. Christmas Day, Summer Camp, Bank Holiday…">
          </div>
          <button class="btn btn-primary" onclick="addClosure()">Add closure</button>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:var(--sp-2)">
          Tip: class generation will skip dates marked as closures, and the schedule will show a banner on those days.
        </div>
      </div>

      <!-- Upcoming closures table -->
      ${upcoming.length > 0 ? `
        <div class="card" style="margin-bottom:var(--sp-4);overflow:hidden">
          <div style="font-weight:600;padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border)">Upcoming closures (${upcoming.length})</div>
          <table style="width:100%;border-collapse:collapse">
            <thead>
              <tr style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-muted);background:var(--surface-alt)">
                <th style="padding:var(--sp-2) var(--sp-3);text-align:left">Date</th>
                <th style="padding:var(--sp-2) var(--sp-3);text-align:left">Label</th>
                <th style="padding:var(--sp-2) var(--sp-3);text-align:center">Classes</th>
                <th style="padding:var(--sp-2) var(--sp-3);text-align:right"></th>
              </tr>
            </thead>
            <tbody>
              ${upcoming.map(closureRow).join('')}
            </tbody>
          </table>
        </div>` : `<div class="card" style="padding:var(--sp-5);text-align:center;color:var(--text-muted)">No upcoming closures recorded.</div>`}

      <!-- Past closures -->
      ${past.length > 0 ? `
        <details style="margin-bottom:var(--sp-4)">
          <summary style="cursor:pointer;font-size:13px;font-weight:600;color:var(--text-muted);padding:var(--sp-2) 0">Past closures (${past.length})</summary>
          <div class="card" style="margin-top:var(--sp-2);overflow:hidden">
            <table style="width:100%;border-collapse:collapse">
              <tbody>${past.slice().reverse().map(closureRow).join('')}</tbody>
            </table>
          </div>
        </details>` : ''}
    `;
  }

  // ---------- Dark mode -----------------------------------------------------

  const THEME_KEY = 'tatami_theme';
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
  }
  function loadTheme() {
    const saved = localStorage.getItem(THEME_KEY) || 'light';
    applyTheme(saved);
  }
  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem(THEME_KEY, next);
    // Update button icon in-place
    const btn = document.getElementById('theme-toggle-btn');
    if (btn) btn.textContent = next === 'dark' ? '☀' : '☾';
  }

  // ---------- Boot ----------------------------------------------------------

  loadTheme();
  loadPersistedData(); // overrides seed arrays if localStorage has data
  loadEquipment();
  loadClosures();
  loadPersistedPromotionRules();
  loadGradingSessions();
  loadObjectives();
  loadSessionNotes();
  loadStudentNotes();
  loadStudentInjuries();
  loadRetentionFlags();
  loadRetentionContacts();
  loadClassRatings();
  loadStudentMastery();
  loadHomework();
  loadGoals();
  loadWaiverDocs();
  loadWaivers();
  loadPrivateLessons();
  loadFamilyGroups();
  loadPackages();
  loadExpenses();
  loadPayRates();
  loadRenewalRecords();
  loadCommLog();
  loadMembershipPlans();
  applyOrgSetup();
  renderApp();
  </script>
</body>
</html>

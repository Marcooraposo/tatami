  function EventDetail(evtId) {
    const evt = EVENTS.find(e => e.id === evtId);
    if (!evt) return `<div class="muted">Event not found.</div>`;

    const et = _evtType(evt.type);
    const registered = evt.registeredStudentIds
      .map(id => STUDENTS.find(s => s.id === id))
      .filter(Boolean);

    const spotsLeft = evt.capacity
      ? evt.capacity - registered.length
      : null;

    const isFull = evt.capacity && registered.length >= evt.capacity;

    // Students not yet registered
    const notRegistered = STUDENTS.filter(s => !evt.registeredStudentIds.includes(s.id));

    const durationLabel = evt.durationMin >= 60
      ? `${Math.floor(evt.durationMin / 60)}h${evt.durationMin % 60 ? ' ' + (evt.durationMin % 60) + 'min' : ''}`
      : `${evt.durationMin}min`;

    const registeredRows = registered.length === 0
      ? `<div class="muted" style="padding:var(--sp-3) 0">No students registered yet.</div>`
      : registered.map(s => {
          const enr  = ENROLLMENTS.find(e => e.studentId === s.id);
          const belt = enr ? BeltChip(enr.currentLevelId, enr.sportId) : '';
          return `
            <div style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0;border-bottom:1px solid var(--border)">
              <div style="width:32px;height:32px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:13px;flex-shrink:0">
                ${s.name.charAt(0)}
              </div>
              <div style="flex:1">
                <a href="#/students/${s.id}" style="font-weight:600;font-size:14px;color:var(--accent);text-decoration:none">${s.name}</a>
                <div style="margin-top:2px">${belt}</div>
              </div>
              <button class="btn btn-sm" style="color:var(--danger)" onclick="unregisterStudentFromEvent('${evtId}','${s.id}')">Remove</button>
            </div>`;
        }).join('');

    const addStudentRows = isFull
      ? `<div class="muted" style="padding:var(--sp-3) 0">Event is at capacity (${evt.capacity}).</div>`
      : notRegistered.length === 0
        ? `<div class="muted" style="padding:var(--sp-3) 0">All students already registered.</div>`
        : notRegistered.map(s => {
            const enr  = ENROLLMENTS.find(e => e.studentId === s.id);
            const belt = enr ? BeltChip(enr.currentLevelId, enr.sportId) : '';
            return `
              <div style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0;border-bottom:1px solid var(--border)">
                <div style="width:32px;height:32px;background:var(--surface-alt);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-weight:700;font-size:13px;flex-shrink:0">
                  ${s.name.charAt(0)}
                </div>
                <div style="flex:1">
                  <span style="font-weight:600;font-size:14px">${s.name}</span>
                  <div style="margin-top:2px">${belt}</div>
                </div>
                <button class="btn btn-sm btn-primary" onclick="registerStudentToEvent('${evtId}','${s.id}')">+ Register</button>
              </div>`;
          }).join('');

    return `
      <div style="max-width:700px">
        <div class="row-between" style="margin-bottom:var(--sp-5)">
          <button class="btn" onclick="go('events')">← Events</button>
          <button class="btn btn-sm" style="color:var(--danger)" onclick="deleteEvent('${evtId}')">Delete</button>
        </div>

        <div class="card" style="margin-bottom:var(--sp-4)">
          <div style="display:flex;align-items:flex-start;gap:var(--sp-4);flex-wrap:wrap">
            <div style="font-size:40px;line-height:1">${et.icon}</div>
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-2)">
                <h1 class="h1" style="margin:0">${evt.title}</h1>
                <span class="tag" style="background:${et.color}1a;color:${et.color};font-size:12px;font-weight:700">${et.label}</span>
              </div>
              <div style="display:flex;gap:var(--sp-4);flex-wrap:wrap;font-size:13px;color:var(--text-muted)">
                <span>📅 ${evt.date}${evt.time ? ' · ' + evt.time : ''}</span>
                <span>⏱ ${durationLabel}</span>
                ${evt.location ? `<span>📍 ${evt.location}</span>` : ''}
                ${evt.capacity ? `<span>👥 ${registered.length}/${evt.capacity} registered</span>` : `<span>👥 ${registered.length} registered</span>`}
              </div>
              ${evt.notes ? `<div style="margin-top:var(--sp-3);font-size:13px;color:var(--text-body);white-space:pre-wrap">${evt.notes}</div>` : ''}
            </div>
          </div>
        </div>

        <div class="card" style="margin-bottom:var(--sp-4)">
          <h3 class="card-title" style="margin-bottom:var(--sp-4)">
            Registered students (${registered.length}${evt.capacity ? '/' + evt.capacity : ''})
            ${spotsLeft !== null ? `<span class="faint" style="font-size:12px;font-weight:400;margin-left:var(--sp-2)">${spotsLeft} spot${spotsLeft !== 1 ? 's' : ''} left</span>` : ''}
          </h3>
          ${registeredRows}
        </div>

        ${evt.type === 'tournament' ? (() => {
          const today = new Date().toISOString().slice(0, 10);
          const isPast = evt.date < today;
          const evtResults = COMPETITION_RESULTS.filter(r => r.eventId === evtId)
            .sort((a, b) => a.loggedAt.localeCompare(b.loggedAt));
          const resultRows = evtResults.length === 0
            ? `<div class="muted" style="padding:var(--sp-3) 0">No results logged yet.</div>`
            : evtResults.map(r => {
                const stu = STUDENTS.find(s => s.id === r.studentId);
                return `
                  <div style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0;border-bottom:1px solid var(--border)">
                    <div style="font-size:22px;line-height:1;flex-shrink:0">${_medalEmoji(r.medal)}</div>
                    <div style="flex:1;min-width:0">
                      <div style="display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap">
                        <a href="#/students/${r.studentId}" style="font-weight:600;font-size:14px;color:var(--accent);text-decoration:none">${stu ? stu.name : r.studentId}</a>
                        <span style="font-size:12px;font-weight:700;color:${_placementColor(r.medal)}">${r.placement}</span>
                        <span style="font-size:12px;color:var(--text-muted)">${r.division}</span>
                      </div>
                      ${r.notes ? `<div style="font-size:12px;color:var(--text-muted);font-style:italic;margin-top:2px">${r.notes}</div>` : ''}
                    </div>
                    <button class="btn btn-sm" style="color:var(--danger)" onclick="deleteCompResult('${r.id}','${evtId}')">×</button>
                  </div>`;
              }).join('');
          const addResultForm = `
            <div style="margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--border)">
              <div style="font-size:13px;font-weight:600;margin-bottom:var(--sp-3);color:var(--text-muted)">Log a result</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-3)">
                <select id="cr-student-${evtId}" class="input" style="font-size:13px">
                  <option value="">— Student —</option>
                  ${registered.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                </select>
                <select id="cr-placement-${evtId}" class="input" style="font-size:13px">
                  <option value="">— Placement —</option>
                  <option value="1st">🥇 1st</option>
                  <option value="2nd">🥈 2nd</option>
                  <option value="3rd">🥉 3rd</option>
                  <option value="5th">5th</option>
                  <option value="DNP">DNP</option>
                </select>
              </div>
              <input id="cr-division-${evtId}" class="input" style="width:100%;margin-bottom:var(--sp-3);font-size:13px" placeholder="Division (e.g. Adult White Belt -70kg)">
              <input id="cr-notes-${evtId}" class="input" style="width:100%;margin-bottom:var(--sp-3);font-size:13px" placeholder="Notes (optional)">
              <button class="btn btn-primary" onclick="logCompResult('${evtId}')">+ Log result</button>
            </div>`;
          return `
            <div class="card" style="margin-bottom:var(--sp-4)">
              <div class="row-between" style="margin-bottom:var(--sp-4)">
                <h3 class="card-title" style="margin:0">🏆 Competition results (${evtResults.length})</h3>
                ${evtResults.filter(r=>r.medal==='gold').length ? `<span style="font-size:13px">🥇 ${evtResults.filter(r=>r.medal==='gold').length} · 🥈 ${evtResults.filter(r=>r.medal==='silver').length} · 🥉 ${evtResults.filter(r=>r.medal==='bronze').length}</span>` : ''}
              </div>
              ${resultRows}
              ${addResultForm}
            </div>`;
        })() : ''}

        <div class="card">
          <h3 class="card-title" style="margin-bottom:var(--sp-4)">Add students</h3>
          ${addStudentRows}
        </div>
      </div>
    `;
  }

  function EventsList() {
    const today = new Date().toISOString().slice(0, 10);
    const upcoming = EVENTS.filter(e => e.date >= today).sort((a, b) => a.date.localeCompare(b.date));
    const past     = EVENTS.filter(e => e.date <  today).sort((a, b) => b.date.localeCompare(a.date));

    const totalRegistrations = EVENTS.reduce((n, e) => n + e.registeredStudentIds.length, 0);

    function EvtCard(evt) {
      const et = _evtType(evt.type);
      const regCount = evt.registeredStudentIds.length;
      const isFull   = evt.capacity && regCount >= evt.capacity;
      const isPast   = evt.date < today;
      return `
        <div class="card" style="margin-bottom:var(--sp-3);cursor:pointer;${isPast ? 'opacity:0.65' : ''}"
             onclick="go('events/${evt.id}')">
          <div style="display:flex;align-items:center;gap:var(--sp-4)">
            <div style="font-size:32px;line-height:1;flex-shrink:0">${et.icon}</div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:4px">
                <span style="font-weight:700;font-size:15px">${evt.title}</span>
                <span class="tag" style="background:${et.color}1a;color:${et.color};font-size:11px">${et.label}</span>
                ${isFull ? `<span class="tag" style="background:#fef3c7;color:#92400e;font-size:11px">Full</span>` : ''}
              </div>
              <div style="font-size:13px;color:var(--text-muted);display:flex;gap:var(--sp-3);flex-wrap:wrap">
                <span>📅 ${evt.date}${evt.time ? ' · ' + evt.time : ''}</span>
                ${evt.location ? `<span>📍 ${evt.location}</span>` : ''}
                <span>👥 ${regCount}${evt.capacity ? '/' + evt.capacity : ''} registered</span>
              </div>
            </div>
            <div style="font-size:20px;color:var(--text-muted);flex-shrink:0">›</div>
          </div>
        </div>`;
    }

    const upcomingHtml = upcoming.length === 0
      ? `<div class="muted" style="padding:var(--sp-3) 0">No upcoming events. Create one above.</div>`
      : upcoming.map(EvtCard).join('');

    const pastHtml = past.length === 0 ? '' : `
      <div style="margin-top:var(--sp-6)">
        <h2 class="h2" style="margin-bottom:var(--sp-3)">Past</h2>
        ${past.map(EvtCard).join('')}
      </div>`;

    return `
      <div class="row-between" style="margin-bottom:var(--sp-5)">
        <h1 class="h1">Events</h1>
        <button class="btn btn-primary" onclick="go('events/new')">+ New event</button>
      </div>

      <div style="display:flex;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-6)">
        <div class="card" style="flex:1;min-width:120px">
          <div style="font-size:22px;margin-bottom:var(--sp-1)">📅</div>
          <div style="font-size:28px;font-weight:700">${upcoming.length}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Upcoming</div>
        </div>
        <div class="card" style="flex:1;min-width:120px">
          <div style="font-size:22px;margin-bottom:var(--sp-1)">🗂</div>
          <div style="font-size:28px;font-weight:700">${past.length}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Past</div>
        </div>
        <div class="card" style="flex:1;min-width:120px">
          <div style="font-size:22px;margin-bottom:var(--sp-1)">👥</div>
          <div style="font-size:28px;font-weight:700">${totalRegistrations}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Registrations</div>
        </div>
        <div class="card" style="flex:1;min-width:120px">
          <div style="font-size:22px;margin-bottom:var(--sp-1)">🏆</div>
          <div style="font-size:28px;font-weight:700">${EVENTS.filter(e=>e.type==='tournament').length}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Tournaments</div>
        </div>
      </div>

      <h2 class="h2" style="margin-bottom:var(--sp-3)">Upcoming</h2>
      ${upcomingHtml}
      ${pastHtml}
    `;
  }

  // ---------- Goals ---------------------------------------------------------

  const GOALS_KEY = 'tatami_goals_v1';
  let GOALS = {
    revenueTarget:    500,   // monthly €
    newStudentsTarget: 3,    // per month
    retentionTarget:   80,   // % attended in last 30 days
    promotionsTarget:  4,    // per quarter
    fillRateTarget:    70    // % avg class fill rate
  };

  function loadGoals() {
    try {
      const saved = JSON.parse(localStorage.getItem(GOALS_KEY));
      if (saved) GOALS = Object.assign({}, GOALS, saved);
    } catch {}
  }

  function saveGoals() {
    try { localStorage.setItem(GOALS_KEY, JSON.stringify(GOALS)); } catch {}
  }

  function updateGoal(field) {
    const el = document.getElementById('goal-' + field);
    const val = parseFloat(el?.value);
    if (!isNaN(val) && val >= 0) { GOALS[field] = val; saveGoals(); }
    document.getElementById('content').innerHTML = GoalsScreen();
  }

  function GoalsScreen() {
    const today = new Date(CONFIG.today);
    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1).toISOString();

    // --- Actuals ---
    // 1. MRR
    function parseMonthlyCents2(priceStr) {
      const num = parseFloat((priceStr || '').replace(/[^0-9.]/g, ''));
      if (!num) return 0;
      if (/yr|year/i.test(priceStr)) return Math.round((num / 12) * 100);
      return Math.round(num * 100);
    }
    const planMap = {};
    MEMBERSHIP_PLANS.forEach(p => { planMap[p.id] = parseMonthlyCents2(p.price); });
    const mrrCents = ENROLLMENTS.reduce((sum, e) => sum + (planMap[e.membership] || 0), 0);
    const actualRevenue = Math.round(mrrCents / 100);

    // 2. New students this month
    const newThisMonth = STUDENTS.filter(s => s.joinedAt && s.joinedAt >= monthStart).length;

    // 3. Retention: students who attended at least once in last 30 days
    const thirtyDaysAgo = new Date(today.getTime() - 30 * 86400000).toISOString();
    const recentAttenders = new Set(
      ATTENDANCE.filter(a => {
        if (!a.attended) return false;
        const cls = CLASSES.find(c => c.id === a.classId);
        return cls && cls.startsAt >= thirtyDaysAgo;
      }).map(a => a.studentId)
    );
    const activeStudents = STUDENTS.filter(s => !s.inactive);
    const actualRetention = activeStudents.length
      ? Math.round((recentAttenders.size / activeStudents.length) * 100)
      : 0;

    // 4. Promotions this quarter
    const qStart = new Date(today.getFullYear(), Math.floor(today.getMonth() / 3) * 3, 1).toISOString();
    const promoThisQtr = (GRADING_SESSIONS || []).reduce((sum, sess) => {
      if (sess.date && sess.date >= qStart) return sum + (sess.students?.length || 0);
      return sum;
    }, 0);

    // 5. Avg fill rate (last 30 classes)
    const recentClasses = CLASSES.filter(c => c.status === 'completed' || c.startsAt < today.toISOString())
      .slice(-30);
    const avgFill = recentClasses.length
      ? Math.round(recentClasses.reduce((sum, c) => {
          const booked = BOOKINGS.filter(b => b.classId === c.id && b.status === 'booked').length;
          return sum + (c.capacity ? Math.round((booked / c.capacity) * 100) : 0);
        }, 0) / recentClasses.length)
      : 0;

    const goals = [
      {
        id: 'revenueTarget',
        label: 'Monthly Revenue',
        icon: '💰',
        unit: '€',
        unitPos: 'pre',
        actual: actualRevenue,
        target: GOALS.revenueTarget,
        desc: 'Current MRR vs monthly revenue target',
        color: 'var(--accent)'
      },
      {
        id: 'newStudentsTarget',
        label: 'New Students This Month',
        icon: '🧑',
        unit: '',
        unitPos: 'post',
        actual: newThisMonth,
        target: GOALS.newStudentsTarget,
        desc: 'Students who joined this calendar month',
        color: '#10b981'
      },
      {
        id: 'retentionTarget',
        label: 'Retention Rate',
        icon: '🔄',
        unit: '%',
        unitPos: 'post',
        actual: actualRetention,
        target: GOALS.retentionTarget,
        desc: 'Active students who attended in the last 30 days',
        color: '#8b5cf6'
      },
      {
        id: 'promotionsTarget',
        label: 'Belt Promotions This Quarter',
        icon: '★',
        unit: '',
        unitPos: 'post',
        actual: promoThisQtr,
        target: GOALS.promotionsTarget,
        desc: 'Students promoted via grading sessions this quarter',
        color: '#f59e0b'
      },
      {
        id: 'fillRateTarget',
        label: 'Avg Class Fill Rate',
        icon: '◷',
        unit: '%',
        unitPos: 'post',
        actual: avgFill,
        target: GOALS.fillRateTarget,
        desc: 'Average fill rate across last 30 classes',
        color: '#ef4444'
      }
    ];

    function GoalCard(g) {
      const pct     = g.target > 0 ? Math.min(100, Math.round((g.actual / g.target) * 100)) : 0;
      const onTrack = pct >= 100;
      const close   = pct >= 80 && pct < 100;
      const badge   = onTrack
        ? `<span style="background:#d1fae5;color:#065f46;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700">✓ On track</span>`
        : close
          ? `<span style="background:#fef3c7;color:#92400e;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700">Almost there</span>`
          : `<span style="background:#fee2e2;color:#991b1b;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700">Needs attention</span>`;
      const actualFmt = g.unitPos === 'pre' ? g.unit + g.actual : g.actual + g.unit;
      const targetFmt = g.unitPos === 'pre' ? g.unit + g.target : g.target + g.unit;
      return `
        <div class="card" style="margin-bottom:var(--sp-3)">
          <div style="display:flex;align-items:flex-start;gap:var(--sp-3)">
            <div style="font-size:26px;line-height:1;padding-top:2px">${g.icon}</div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:var(--sp-2);margin-bottom:4px;flex-wrap:wrap">
                <div style="font-weight:700;font-size:15px">${g.label}</div>
                ${badge}
              </div>
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:var(--sp-2)">${g.desc}</div>
              <div style="display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-2)">
                <div>
                  <div style="font-size:28px;font-weight:800;color:${onTrack ? '#065f46' : 'var(--text-body)'};line-height:1">${actualFmt}</div>
                  <div style="font-size:11px;color:var(--text-muted)">actual</div>
                </div>
                <div style="color:var(--text-faint);font-size:22px;font-weight:300">/</div>
                <div>
                  <div style="font-size:22px;font-weight:700;color:var(--text-muted);line-height:1">${targetFmt}</div>
                  <div style="font-size:11px;color:var(--text-muted)">target</div>
                </div>
                <div style="flex:1;margin-left:var(--sp-2)">
                  <div style="background:var(--surface-alt);border-radius:6px;height:10px;overflow:hidden">
                    <div style="width:${pct}%;height:100%;background:${onTrack ? '#10b981' : close ? '#f59e0b' : g.color};border-radius:6px;transition:width .4s"></div>
                  </div>
                  <div style="font-size:11px;color:var(--text-muted);margin-top:3px;text-align:right">${pct}%</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-1)">
                <label style="font-size:12px;color:var(--text-muted);white-space:nowrap">Set target:</label>
                <input id="goal-${g.id}" type="number" min="0" value="${g.target}"
                  style="width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--text-body)"
                  onkeydown="if(event.key==='Enter')updateGoal('${g.id}')">
                <button class="btn btn-sm" onclick="updateGoal('${g.id}')">Save</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    // Summary stat cards
    const onTrackCount  = goals.filter(g => g.target > 0 && (g.actual / g.target) >= 1).length;
    const closeCount    = goals.filter(g => g.target > 0 && (g.actual / g.target) >= 0.8 && (g.actual / g.target) < 1).length;
    const behindCount   = goals.filter(g => g.target > 0 && (g.actual / g.target) < 0.8).length;

    return `
      <div style="max-width:720px">
        <div style="margin-bottom:var(--sp-4)">
          <h2 style="margin:0;font-size:22px">Goals</h2>
          <div style="font-size:13px;color:var(--text-muted);margin-top:2px">Track academy performance against your targets · ${today.toLocaleDateString('en', { month: 'long', year: 'numeric' })}</div>
        </div>

        <div class="stat-grid" style="margin-bottom:var(--sp-4)">
          <div class="stat-card">
            <div class="stat-value" style="color:#065f46">${onTrackCount}</div>
            <div class="stat-label">On track</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:#92400e">${closeCount}</div>
            <div class="stat-label">Almost there</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:#991b1b">${behindCount}</div>
            <div class="stat-label">Needs attention</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${goals.length}</div>
            <div class="stat-label">Total goals</div>
          </div>
        </div>

        ${goals.map(g => GoalCard(g)).join('')}
      </div>`;
  }

  // ---------- Discount Codes -------------------------------------------------

  let _discountDraft = null; // null = form closed, {} = new, {id,...} = editing

  function _discountStatus(dc) {
    const today = new Date().toISOString().slice(0, 10);
    if (!dc.active) return 'inactive';
    if (dc.maxUses !== null && dc.uses >= dc.maxUses) return 'maxed';
    if (dc.expiresAt && dc.expiresAt < today) return 'expired';
    if (dc.expiresAt) {
      const daysLeft = Math.ceil((new Date(dc.expiresAt) - new Date()) / 86400000);
      if (daysLeft <= 14) return 'expiring';
    }
    return 'active';
  }

  function _discountStatusBadge(status) {
    const map = {
      active:   ['Active',          'var(--success)',       '#fff'],
      expiring: ['Expiring soon',   '#f59e0b',             '#fff'],
      maxed:    ['Max uses reached', '#6366f1',            '#fff'],
      expired:  ['Expired',          'var(--muted)',        '#fff'],
      inactive: ['Inactive',         'var(--surface-alt)', 'var(--muted)'],
    };
    const [label, bg, fg] = map[status] || map.inactive;
    return `<span style="background:${bg};color:${fg};padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600">${label}</span>`;
  }

  function openDiscountForm(dc) {
    _discountDraft = dc
      ? { id: dc.id, code: dc.code, type: dc.type, value: dc.value, maxUses: dc.maxUses, expiresAt: dc.expiresAt || '', note: dc.note || '', active: dc.active }
      : { id: null, code: '', type: 'percent', value: '', maxUses: '', expiresAt: '', note: '', active: true };
    document.getElementById('content').innerHTML = DiscountsScreen();
  }

  function cancelDiscountForm() {
    _discountDraft = null;
    document.getElementById('content').innerHTML = DiscountsScreen();
  }

  function saveDiscountDraft() {
    const code = (document.getElementById('dc-code').value || '').trim().toUpperCase();
    const type = document.getElementById('dc-type').value;
    const value = parseFloat(document.getElementById('dc-value').value);
    const maxUses = document.getElementById('dc-maxuses').value ? parseInt(document.getElementById('dc-maxuses').value) : null;
    const expiresAt = document.getElementById('dc-expires').value || null;
    const note = (document.getElementById('dc-note').value || '').trim();
    const active = document.getElementById('dc-active').checked;

    if (!code) { alert('Code is required.'); return; }
    if (isNaN(value) || value < 0) { alert('Value must be a positive number.'); return; }
    if (type === 'percent' && value > 100) { alert('Percentage cannot exceed 100.'); return; }

    // Check for duplicate code (exclude self when editing)
    const duplicate = DISCOUNT_CODES.find(d => d.code === code && d.id !== _discountDraft.id);
    if (duplicate) { alert(`Code "${code}" already exists.`); return; }

    if (_discountDraft.id) {
      const existing = DISCOUNT_CODES.find(d => d.id === _discountDraft.id);
      if (existing) Object.assign(existing, { code, type, value, maxUses, expiresAt, note, active });
    } else {
      DISCOUNT_CODES.unshift({ id: 'dc-' + Date.now(), code, type, value, maxUses, expiresAt, note, active, uses: 0, createdAt: new Date().toISOString().slice(0, 10) });
    }
    const isEdit = !!_discountDraft.id;
    persistData();
    _discountDraft = null;
    document.getElementById('content').innerHTML = DiscountsScreen();
    showToast(isEdit ? 'Code updated!' : 'Code created!');
  }

  function deleteDiscount(id) {
    if (!confirm('Delete this discount code?')) return;
    const idx = DISCOUNT_CODES.findIndex(d => d.id === id);
    if (idx !== -1) { DISCOUNT_CODES.splice(idx, 1); persistData(); }
    document.getElementById('content').innerHTML = DiscountsScreen();
  }

  function useDiscount(id) {
    const dc = DISCOUNT_CODES.find(d => d.id === id);
    if (!dc) return;
    dc.uses = (dc.uses || 0) + 1;
    persistData();
    document.getElementById(`dc-row-${id}`).outerHTML = _discountRow(dc);
  }

  function copyDiscountCode(code) {
    navigator.clipboard.writeText(code).then(() => showToast(`Copied "${code}"`));
  }

  function _discountRow(dc) {
    const status = _discountStatus(dc);
    const usesBar = dc.maxUses
      ? `<div style="width:80px;height:6px;border-radius:3px;background:var(--surface-alt);overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px">
           <div style="width:${Math.min(100, Math.round(dc.uses / dc.maxUses * 100))}%;height:100%;background:var(--accent);border-radius:3px"></div>
         </div> <span style="font-size:11px;color:var(--muted)">${dc.uses}/${dc.maxUses}</span>`
      : `<span style="font-size:12px;color:var(--muted)">${dc.uses} uses</span>`;
    const expiry = dc.expiresAt
      ? `<span style="font-size:12px">${dc.expiresAt.slice(0,10)}</span>`
      : `<span style="color:var(--muted);font-size:12px">No expiry</span>`;
    return `
      <tr id="dc-row-${dc.id}">
        <td style="font-family:monospace;font-size:15px;font-weight:700;letter-spacing:1px">
          ${dc.code}
          <button class="btn btn-ghost" style="padding:2px 6px;font-size:11px;margin-left:4px" onclick="copyDiscountCode('${dc.code}')">⧉ Copy</button>
        </td>
        <td>
          <span style="background:${dc.type==='percent'?'#6366f1':'#0ea5e9'};color:#fff;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600">
            ${dc.type === 'percent' ? dc.value + '%' : '€' + dc.value + ' off'}
          </span>
        </td>
        <td>${usesBar}</td>
        <td>${expiry}</td>
        <td>${_discountStatusBadge(status)}</td>
        <td style="color:var(--muted);font-size:12px">${dc.note || '—'}</td>
        <td>
          <button class="btn btn-ghost" style="padding:3px 8px;font-size:12px" onclick="openDiscountForm(DISCOUNT_CODES.find(d=>d.id==='${dc.id}'))">✏</button>
          <button class="btn btn-ghost" style="padding:3px 8px;font-size:12px;color:var(--error)" onclick="deleteDiscount('${dc.id}')">✕</button>
        </td>
      </tr>`;
  }

  function DiscountsScreen() {
    const today = new Date().toISOString().slice(0, 10);
    const active   = DISCOUNT_CODES.filter(d => _discountStatus(d) === 'active');
    const expiring = DISCOUNT_CODES.filter(d => _discountStatus(d) === 'expiring');
    const maxed    = DISCOUNT_CODES.filter(d => _discountStatus(d) === 'maxed');
    const totalUses = DISCOUNT_CODES.reduce((s, d) => s + (d.uses || 0), 0);

    const formHtml = _discountDraft !== null ? `
      <div class="card" style="margin-bottom:var(--sp-4);border:2px solid var(--accent)">
        <h3 class="card-title" style="margin-bottom:var(--sp-4)">${_discountDraft.id ? 'Edit discount code' : 'New discount code'}</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-3)">
          <div>
            <label class="form-label">Code *</label>
            <input id="dc-code" class="input" placeholder="e.g. SUMMER20" style="font-family:monospace;font-weight:700;text-transform:uppercase"
              value="${_discountDraft.code}" oninput="this.value=this.value.toUpperCase()">
          </div>
          <div>
            <label class="form-label">Type</label>
            <select id="dc-type" class="input">
              <option value="percent" ${_discountDraft.type==='percent'?'selected':''}>Percentage (% off)</option>
              <option value="fixed"   ${_discountDraft.type==='fixed'?'selected':''}>Fixed amount (€ off)</option>
            </select>
          </div>
          <div>
            <label class="form-label">Value *</label>
            <input id="dc-value" class="input" type="number" min="0" step="any" placeholder="e.g. 20" value="${_discountDraft.value}">
          </div>
          <div>
            <label class="form-label">Max uses (blank = unlimited)</label>
            <input id="dc-maxuses" class="input" type="number" min="1" placeholder="Unlimited" value="${_discountDraft.maxUses ?? ''}">
          </div>
          <div>
            <label class="form-label">Expires (blank = never)</label>
            <input id="dc-expires" class="input" type="date" value="${(_discountDraft.expiresAt||'').slice(0,10)}">
          </div>
          <div>
            <label class="form-label">Note</label>
            <input id="dc-note" class="input" placeholder="Internal note" value="${_discountDraft.note || ''}">
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:var(--sp-3)">
          <input type="checkbox" id="dc-active" ${_discountDraft.active?'checked':''}> Active (can be used)
        </label>
        <div style="display:flex;gap:var(--sp-2)">
          <button class="btn btn-primary" onclick="saveDiscountDraft()">Save code</button>
          <button class="btn btn-ghost"   onclick="cancelDiscountForm()">Cancel</button>
        </div>
      </div>` : '';

    const rows = DISCOUNT_CODES.map(dc => _discountRow(dc)).join('');

    return `
      <div class="screen-content">
        <div class="screen-header">
          <h2 class="screen-title">Discount Codes</h2>
          ${_discountDraft === null
            ? `<button class="btn btn-primary" onclick="openDiscountForm(null)">+ New code</button>`
            : ''}
        </div>

        <div class="stat-row">
          <div class="stat-card">
            <div class="stat-value">${active.length}</div>
            <div class="stat-label">Active codes</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${totalUses}</div>
            <div class="stat-label">Total uses</div>
          </div>
          <div class="stat-card" style="${expiring.length > 0 ? 'border-color:#f59e0b' : ''}">
            <div class="stat-value" style="${expiring.length > 0 ? 'color:#f59e0b' : ''}">${expiring.length}</div>
            <div class="stat-label">Expiring soon</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${maxed.length}</div>
            <div class="stat-label">Maxed out</div>
          </div>
        </div>

        ${formHtml}

        ${DISCOUNT_CODES.length === 0
          ? `<div class="card"><div class="muted" style="padding:var(--sp-3)">No discount codes yet. Create one above.</div></div>`
          : `<div class="card" style="padding:0;overflow:hidden">
              <table style="width:100%;border-collapse:collapse;font-size:14px">
                <thead>
                  <tr style="background:var(--surface-alt);text-align:left">
                    <th style="padding:10px 16px;font-weight:600">Code</th>
                    <th style="padding:10px 12px;font-weight:600">Discount</th>
                    <th style="padding:10px 12px;font-weight:600">Uses</th>
                    <th style="padding:10px 12px;font-weight:600">Expires</th>
                    <th style="padding:10px 12px;font-weight:600">Status</th>
                    <th style="padding:10px 12px;font-weight:600">Note</th>
                    <th style="padding:10px 12px"></th>
                  </tr>
                </thead>
                <tbody>
                  ${rows}
                </tbody>
              </table>
             </div>`
        }

        <div class="card" style="margin-top:var(--sp-4);background:var(--surface-alt);border:none">
          <div style="font-size:13px;color:var(--muted);line-height:1.6">
            <strong style="color:var(--text)">How to use:</strong> Share a code with a student when they enrol or renew.
            Use the "⧉ Copy" button to copy the code to your clipboard.
            Track redemptions by incrementing "uses" manually or integrate with your payment processor.
          </div>
        </div>
      </div>`;
  }

  // ---------- Announcements -------------------------------------------------

  let announcementDraft = null; // null = form closed, {} = new, {id,...} = editing

  function openAnnouncementForm(ann) {
    announcementDraft = ann
      ? { id: ann.id, title: ann.title, body: ann.body, pinned: ann.pinned, expiresAt: ann.expiresAt || '' }
      : { id: null, title: '', body: '', pinned: false, expiresAt: '' };
    document.getElementById('content').innerHTML = AnnouncementsScreen();
  }

  function closeAnnouncementForm() {
    announcementDraft = null;
    document.getElementById('content').innerHTML = AnnouncementsScreen();
  }

  function saveAnnouncement() {
    const title    = document.getElementById('ann-title')?.value.trim();
    const body     = document.getElementById('ann-body')?.value.trim();
    const pinned   = document.getElementById('ann-pinned')?.checked || false;
    const expiresAt = document.getElementById('ann-expires')?.value || null;
    if (!title) { alert('Title is required.'); return; }

    if (announcementDraft?.id) {
      // Edit existing
      const ann = ANNOUNCEMENTS.find(a => a.id === announcementDraft.id);
      if (ann) { ann.title = title; ann.body = body; ann.pinned = pinned; ann.expiresAt = expiresAt || null; }
    } else {
      // New
      ANNOUNCEMENTS.unshift({
        id: 'ann-' + Date.now(),
        title, body, pinned,
        createdAt: new Date().toISOString(),
        expiresAt: expiresAt || null
      });
    }
    persistData();
    announcementDraft = null;
    document.getElementById('content').innerHTML = AnnouncementsScreen();
  }

  function deleteAnnouncement(id) {
    if (!confirm('Delete this announcement?')) return;
    const idx = ANNOUNCEMENTS.findIndex(a => a.id === id);
    if (idx !== -1) { ANNOUNCEMENTS.splice(idx, 1); persistData(); }
    document.getElementById('content').innerHTML = AnnouncementsScreen();
  }

  function toggleAnnPin(id) {
    const ann = ANNOUNCEMENTS.find(a => a.id === id);
    if (ann) { ann.pinned = !ann.pinned; persistData(); }
    document.getElementById('content').innerHTML = AnnouncementsScreen();
  }

  function AnnouncementsScreen() {
    const now = new Date().toISOString();
    const active  = ANNOUNCEMENTS.filter(a => !a.expiresAt || a.expiresAt > now);
    const expired = ANNOUNCEMENTS.filter(a =>  a.expiresAt && a.expiresAt <= now);

    // Sort: pinned first, then by createdAt desc
    const sorted = [...active].sort((a, b) => {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });

    function AnnCard(ann, isExpired) {
      const pinIcon = ann.pinned ? '📌 ' : '';
      const expLabel = ann.expiresAt
        ? `<span class="tag" style="background:var(--surface-alt);color:var(--text-muted);font-size:11px">Expires ${ann.expiresAt.slice(0,10)}</span>`
        : '';
      const expiredBadge = isExpired
        ? `<span class="tag" style="background:#fef3c7;color:#92400e;font-size:11px">Expired</span>`
        : '';
      return `
        <div class="card" style="margin-bottom:var(--sp-3);${isExpired ? 'opacity:0.6' : ''}">
          <div style="display:flex;align-items:flex-start;gap:var(--sp-3)">
            <div style="flex:1">
              <div style="font-weight:700;font-size:15px;margin-bottom:var(--sp-1)">${pinIcon}${ann.title}</div>
              <div style="font-size:13px;color:var(--text-body);white-space:pre-wrap;margin-bottom:var(--sp-2)">${ann.body}</div>
              <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center">
                <span class="faint" style="font-size:11px">Posted ${(ann.createdAt||'').slice(0,10)}</span>
                ${expLabel}${expiredBadge}
              </div>
            </div>
            ${!isExpired ? `
            <div style="display:flex;gap:var(--sp-2);flex-shrink:0">
              <button class="btn btn-sm" onclick="toggleAnnPin('${ann.id}')" title="${ann.pinned ? 'Unpin' : 'Pin'}">${ann.pinned ? '📌' : '📍'}</button>
              <button class="btn btn-sm" onclick="openAnnouncementForm(${JSON.stringify(ann).replace(/"/g,'&quot;')})">Edit</button>
              <button class="btn btn-sm" style="color:var(--danger)" onclick="deleteAnnouncement('${ann.id}')">×</button>
            </div>` : `
            <div>
              <button class="btn btn-sm" style="color:var(--danger)" onclick="deleteAnnouncement('${ann.id}')">× Remove</button>
            </div>`}
          </div>
        </div>`;
    }

    const formHtml = announcementDraft !== null ? `
      <div class="card" style="margin-bottom:var(--sp-5);border:2px solid var(--accent)">
        <h3 class="card-title" style="margin-bottom:var(--sp-4)">${announcementDraft.id ? 'Edit announcement' : 'New announcement'}</h3>
        <div style="display:flex;flex-direction:column;gap:var(--sp-3)">
          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Title *</label>
            <input id="ann-title" class="input" style="width:100%" placeholder="e.g. Gym closed this Saturday"
              value="${announcementDraft.title || ''}">
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Message</label>
            <textarea id="ann-body" class="input" rows="4" style="width:100%;resize:vertical"
              placeholder="Announcement details...">${announcementDraft.body || ''}</textarea>
          </div>
          <div style="display:flex;gap:var(--sp-5);align-items:center;flex-wrap:wrap">
            <label style="display:flex;align-items:center;gap:var(--sp-2);font-size:13px;cursor:pointer">
              <input type="checkbox" id="ann-pinned" ${announcementDraft.pinned ? 'checked' : ''}> Pin to top
            </label>
            <div>
              <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Expires on (optional)</label>
              <input type="date" id="ann-expires" class="input" value="${(announcementDraft.expiresAt||'').slice(0,10)}">
            </div>
          </div>
          <div style="display:flex;gap:var(--sp-3)">
            <button class="btn btn-primary" onclick="saveAnnouncement()">Save</button>
            <button class="btn" onclick="closeAnnouncementForm()">Cancel</button>
          </div>
        </div>
      </div>` : '';

    const annRows = sorted.length === 0
      ? `<div class="muted" style="padding:var(--sp-3) 0">No active announcements. Create one above.</div>`
      : sorted.map(a => AnnCard(a, false)).join('');

    const expRows = expired.length === 0 ? '' : `
      <div style="margin-top:var(--sp-6)">
        <h3 class="h3" style="margin-bottom:var(--sp-3)">Expired</h3>
        ${expired.map(a => AnnCard(a, true)).join('')}
      </div>`;

    return `
      <div class="row-between" style="margin-bottom:var(--sp-5)">
        <h1 class="h1">Announcements</h1>
        ${announcementDraft === null
          ? `<button class="btn btn-primary" onclick="openAnnouncementForm(null)">+ New announcement</button>`
          : ''}
      </div>

      <div style="display:flex;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-5)">
        <div class="card" style="flex:1;min-width:130px">
          <div style="font-size:22px;margin-bottom:var(--sp-1)">📢</div>
          <div style="font-size:28px;font-weight:700">${active.length}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Active</div>
        </div>
        <div class="card" style="flex:1;min-width:130px">
          <div style="font-size:22px;margin-bottom:var(--sp-1)">📌</div>
          <div style="font-size:28px;font-weight:700">${active.filter(a=>a.pinned).length}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Pinned</div>
        </div>
        <div class="card" style="flex:1;min-width:130px">
          <div style="font-size:22px;margin-bottom:var(--sp-1)">🗂</div>
          <div style="font-size:28px;font-weight:700">${expired.length}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Expired</div>
        </div>
      </div>

      ${formHtml}

      <div>
        ${annRows}
      </div>
      ${expRows}
    `;
  }

  // ---------- Recurring Templates editor -----------------------------------

  let templateDraft = null; // null = form closed, {} = new, {...} = editing

  const TEMPLATE_CLASS_TYPES = ['Fundamentals', 'Open Class', 'Advanced', 'Kids', 'Competition'];
  const TEMPLATE_AUDIENCES   = ['Adults', 'Kids', 'Competition', 'All'];
  const TEMPLATE_DURATIONS   = [45, 60, 75, 90, 120];
  const TEMPLATE_DAYS        = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function openTemplateForm(tpl) {
    templateDraft = tpl
      ? { id: tpl.id, dow: tpl.dow, time: tpl.time, durationMin: tpl.durationMin,
          classType: tpl.classType, audience: tpl.audience || 'Adults',
          instructorId: tpl.instructorId, capacity: tpl.capacity, sportId: tpl.sportId || 'sport-bjj' }
      : { id: null, dow: 1, time: '19:00', durationMin: 60, classType: 'Fundamentals',
          audience: 'Adults', instructorId: INSTRUCTORS[0]?.id || '', capacity: 20, sportId: 'sport-bjj' };
    document.getElementById('content').innerHTML = TemplatesScreen();
  }

  function closeTemplateForm() {
    templateDraft = null;
    document.getElementById('content').innerHTML = TemplatesScreen();
  }

  function saveTplDraft() {
    const dow         = parseInt(document.getElementById('tpl-dow')?.value);
    const time        = document.getElementById('tpl-time')?.value.trim();
    const durationMin = parseInt(document.getElementById('tpl-dur')?.value);
    const classType   = document.getElementById('tpl-type')?.value;
    const audience    = document.getElementById('tpl-audience')?.value;
    const instructorId= document.getElementById('tpl-instructor')?.value;
    const capacity    = parseInt(document.getElementById('tpl-capacity')?.value) || 20;
    const sportId     = document.getElementById('tpl-sport')?.value || 'sport-bjj';

    if (!time || isNaN(dow)) { alert('Day and time are required.'); return; }

    if (templateDraft?.id) {
      const tpl = RECURRING_TEMPLATES.find(t => t.id === templateDraft.id);
      if (tpl) Object.assign(tpl, { dow, time, durationMin, classType, audience, instructorId, capacity, sportId });
    } else {
      RECURRING_TEMPLATES.push({
        id: 'rt-' + Date.now(),
        dow, time, durationMin, classType, audience, instructorId, capacity, sportId
      });
    }
    persistData();
    templateDraft = null;
    document.getElementById('content').innerHTML = TemplatesScreen();
  }

  function deleteTplSlot(id) {
    if (!confirm('Remove this recurring slot? Existing class instances are not affected.')) return;
    const idx = RECURRING_TEMPLATES.findIndex(t => t.id === id);
    if (idx !== -1) { RECURRING_TEMPLATES.splice(idx, 1); persistData(); }
    document.getElementById('content').innerHTML = TemplatesScreen();
  }

  function TemplatesScreen() {
    const sorted = [...RECURRING_TEMPLATES].sort((a, b) => {
      if (a.dow !== b.dow) return a.dow - b.dow;
      return a.time.localeCompare(b.time);
    });

    const instOpts = INSTRUCTORS.map(i =>
      `<option value="${i.id}" ${templateDraft?.instructorId === i.id ? 'selected' : ''}>${i.name}</option>`
    ).join('');

    const sportOpts = SPORTS.map(s =>
      `<option value="${s.id}" ${(templateDraft?.sportId || 'sport-bjj') === s.id ? 'selected' : ''}>${s.name.en}</option>`
    ).join('');

    function dayDot(dow) {
      const colors = ['#ef4444','#3b82f6','#3b82f6','#3b82f6','#3b82f6','#3b82f6','#f59e0b'];
      return `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colors[dow]};margin-right:4px;vertical-align:middle"></span>`;
    }

    function TplRow(tpl) {
      const inst = DB.instructor(tpl.instructorId);
      const sport = DB.sport(tpl.sportId);
      return `
        <div class="list-row" style="display:grid;grid-template-columns:80px 60px 60px 1fr 80px 1fr 50px auto;gap:var(--sp-3);align-items:center;padding:var(--sp-3) var(--sp-4)">
          <div style="font-weight:600">${dayDot(tpl.dow)}${TEMPLATE_DAYS[tpl.dow]}</div>

            <button class="btn btn-sm" onclick="openTemplateForm(${JSON.stringify(tpl).replace(/"/g,'&quot;')})">Edit</button>

    }

    const formHtml = templateDraft !== null ? `
      <div class="card" style="margin-bottom:var(--sp-5);border:2px solid var(--accent)">
        <h3 class="card-title" style="margin-bottom:var(--sp-4)">${templateDraft.id ? 'Edit recurring slot' : 'New recurring slot'}</h3>

          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Day *</label>

            <select id="tpl-dur" class="input" style="width:100%">
              ${TEMPLATE_DURATIONS.map(d=>`<option value="${d}" ${templateDraft.durationMin==d?'selected':''}>${d} min</option>`).join('')}

          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Class type</label>
            <select id="tpl-type" class="input" style="width:100%">
              ${TEMPLATE_CLASS_TYPES.map(ct=>`<option value="${ct}" ${templateDraft.classType===ct?'selected':''}>${ct}</option>`).join('')}
            </select>
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Audience</label>
            <select id="tpl-audience" class="input" style="width:100%">
              ${TEMPLATE_AUDIENCES.map(a=>`<option value="${a}" ${templateDraft.audience===a?'selected':''}>${a}</option>`).join('')}
            </select>
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Instructor</label>
            <select id="tpl-instructor" class="input" style="width:100%">
              <option value="">— None —</option>
              ${INSTRUCTORS.map(i=>`<option value="${i.id}" ${templateDraft.instructorId===i.id?'selected':''}>${i.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Capacity</label>
            <input type="number" id="tpl-capacity" class="input" style="width:100%" min="1" max="200" value="${templateDraft.capacity}">
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Sport</label>
            <select id="tpl-sport" class="input" style="width:100%">${sportOpts}</select>

        </div>
        <div style="display:flex;gap:var(--sp-3)">
          <button class="btn btn-primary" onclick="saveTplDraft()">Save slot</button>
          <button class="btn" onclick="closeTemplateForm()">Cancel</button>
        </div>
      </div>` : '';

    // Group by day for stats
    const byDay = TEMPLATE_DAYS.map((d,i) => ({ day: d, count: RECURRING_TEMPLATES.filter(t => t.dow === i).length }));
    const activeDays = byDay.filter(d => d.count > 0).length;
    const totalSlots = RECURRING_TEMPLATES.length;
    const weeklyHours = RECURRING_TEMPLATES.reduce((sum, t) => sum + t.durationMin / 60, 0);

    return `
      <div class="row-between" style="margin-bottom:var(--sp-5)">
        <h1 class="h1">🔁 Weekly Templates</h1>
        ${templateDraft === null
          ? `<button class="btn btn-primary" onclick="openTemplateForm(null)">+ New slot</button>`

      </div>

        <div class="card" style="flex:1;min-width:130px">
          <div style="font-size:22px;margin-bottom:var(--sp-1)">📋</div>
          <div style="font-size:28px;font-weight:700">${totalSlots}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Weekly slots</div>
        </div>
        <div class="card" style="flex:1;min-width:130px">
          <div style="font-size:22px;margin-bottom:var(--sp-1)">📅</div>
          <div style="font-size:28px;font-weight:700">${activeDays}</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Active days</div>
        </div>
        <div class="card" style="flex:1;min-width:130px">
          <div style="font-size:22px;margin-bottom:var(--sp-1)">⏱</div>
          <div style="font-size:28px;font-weight:700">${weeklyHours.toFixed(1)}h</div>
          <div style="font-size:13px;font-weight:600;margin-top:var(--sp-1)">Hours / week</div>
        </div>
      </div>

      <div class="card" style="margin-bottom:var(--sp-4)">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--sp-3)">
          <div>
            <div style="font-weight:600;margin-bottom:var(--sp-1)">📆 Generate class instances</div>
            <div style="font-size:13px;color:var(--text-muted)">Create scheduled classes from these templates. Existing classes are never overwritten.</div>
          </div>
          <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap">
            <button class="btn btn-secondary" onclick="generateWeekFromTemplates(-1)">← Last week</button>
            <button class="btn btn-secondary" onclick="generateWeekFromTemplates(0)">This week</button>
            <button class="btn btn-secondary" onclick="generateWeekFromTemplates(1)">Next week →</button>
          </div>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:var(--sp-3);display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap">
          <span style="font-size:13px;font-weight:600;color:var(--text-muted);white-space:nowrap">Bulk generate:</span>
          <select id="bulk-weeks-select" class="form-input" style="font-size:13px;padding:5px 8px;min-width:140px">
            <option value="2">Next 2 weeks</option>
            <option value="4" selected>Next 4 weeks</option>
            <option value="8">Next 8 weeks</option>
            <option value="12">Next 12 weeks</option>
          </select>
          <button class="btn" onclick="generateMultipleWeeks(parseInt(document.getElementById('bulk-weeks-select').value))">⚡ Generate →</button>
          <span style="font-size:12px;color:var(--text-muted)">Generates all template slots for each upcoming week in one shot.</span>
        </div>
      </div>

      ${formHtml}

      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border);background:var(--surface-alt)">
          <div style="display:grid;grid-template-columns:80px 60px 60px 1fr 80px 1fr 50px auto;gap:var(--sp-3);font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted)">
            <span>Day</span><span>Time</span><span>Dur.</span><span>Type / Audience</span><span>Cap.</span><span>Instructor</span><span>Sport</span><span></span>
          </div>
        </div>
        ${sorted.length === 0
          ? `<div class="muted" style="padding:var(--sp-5) var(--sp-4)">No recurring slots yet. Add one above to populate the schedule.</div>`
          : sorted.map(TplRow).join('')}
      </div>

      <div class="card" style="margin-top:var(--sp-4);background:var(--surface-alt)">
        <div style="font-size:13px;color:var(--text-muted)">
          ℹ️ Templates define the weekly recurring schedule shown in the Schedule screen and the student app.
          Changes here affect future class generation — existing class instances are not modified.
        </div>
      </div>
    `;
  }

  // ---------- Generate classes from templates -----------------------------------

  function generateWeekFromTemplates(weekOffset) {
    // Find Monday of the target week (weekOffset 0=this week, 1=next week, -1=last week)
    const now = new Date();
    const dow = now.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
    const diffToMon = (dow === 0) ? -6 : 1 - dow;
    const monday = new Date(now);
    monday.setHours(0, 0, 0, 0);
    monday.setDate(monday.getDate() + diffToMon + weekOffset * 7);

    // Format week label for feedback
    const sunday = new Date(monday);
    sunday.setDate(sunday.getDate() + 6);
    const fmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    const weekLabel = `${fmt(monday)} – ${fmt(sunday)}`;

    // Collect existing startsAt values to avoid duplicates
    const existingTimes = new Set(CLASSES.map(c => c.startsAt));
    let created = 0;

    RECURRING_TEMPLATES.forEach(rt => {
      // Map DOW to offset from Monday: Mon=0, Tue=1, ..., Sat=5, Sun=6
      const dayOffset = (rt.dow === 0) ? 6 : rt.dow - 1;
      const d = new Date(monday);
      d.setDate(d.getDate() + dayOffset);
      const dateStr = d.toISOString().slice(0, 10);
      const startsAt = new Date(`${dateStr}T${rt.time}:00`).toISOString();

      if (!existingTimes.has(startsAt) && !isClosure(dateStr)) {
        CLASSES.push({
          id: 'cls-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          startsAt,
          durationMin: rt.durationMin,
          classType: rt.classType,
          instructorId: rt.instructorId,
          sportId: rt.sportId || 'sport-bjj',
          capacity: rt.capacity,
          plannedItemIds: [],
          status: 'scheduled',
          _templateId: rt.id
        });
        existingTimes.add(startsAt);
        created++;
      }
    });

    if (created === 0) {
      alert(`All classes for ${weekLabel} already exist — nothing to generate.`);
    } else {
      persistData();
      alert(`✓ Generated ${created} class${created !== 1 ? 'es' : ''} for ${weekLabel}.`);
    }
    document.getElementById('content').innerHTML = TemplatesScreen();
  }

  // ---------- Bulk multi-week class generation ----------------------------------

  function generateMultipleWeeks(count) {
    if (!count || count < 1) return;
    const now = new Date();
    const dow = now.getDay();
    const diffToMon = (dow === 0) ? -6 : 1 - dow;
    const existingTimes = new Set(CLASSES.map(c => c.startsAt));

    let totalCreated = 0;
    const weekLabels = [];

    for (let weekOffset = 0; weekOffset < count; weekOffset++) {
      const monday = new Date(now);
      monday.setHours(0, 0, 0, 0);
      monday.setDate(monday.getDate() + diffToMon + weekOffset * 7);

      const sunday = new Date(monday);
      sunday.setDate(sunday.getDate() + 6);
      const fmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      if (weekOffset === 0) weekLabels.push(fmt(monday) + ' – ' + fmt(sunday));
      if (weekOffset === count - 1 && count > 1) weekLabels.push(fmt(monday) + ' – ' + fmt(sunday));

      let weekCreated = 0;
      RECURRING_TEMPLATES.forEach(rt => {
        const dayOffset = (rt.dow === 0) ? 6 : rt.dow - 1;
        const d = new Date(monday);
        d.setDate(d.getDate() + dayOffset);
        const dateStr = d.toISOString().slice(0, 10);
        const startsAt = new Date(`${dateStr}T${rt.time}:00`).toISOString();
        if (!existingTimes.has(startsAt) && !isClosure(dateStr)) {
          CLASSES.push({
            id: 'cls-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
            startsAt,
            durationMin: rt.durationMin,
            classType: rt.classType,
            instructorId: rt.instructorId,
            sportId: rt.sportId || 'sport-bjj',
            capacity: rt.capacity,
            plannedItemIds: [],
            status: 'scheduled',
            _templateId: rt.id
          });
          existingTimes.add(startsAt);
          weekCreated++;
        }
      });
      totalCreated += weekCreated;
    }

    if (totalCreated === 0) {
      alert(`All classes for the next ${count} weeks already exist — nothing to generate.`);
    } else {
      persistData();
      const rangeLabel = weekLabels.length > 1
        ? `${weekLabels[0]} → ${weekLabels[1]}`
        : weekLabels[0] || `next ${count} weeks`;
      alert(`✓ Generated ${totalCreated} class${totalCreated !== 1 ? 'es' : ''} across ${count} weeks (${rangeLabel}).`);
    }
    document.getElementById('content').innerHTML = TemplatesScreen();
  }

  // ---------- Prospects / Lead Pipeline ----------------------------------------

  let prospectDraft = null; // null = form closed

  const PROSPECT_STATUSES = [
    { id: 'new',              label: 'New lead',        color: '#64748b' },
    { id: 'trial-scheduled',  label: 'Trial scheduled', color: '#2563eb' },
    { id: 'trial-attended',   label: 'Trial attended',  color: '#7c3aed' },
    { id: 'follow-up',        label: 'Follow-up',       color: '#d97706' },
    { id: 'converted',        label: 'Converted ✓',     color: '#16a34a' },
    { id: 'lost',             label: 'Lost',            color: '#9ca3af' },
  ];

  const PROSPECT_SOURCES = ['referral', 'instagram', 'google', 'walk-in', 'event', 'other'];

  function _prospectStatusMeta(statusId) {
    return PROSPECT_STATUSES.find(s => s.id === statusId) || PROSPECT_STATUSES[0];
  }

  function _prospectNextStatus(statusId) {
    const order = ['new', 'trial-scheduled', 'trial-attended', 'follow-up', 'converted'];
    const idx = order.indexOf(statusId);
    return idx >= 0 && idx < order.length - 1 ? order[idx + 1] : null;
  }

  function openProspectForm(pr) {
    prospectDraft = pr ? { ...pr } : { id: null, name: '', contact: '', source: 'referral', sportId: 'sport-bjj', status: 'new', trialDate: null, notes: '' };
    document.getElementById('content').innerHTML = ProspectsScreen();
  }

  function closeProspectForm() {
    prospectDraft = null;
    document.getElementById('content').innerHTML = ProspectsScreen();
  }

  function saveProspectDraft() {
    const f = id => document.getElementById(id);
    const name = (f('pr-name') ? f('pr-name').value : prospectDraft.name).trim();
    if (!name) { alert('Name is required'); return; }
    const pr = {
      id:        prospectDraft.id || ('pr-' + Date.now()),
      name,
      contact:   f('pr-contact') ? f('pr-contact').value.trim() : prospectDraft.contact,
      source:    f('pr-source')  ? f('pr-source').value          : prospectDraft.source,
      sportId:   'sport-bjj',
      status:    prospectDraft.id ? prospectDraft.status : 'new',
      trialDate: f('pr-trialdate') ? (f('pr-trialdate').value || null) : prospectDraft.trialDate,
      notes:     f('pr-notes')   ? f('pr-notes').value.trim()   : prospectDraft.notes,
      createdAt: prospectDraft.createdAt || new Date().toISOString(),
    };
    if (prospectDraft.id) {
      const idx = PROSPECTS.findIndex(p => p.id === prospectDraft.id);
      if (idx !== -1) PROSPECTS[idx] = pr;
    } else {
      PROSPECTS.unshift(pr);
    }
    persistData();
    prospectDraft = null;
    document.getElementById('content').innerHTML = ProspectsScreen();
  }

  function advanceProspectStatus(prospectId) {
    const pr = PROSPECTS.find(p => p.id === prospectId);
    if (!pr) return;
    const next = _prospectNextStatus(pr.status);
    if (next) { pr.status = next; persistData(); document.getElementById('content').innerHTML = ProspectsScreen(); }
  }

  function markProspectLost(prospectId) {
    const pr = PROSPECTS.find(p => p.id === prospectId);
    if (pr) { pr.status = 'lost'; persistData(); document.getElementById('content').innerHTML = ProspectsScreen(); }
  }

  function deleteProspect(prospectId) {
    if (!confirm('Delete this prospect?')) return;
    const idx = PROSPECTS.findIndex(p => p.id === prospectId);
    if (idx !== -1) { PROSPECTS.splice(idx, 1); persistData(); document.getElementById('content').innerHTML = ProspectsScreen(); }
  }

  function convertProspect(prospectId) {
    const pr = PROSPECTS.find(p => p.id === prospectId);
    if (!pr) return;
    if (!confirm(`Convert "${pr.name}" to a full member? This will create a student record with a Monthly membership.`)) return;
    const stuId = 's-' + Date.now();
    const today = new Date().toISOString().slice(0, 10);
    STUDENTS.push({ id: stuId, name: pr.name, initials: pr.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase(), dob: '', weightKg: 0, joinedAt: today, contact: pr.contact });
    const gs = GRADING_SYSTEMS.find(g => g.sportId === pr.sportId);
    const firstLevel = gs ? gs.levels[0].id : '';
    ENROLLMENTS.push({ id: 'e-' + Date.now(), studentId: stuId, sportId: pr.sportId, gradingSystemId: gs ? gs.id : '', currentLevelId: firstLevel, currentStripes: 0, levelSince: today, lastPromotionAt: null, membership: 'plan-monthly' });
    pr.status = 'converted';
    persistData();
    document.getElementById('content').innerHTML = ProspectsScreen();
  }

  function ProspectsScreen() {
    const active  = PROSPECTS.filter(p => p.status !== 'lost' && p.status !== 'converted');
    const conv    = PROSPECTS.filter(p => p.status === 'converted');
    const lost    = PROSPECTS.filter(p => p.status === 'lost');
    const trialAt = PROSPECTS.filter(p => p.status === 'trial-attended' || p.status === 'follow-up');

    const convRate = PROSPECTS.length > 0
      ? Math.round((conv.length / PROSPECTS.length) * 100) + '%'
      : '—';

    const statCards = `
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3);margin-bottom:var(--sp-4)">
        ${[
          { label: 'Active leads',     value: active.length,   color: '#2563eb' },
          { label: 'Awaiting follow-up',value: trialAt.length,  color: '#d97706' },
          { label: 'Converted',         value: conv.length,     color: '#16a34a' },
          { label: 'Conversion rate',   value: convRate,        color: '#7c3aed' },
        ].map(c => `
          <div class="card" style="text-align:center;padding:var(--sp-3)">
            <div style="font-size:24px;font-weight:700;color:${c.color}">${c.value}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:4px">${c.label}</div>
          </div>`).join('')}
      </div>`;

    // Form
    let formHtml = '';
    if (prospectDraft) {
      const d = prospectDraft;
      formHtml = `
        <div class="card" style="margin-bottom:var(--sp-4);border:2px solid var(--accent)">
          <div style="font-weight:700;font-size:15px;margin-bottom:var(--sp-3)">${d.id ? 'Edit prospect' : '+ New prospect'}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)">
            <label style="font-size:13px;color:var(--text-muted)">Name *
              <input id="pr-name" class="form-input" value="${escHtml(d.name)}" placeholder="Full name" style="margin-top:4px">
            </label>
            <label style="font-size:13px;color:var(--text-muted)">Contact
              <input id="pr-contact" class="form-input" value="${escHtml(d.contact)}" placeholder="Email or phone" style="margin-top:4px">
            </label>
            <label style="font-size:13px;color:var(--text-muted)">Source
              <select id="pr-source" class="form-input" style="margin-top:4px">
                ${PROSPECT_SOURCES.map(s => `<option value="${s}" ${d.source===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}
              </select>
            </label>
            <label style="font-size:13px;color:var(--text-muted)">Trial date
              <input id="pr-trialdate" type="date" class="form-input" value="${d.trialDate || ''}" style="margin-top:4px">
            </label>
            <label style="font-size:13px;color:var(--text-muted);grid-column:1/-1">Notes
              <textarea id="pr-notes" class="form-input" rows="2" style="margin-top:4px;resize:vertical">${escHtml(d.notes)}</textarea>
            </label>
          </div>
          <div style="display:flex;gap:var(--sp-2);margin-top:var(--sp-3)">
            <button class="btn btn-primary" onclick="saveProspectDraft()">Save</button>
            <button class="btn btn-secondary" onclick="closeProspectForm()">Cancel</button>
          </div>
        </div>`;
    }

    // Group prospects by pipeline order, excluding converted/lost unless there's nothing else
    const statusOrder = ['new', 'trial-scheduled', 'trial-attended', 'follow-up', 'converted', 'lost'];
    const grouped = {};
    statusOrder.forEach(s => { grouped[s] = PROSPECTS.filter(p => p.status === s); });

    const now = new Date();
    function daysSince(iso) {
      if (!iso) return null;
      return Math.floor((now - new Date(iso)) / 86400000);
    }

    function prospectRow(pr) {
      const meta    = _prospectStatusMeta(pr.status);
      const nextSt  = _prospectNextStatus(pr.status);
      const nextMeta = nextSt ? _prospectStatusMeta(nextSt) : null;
      const age     = daysSince(pr.createdAt);
      const isActive = pr.status !== 'converted' && pr.status !== 'lost';

      return `
        <div style="display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3);border-bottom:1px solid var(--border);last-child:border:none">
          <div style="width:36px;height:36px;border-radius:50%;background:${meta.color}22;color:${meta.color};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0">
            ${pr.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span style="font-weight:600;font-size:14px">${escHtml(pr.name)}</span>
              <span style="font-size:11px;background:${meta.color}22;color:${meta.color};padding:2px 8px;border-radius:99px;font-weight:600">${meta.label}</span>
              <span style="font-size:11px;background:var(--surface-alt);color:var(--text-muted);padding:2px 7px;border-radius:99px">${pr.source}</span>
              ${age !== null ? `<span style="font-size:11px;color:var(--text-muted)">${age}d ago</span>` : ''}
            </div>
            ${pr.contact ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px">${escHtml(pr.contact)}</div>` : ''}
            ${pr.trialDate ? `<div style="font-size:12px;color:var(--text-muted)">Trial: ${pr.trialDate}</div>` : ''}
            ${pr.notes ? `<div style="font-size:12px;color:var(--text-body);margin-top:4px;font-style:italic">"${escHtml(pr.notes)}"</div>` : ''}
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
            ${isActive && nextMeta ? `<button class="btn btn-primary" style="font-size:12px;padding:4px 10px" onclick="advanceProspectStatus('${pr.id}')">→ ${nextMeta.label}</button>` : ''}
            ${isActive && pr.status !== 'converted' ? `<button class="btn btn-secondary" style="font-size:12px;padding:4px 10px;color:#16a34a;border-color:#16a34a" onclick="convertProspect('${pr.id}')">✓ Convert</button>` : ''}
            ${isActive && pr.status !== 'lost' ? `<button class="btn btn-secondary" style="font-size:12px;padding:4px 10px" onclick="markProspectLost('${pr.id}')">Mark lost</button>` : ''}
            <button class="btn btn-secondary" style="font-size:12px;padding:4px 8px" onclick="openProspectForm(PROSPECTS.find(p=>p.id==='${pr.id}'))">Edit</button>
            <button class="btn btn-secondary" style="font-size:12px;padding:4px 8px;color:#dc2626;border-color:#dc2626" onclick="deleteProspect('${pr.id}')">×</button>
          </div>
        </div>`;
    }

    // Render active pipeline stages + collapsed converted/lost sections
    const pipelineStages = ['new', 'trial-scheduled', 'trial-attended', 'follow-up'];
    let pipelineHtml = pipelineStages.map(st => {
      const rows = grouped[st];
      if (rows.length === 0 && st !== 'new') return '';
      const meta = _prospectStatusMeta(st);
      return `
        <div class="card" style="margin-bottom:var(--sp-3);padding:0;overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--sp-3);background:${meta.color}11;border-bottom:${rows.length?'1px solid var(--border)':'none'}">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="width:10px;height:10px;border-radius:50%;background:${meta.color};display:inline-block"></span>
              <span style="font-weight:600;font-size:14px">${meta.label}</span>
              <span style="font-size:12px;color:var(--text-muted)">${rows.length} prospect${rows.length===1?'':'s'}</span>
            </div>
          </div>
          ${rows.length ? rows.map(prospectRow).join('') : `<div style="padding:var(--sp-3);color:var(--text-muted);font-size:13px">No prospects here.</div>`}
        </div>`;
    }).join('');

    // Converted section (collapsed if empty)
    const convRows = grouped['converted'];
    const lostRows = grouped['lost'];
    const archiveHtml = (convRows.length + lostRows.length) === 0 ? '' : `
      <details style="margin-top:var(--sp-3)">
        <summary style="cursor:pointer;font-size:13px;color:var(--text-muted);padding:var(--sp-2) 0">
          Show archived (${convRows.length} converted, ${lostRows.length} lost)
        </summary>
        <div style="margin-top:var(--sp-2)">
          ${convRows.length ? `<div class="card" style="padding:0;overflow:hidden;margin-bottom:var(--sp-2)">${convRows.map(prospectRow).join('')}</div>` : ''}
          ${lostRows.length ? `<div class="card" style="padding:0;overflow:hidden">${lostRows.map(prospectRow).join('')}</div>` : ''}
        </div>
      </details>`;

    return `
      <div style="max-width:860px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4)">
          <div>
            <h2 style="margin:0;font-size:22px">Prospects</h2>
            <div style="font-size:13px;color:var(--text-muted);margin-top:2px">Track trial leads through to conversion</div>
          </div>
          ${!prospectDraft ? `<button class="btn btn-primary" onclick="openProspectForm(null)">+ Add prospect</button>` : ''}
        </div>
        ${statCards}
        ${formHtml}
        ${pipelineHtml}
        ${archiveHtml}
      </div>`;
  }

  // ---------- Screen: Analytics ---------------------------------------------

  function AnalyticsScreen() {
    const todayMs = new Date(CONFIG.today).getTime();
    const MONTH_MS = 30.44 * 24 * 60 * 60 * 1000;

    // Helper: ISO month key "YYYY-MM"
    function monthKey(ms) {
      const d = new Date(ms);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    // Helper: short month label "Jan", "Feb"…
    function monthLabel(key) {
      const [y, m] = key.split('-');
      return new Date(parseInt(y), parseInt(m) - 1, 1).toLocaleString('en', { month: 'short' }) + ' ' + y.slice(2);
    }

    // Build last 6 calendar months
    const last6Months = Array.from({ length: 6 }, (_, i) => {
      const d = new Date(CONFIG.today);
      d.setDate(1);
      d.setMonth(d.getMonth() - (5 - i));
      return monthKey(d.getTime());
    });

    // ---- 1. Monthly attendance (attended check-ins per month) ----
    const attendByMonth = {};
    last6Months.forEach(k => { attendByMonth[k] = 0; });
    ATTENDANCE.forEach(a => {
      if (!a.attended) return;
      const cls = CLASSES.find(c => c.id === a.classId);
      if (!cls) return;
      const k = monthKey(new Date(cls.startsAt).getTime());
      if (attendByMonth[k] !== undefined) attendByMonth[k]++;
    });

    // ---- 2. New students per month ----
    const newByMonth = {};
    last6Months.forEach(k => { newByMonth[k] = 0; });
    STUDENTS.forEach(s => {
      const k = monthKey(new Date(s.joinedAt).getTime());
      if (newByMonth[k] !== undefined) newByMonth[k]++;
    });

    // ---- 3. Class fill rate by type ----
    const typeStats = {};
    CLASSES.forEach(cls => {
      const t = cls.classType || 'Other';
      if (!typeStats[t]) typeStats[t] = { booked: 0, capacity: 0, classCount: 0 };
      const bookedCount = BOOKINGS.filter(b => b.classId === cls.id && b.status === 'booked').length;
      typeStats[t].booked += bookedCount;
      typeStats[t].capacity += (cls.capacity || 20);
      typeStats[t].classCount++;
    });
    const typeRows = Object.entries(typeStats)
      .map(([type, s]) => ({ type, fillPct: s.capacity ? Math.round((s.booked / s.capacity) * 100) : 0, classCount: s.classCount }))
      .sort((a, b) => b.fillPct - a.fillPct);

    // ---- 4. Busiest days of week ----
    const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const dayAttend = Array(7).fill(0);
    ATTENDANCE.forEach(a => {
      if (!a.attended) return;
      const cls = CLASSES.find(c => c.id === a.classId);
      if (!cls) return;
      const dow = new Date(cls.startsAt).getDay();
      dayAttend[dow]++;
    });

    // Reusable mini bar chart builder
    function barChart(values, labels, color, maxOverride) {
      const maxVal = maxOverride || Math.max(...values, 1);
      return values.map((v, i) => {
        const pct = Math.round((v / maxVal) * 100);
        return `
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
            <div style="font-size:10px;font-weight:600;color:var(--text-secondary)">${v}</div>
            <div style="width:100%;background:var(--surface-alt);border-radius:4px;height:52px;display:flex;align-items:flex-end;overflow:hidden">
              <div style="width:100%;height:${Math.max(pct, 4)}%;background:${color};border-radius:3px 3px 0 0;transition:height .3s"></div>
            </div>
            <div style="font-size:9px;color:var(--text-faint);white-space:nowrap">${labels[i]}</div>
          </div>`;
      }).join('');
    }

    const attendVals = last6Months.map(k => attendByMonth[k]);
    const newStudVals = last6Months.map(k => newByMonth[k]);
    const monthLabels = last6Months.map(monthLabel);

    // Stat cards
    const totalAttend6 = attendVals.reduce((a, b) => a + b, 0);
    const totalNew6    = newStudVals.reduce((a, b) => a + b, 0);
    const avgFillPct   = typeRows.length ? Math.round(typeRows.reduce((s, r) => s + r.fillPct, 0) / typeRows.length) : 0;
    const busiestDay   = dayLabels[dayAttend.indexOf(Math.max(...dayAttend))];

    const statCards = `
      <div class="stat-grid" style="margin-bottom:var(--sp-4)">
        <div class="stat-card"><div class="stat-value">${totalAttend6}</div><div class="stat-label">Check-ins (6 mo)</div></div>
        <div class="stat-card"><div class="stat-value">${totalNew6}</div><div class="stat-label">New students (6 mo)</div></div>
        <div class="stat-card"><div class="stat-value">${avgFillPct}%</div><div class="stat-label">Avg fill rate</div></div>
        <div class="stat-card"><div class="stat-value">${busiestDay}</div><div class="stat-label">Busiest day</div></div>
      </div>`;

    // Fill rate bars for class types
    const maxFill = 100;
    const typeBars = typeRows.map(r => {
      const pct = r.fillPct;
      const color = pct >= 70 ? 'var(--success)' : pct >= 40 ? 'var(--accent)' : 'var(--warning)';
      return `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <div style="min-width:90px;font-size:13px;font-weight:500">${r.type}</div>
          <div style="flex:1;background:var(--surface-alt);border-radius:4px;height:18px;overflow:hidden">
            <div style="width:${pct}%;height:100%;background:${color};border-radius:4px;transition:width .3s"></div>
          </div>
          <div style="min-width:42px;text-align:right;font-size:13px;font-weight:600;color:var(--text-secondary)">${pct}%</div>
          <div style="min-width:60px;font-size:11px;color:var(--text-faint)">${r.classCount} classes</div>
        </div>`;
    }).join('');

    // Day-of-week bars (skip Sun if 0)
    const activeDays = dayAttend.map((v, i) => ({ v, label: dayLabels[i] })).filter(d => d.v > 0 || [1,2,3,4,5].includes(dayLabels.indexOf(d.label)));
    const dowMax = Math.max(...dayAttend, 1);
    const dowBars = dayAttend.map((v, i) => {
      const pct = Math.round((v / dowMax) * 100);
      return `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
          <div style="font-size:10px;font-weight:600;color:var(--text-secondary)">${v}</div>
          <div style="width:100%;background:var(--surface-alt);border-radius:4px;height:52px;display:flex;align-items:flex-end;overflow:hidden">
            <div style="width:100%;height:${Math.max(pct,4)}%;background:${i === dayAttend.indexOf(Math.max(...dayAttend)) ? 'var(--accent)' : 'var(--border)'};border-radius:3px 3px 0 0;transition:height .3s"></div>
          </div>
          <div style="font-size:9px;color:var(--text-faint)">${dayLabels[i]}</div>
        </div>`;
    }).join('');

    // ---- 5. Attendance heatmap (day × hour) ----
    // Only show hours that have at least one class in the dataset, defaulting to 6am–9pm
    const heatDays  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const heatDowMap = [1,2,3,4,5,6,0]; // index in heatDays → JS getDay()
    // Determine which hours appear in CLASSES (within 6–21 range)
    const hourSet = new Set();
    CLASSES.forEach(c => {
      const h = new Date(c.startsAt).getHours();
      if (h >= 6 && h <= 21) hourSet.add(h);
    });
    // If no classes yet, show a sensible default range
    const heatHours = hourSet.size
      ? [...hourSet].sort((a, b) => a - b)
      : [7, 9, 10, 12, 17, 18, 19, 20];

    // Build matrix [dayIndex][hourIndex] = attendanceCount
    const heatMatrix = heatDays.map(() => heatHours.map(() => 0));
    ATTENDANCE.forEach(a => {
      if (!a.attended) return;
      const cls = CLASSES.find(c => c.id === a.classId);
      if (!cls) return;
      const d   = new Date(cls.startsAt);
      const dow = d.getDay();
      const hr  = d.getHours();
      const di  = heatDowMap.indexOf(dow);
      const hi  = heatHours.indexOf(hr);
      if (di >= 0 && hi >= 0) heatMatrix[di][hi]++;
    });
    const heatMax = Math.max(...heatMatrix.flat(), 1);

    // Colour ramp: 0 → surface-alt, high → accent at full opacity
    function heatColor(v) {
      if (v === 0) return 'var(--surface-alt)';
      const t = v / heatMax;
      // Interpolate from #e0e7ff (light indigo) to #6366f1 (accent)
      const r = Math.round(224 + (99  - 224) * t);
      const g = Math.round(231 + (102 - 231) * t);
      const b = Math.round(255 + (241 - 255) * t);
      return `rgb(${r},${g},${b})`;
    }

    const heatHourLabels = heatHours.map(h => {
      const ampm = h < 12 ? 'am' : 'pm';
      const h12  = h % 12 || 12;
      return h12 + ampm;
    });

    // Build the grid HTML
    const cellW = 36; // px per cell
    const heatRows = heatDays.map((day, di) => {
      const cells = heatHours.map((_, hi) => {
        const v = heatMatrix[di][hi];
        const bg = heatColor(v);
        const textColor = (v / heatMax) > 0.55 ? '#fff' : 'var(--text-secondary)';
        const title = `${day} ${heatHourLabels[hi]}: ${v} check-in${v !== 1 ? 's' : ''}`;
        return `<div title="${title}" style="width:${cellW}px;height:28px;border-radius:4px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:${textColor};cursor:default">${v || ''}</div>`;
      }).join('');
      return `
        <div style="display:flex;align-items:center;gap:4px">
          <div style="min-width:28px;font-size:11px;font-weight:600;color:var(--text-muted);text-align:right">${day}</div>
          ${cells}
        </div>`;
    }).join('');

    const heatHeader = heatHourLabels.map(lbl =>
      `<div style="width:${cellW}px;text-align:center;font-size:9px;color:var(--text-faint);font-weight:500">${lbl}</div>`
    ).join('');

    // Legend scale
    const legendSteps = 5;
    const legendCells = Array.from({ length: legendSteps }, (_, i) => {

  // ---------- Check-in Kiosk -----------------------------------------------

  let kioskClassId = null; // selected class for kiosk

  function kioskCheckIn(classId, studentId) {
    const existing = ATTENDANCE.find(a => a.classId === classId && a.studentId === studentId);
    if (existing) {
      existing.attended = true;
      existing.markedAt = new Date().toISOString();
    } else {
      ATTENDANCE.push({ classId, studentId, attended: true, markedAt: new Date().toISOString() });
    }
    // Also book them if not already booked (walk-in)
    const alreadyBooked = BOOKINGS.some(b => b.classId === classId && b.studentId === studentId && b.status === 'booked');
    if (!alreadyBooked) {
      BOOKINGS.push({ id: 'bk-' + Date.now(), classId, studentId, status: 'booked', bookedAt: new Date().toISOString() });
    }
    persistAttendance();
    persistData();
    document.getElementById('content').innerHTML = KioskScreen();
  }

  function KioskScreen() {
    const todayStart = new Date(CONFIG.today).setHours(0, 0, 0, 0);
    const todayEnd   = todayStart + 24 * 60 * 60 * 1000;

    // Get today's classes (scheduled + completed)
    const todayClasses = CLASSES
      .filter(c => {
        const t = new Date(c.startsAt).getTime();
        return t >= todayStart && t < todayEnd && c.status !== 'cancelled';
      })
      .sort((a, b) => new Date(a.startsAt) - new Date(b.startsAt));

    // Pick default class: first non-completed, or first overall
    if (!kioskClassId || !todayClasses.find(c => c.id === kioskClassId)) {
      const active = todayClasses.find(c => c.status !== 'completed');
      kioskClassId = (active || todayClasses[0])?.id || null;
    }

    // Class tabs

            <div style="font-size:18px;font-weight:600;margin-bottom:8px">No classes scheduled today</div>
            <div style="font-size:14px">Add classes on the <a href="#/schedule" style="color:var(--accent)">Schedule</a> screen or generate from templates.</div>
          </div>
        </div>`;

    const bookedIds  = BOOKINGS.filter(b => b.classId === cls.id && b.status === 'booked').map(b => b.studentId);

    ATTENDANCE.filter(a => a.classId === cls.id).forEach(a => { attendMap[a.studentId] = a.attended; });

    const bookedStudents = bookedIds
      .map(id => STUDENTS.find(s => s.id === id))
      .filter(Boolean)
      .sort((a, b) => a.name.localeCompare(b.name));

    // Walk-in candidates: enrolled but not booked
    const allEnrolled = ENROLLMENTS.map(e => STUDENTS.find(s => s.id === e.studentId)).filter(Boolean);
    const walkIns = allEnrolled
      .filter(s => !bookedIds.includes(s.id))
      .sort((a, b) => a.name.localeCompare(b.name));

    function studentCard(stu, isWalkIn) {
      const checkedIn = !!attendMap[stu.id];
      const bg    = checkedIn ? '#dcfce7' : isWalkIn ? 'var(--surface-alt)' : 'var(--surface)';

                      font-weight:700;color:${checkedIn ? '#fff' : 'var(--accent)'}">

          ${checkedIn ? '<div style="font-size:11px;color:#16a34a;font-weight:600">Checked in</div>' : ''}
          ${isWalkIn && !checkedIn ? '<div style="font-size:10px;color:var(--text-faint)">Walk-in</div>' : ''}
        </button>`;

    const checkedInCount = bookedStudents.filter(s => attendMap[s.id]).length

    const instructor = INSTRUCTORS.find(i => i.id === cls.instructorId);
    const timeStr    = new Date(cls.startsAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    const endMs      = new Date(cls.startsAt).getTime() + cls.durationMin * 60000;
    const endStr     = new Date(endMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

    return `
      <div style="max-width:960px">
        <!-- Header -->
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:var(--sp-4)">

            <div style="font-size:13px;color:var(--text-muted);margin-top:4px">
              ${new Date(CONFIG.today).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' })}
              · Tap a student card to mark attendance
            </div>
          </div>
          <div style="font-size:13px;color:var(--text-muted);text-align:right">
            <span style="font-size:22px;font-weight:700;color:var(--accent)">${checkedInCount}</span>
            <span style="font-size:13px"> / ${totalExpected} checked in</span>
          </div>
        </div>

        <!-- Class tabs -->
        ${todayClasses.length > 1 ? `
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--sp-4)">
          ${tabs}
        </div>` : ''}

        <!-- Selected class info -->
        <div class="card" style="margin-bottom:var(--sp-4);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px 20px">
          <div style="display:flex;align-items:center;gap:14px">
            <div style="font-size:32px">🥋</div>
            <div>
              <div style="font-size:18px;font-weight:700">${cls.classType}</div>
              <div style="font-size:13px;color:var(--text-muted);margin-top:2px">
                ${timeStr}–${endStr} · ${cls.durationMin} min
                ${instructor ? ' · ' + instructor.name : ''}
              </div>
            </div>
          </div>
          <div style="display:flex;gap:20px">
            <div style="text-align:center">
              <div style="font-size:22px;font-weight:700;color:#16a34a">${checkedInCount}</div>
              <div style="font-size:11px;color:var(--text-muted)">Checked in</div>
            </div>
            <div style="text-align:center">
              <div style="font-size:22px;font-weight:700">${totalExpected}</div>
              <div style="font-size:11px;color:var(--text-muted)">Expected</div>
            </div>
            <div style="text-align:center">
              <div style="font-size:22px;font-weight:700;color:var(--accent)">${cls.capacity - totalExpected}</div>
              <div style="font-size:11px;color:var(--text-muted)">Open spots</div>
            </div>
          </div>
        </div>

        <!-- Booked students grid -->
        ${bookedStudents.length ? `
        <div style="margin-bottom:var(--sp-5)">
          <div style="font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">
            Booked · ${bookedStudents.length}
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px">
            ${bookedStudents.map(s => studentCard(s, false)).join('')}
          </div>
        </div>` : ''}

        <!-- Walk-ins -->
        ${walkIns.length ? `
        <details style="margin-top:var(--sp-2)">
          <summary style="font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none;margin-bottom:10px;list-style:none;display:flex;align-items:center;gap:6px">
            <span style="font-size:16px">▶</span> Walk-ins · ${walkIns.length} other enrolled students
          </summary>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px">
            ${walkIns.map(s => studentCard(s, true)).join('')}
          </div>
        </details>` : ''}

        ${!bookedStudents.length && !walkIns.length ? `
        <div class="card" style="text-align:center;padding:40px;color:var(--text-muted)">
          <div style="font-size:36px;margin-bottom:12px">🧑‍🤝‍🧑</div>

  // ---------- Messages / bulk email composer --------------------------------

  // msgState holds the current filter + draft so edits survive re-renders
  let msgState = {
    group: 'all',       // 'all' | 'belt:<id>' | 'plan:<id>' | 'at-risk' | 'ready'
    subject: '',
    body: '',
  };

  function _msgRecipients(group) {
    const nowMs = new Date(CONFIG.today).getTime();

    let studs = [...STUDENTS];

    if (group === 'at-risk') {
      // students who haven't attended in 14+ days (or never, if joined >7d ago)
      studs = studs.filter(stu => {
        const attended = ATTENDANCE.filter(a => a.studentId === stu.id && a.attended);
        const lastMs = attended.reduce((latest, a) => {
          const cls = CLASSES.find(c => c.id === a.classId);
          if (!cls) return latest;
          const t = new Date(cls.startsAt).getTime();
          return t > latest ? t : latest;
        }, 0);
        const joinedDaysAgo = Math.floor((nowMs - new Date(stu.joinedAt).getTime()) / 86400000);
        if (joinedDaysAgo <= 7) return false;
        const daysSince = lastMs ? Math.floor((nowMs - lastMs) / 86400000) : null;
        return daysSince === null || daysSince >= 14;
      });
    } else if (group === 'ready') {
      // promotion-ready students (same logic as Dashboard)
      const readyIds = new Set(
        ENROLLMENTS
          .filter(e => {
            const rules = (grading.promotionRules || []).find(r => r.fromLevelId === e.currentLevelId);
            if (!rules) return false;
            const attended = ATTENDANCE.filter(a => a.studentId === e.studentId && a.attended).length;
            const levelSinceMs = e.levelSince ? new Date(e.levelSince).getTime() : nowMs;
            const monthsAtLevel = (nowMs - levelSinceMs) / (30.44 * 86400000);
            return attended >= (rules.minClasses || 0) && monthsAtLevel >= (rules.minMonths || 0);
          })
          .map(e => e.studentId)
      );
      studs = studs.filter(s => readyIds.has(s.id));
    } else if (group.startsWith('belt:')) {
      const levelId = group.slice(5);
      const matchIds = new Set(
        ENROLLMENTS.filter(e => e.currentLevelId === levelId).map(e => e.studentId)
      );
      studs = studs.filter(s => matchIds.has(s.id));
    } else if (group.startsWith('plan:')) {
      const planId = group.slice(5);
      const matchIds = new Set(
        ENROLLMENTS.filter(e => e.membership === planId).map(e => e.studentId)
      );
      studs = studs.filter(s => matchIds.has(s.id));
    }
    return studs;
  }

  // ---------- Communication Log -----------------------------------------------

  const COMM_LOG_KEY = 'tatami_comm_log';
  let COMM_LOG = []; // [{ id, type, group, subject, body, recipientCount, emails, sentAt }]

  function loadCommLog() {
    try {
      const saved = JSON.parse(localStorage.getItem(COMM_LOG_KEY));
      if (Array.isArray(saved)) COMM_LOG = saved;
    } catch(e) { console.warn('loadCommLog failed', e); }
  }

  function saveCommLog() {
    try { localStorage.setItem(COMM_LOG_KEY, JSON.stringify(COMM_LOG)); } catch(e) {}
  }

  function logCommunication(type, group, subject, body, recipientCount, emails) {
    COMM_LOG.unshift({
      id: 'cl-' + Date.now(),
      type,          // 'email' | 'copy-emails' | 'copy-message'
      group,
      subject: subject || '',
      body: body || '',
      recipientCount,
      emails: emails || [],
      sentAt: new Date().toISOString(),
    });
    if (COMM_LOG.length > 200) COMM_LOG.length = 200; // cap at 200 entries
    saveCommLog();
  }

  function deleteCommEntry(id) {
    const idx = COMM_LOG.findIndex(e => e.id === id);
    if (idx !== -1) { COMM_LOG.splice(idx, 1); saveCommLog(); }
    document.getElementById('content').innerHTML = CommLogScreen();
  }

  function _msgSend(group, subject, body) {
    const studs = _msgRecipients(group);
    const emails = studs.map(s => s.contact).filter(e => e && e.includes('@'));
    if (!emails.length) { showToast('No recipients with email addresses.'); return; }
    logCommunication('email', group, subject, body, emails.length, emails);
    const href = `mailto:?bcc=${emails.map(e => encodeURIComponent(e)).join(',')}`
               + `&subject=${encodeURIComponent(subject)}`
               + `&body=${encodeURIComponent(body)}`;
    window.location.href = href;
  }

  function _msgCopyEmails(group) {
    const studs = _msgRecipients(group);
    const emails = studs.map(s => s.contact).filter(e => e && e.includes('@'));
    if (!emails.length) { showToast('No emails to copy.'); return; }
    logCommunication('copy-emails', group, '', '', emails.length, emails);
    navigator.clipboard.writeText(emails.join(', ')).then(
      () => showToast(`✓ Copied ${emails.length} email${emails.length > 1 ? 's' : ''}`),
      () => {
        // fallback: prompt
        prompt('Copy these emails:', emails.join(', '));
      }
    );
  }

  function _msgCopyMessage(subject, body) {
    const text = subject ? `Subject: ${subject}\n\n${body}` : body;
    navigator.clipboard.writeText(text).then(
      () => showToast('✓ Message copied to clipboard'),
      () => { prompt('Copy this message:', text); }
    );
  }

  function CommLogScreen() {
    // Helpers
    const groupLabel = g => {
      if (!g || g === 'all') return 'All students';
      if (g === 'at-risk') return 'At-risk (14d+)';
      if (g === 'promo-ready') return 'Promotion-ready';
      if (g.startsWith('plan:')) return 'Plan: ' + g.slice(5);
      if (g.startsWith('belt:')) {
        const levelId = g.slice(5);
        for (const sport of (grading.sports || [])) {
          const lvl = (sport.levels || []).find(l => l.id === levelId);
          if (lvl) return 'Belt: ' + lvl.name;
        }
        return 'Belt: ' + levelId;
      }
      return g;
    };

    const typeIcon  = t => ({ email: '✉', 'copy-emails': '📋', 'copy-message': '📄' }[t] || '✉');
    const typeLabel = t => ({ email: 'Sent via mail client', 'copy-emails': 'Emails copied', 'copy-message': 'Message copied' }[t] || t);

    const fmtDate = iso => {
      const d = new Date(iso);
      return d.toLocaleDateString('en-IE', { day:'2-digit', month:'short', year:'numeric' })
           + ' ' + d.toLocaleTimeString('en-IE', { hour:'2-digit', minute:'2-digit' });
    };

    // Stats
    const total      = COMM_LOG.length;
    const emailCount = COMM_LOG.filter(e => e.type === 'email').length;
    const totalReach = COMM_LOG.reduce((s, e) => s + (e.recipientCount || 0), 0);
    const last30Days = (() => {
      const cutoff = Date.now() - 30 * 86400000;
      return COMM_LOG.filter(e => new Date(e.sentAt).getTime() > cutoff).length;
    })();

    const rows = COMM_LOG.length === 0
      ? `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:32px">No communications logged yet — use the Messages screen to compose and send.</td></tr>`
      : COMM_LOG.map(entry => {
          const preview = entry.subject
            ? `<strong>${entry.subject}</strong>`
            : `<span style="color:var(--text-muted);font-style:italic">(no subject)</span>`;
          const emailsTitle = entry.emails.length
            ? 'title="' + entry.emails.join(', ').replace(/"/g, '&quot;') + '"'
            : '';
          return `
          <tr>
            <td style="white-space:nowrap;color:var(--text-muted);font-size:12px">${fmtDate(entry.sentAt)}</td>
            <td title="${typeLabel(entry.type)}">${typeIcon(entry.type)} ${typeLabel(entry.type)}</td>
            <td><span class="badge" style="background:var(--surface-alt);color:var(--text-muted);font-size:11px">${groupLabel(entry.group)}</span></td>
            <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${preview}</td>
            <td ${emailsTitle} style="cursor:${entry.emails.length ? 'help' : 'default'}">${entry.recipientCount} recipient${entry.recipientCount !== 1 ? 's' : ''}</td>
            <td style="white-space:nowrap">
              ${entry.body ? `<button class="btn btn-secondary" style="padding:2px 8px;font-size:12px"
                onclick="(function(){
                  const el = document.getElementById('cl-preview-${entry.id}');
                  el.style.display = el.style.display === 'none' ? 'block' : 'none';
                })()">Preview</button>` : ''}
              <button class="btn" style="padding:2px 8px;font-size:12px;color:var(--danger)"
                onclick="if(confirm('Delete this log entry?'))deleteCommEntry('${entry.id}')">✕</button>
            </td>
          </tr>
          ${entry.body ? `<tr id="cl-preview-${entry.id}" style="display:none">
            <td colspan="6">
              <pre style="margin:0;padding:12px;background:var(--surface-alt);border-radius:var(--radius);font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto">${entry.body.replace(/</g,'&lt;')}</pre>
            </td>
          </tr>` : ''}
          `;
        }).join('');

    return `
      <div style="max-width:1000px;margin:0 auto;padding:var(--sp-6)">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:var(--sp-4)">
          <div>
            <h1 class="h1" style="margin:0">📬 Communication Log</h1>
            <div style="font-size:13px;color:var(--text-muted);margin-top:4px">History of all bulk messages, email lists, and outreach</div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-secondary" onclick="go('messages')">✉ Compose new</button>
            ${COMM_LOG.length > 0 ? `<button class="btn" style="color:var(--danger)"
              onclick="if(confirm('Clear entire communication log?')){COMM_LOG.length=0;saveCommLog();document.getElementById('content').innerHTML=CommLogScreen()}">Clear all</button>` : ''}
          </div>
        </div>

        <!-- Stat cards -->
        <div class="stats-row" style="margin-bottom:var(--sp-5)">
          <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Total logged</div></div>
          <div class="stat-card"><div class="stat-value">${last30Days}</div><div class="stat-label">Last 30 days</div></div>
          <div class="stat-card"><div class="stat-value">${emailCount}</div><div class="stat-label">Via mail client</div></div>
          <div class="stat-card"><div class="stat-value">${totalReach.toLocaleString()}</div><div class="stat-label">Total recipients</div></div>
        </div>

        <!-- Log table -->
        <div class="card" style="padding:0;overflow:hidden">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
              <tr style="background:var(--surface-alt);text-align:left">
                <th style="padding:10px 14px;font-weight:600;color:var(--text-muted)">Date & time</th>
                <th style="padding:10px 14px;font-weight:600;color:var(--text-muted)">Type</th>
                <th style="padding:10px 14px;font-weight:600;color:var(--text-muted)">Group</th>
                <th style="padding:10px 14px;font-weight:600;color:var(--text-muted)">Subject / Message</th>
                <th style="padding:10px 14px;font-weight:600;color:var(--text-muted)">Recipients</th>
                <th style="padding:10px 14px;font-weight:600;color:var(--text-muted)"></th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        </div>

        ${COMM_LOG.length > 0 ? `<div style="font-size:12px;color:var(--text-muted);margin-top:12px;text-align:right">Hover "N recipients" to see email list · Capped at 200 entries</div>` : ''}
      </div>`;
  }

  function MessagesScreen() {
    const nowMs = new Date(CONFIG.today).getTime();

    // Build group options
    // Belt groups: deduplicate currentLevelId from ENROLLMENTS
    const beltGroups = [];
    const seenLevels = new Set();
    ENROLLMENTS.forEach(e => {
      if (e.currentLevelId && !seenLevels.has(e.currentLevelId)) {
        seenLevels.add(e.currentLevelId);
        const levelName = (() => {
          for (const sport of (grading.sports || [])) {
            const lvl = (sport.levels || []).find(l => l.id === e.currentLevelId);
            if (lvl) return lvl.name;
          }
          return e.currentLevelId;
        })();
        beltGroups.push({ id: `belt:${e.currentLevelId}`, label: levelName });
      }
    });

    // Plan groups
    const planGroups = (MEMBERSHIP_PLANS || []).map(p => ({ id: `plan:${p.id}`, label: p.name + ' plan' }));

    const groups = [
      { id: 'all',      label: 'All students' },
      ...planGroups,
      ...beltGroups,
      { id: 'at-risk',  label: 'At-risk (14+ days inactive)' },
      { id: 'ready',    label: 'Promotion-ready' },
    ];

    const currentGroup = groups.find(g => g.id === msgState.group) || groups[0];
    const recipients   = _msgRecipients(msgState.group);
    const withEmail    = recipients.filter(s => s.contact && s.contact.includes('@'));
    const noEmail      = recipients.filter(s => !s.contact || !s.contact.includes('@'));

    const groupOpts = groups.map(g =>
      `<option value="${g.id}" ${msgState.group === g.id ? 'selected' : ''}>${g.label} (${_msgRecipients(g.id).length})</option>`
    ).join('');

    const recipientChips = withEmail.slice(0, 20).map(s =>
      `<span style="display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 10px 3px 6px;font-size:12px">
         <span style="width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">${s.initials}</span>
         <span style="font-weight:500">${s.name.split(' ')[0]}</span>
       </span>`
    ).join('') + (withEmail.length > 20 ? `<span style="font-size:12px;color:var(--text-muted);padding:4px 8px">+${withEmail.length - 20} more</span>` : '');

    const canSend = withEmail.length > 0;

    return `
      <div style="max-width:780px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:var(--sp-4)">
          <div>
            <h1 class="h1" style="margin:0">✉ Messages</h1>
            <div style="font-size:13px;color:var(--text-muted);margin-top:4px">
              Compose and send bulk emails to student groups via your mail client
            </div>
          </div>
        </div>

        <!-- Stat cards -->
        <div class="stats-grid" style="margin-bottom:var(--sp-4)">
          <div class="stat-card">
            <div class="stat-value">${recipients.length}</div>
            <div class="stat-label">Recipients</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:#16a34a">${withEmail.length}</div>
            <div class="stat-label">With email</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:var(--text-muted)">${noEmail.length}</div>
            <div class="stat-label">No email on file</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${groups.length}</div>
            <div class="stat-label">Groups available</div>
          </div>
        </div>

        <!-- Composer card -->
        <div class="card" style="margin-bottom:var(--sp-4)">
          <div style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:var(--sp-3)">Compose message</div>

          <!-- Group selector -->
          <label style="display:block;margin-bottom:var(--sp-3)">
            <div style="font-size:13px;font-weight:600;margin-bottom:6px">Send to</div>
            <select
              onchange="msgState.group=this.value;document.getElementById('content').innerHTML=MessagesScreen()"
              style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:14px;color:var(--text)">
              ${groupOpts}
            </select>
          </label>

          <!-- Subject -->
          <label style="display:block;margin-bottom:var(--sp-3)">
            <div style="font-size:13px;font-weight:600;margin-bottom:6px">Subject</div>
            <input type="text" id="msg-subject" value="${msgState.subject.replace(/"/g, '&quot;')}"
              placeholder="e.g. Upcoming grading session — are you ready?"
              oninput="msgState.subject=this.value"
              style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:14px;color:var(--text);box-sizing:border-box" />
          </label>

          <!-- Body -->
          <label style="display:block;margin-bottom:var(--sp-4)">
            <div style="font-size:13px;font-weight:600;margin-bottom:6px">Message</div>
            <textarea id="msg-body" rows="8"
              placeholder="Write your message here…"
              oninput="msgState.body=this.value"
              style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:14px;color:var(--text);resize:vertical;box-sizing:border-box;font-family:inherit">${msgState.body.replace(/</g, '&lt;')}</textarea>
          </label>

          <!-- Actions -->
          <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
            <button class="btn btn-primary" ${canSend ? '' : 'disabled'}
              onclick="msgState.subject=document.getElementById('msg-subject').value;msgState.body=document.getElementById('msg-body').value;_msgSend(msgState.group,msgState.subject,msgState.body)"
              title="${canSend ? 'Open in your default mail client (BCC all recipients)' : 'No recipients with email addresses'}">
              ✉ Open in mail client
            </button>
            <button class="btn" ${canSend ? '' : 'disabled'}
              onclick="_msgCopyEmails(msgState.group)"
              title="Copy all email addresses to clipboard">
              📋 Copy emails
            </button>
            <button class="btn"
              onclick="msgState.subject=document.getElementById('msg-subject').value;msgState.body=document.getElementById('msg-body').value;_msgCopyMessage(msgState.subject,msgState.body)"
              title="Copy subject + body to clipboard">
              📝 Copy message
            </button>
            ${!canSend ? `<span style="font-size:12px;color:var(--warn)">⚠ No email addresses on file for this group</span>` : ''}
          </div>
        </div>

        <!-- Recipients preview -->
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3)">
            <div style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)">
              Recipients · ${currentGroup.label}
            </div>
            <div style="font-size:12px;color:var(--text-muted)">${withEmail.length} of ${recipients.length} have email</div>
          </div>

          ${recipients.length === 0 ? `
            <div style="text-align:center;padding:32px;color:var(--text-muted)">
              <div style="font-size:28px;margin-bottom:8px">🤷</div>
              <div style="font-weight:600">No students match this group</div>
            </div>` : `
            <!-- Chips for those with email -->
            ${withEmail.length ? `
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:${noEmail.length ? 'var(--sp-3)' : '0'}">
              ${recipientChips}
            </div>` : ''}

            <!-- List those without email as warning -->
            ${noEmail.length ? `
            <details style="margin-top:var(--sp-2)">
              <summary style="font-size:12px;color:var(--warn);cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:4px">
                <span>▶</span> ${noEmail.length} student${noEmail.length > 1 ? 's' : ''} without email — won't receive this message
              </summary>
              <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">
                ${noEmail.map(s => `
                  <div style="display:flex;align-items:center;gap:8px;padding:4px 0">
                    <div class="avatar" style="width:28px;height:28px;font-size:10px">${s.initials}</div>
                    <a href="#/students/${s.id}" style="font-size:13px;color:var(--accent);text-decoration:none">${s.name}</a>
                    <span style="font-size:11px;color:var(--text-faint)">no email on file</span>
                  </div>`).join('')}
              </div>
            </details>` : ''}
          `}
        </div>

        <!-- Quick templates -->
        <div class="card" style="margin-top:var(--sp-4)">
          <div style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:var(--sp-3)">Quick templates</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${[
              {
                label: '🥋 Grading reminder',
                subject: 'Grading session coming up — are you ready?',
                body: `Hi,\n\nWe have an upcoming grading session and we wanted to make sure you're prepared.\n\nIf you think you might be ready for your next belt, speak to your instructor this week. Don't forget to keep up with your mat time!\n\nSee you on the mats,\n${(ACADEMY || {}).name || 'The Team'}`,
              },
              {
                label: '👋 We miss you',
                subject: `We miss you at ${(ACADEMY || {}).name || 'the academy'}!`,
                body: `Hi,\n\nWe noticed it's been a while since your last class and wanted to check in.\n\nWe understand life gets busy, but your spot is always here when you're ready to return. If there's anything we can do to help, just reply to this email.\n\nHope to see you soon!\n${(ACADEMY || {}).name || 'The Team'}`,
              },
              {
                label: '📢 Class schedule update',
                subject: 'Schedule update — important changes',
                body: `Hi,\n\nWe want to let you know about some upcoming changes to the class schedule.\n\n[Describe changes here]\n\nIf you have any questions, please don't hesitate to get in touch.\n\nThank you,\n${(ACADEMY || {}).name || 'The Team'}`,
              },
              {
                label: '🎉 Welcome new members',
                subject: `Welcome to ${(ACADEMY || {}).name || 'the academy'}!`,
                body: `Hi,\n\nWelcome to ${(ACADEMY || {}).name || 'our academy'}! We're thrilled to have you join us.\n\nA few things to help you get started:\n- Check our class schedule and book your first session\n- Bring comfortable training gear to your first class\n- Don't hesitate to introduce yourself to the instructors\n\nWe look forward to training with you!\n${(ACADEMY || {}).name || 'The Team'}`,
              },
            ].map(tpl => `
              <button class="btn" style="text-align:left;justify-content:flex-start;font-size:13px"
                onclick="msgState.subject=${JSON.stringify(tpl.subject).replace(/</g,'&lt;')};msgState.body=${JSON.stringify(tpl.body).replace(/</g,'&lt;')};document.getElementById('content').innerHTML=MessagesScreen()">
                ${tpl.label}
              </button>`).join('')}
          </div>
        </div>
      </div>`;
  }

  // ---------- Waivers -------------------------------------------------------

  const WAIVERS_KEY      = 'tatami_waivers_v1';
  const WAIVER_DOCS_KEY  = 'tatami_waiver_docs_v1';

  const WAIVER_DOCS_DEFAULT = [
    { id: 'liability', label: 'Liability Waiver',   icon: '🛡' },
    { id: 'photo',     label: 'Photo Release',      icon: '📷' },
    { id: 'medical',   label: 'Medical Info Form',  icon: '🏥' },
  ];

  // Mutable — admins can add/remove document types
  let WAIVER_DOCS = WAIVER_DOCS_DEFAULT.slice();

  function loadWaiverDocs() {
    try {
      const saved = JSON.parse(localStorage.getItem(WAIVER_DOCS_KEY));
      if (Array.isArray(saved) && saved.length) {
        WAIVER_DOCS = saved;
      }
    } catch {}
  }

  function saveWaiverDocs() {
    try { localStorage.setItem(WAIVER_DOCS_KEY, JSON.stringify(WAIVER_DOCS)); } catch {}
  }

  function addWaiverDoc() {
    const iconEl  = document.getElementById('wdoc-icon');
    const labelEl = document.getElementById('wdoc-label');
    const icon    = (iconEl?.value.trim()  || '📄');
    const label   = (labelEl?.value.trim() || '');
    if (!label) { showToast('Document name is required'); return; }
    if (WAIVER_DOCS.some(d => d.label.toLowerCase() === label.toLowerCase())) {
      showToast('A document with that name already exists'); return;
    }
    const id = 'doc-' + Date.now();
    WAIVER_DOCS.push({ id, label, icon });
    saveWaiverDocs();
    document.getElementById('content').innerHTML = WaiversScreen();
  }

  function deleteWaiverDoc(docId) {
    const doc = WAIVER_DOCS.find(d => d.id === docId);
    if (!doc) return;
    // Count how many students have signed this doc
    const signedCount = Object.values(WAIVER_RECORDS).filter(r => r[docId]?.signedAt).length;
    const msg = signedCount > 0
      ? `Delete "${doc.label}"? This will remove ${signedCount} existing signature record${signedCount !== 1 ? 's' : ''}. This cannot be undone.`
      : `Delete "${doc.label}"?`;
    if (!confirm(msg)) return;
    // Remove from doc list
    WAIVER_DOCS = WAIVER_DOCS.filter(d => d.id !== docId);
    saveWaiverDocs();
    // Clean up any signatures for this doc
    Object.values(WAIVER_RECORDS).forEach(r => { delete r[docId]; });
    saveWaivers();
    document.getElementById('content').innerHTML = WaiversScreen();
  }

  // WAIVER_RECORDS: { [studentId]: { [docId]: { signedAt: ISO } | null } }
  let WAIVER_RECORDS = {};

  function loadWaivers() {
    try {
      const saved = JSON.parse(localStorage.getItem(WAIVERS_KEY));
      if (saved && typeof saved === 'object') WAIVER_RECORDS = saved;
    } catch {}
  }

  function saveWaivers() {
    try { localStorage.setItem(WAIVERS_KEY, JSON.stringify(WAIVER_RECORDS)); } catch {}
  }

  function waiverSign(studentId, docId) {
    if (!WAIVER_RECORDS[studentId]) WAIVER_RECORDS[studentId] = {};
    WAIVER_RECORDS[studentId][docId] = { signedAt: new Date().toISOString().slice(0, 10) };
    saveWaivers();
    // Re-render whichever view is showing
    const content = document.getElementById('content');
    const hash = location.hash;
    if (hash.includes('/students/')) {
      content.innerHTML = StudentReport(studentId);
    } else {
      content.innerHTML = WaiversScreen();
    }
  }

  function waiverRevoke(studentId, docId) {
    if (!WAIVER_RECORDS[studentId]) return;
    WAIVER_RECORDS[studentId][docId] = null;
    saveWaivers();
    const content = document.getElementById('content');
    const hash = location.hash;
    if (hash.includes('/students/')) {
      content.innerHTML = StudentReport(studentId);
    } else {
      content.innerHTML = WaiversScreen();
    }
  }

  function waiverStatus(studentId, docId) {
    return WAIVER_RECORDS[studentId]?.[docId] || null;
  }

  function waiverComplete(studentId) {
    return WAIVER_DOCS.every(d => waiverStatus(studentId, d.id)?.signedAt);
  }

  function WaiversScreen() {
    const today = new Date(CONFIG.today);
    const allStudents = STUDENTS.filter(s => !s.inactive);

    const complete   = allStudents.filter(s => waiverComplete(s.id));
    const incomplete = allStudents.filter(s => !waiverComplete(s.id));
    const missing    = allStudents.filter(s => WAIVER_DOCS.every(d => !waiverStatus(s.id, d.id)));

    // filter: 'all' | 'incomplete'
    const filterEl = document.getElementById('waiver-filter');
    const filter   = filterEl ? filterEl.value : 'incomplete';
    const displayed = filter === 'all' ? allStudents : incomplete;

    function cell(s, doc) {
      const status = waiverStatus(s.id, doc.id);
      if (status?.signedAt) {
        return `<td style="text-align:center">
          <span style="color:var(--green,#16a34a);font-weight:600;font-size:13px" title="${status.signedAt}">✓</span>
          <div style="font-size:10px;color:var(--text-faint)">${status.signedAt.slice(5)}</div>
          <button class="btn btn-secondary" style="font-size:10px;padding:2px 6px;margin-top:2px"
            onclick="waiverRevoke('${s.id}','${doc.id}')">Revoke</button>
        </td>`;
      }
      return `<td style="text-align:center">
        <span style="color:var(--red,#dc2626);font-size:13px">✗</span>
        <div><button class="btn btn-primary" style="font-size:11px;padding:3px 10px;margin-top:4px"
          onclick="waiverSign('${s.id}','${doc.id}')">Sign</button></div>
      </td>`;
    }

    const rows = displayed.map(s => {
      const allSigned = waiverComplete(s.id);
      const enr = ENROLLMENTS.find(e => e.studentId === s.id);
      const belt = enr ? getBeltLevel(enr.currentLevelId) : null;
      return `<tr>
        <td>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="avatar" style="width:32px;height:32px;font-size:11px">${s.initials}</div>
            <div>
              <a href="#/students/${s.id}" style="font-weight:600;font-size:13px;color:var(--accent);text-decoration:none">${s.name}</a>
              ${belt ? `<div style="font-size:11px;color:var(--text-muted)">${belt.label}</div>` : ''}
            </div>
          </div>
        </td>
        ${WAIVER_DOCS.map(d => cell(s, d)).join('')}
        <td style="text-align:center">
          <span class="badge ${allSigned ? '' : 'badge-warn'}" style="font-size:11px">${allSigned ? '✓ Done' : '⚠ Missing'}</span>
        </td>
      </tr>`;
    }).join('');

    return `
      <div style="max-width:900px;margin:0 auto">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4)">
          <div>
            <h1 class="h1" style="margin-bottom:var(--sp-1)">Documents &amp; Waivers</h1>
            <p class="muted" style="font-size:13px">Track consent forms and liability waivers for all students.</p>
          </div>
        </div>

        <div class="stat-grid" style="margin-bottom:var(--sp-5)">
          <div class="stat-card">
            <div class="stat-label">All signed</div>
            <div class="stat-value" style="color:var(--green,#16a34a)">${complete.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Missing ≥1 doc</div>
            <div class="stat-value" style="color:var(--orange,#ea580c)">${incomplete.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">No docs at all</div>
            <div class="stat-value" style="color:var(--red,#dc2626)">${missing.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total students</div>
            <div class="stat-value">${allStudents.length}</div>
          </div>
        </div>

        <div class="card" style="padding:0;overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--sp-4) var(--sp-4) 0">
            <div style="font-weight:600;font-size:14px">Student documents</div>
            <select id="waiver-filter" class="input" style="width:auto;font-size:13px"
              onchange="document.getElementById('content').innerHTML=WaiversScreen()">
              <option value="incomplete" ${filter === 'incomplete' ? 'selected' : ''}>Missing only</option>
              <option value="all" ${filter === 'all' ? 'selected' : ''}>All students</option>
            </select>
          </div>
          ${displayed.length === 0
            ? `<div class="muted" style="padding:var(--sp-5);text-align:center">🎉 All students have signed all documents.</div>`
            : `<div style="overflow-x:auto">
              <table style="width:100%;border-collapse:collapse;font-size:13px">
                <thead>
                  <tr style="border-bottom:1px solid var(--border)">
                    <th style="text-align:left;padding:var(--sp-3) var(--sp-4);font-weight:600;font-size:12px;color:var(--text-muted)">Student</th>
                    ${WAIVER_DOCS.map(d => `<th style="text-align:center;padding:var(--sp-3);font-weight:600;font-size:12px;color:var(--text-muted)">${d.icon} ${d.label}</th>`).join('')}
                    <th style="text-align:center;padding:var(--sp-3);font-weight:600;font-size:12px;color:var(--text-muted)">Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows.replace(/<tr>/g, '<tr style="border-bottom:1px solid var(--border)">')}
                </tbody>
              </table>
            </div>`}
        </div>

        <!-- Manage document types -->
        <div style="margin-top:var(--sp-5)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3)">
            <h2 style="font-size:15px;font-weight:700;margin:0">📋 Document types</h2>
          </div>
          <div class="card" style="padding:0">
            ${WAIVER_DOCS.map(d => {
              const signedCount = Object.values(WAIVER_RECORDS).filter(r => r[d.id]?.signedAt).length;
              const isDefault = WAIVER_DOCS_DEFAULT.some(def => def.id === d.id);
              return `
                <div style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border)">
                  <span style="font-size:18px;width:24px;text-align:center">${d.icon}</span>
                  <div style="flex:1">
                    <div style="font-weight:600;font-size:13px">${d.label}</div>
                    <div style="font-size:11px;color:var(--text-muted)">${signedCount} student${signedCount !== 1 ? 's' : ''} signed</div>
                  </div>
                  ${isDefault
                    ? `<span style="font-size:11px;color:var(--text-faint);font-style:italic">built-in</span>`
                    : `<button class="btn btn-secondary" style="font-size:11px;padding:3px 10px;color:var(--danger,#dc2626);border-color:var(--danger,#dc2626)"
                         onclick="deleteWaiverDoc('${d.id}')">✕ Delete</button>`}
                </div>`;
            }).join('')}
            <!-- Add new doc type form -->
            <div style="padding:var(--sp-4);background:var(--surface-alt);display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap">
              <input id="wdoc-icon" class="input" style="width:64px;text-align:center;font-size:18px"
                placeholder="📄" maxlength="2" />
              <input id="wdoc-label" class="input" style="flex:1;min-width:160px"
                placeholder="Document name (e.g. Sparring Agreement)"
                onkeydown="if(event.key==='Enter') addWaiverDoc()" />
              <button class="btn btn-secondary" style="white-space:nowrap" onclick="addWaiverDoc()">+ Add document type</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function WaiverCard(studentId) {
    const allSigned = waiverComplete(studentId);
    const rows = WAIVER_DOCS.map(doc => {
      const status = waiverStatus(studentId, doc.id);
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--sp-2) 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:8px">
            <span>${doc.icon}</span>
            <span style="font-size:13px;font-weight:500">${doc.label}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            ${status?.signedAt
              ? `<span style="font-size:12px;color:var(--text-muted)">Signed ${status.signedAt}</span>
                 <span style="color:var(--green,#16a34a);font-weight:700">✓</span>
                 <button class="btn btn-secondary" style="font-size:11px;padding:2px 8px"
                   onclick="waiverRevoke('${studentId}','${doc.id}')">Revoke</button>`
              : `<span style="color:var(--red,#dc2626);font-weight:700">✗ Missing</span>
                 <button class="btn btn-primary" style="font-size:11px;padding:2px 10px"
                   onclick="waiverSign('${studentId}','${doc.id}')">Sign</button>`}
          </div>
        </div>`;
    }).join('');

    return `
      <div class="card" style="margin-bottom:var(--sp-4)" id="waiver-card-${studentId}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3)">
          <h3 class="card-title" style="margin:0">📋 Documents &amp; Waivers</h3>
          <span class="badge ${allSigned ? '' : 'badge-warn'}" style="font-size:11px">${allSigned ? '✓ All signed' : '⚠ Incomplete'}</span>
        </div>
        ${rows}
      </div>`;
  }

  // ---------- Private Lessons -----------------------------------------------

  const PRIVATE_LESSONS_KEY = 'tatami_private_lessons';
  let PRIVATE_LESSONS = [];

  // Seed a couple of examples so the screen isn't empty on first load
  const _PL_SEEDS = [
    { id: 'pl-1', studentId: 's-1', instructorId: 'inst-1', date: '2026-05-28', time: '10:00', durationMin: 60, type: 'Technique Review',    notes: 'Guard passing fundamentals', status: 'completed' },
    { id: 'pl-2', studentId: 's-2', instructorId: 'inst-1', date: '2026-05-30', time: '09:00', durationMin: 45, type: 'Competition Prep',     notes: 'Takedown drilling',          status: 'scheduled' },
    { id: 'pl-3', studentId: 's-5', instructorId: 'inst-2', date: '2026-06-03', time: '18:30', durationMin: 60, type: 'Fundamentals',         notes: '',                           status: 'scheduled' },
  ];

  function loadPrivateLessons() {
    try {
      const saved = JSON.parse(localStorage.getItem(PRIVATE_LESSONS_KEY));
      if (Array.isArray(saved) && saved.length) {
        PRIVATE_LESSONS.splice(0, PRIVATE_LESSONS.length, ...saved);
      } else {
        PRIVATE_LESSONS.splice(0, PRIVATE_LESSONS.length, ..._PL_SEEDS);
      }
    } catch(e) { PRIVATE_LESSONS.splice(0, PRIVATE_LESSONS.length, ..._PL_SEEDS); }
  }

  function savePrivateLessons() {
    try { localStorage.setItem(PRIVATE_LESSONS_KEY, JSON.stringify(PRIVATE_LESSONS)); } catch(e) {}
  }

  // ---- Private lesson requests (student-submitted) --------------------------
  const PL_REQUESTS_KEY = 'tatami_pl_requests';

  function loadPlRequests() {
    try { return JSON.parse(localStorage.getItem(PL_REQUESTS_KEY)) || []; } catch { return []; }
  }
  function savePlRequests(reqs) {
    try { localStorage.setItem(PL_REQUESTS_KEY, JSON.stringify(reqs)); } catch {}
  }
  function plrApprove(reqId) {
    const reqs = loadPlRequests();
    const req  = reqs.find(r => r.id === reqId);
    if (!req) return;
    // Convert to a scheduled private lesson; admin can edit details after
    const lesson = {
      id:           'pl-' + Date.now(),
      studentId:    req.studentId,
      instructorId: INSTRUCTORS[0]?.id || '',
      date:         req.preferredDate,
      time:         req.preferredTime || '09:00',
      durationMin:  60,
      type:         req.focus || 'Technique Review',
      notes:        req.notes || '',
      status:       'scheduled',
    };
    PRIVATE_LESSONS.push(lesson);
    savePrivateLessons();
    req.status = 'approved';
    savePlRequests(reqs);
    document.getElementById('content').innerHTML = PrivateLessonsScreen();
  }
  function plrDismiss(reqId) {
    const reqs = loadPlRequests();
    const req  = reqs.find(r => r.id === reqId);
    if (req) req.status = 'dismissed';
    savePlRequests(reqs);
    document.getElementById('content').innerHTML = PrivateLessonsScreen();
  }

  let plDraft = null; // null = form closed, {} = form open

  function plOpenForm() {
    plDraft = { studentId: '', instructorId: INSTRUCTORS[0]?.id || '', date: '', time: '', durationMin: 60, type: 'Technique Review', notes: '' };
    document.getElementById('content').innerHTML = PrivateLessonsScreen();
  }

  function plCloseForm() {
    plDraft = null;
    document.getElementById('content').innerHTML = PrivateLessonsScreen();
  }

  function plSave() {
    const f = (id) => document.getElementById(id)?.value?.trim();
    const lesson = {
      id: 'pl-' + Date.now(),
      studentId:    f('pl-student'),
      instructorId: f('pl-instructor'),
      date:         f('pl-date'),
      time:         f('pl-time'),
      durationMin:  parseInt(f('pl-duration') || '60'),
      type:         f('pl-type'),
      notes:        f('pl-notes'),
      status:       'scheduled',
    };
    if (!lesson.studentId || !lesson.date || !lesson.time) {
      showToast('Please fill in student, date, and time.'); return;
    }
    PRIVATE_LESSONS.unshift(lesson);
    savePrivateLessons();
    plDraft = null;
    document.getElementById('content').innerHTML = PrivateLessonsScreen();
    showToast('Private lesson booked ✓');
  }

  function plUpdateStatus(id, status) {
    const lesson = PRIVATE_LESSONS.find(l => l.id === id);
    if (!lesson) return;
    lesson.status = status;
    savePrivateLessons();
    document.getElementById('content').innerHTML = PrivateLessonsScreen();
  }

  function plDelete(id) {
    const idx = PRIVATE_LESSONS.findIndex(l => l.id === id);
    if (idx === -1) return;
    PRIVATE_LESSONS.splice(idx, 1);
    savePrivateLessons();
    document.getElementById('content').innerHTML = PrivateLessonsScreen();
    showToast('Lesson removed');
  }

  // ---------- Screen: Equipment -----------------------------------------------

  const EQUIPMENT_KEY = 'tatami_equipment_v1';
  let _equipEditId  = null;  // which row has inline-edit open
  let _equipShowAdd = false; // whether add-form is visible

  function loadEquipment() {
    try {
      const saved = JSON.parse(localStorage.getItem(EQUIPMENT_KEY));
      if (saved && Array.isArray(saved) && saved.length > 0) {
        EQUIPMENT.splice(0, EQUIPMENT.length, ...saved);
      }
    } catch(e) { console.warn('loadEquipment failed', e); }
  }

  function saveEquipment() {
    try { localStorage.setItem(EQUIPMENT_KEY, JSON.stringify(EQUIPMENT)); }
    catch(e) { console.warn('saveEquipment failed', e); }
  }

  function EquipmentScreen() {
    // Load loan overrides from localStorage so edits persist
    let loans = [];
    try { loans = JSON.parse(localStorage.getItem('tatami_equipment_loans') || 'null') || EQUIPMENT_LOANS.map(l => ({...l})); }
    catch { loans = EQUIPMENT_LOANS.map(l => ({...l})); }

    function saveLoans() {
      localStorage.setItem('tatami_equipment_loans', JSON.stringify(loans));
    }

    window.equipmentLoan = function(equipmentId) {
      const stuId = document.getElementById('eq-loan-student-' + equipmentId)?.value;
      const notes = document.getElementById('eq-loan-notes-' + equipmentId)?.value.trim() || '';
      if (!stuId) return;
      const newLoan = {
        id: 'loan-' + Date.now(),
        equipmentId,
        studentId: stuId,
        borrowedAt: CONFIG.today.toISOString().slice(0,10),
        returnedAt: null,
        notes,
      };
      loans.push(newLoan);
      saveLoans();
      document.getElementById('content').innerHTML = EquipmentScreen();
    };

    window.equipmentReturn = function(loanId) {
      const loan = loans.find(l => l.id === loanId);
      if (loan) { loan.returnedAt = CONFIG.today.toISOString().slice(0,10); }
      saveLoans();
      document.getElementById('content').innerHTML = EquipmentScreen();
    };

    window.equipmentToggleAdd = function() {
      _equipShowAdd = !_equipShowAdd;
      _equipEditId  = null;
      document.getElementById('content').innerHTML = EquipmentScreen();
    };

    window.equipmentAdd = function() {
      const name      = document.getElementById('eq-add-name').value.trim();
      const category  = document.getElementById('eq-add-category').value.trim();
      const qty       = parseInt(document.getElementById('eq-add-qty').value) || 1;
      const condition = document.getElementById('eq-add-condition').value;
      const notes     = document.getElementById('eq-add-notes').value.trim();
      if (!name || !category) { showToast('Name and category are required'); return; }
      EQUIPMENT.push({ id: 'eq-' + Date.now(), category, name, qty, condition, notes });
      saveEquipment();
      _equipShowAdd = false;
      document.getElementById('content').innerHTML = EquipmentScreen();
      showToast('Equipment added');
    };

    window.equipmentDelete = function(id) {
      const idx = EQUIPMENT.findIndex(e => e.id === id);
      if (idx !== -1) { EQUIPMENT.splice(idx, 1); saveEquipment(); }
      document.getElementById('content').innerHTML = EquipmentScreen();
      showToast('Item removed');
    };

    window.equipmentToggleEdit = function(id) {
      _equipEditId = _equipEditId === id ? null : id;
      document.getElementById('content').innerHTML = EquipmentScreen();
    };

    window.equipmentSaveEdit = function(id) {
      const eq = EQUIPMENT.find(e => e.id === id);
      if (!eq) return;
      eq.name      = document.getElementById('eq-edit-name-' + id).value.trim() || eq.name;
      eq.category  = document.getElementById('eq-edit-cat-' + id).value.trim()  || eq.category;
      eq.qty       = Math.max(1, parseInt(document.getElementById('eq-edit-qty-' + id).value) || eq.qty);
      eq.condition = document.getElementById('eq-edit-cond-' + id).value;
      eq.notes     = document.getElementById('eq-edit-notes-' + id).value.trim();
      saveEquipment();
      _equipEditId = null;
      document.getElementById('content').innerHTML = EquipmentScreen();
      showToast('Equipment updated');
    };

    // Active loans (not yet returned)
    const activeLoans = loans.filter(l => !l.returnedAt);

    // How many units of each item are currently on loan
    function onLoanCount(eqId) {
      return activeLoans.filter(l => l.equipmentId === eqId).length;
    }

    // Group equipment by category
    const categories = [...new Set(EQUIPMENT.map(e => e.category))];

    const conditionColor = { new: '#16a34a', good: '#2563eb', fair: '#d97706', poor: '#dc2626' };
    const conditionBg    = { new: '#f0fdf4', good: '#eff6ff', fair: '#fffbeb', poor: '#fef2f2' };

    const studentOptions = STUDENTS.map(s =>
      `<option value="${s.id}">${s.name}</option>`
    ).join('');

    const categorySections = categories.map(cat => {
      const items = EQUIPMENT.filter(e => e.category === cat);
      const rows = items.map(eq => {
        const loaned  = onLoanCount(eq.id);
        const avail   = Math.max(0, eq.qty - loaned);
        const isEditing = _equipEditId === eq.id;

        const loanedRows = activeLoans.filter(l => l.equipmentId === eq.id).map(loan => {
          const stu = STUDENTS.find(s => s.id === loan.studentId);
          return `
            <div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-top:4px;background:#f8fafc;border-radius:6px;padding:4px 8px">
              <span style="color:var(--text-muted)">🧑 ${stu?.name || loan.studentId}</span>
              <span style="color:var(--text-faint)">since ${loan.borrowedAt}</span>
              ${loan.notes ? `<span class="faint">· ${loan.notes}</span>` : ''}
              <button class="btn btn-sm" style="margin-left:auto;font-size:11px;padding:2px 8px"
                onclick="equipmentReturn('${loan.id}')">Return</button>
            </div>`;
        }).join('');

        const loanForm = (!isEditing && avail > 0) ? `
          <div style="display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap">
            <select id="eq-loan-student-${eq.id}" class="input" style="font-size:12px;padding:4px 8px;flex:1;min-width:120px">
              <option value="">— Student —</option>
              ${studentOptions}
            </select>
            <input id="eq-loan-notes-${eq.id}" class="input" placeholder="Notes (optional)"
              style="font-size:12px;padding:4px 8px;flex:1;min-width:100px" />
            <button class="btn btn-primary" style="font-size:12px;padding:4px 12px;white-space:nowrap"
              onclick="equipmentLoan('${eq.id}')">Loan out</button>
          </div>` : '';

        const editForm = isEditing ? `
          <div style="margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:flex-end">
            <div style="flex:2;min-width:140px">
              <label style="font-size:11px;color:var(--text-muted);font-weight:600;display:block;margin-bottom:3px">Name</label>
              <input id="eq-edit-name-${eq.id}" class="input" value="${eq.name.replace(/"/g,'&quot;')}" style="font-size:12px;padding:4px 8px" />
            </div>
            <div style="flex:1;min-width:110px">
              <label style="font-size:11px;color:var(--text-muted);font-weight:600;display:block;margin-bottom:3px">Category</label>
              <input id="eq-edit-cat-${eq.id}" class="input" value="${eq.category.replace(/"/g,'&quot;')}" style="font-size:12px;padding:4px 8px" />
            </div>
            <div style="flex:0 0 70px">
              <label style="font-size:11px;color:var(--text-muted);font-weight:600;display:block;margin-bottom:3px">Qty</label>
              <input id="eq-edit-qty-${eq.id}" class="input" type="number" min="1" value="${eq.qty}" style="font-size:12px;padding:4px 8px" />
            </div>
            <div style="flex:0 0 100px">
              <label style="font-size:11px;color:var(--text-muted);font-weight:600;display:block;margin-bottom:3px">Condition</label>
              <select id="eq-edit-cond-${eq.id}" class="input" style="font-size:12px;padding:4px 8px">
                ${['new','good','fair','poor'].map(c => `<option value="${c}"${eq.condition===c?' selected':''}>${c}</option>`).join('')}
              </select>
            </div>
            <div style="flex:2;min-width:140px">
              <label style="font-size:11px;color:var(--text-muted);font-weight:600;display:block;margin-bottom:3px">Notes</label>
              <input id="eq-edit-notes-${eq.id}" class="input" value="${(eq.notes||'').replace(/"/g,'&quot;')}" style="font-size:12px;padding:4px 8px" />
            </div>
            <div style="display:flex;gap:var(--sp-2);margin-bottom:2px">
              <button class="btn btn-primary" style="font-size:12px;padding:4px 12px;white-space:nowrap"
                onclick="equipmentSaveEdit('${eq.id}')">Save</button>
              <button class="btn btn-secondary" style="font-size:12px;padding:4px 10px"
                onclick="equipmentToggleEdit('${eq.id}')">Cancel</button>
            </div>
          </div>` : '';

        return `
          <div class="list-row" style="grid-template-columns:1fr auto;display:block;padding:var(--sp-3) var(--sp-4);${isEditing ? 'background:var(--surface-alt)' : ''}">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3)">
              <div style="flex:1">
                <div style="font-weight:600;font-size:14px">${eq.name}</div>
                ${eq.notes ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px">${eq.notes}</div>` : ''}
              </div>
              <div style="display:flex;gap:var(--sp-2);align-items:center;flex-shrink:0">
                <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
                  background:${conditionBg[eq.condition] || '#f3f4f6'};color:${conditionColor[eq.condition] || '#374151'}">${eq.condition}</span>
                <div style="text-align:right">
                  <span style="font-size:20px;font-weight:700;color:${avail === 0 ? 'var(--danger)' : 'var(--text)'}">${avail}</span>
                  <span style="font-size:11px;color:var(--text-muted)">/${eq.qty}</span>
                  <div style="font-size:10px;color:var(--text-faint)">available</div>
                </div>
                <button class="btn btn-sm" title="Edit" style="font-size:11px;padding:3px 8px;${isEditing ? 'background:var(--accent);color:#fff;border-color:var(--accent)' : ''}"
                  onclick="equipmentToggleEdit('${eq.id}')">✏</button>
                <button class="btn btn-sm" title="Delete" style="font-size:11px;padding:3px 8px;color:var(--danger)"
                  onclick="if(confirm('Remove ${eq.name.replace(/'/g,"\\'")}?')) equipmentDelete('${eq.id}')">✕</button>
              </div>
            </div>
            ${editForm}
            ${loanedRows}
            ${loanForm}
          </div>`;
      }).join('');

      return `
        <div class="card" style="padding:0;margin-bottom:var(--sp-4)">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;
            color:var(--text-muted);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border)">${cat}</div>
          <div class="list" style="padding:0">${rows}</div>
        </div>`;
    }).join('');

    // Active loans summary card
    const loanSummaryRows = activeLoans.map(loan => {
      const stu = STUDENTS.find(s => s.id === loan.studentId);
      const eq  = EQUIPMENT.find(e => e.id === loan.equipmentId);
      const daysOut = Math.floor((new Date(CONFIG.today) - new Date(loan.borrowedAt)) / 86400000);
      return `
        <div class="list-row" style="grid-template-columns:40px 1fr auto auto">
          <div class="avatar" style="font-size:11px">${stu?.initials || '?'}</div>
          <div>
            <div style="font-weight:600;font-size:13px">${stu?.name || loan.studentId}</div>
            <div style="font-size:12px;color:var(--text-muted)">${eq?.name || loan.equipmentId}</div>
          </div>
          <div style="font-size:12px;color:var(--text-muted);text-align:right">${daysOut}d out</div>
          <button class="btn btn-sm" style="font-size:11px;padding:3px 10px"
            onclick="equipmentReturn('${loan.id}')">Return</button>
        </div>`;
    }).join('');

    const existingCategories = [...new Set(EQUIPMENT.map(e => e.category))];

    const addForm = _equipShowAdd ? `
      <div class="card" style="margin-bottom:var(--sp-4);padding:var(--sp-4)">
        <div style="font-size:13px;font-weight:700;margin-bottom:var(--sp-3)">➕ Add equipment</div>
        <div style="display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:flex-end">
          <div style="flex:2;min-width:140px">
            <label style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:3px">Name *</label>
            <input id="eq-add-name" class="input" placeholder="e.g. Gi A2 (S)" style="font-size:13px" />
          </div>
          <div style="flex:1;min-width:120px">
            <label style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:3px">Category *</label>
            <input id="eq-add-category" class="input" list="eq-cat-list" placeholder="e.g. Loaner Gi" style="font-size:13px" />
            <datalist id="eq-cat-list">${existingCategories.map(c=>`<option value="${c}">`).join('')}</datalist>
          </div>
          <div style="flex:0 0 70px">
            <label style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:3px">Qty</label>
            <input id="eq-add-qty" class="input" type="number" min="1" value="1" style="font-size:13px" />
          </div>
          <div style="flex:0 0 100px">
            <label style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:3px">Condition</label>
            <select id="eq-add-condition" class="input" style="font-size:13px">
              <option value="new">new</option>
              <option value="good" selected>good</option>
              <option value="fair">fair</option>
              <option value="poor">poor</option>
            </select>
          </div>
          <div style="flex:2;min-width:140px">
            <label style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:3px">Notes</label>
            <input id="eq-add-notes" class="input" placeholder="Optional" style="font-size:13px" />
          </div>
          <div style="display:flex;gap:var(--sp-2);margin-bottom:2px">
            <button class="btn btn-primary" onclick="equipmentAdd()">Add item</button>
            <button class="btn btn-secondary" onclick="equipmentToggleAdd()">Cancel</button>
          </div>
        </div>
      </div>` : '';

    return `
      <div style="max-width:900px;margin:0 auto">
        <div class="row-between" style="margin-bottom:var(--sp-5)">
          <div>
            <h1 class="h1" style="margin-bottom:var(--sp-1)">Equipment</h1>
            <p class="muted">Academy gear inventory and loaner tracking.</p>
          </div>
          <div style="display:flex;gap:var(--sp-3);align-items:center">

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>openmat.me</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --border: #e4e6ea;
      --text: #0f172a;
      --text-muted: #5b6472;
      --primary: #14171c;
      --accent: #1a1a1a;
      --accent-hover: #000000;
      --r-md: 10px;
      --r-lg: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
      --shadow-md: 0 4px 12px rgba(15,23,42,.08), 0 1px 3px rgba(15,23,42,.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-md);
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 400px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .logo-mark svg { width: 32px; height: 32px; }
    .logo-mark svg path { stroke: #0a0a0a; }
    .logo-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .stack { display: flex; flex-direction: column; gap: 12px; }

    .btn {
      display: block;
      width: 100%;
      padding: 13px 20px;
      border-radius: var(--r-md);
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      border: none;
      transition: background .15s, border-color .15s, transform .08s;
    }
    .btn:active { transform: scale(.98); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { border-color: #adb5bd; background: #f8f9fa; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 12px;
      margin: 4px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-label="openmat.me"><path d="M18 4 H8 a4 4 0 0 0-4 4 v8 a4 4 0 0 0 4 4 h8 a4 4 0 0 0 4-4 V10" fill="none" stroke-width="2.6" stroke-linecap="round"></path></svg></div>
      <div class="logo-name">openmat.me</div>
    </div>

    <h1>Welcome</h1>
    <p class="subtitle">Manage your martial arts academy or join one as a student.</p>

    <div class="stack">
      <a href="admin.html#/setup" class="btn btn-primary">Register your academy</a>

      <div class="divider">or</div>

      <a href="admin.html" class="btn btn-secondary">Log in as admin</a>
      <a href="student.html" class="btn btn-secondary">Log in as student</a>
    </div>
  </div>

  <div class="footer">
    By continuing you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a>
  </div>
</body>
</html>

// ─── Profile Screen ───────────────────────────────────────────────────────────
function renderMe() {
  const student = STUDENTS.find(s => s.id === currentStudentId);
  if (!student) { go(''); return ''; }

  const enrollment = ENROLLMENTS.find(e => e.studentId === currentStudentId);
  const gradingSystem = enrollment ? GRADING_SYSTEMS.find(g => g.id === enrollment.gradingSystemId) : null;
  const level = enrollment && gradingSystem ? gradingSystem.levels.find(l => l.id === enrollment.currentLevelId) : null;
  const sport = enrollment ? SPORTS.find(s => s.id === enrollment.sportId) : null;
  const beltColors = level ? beltColor(level.id) : null;
  const stripes = enrollment ? enrollment.currentStripes || 0 : 0;

  // Stats
  const attendedRecords = ATTENDANCE.filter(a => a.studentId === currentStudentId && a.attended);
  const attended = attendedRecords.length;
  const streak = getAttendanceStreak(currentStudentId);

  // Upcoming bookings
  const myBookings = BOOKINGS
    .filter(b => b.studentId === currentStudentId && b.status === 'booked')
    .map(b => resolveClass(b.classId))
    .filter(c => c && c.status === 'scheduled' && new Date(c.startsAt) > new Date())
    .sort((a, b) => new Date(a.startsAt) - new Date(b.startsAt));

  // Attendance history — past classes attended, newest first
  const attendedClasses = attendedRecords
    .map(a => resolveClass(a.classId))
    .filter(Boolean)
    .sort((a, b) => new Date(b.startsAt) - new Date(a.startsAt));

  const membershipLabel = {
    'plan-monthly': 'Monthly',
    'plan-unlimited': 'Unlimited',
    'plan-annual': 'Annual',
  }[enrollment?.membership] || 'Active';

  // Membership price + next renewal date
  const _PLAN_DEFAULTS = [
    { id: 'plan-monthly',   price: '€80/mo',  period: 'monthly' },
    { id: 'plan-unlimited', price: '€120/mo', period: 'monthly' },
    { id: 'plan-annual',    price: '€800/yr', period: 'annual'  },
  ];
  let _storedPlans = _PLAN_DEFAULTS;
  try {
    const _sp = JSON.parse(localStorage.getItem('tatami_membership_plans_v1'));
    if (Array.isArray(_sp) && _sp.length) _storedPlans = _sp;
  } catch {}
  const _myPlanInfo = _storedPlans.find(p => p.id === enrollment?.membership) || _PLAN_DEFAULTS.find(p => p.id === enrollment?.membership);
  const _membershipPrice = _myPlanInfo?.price || null;
  const _isAnnual = enrollment?.membership === 'plan-annual';

  function _nextRenewalDate(joinedAt, annual) {
    if (!joinedAt) return null;
    const joined = new Date(joinedAt);
    const now = new Date();
    const dayOfMonth = joined.getDate();
    if (annual) {
      // Next anniversary of joinedAt year
      let yr = now.getFullYear();
      const thisYear = new Date(yr, joined.getMonth(), dayOfMonth);
      if (thisYear <= now) yr++;
      return new Date(yr, joined.getMonth(), dayOfMonth);
    } else {
      // Next monthly recurrence
      let d = new Date(joined);
      while (d <= now) {
        d = new Date(d.getFullYear(), d.getMonth() + 1, dayOfMonth);
      }
      return d;
    }
  }
  const _renewalDate = _nextRenewalDate(student.joinedAt, _isAnnual);
  const _renewalStr = _renewalDate
    ? _renewalDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
    : null;
  const _daysToRenewal = _renewalDate
    ? Math.ceil((_renewalDate - new Date()) / 86400000)
    : null;
  const _renewalUrgent = _daysToRenewal !== null && _daysToRenewal <= 7;
  const _memberSinceStr = student.joinedAt
    ? new Date(student.joinedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
    : null;

  // Belt progression — current belt card + level history
  const levelIdx = gradingSystem ? gradingSystem.levels.findIndex(l => l.id === enrollment?.currentLevelId) : -1;
  const levelSinceStr = enrollment?.levelSince
    ? new Date(enrollment.levelSince).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
    : '';
  const allLevels = gradingSystem?.levels || [];
  const pastLevels = levelIdx > 0 ? allLevels.slice(0, levelIdx).reverse() : [];

  // Promotion progress card
  let promotionProgressCard = '';
  if (enrollment && gradingSystem) {
    const currentLvl = gradingSystem.levels.find(l => l.id === enrollment.currentLevelId);
    const nextLvl    = gradingSystem.levels.find(l => l.order === (currentLvl?.order ?? -1) + 1);
    if (currentLvl && nextLvl) {
      const ruleKey = `${currentLvl.id}-to-${nextLvl.id}`;
      const rule    = gradingSystem.promotionRules?.[ruleKey];
      if (rule) {
        const levelSinceMs = enrollment.levelSince ? new Date(enrollment.levelSince).getTime() : 0;
        const classesAtLevel = ATTENDANCE.filter(a => {
          if (!a.attended || a.studentId !== currentStudentId) return false;
          const cls = CLASSES.find(c => c.id === a.classId);
          return cls && new Date(cls.startsAt).getTime() >= levelSinceMs;
        }).length;
        const nowMs = CONFIG.today instanceof Date ? CONFIG.today.getTime() : Date.now();
        const monthsAtLevel = enrollment.levelSince
          ? Math.floor((nowMs - new Date(enrollment.levelSince).getTime()) / (30.5 * 24 * 60 * 60 * 1000))
          : 0;
        const classReq  = rule.minClassesAtLevel  || 0;
        const monthReq  = rule.minMonthsAtLevel   || 0;
        const classPct  = classReq  > 0 ? Math.min(100, Math.round((classesAtLevel / classReq) * 100)) : 100;
        const monthPct  = monthReq  > 0 ? Math.min(100, Math.round((monthsAtLevel  / monthReq) * 100)) : 100;
        const isReady   = classPct >= 100 && monthPct >= 100;
        const nextColor = beltColor(nextLvl.id);

        const nextLvlName = typeof nextLvl.name === 'object' ? t(nextLvl.name) : nextLvl.name;
        const currLvlName = typeof currentLvl.name === 'object' ? t(currentLvl.name) : currentLvl.name;
        promotionProgressCard = `
          <div class="section-hd">Progress to ${nextLvlName}</div>
          <div class="card" style="padding:16px 20px">
            ${isReady ? (() => {
              const reqDate = getBeltTestRequestDate(currentStudentId);
              const reqLabel = reqDate
                ? `<span style="font-size:11px;color:var(--success);font-weight:600">✓ Request sent ${new Date(reqDate).toLocaleDateString('en-GB', { day:'numeric', month:'short' })}</span>`
                : `<button onclick="requestBeltTest('${currentStudentId}','${student.name.replace(/'/g,"\\'")}')"
                     style="background:var(--success);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap">
                     🥋 Request belt test
                   </button>`;
              return `
              <div style="background:var(--success-bg);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <span style="font-size:20px;flex-shrink:0">🎖</span>
                <div style="flex:1;min-width:0">
                  <div style="font-size:13px;font-weight:700;color:var(--success)">You may be ready for promotion!</div>
                  <div style="font-size:11px;color:var(--success);margin-top:1px">Notify your instructor to schedule a grading session.</div>
                </div>
                ${reqLabel}
              </div>`;
            })() : ''}
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
              <span style="font-size:12px;color:var(--text-muted)">Working towards</span>
              <span style="font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;
                background:${nextColor.bg};color:${nextColor.text}">
                ${nextLvlName}
              </span>
            </div>
            ${classReq > 0 ? `
              <div style="margin-bottom:12px">
                <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
                  <span style="color:var(--text-muted)">Classes at ${currLvlName} belt</span>
                  <span style="font-weight:700;color:${classPct >= 100 ? 'var(--success)' : 'var(--text)'}">${classesAtLevel} / ${classReq}</span>
                </div>
                <div style="height:6px;background:var(--surface-alt);border-radius:3px;overflow:hidden">
                  <div style="height:100%;width:${classPct}%;background:${classPct >= 100 ? 'var(--success)' : 'var(--accent)'};border-radius:3px;transition:width .4s"></div>
                </div>
              </div>
            ` : ''}
            ${monthReq > 0 ? `
              <div>
                <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
                  <span style="color:var(--text-muted)">Time at ${currLvlName} belt</span>
                  <span style="font-weight:700;color:${monthPct >= 100 ? 'var(--success)' : 'var(--text)'}">${monthsAtLevel} / ${monthReq} months</span>
                </div>
                <div style="height:6px;background:var(--surface-alt);border-radius:3px;overflow:hidden">
                  <div style="height:100%;width:${monthPct}%;background:${monthPct >= 100 ? 'var(--success)' : 'var(--accent)'};border-radius:3px;transition:width .4s"></div>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }
    }
  }

  const progressionRows = pastLevels.map(lvl => {
    const c = beltColor(lvl.id);
    return `
      <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
        <span style="width:10px;height:10px;border-radius:50%;background:${c.dot};flex-shrink:0"></span>
        <span style="font-size:14px;color:var(--text-muted)">${typeof lvl.name === 'object' ? t(lvl.name) : lvl.name}</span>
      </div>`;
  }).join('');

  const upcomingRows = myBookings.slice(0, 5).map(cls => `
    <div class="class-row" onclick="go('classes/${cls.id}')">
      <div class="class-date-col">
        <div class="class-day">${dayName(cls.startsAt)}</div>
        <div class="class-num">${dayNum(cls.startsAt)}</div>
      </div>
      <div class="class-info">
        <div class="class-type">${cls.classType}</div>
        <div class="class-meta">${fmtTime(cls.startsAt)} · ${cls.durationMin} min</div>
      </div>
      <span class="class-badge badge-booked">Booked</span>
      <span style="color:var(--text-faint);font-size:18px;margin-left:4px">›</span>
    </div>
  `).join('');

  const historyRows = attendedClasses.slice(0, 20).map(cls => {
    const myNote = getMyNote(cls.id);
    return `
    <div onclick="go('classes/${cls.id}')" style="display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer">
      <div style="min-width:44px;text-align:center">
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-faint)">${dayName(cls.startsAt).slice(0,3)}</div>
        <div style="font-size:17px;font-weight:700;line-height:1.1">${dayNum(cls.startsAt)}</div>
        <div style="font-size:10px;color:var(--text-faint)">${new Date(cls.startsAt).toLocaleDateString('en-GB',{month:'short',year:'numeric'})}</div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600">${cls.classType}</div>
        <div style="font-size:12px;color:var(--text-muted)">${fmtTime(cls.startsAt)} · ${cls.durationMin} min</div>
        ${myNote ? `<div style="font-size:11px;color:var(--text-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px">✏️ ${myNote.text}</div>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
        <span style="font-size:12px;font-weight:600;color:var(--success)">✓</span>
        <span style="color:var(--text-faint);font-size:16px">›</span>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="screen">
      <div class="topbar">
        <div class="topbar-title">My Profile</div>
        <div style="display:flex;gap:10px;align-items:center">
          <button id="student-theme-btn" onclick="toggleTheme()" title="Toggle dark / light mode"
            style="background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;padding:4px 9px;color:var(--text);font-family:var(--font);line-height:1"
          >${(localStorage.getItem('tatami_theme') || 'light') === 'dark' ? '☀' : '☾'}</button>
          <button style="background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text);padding:5px 10px;font-family:var(--font)" onclick="go('edit-profile')">✏ Edit</button>
          <button style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--text-muted);font-family:var(--font)" onclick="logout()">Log out</button>
        </div>
      </div>

      <div class="content" style="padding-top:20px">
        <!-- Identity -->
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
          <div class="avatar">${esc(student.initials)}</div>
          <div>
            <div style="font-size:20px;font-weight:700;letter-spacing:-0.3px">${esc(student.name)}</div>
            <div style="font-size:13px;color:var(--text-muted);margin-top:2px">${esc(student.contact || '')}${student.phone ? ' · ' + esc(student.phone) : ''}</div>
            ${level && beltColors ? `
              <div style="margin-top:6px">
                <span class="belt-pill" style="background:${beltColors.bg};color:${beltColors.text}">
                  <span class="belt-dot" style="background:${beltColors.dot}"></span>
                  ${typeof level.name === 'object' ? t(level.name) : level.name}${stripes > 0 ? ' · ' + '●'.repeat(stripes) : ''}
                </span>
              </div>` : ''}
          </div>
        </div>

        <!-- Stats -->
        <div class="stat-row">
          <div class="stat-card">
            <div class="stat-val">${attended}</div>
            <div class="stat-lbl">Classes</div>
          </div>
          <div class="stat-card">
            <div class="stat-val">${stripes}</div>
            <div class="stat-lbl">Stripes</div>
          </div>
          <div class="stat-card">
            <div class="stat-val">${myBookings.length}</div>
            <div class="stat-lbl">Upcoming</div>
          </div>
          <div class="stat-card" style="${streak >= 3 ? 'background:linear-gradient(135deg,#fff7ed,#fff);border-color:#fed7aa' : ''}">
            <div class="stat-val" style="${streak >= 3 ? 'color:#ea580c' : ''}">${streak >= 1 ? '🔥' : '—'}&thinsp;${streak > 0 ? streak : ''}</div>
            <div class="stat-lbl">Wk streak</div>
          </div>
        </div>

        <!-- Attendance heatmap -->
        ${buildAttendanceHeatmap(currentStudentId)}

        <!-- Training goal -->
        ${buildTrainingGoalSection(false)}

        <!-- Belt progression -->
        <div class="section-hd">${tr('sapp.beltProgression')}</div>
        <div class="card" style="padding:0 16px">
          <!-- Current belt -->
          <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)">
            <div style="display:flex;align-items:center;gap:12px">
              ${beltColors ? `<span style="width:12px;height:12px;border-radius:50%;background:${beltColors.dot}"></span>` : ''}
              <div>
                <div style="font-size:15px;font-weight:700">${level ? (typeof level.name === 'object' ? t(level.name) : level.name) : '—'}</div>
                ${levelSinceStr ? `<div style="font-size:11px;color:var(--text-muted)">Since ${levelSinceStr}</div>` : ''}
              </div>
            </div>
            <span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--accent-bg);color:var(--accent)">Current</span>
          </div>
          ${progressionRows || `<div style="padding:12px 0;font-size:13px;color:var(--text-muted)">Starting belt — keep training!</div>`}
        </div>

        <!-- Promotion progress -->
        ${promotionProgressCard}

        <!-- Technique progress shortcut -->
        ${(() => {
          const totalItems = CURRICULUM_ITEMS.length;
          if (totalItems === 0) return '';
          let mastered = new Set();
          try {
            const raw = JSON.parse(localStorage.getItem('tatami_student_mastery') || '{}');
            mastered = new Set(raw[currentStudentId] || []);
          } catch {}
          const masteredCount = CURRICULUM_ITEMS.filter(i => mastered.has(i.id)).length;
          const pct = totalItems ? Math.round((masteredCount / totalItems) * 100) : 0;
          const enr2 = ENROLLMENTS.find(e => e.studentId === currentStudentId);
          const beltBarColor = enr2 ? (beltColor(enr2.currentLevelId || '')?.dot || 'var(--accent)') : 'var(--accent)';
          return `
            <div class="section-hd">${tr('sapp.techniqueProgress')}</div>
            <div class="card" onclick="go('progress')" style="padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:14px">
              <div style="flex:1">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                  <span style="font-size:14px;font-weight:600">Overall mastery</span>
                  <span style="font-size:16px;font-weight:800;color:${pct === 100 ? 'var(--success)' : 'var(--text)'}">${pct}%</span>
                </div>
                <div style="height:6px;background:var(--surface-alt);border-radius:3px;overflow:hidden;margin-bottom:6px">
                  <div style="height:100%;width:${pct}%;background:${beltBarColor === '#e5e7eb' ? 'var(--accent)' : beltBarColor};border-radius:3px;transition:width .4s ease"></div>
                </div>
                <div style="font-size:12px;color:var(--text-muted)">${masteredCount} of ${totalItems} techniques · tap to view all</div>
              </div>
              <span style="color:var(--text-faint);font-size:22px">›</span>
            </div>`;
        })()}

        <!-- Achievements -->
        ${(() => {
          const totalAtt = attendedRecords.length;
          const joinedMs2 = student.joinedAt ? new Date(student.joinedAt).getTime() : 0;
          const monthsJoined2 = joinedMs2 ? Math.floor((Date.now() - joinedMs2) / (30.5 * 24 * 60 * 60 * 1000)) : 0;
          let compResults2 = [];
          try {
            // Read from shared tatami_v1_data if available
            const saved = JSON.parse(localStorage.getItem('tatami_v1_data') || '{}');
            compResults2 = (saved.competitionResults || []).filter(r => r.studentId === currentStudentId);
          } catch {}
          const hasGold2   = compResults2.some(r => r.medal === 'gold');
          const hasPodium2 = compResults2.some(r => ['gold','silver','bronze'].includes(r.medal));
          const levelIdx2  = gradingSystem ? gradingSystem.levels.findIndex(l => l.id === enrollment?.currentLevelId) : 0;
          const hasPromo2  = !!enrollment?.lastPromotionAt;

          const allBadges = [
            { icon:'🎯', label:'First Step',      desc:'Attended first class',          earned: totalAtt >= 1 },
            { icon:'💪', label:'10 Classes',       desc:'Attended 10 classes',           earned: totalAtt >= 10 },
            { icon:'⚡', label:'50 Classes',       desc:'Attended 50 classes',           earned: totalAtt >= 50 },
            { icon:'🔥', label:'100 Classes',      desc:'Attended 100 classes',          earned: totalAtt >= 100 },
            { icon:'⭐', label:'200 Classes',      desc:'Attended 200 classes',          earned: totalAtt >= 200 },
            { icon:'📅', label:'3 Month Member',   desc:'Member for 3+ months',          earned: monthsJoined2 >= 3 },
            { icon:'📅', label:'6 Month Member',   desc:'Member for 6+ months',          earned: monthsJoined2 >= 6 },
            { icon:'🏠', label:'1 Year Member',    desc:'Member for 1+ year',            earned: monthsJoined2 >= 12 },
            { icon:'🏆', label:'2 Year Member',    desc:'Member for 2+ years',           earned: monthsJoined2 >= 24 },
            { icon:'🥋', label:'First Promotion',  desc:'Earned first belt promotion',   earned: hasPromo2 },
            { icon:'🎖', label:'Double Stripe',    desc:'Promoted at least twice',       earned: levelIdx2 >= 2 },
            { icon:'🎽', label:'Competitor',       desc:'Entered a competition',         earned: compResults2.length > 0 },
            { icon:'🥈', label:'Podium Finish',    desc:'Top 3 in competition',          earned: hasPodium2 },
            { icon:'🥇', label:'Gold Medalist',    desc:'Won gold in competition',       earned: hasGold2 },
          ];
          const earnedCount2 = allBadges.filter(b => b.earned).length;
          const badgePills = allBadges.map(b => `
            <div title="${b.desc}" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;opacity:${b.earned?'1':'0.25'};filter:${b.earned?'none':'grayscale(1)'}">
              <div style="font-size:26px;line-height:1">${b.icon}</div>
              <div style="font-size:9px;font-weight:600;text-align:center;color:${b.earned?'var(--text)':'var(--text-muted)'};line-height:1.3">${b.label}</div>
            </div>`).join('');
          return `
            <div class="section-hd">Achievements <span style="font-weight:400;color:var(--text-muted);font-size:12px">${earnedCount2} / ${allBadges.length}</span></div>
            <div class="card" style="padding:16px 20px">
              <div style="display:flex;flex-wrap:wrap;gap:14px 10px;justify-content:flex-start">
                ${badgePills}
              </div>
            </div>`;
        })()}

        <!-- Membership -->
        <div class="section-hd">Membership</div>
        <div class="card" style="padding:16px 20px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${_renewalStr || _memberSinceStr ? '12px' : '0'}">
            <div>
              <div style="font-size:15px;font-weight:600">${membershipLabel} plan${_membershipPrice ? ` <span style="font-size:13px;font-weight:400;color:var(--text-muted)">· ${_membershipPrice}</span>` : ''}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${sport ? (typeof sport.name === 'object' ? t(sport.name) : sport.name) : 'BJJ'}</div>
            </div>
            <span style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--success-bg);color:var(--success)">Active</span>
          </div>
          ${_renewalStr || _memberSinceStr ? `
          <div style="display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:12px">
            ${_renewalStr ? `
            <div style="flex:1;min-width:120px">
              <div style="font-size:10px;text-transform:uppercase;font-weight:700;color:var(--text-faint);letter-spacing:.05em;margin-bottom:2px">Next renewal</div>
              <div style="font-size:13px;font-weight:600;color:${_renewalUrgent ? '#d97706' : 'var(--text)'}">
                ${_renewalStr}${_renewalUrgent ? ` <span style="font-size:11px;color:#d97706">· in ${_daysToRenewal}d</span>` : _daysToRenewal !== null ? ` <span style="font-size:11px;color:var(--text-faint)">· in ${_daysToRenewal}d</span>` : ''}
              </div>
            </div>` : ''}
            ${_memberSinceStr ? `
            <div style="flex:1;min-width:120px">
              <div style="font-size:10px;text-transform:uppercase;font-weight:700;color:var(--text-faint);letter-spacing:.05em;margin-bottom:2px">Member since</div>
              <div style="font-size:13px;font-weight:600;color:var(--text)">${_memberSinceStr}</div>
            </div>` : ''}
          </div>` : ''}
        </div>

        <!-- Training Hold -->
        ${renderHoldCard()}

        <!-- Injuries -->
        ${(() => { if (isStudentTenant()) return '';
          const myInj = (typeof STUDENT_INJURIES !== 'undefined'
            ? STUDENT_INJURIES.filter(i => i.studentId === currentStudentId)
            : []).sort((a, b) => b.loggedAt.localeCompare(a.loggedAt));
          const activeInj = myInj.filter(i => i.status === 'active');
          const pastInj = myInj.filter(i => i.status !== 'active').slice(0, 3);

          const injTypeLabel = { sprain: 'Sprain', strain: 'Strain', bruise: 'Bruise', soreness: 'Soreness', fracture: 'Fracture', cut: 'Cut/Abrasion', other: 'Other' };
          const injTypeColor = { sprain: '#dc2626', strain: '#d97706', bruise: '#7c3aed', soreness: '#2563eb', fracture: '#dc2626', cut: '#d97706', other: '#6b7280' };

          const activeRows = activeInj.map(inj => `
            <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
              <div style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#fef2f2;color:#dc2626">🩹</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:600">${inj.bodyPart}</div>
                <div style="font-size:11px;color:${injTypeColor[inj.type]||'#6b7280'};font-weight:600;margin-top:1px">${injTypeLabel[inj.type]||inj.type} · ${inj.date}</div>
                ${inj.notes ? `<div style="font-size:11px;color:var(--text-faint);font-style:italic;margin-top:2px">${inj.notes}</div>` : ''}
              </div>
              <button onclick="studentResolveInjury('${inj.id}')"
                style="flex-shrink:0;font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px;
                border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;white-space:nowrap">
                ✓ Recovered
              </button>
            </div>`).join('');

          const pastRows = pastInj.map(inj => `
            <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
              <div style="width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--surface-alt);color:var(--text-muted)">🩹</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:600;color:var(--text-muted)">${inj.bodyPart}</div>
                <div style="font-size:11px;color:var(--text-faint)">${injTypeLabel[inj.type]||inj.type} · ${inj.date} · Recovered</div>
              </div>
            </div>`).join('');

          const addForm = `
            <div id="inj-add-form" style="display:none;padding:14px 0 4px">
              <div style="display:flex;gap:8px;margin-bottom:8px">
                <input id="inj-body" type="text" class="input"
                  placeholder="Body part (e.g. Left knee)"
                  style="flex:1;font-size:13px;padding:8px 12px" />
                <select id="inj-type" class="input" style="flex-shrink:0;font-size:13px;padding:8px 10px;min-width:120px">
                  <option value="soreness">Soreness</option>
                  <option value="sprain">Sprain</option>
                  <option value="strain">Strain</option>
                  <option value="bruise">Bruise</option>
                  <option value="fracture">Fracture</option>
                  <option value="cut">Cut</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <textarea id="inj-notes" class="input"
                placeholder="Brief notes (optional)"
                style="width:100%;box-sizing:border-box;font-size:13px;resize:none;min-height:52px;padding:8px 12px;margin-bottom:8px"></textarea>
              <div style="display:flex;gap:8px">
                <button onclick="studentAddInjury()"
                  style="flex:1;padding:10px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer">
                  Log injury
                </button>
                <button onclick="document.getElementById('inj-add-form').style.display='none'"
                  style="padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:13px;cursor:pointer">
                  Cancel
                </button>
              </div>
            </div>`;

          const headerLabel = activeInj.length > 0
            ? `🩹 Injuries <span style="font-size:12px;font-weight:400;color:#dc2626">· ${activeInj.length} active</span>`
            : '🩹 Injuries';

          return `
            <div class="section-hd" style="display:flex;align-items:center;justify-content:space-between">
              <span>${headerLabel}</span>
              <button onclick="const f=document.getElementById('inj-add-form');f.style.display=f.style.display==='none'?'block':'none'"
                style="font-size:11px;font-weight:600;padding:4px 10px;border-radius:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer">
                + Report
              </button>
            </div>
            <div class="card" style="padding:0 16px;${activeInj.length>0?'border:1.5px solid #fca5a5':''}">
              ${activeRows}
              ${pastRows}
              ${addForm}
              ${activeInj.length===0&&pastInj.length===0 ? '<div style="padding:14px 0;font-size:13px;color:var(--text-muted)">No injuries logged. Use + Report if you have one.</div>' : ''}
              <div style="height:4px"></div>
            </div>`;
        })()}

        <!-- Documents / Waivers -->
        ${(() => { if (isStudentTenant()) return '';
          const docs = getMyWaiverStatus();
          const pending = docs.filter(d => !d.signed);
          const signed  = docs.filter(d => d.signed);
          if (!docs.length) return '';

          const pendingRows = pending.map(doc => `
            <div style="padding:12px 0;border-bottom:1px solid var(--border)">
              <div style="display:flex;align-items:center;gap:12px">
                <div style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
                  font-size:18px;flex-shrink:0;background:#fef2f2;color:#dc2626">${doc.icon}</div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:13px;font-weight:600">${doc.label}</div>
                  <div style="font-size:11px;color:#dc2626;font-weight:600;margin-top:2px">Signature required</div>
                </div>
                <button onclick="toggleWaiverForm('${doc.id}')"
                  style="flex-shrink:0;font-size:12px;font-weight:600;padding:6px 14px;border-radius:8px;
                  border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer">
                  Sign
                </button>
              </div>
              <div id="waiver-form-${doc.id}" style="display:none;margin-top:10px;padding:12px;border-radius:8px;background:var(--surface-alt)">
                <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">
                  By typing your full name below you agree to the ${doc.label}.
                </div>
                <input id="waiver-sig-${doc.id}" type="text" class="input" placeholder="Type your full name…"
                  style="width:100%;margin-bottom:8px;font-style:italic"
                  onkeydown="if(event.key==='Enter')signWaiverFromStudent('${doc.id}')" />
                <button onclick="signWaiverFromStudent('${doc.id}')"
                  style="width:100%;padding:10px;border-radius:8px;border:none;
                  background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer">
                  ✓ Sign document
                </button>
              </div>
            </div>`).join('');

          const signedRows = signed.map(doc => `
            <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
              <div style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
                font-size:18px;flex-shrink:0;background:#f0fdf4;color:#16a34a">${doc.icon}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:600">${doc.label}</div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Signed ${doc.signedAt}</div>
              </div>
              <span style="font-size:16px">✅</span>
            </div>`).join('');

          const sectionTitle = pending.length > 0
            ? `📋 Documents <span style="font-size:12px;font-weight:400;color:#dc2626">· ${pending.length} pending</span>`
            : `📋 Documents`;

          return `
            <div class="section-hd">${sectionTitle}</div>
            <div class="card" style="padding:0 16px;${pending.length > 0 ? 'border:1.5px solid #fca5a5' : ''}">
              ${pendingRows}
              ${signedRows}
              <div style="height:4px"></div>
            </div>`;
        })()}

        <!-- Class packages -->
        ${(() => { if (isStudentTenant()) return '';
          const myPkgs = getMyActivePackages(currentStudentId);
          if (!myPkgs.length) return '';
          const rows = myPkgs.map(sp => {
            const t = _STU_PKG_TYPES.find(p => p.id === sp.packageTypeId);
            if (!t) return '';
            const remaining = Math.max(0, t.classCount - sp.classesUsed);
            const pct = Math.round((sp.classesUsed / t.classCount) * 100);
            const today = new Date().toISOString().split('T')[0];
            const daysLeft = Math.round((new Date(sp.expiresAt) - new Date(today)) / 86400000);
            const urgentColor = daysLeft <= 7 ? '#d97706' : 'var(--accent)';
            return `
              <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
                <div style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#f1f3f5;color:#1a1a1a">🎟</div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:13px;font-weight:600">${t.name}</div>
                  <div style="font-size:12px;color:var(--text-muted);margin-top:2px">
                    <span style="color:${urgentColor};font-weight:600">${remaining} class${remaining===1?'':'es'} left</span>
                    · expires ${daysLeft <= 7 ? `<span style="color:#d97706">in ${daysLeft}d</span>` : sp.expiresAt}
                  </div>
                  <div style="margin-top:6px;height:5px;background:var(--border);border-radius:3px;overflow:hidden">
                    <div style="width:${pct}%;height:100%;background:${urgentColor};border-radius:3px;transition:width .3s"></div>
                  </div>
                </div>
              </div>`;
          }).join('');
          return `
            <div class="section-hd">Class packs</div>
            <div class="card" style="padding:0 16px">
              ${rows}
              <div style="height:4px"></div>
            </div>`;
        })()}

        <!-- Homework -->
        ${(() => {
          let hw = [];
          try {
            const raw = JSON.parse(localStorage.getItem('tatami_homework') || '{}');
            hw = (raw[currentStudentId] || []);
          } catch {}
          const active = hw.filter(h => !h.practicedAt);
          if (!active.length) return '';
          const todayStr = new Date().toISOString().slice(0, 10);

          function markPractised(hwId) {
            try {
              const raw = JSON.parse(localStorage.getItem('tatami_homework') || '{}');
              const arr = raw[currentStudentId] || [];
              const entry = arr.find(h => h.id === hwId);
              if (entry) entry.practicedAt = new Date().toISOString().slice(0, 10);
              raw[currentStudentId] = arr;
              localStorage.setItem('tatami_homework', JSON.stringify(raw));
            } catch {}
            app.innerHTML = renderMe();
          }
          window._hwMarkPractised = markPractised;

          const rows = active.map(h => {
            const item = CURRICULUM_ITEMS.find(i => i.id === h.itemId);
            const sec  = item ? CURRICULUM_SECTIONS.find(s => s.id === item.sectionId) : null;
            const overdue = h.dueDate && h.dueDate < todayStr;
            return `
              <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
                <div style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
                  font-size:18px;flex-shrink:0;background:${overdue ? '#fef2f2' : '#f0fdf4'};color:${overdue ? '#dc2626' : '#16a34a'}">📚</div>
                <div style="flex:1;min-width:0">
                  <div style="font-weight:600;font-size:14px">${item?.name?.en || h.itemId}</div>
                  ${sec ? `<div style="font-size:12px;color:var(--text-muted)">${sec.name?.en || ''}</div>` : ''}
                  ${h.note ? `<div style="font-size:12px;color:var(--text-muted);font-style:italic;margin-top:2px">"${h.note}"</div>` : ''}
                  ${h.dueDate ? `<div style="font-size:11px;margin-top:3px;color:${overdue ? '#dc2626' : 'var(--text-muted)'};font-weight:${overdue ? '700' : '400'}">${overdue ? '⚠ Overdue · ' : ''}Due ${h.dueDate}</div>` : ''}
                </div>
                <button onclick="_hwMarkPractised('${h.id}')"
                  style="flex-shrink:0;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;
                  border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer">
                  ✓ Done
                </button>
              </div>`;
          }).join('');

          return `
            <div class="section-hd">📚 Homework <span style="font-weight:400;color:var(--text-muted);font-size:12px">${active.length} pending</span></div>
            <div class="card" style="padding:0 16px">
              ${rows}
              <div style="height:4px"></div>
            </div>`;
        })()}

        <!-- Private lessons -->
        ${(() => { if (isStudentTenant()) return '';
          const myPL = getMyPrivateLessons(currentStudentId);
          if (!myPL.length) return '';
          const todayStr = new Date().toISOString().split('T')[0];
          const upcoming = myPL.filter(l => l.status === 'scheduled' && l.date >= todayStr);
          const past     = myPL.filter(l => l.status !== 'scheduled' || l.date < todayStr).slice(0, 3);
          const rows = upcoming.concat(past).slice(0, 5).map(l => {
            const inst = INSTRUCTORS.find(i => i.id === l.instructorId);
            const isPast = l.status === 'completed' || l.date < todayStr;
            const isToday2 = l.date === todayStr;
            const dateLabel = isToday2 ? 'Today' : new Date(l.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
            return `
              <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
                <div style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
                  background:${isPast ? 'var(--surface-alt)' : isToday2 ? 'var(--accent)' : '#ede9fe'};
                  color:${isPast ? 'var(--text-muted)' : isToday2 ? '#fff' : '#6d28d9'}">🥋</div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:13px;font-weight:600;color:${isPast ? 'var(--text-muted)' : 'var(--text)'}">${l.type || 'Private lesson'}</div>
                  <div style="font-size:12px;color:var(--text-muted);margin-top:1px">
                    ${dateLabel} · ${l.time}${l.durationMin ? ` · ${l.durationMin} min` : ''}${inst ? ` · ${esc(inst.name)}` : ''}
                  </div>
                  ${l.notes ? `<div style="font-size:11px;color:var(--text-faint);margin-top:2px;font-style:italic">${l.notes}</div>` : ''}
                </div>
                <div>
                  <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;
                    background:${l.status==='completed'?'var(--success-bg)':isToday2?'var(--accent)':'#ede9fe'};
                    color:${l.status==='completed'?'var(--success)':isToday2?'#fff':'#6d28d9'}">
                    ${l.status==='completed'?'Done':isToday2?'Today':'Upcoming'}
                  </span>
                </div>
              </div>`;
          }).join('');
          return `
            <div class="section-hd">Private lessons <span style="font-weight:400;color:var(--text-muted);font-size:12px">${upcoming.length} upcoming</span></div>
            <div class="card" style="padding:0 16px">
              ${rows}
              <div style="height:4px"></div>
            </div>`;
        })()}

        <!-- Request private lesson -->
        ${(() => { if (isStudentTenant()) return '';
          const myReqs = getMyPlRequests(currentStudentId);
          const pendingReqs = myReqs.filter(r => r.status === 'pending');
          const FOCUS_OPTIONS = ['Technique Review','Competition Prep','Fundamentals','Sparring','Conditioning','Video Review'];
          const reqRows = pendingReqs.map(r => `
            <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
              <div style="width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:#fef3c7;color:#d97706">⏳</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:600">Private lesson request</div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:2px">
                  Preferred: ${r.preferredDate}${r.preferredTime ? ' at ' + r.preferredTime : ''}
                  ${r.focus ? ' · ' + r.focus : ''}
                </div>
                ${r.notes ? `<div style="font-size:11px;color:var(--text-faint);margin-top:2px;font-style:italic">${r.notes}</div>` : ''}
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
                <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:#fef3c7;color:#d97706">Pending</span>
                <button onclick="cancelPlRequest('${r.id}')" style="background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--text-muted);cursor:pointer">Cancel</button>
              </div>
            </div>`).join('');
          const reqCard = pendingReqs.length > 0 ? `
            <div class="card" style="padding:0 16px;margin-bottom:8px">
              ${reqRows}
              <div style="height:4px"></div>
            </div>` : '';
          return `
            <div class="section-hd" style="display:flex;align-items:center;justify-content:space-between">
              <span>Private lessons</span>
              <button id="plr-toggle-btn" onclick="
                const f=document.getElementById('plr-form');
                const b=document.getElementById('plr-toggle-btn');
                if(f.style.display==='none'){f.style.display='block';b.textContent='✕ Cancel';}
                else{f.style.display='none';b.textContent='+ Request';}
              " style="font-size:12px;font-weight:600;background:none;border:1px solid var(--border);border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--accent)">+ Request</button>
            </div>
            ${reqCard}
            <div id="plr-form" style="display:none;margin-bottom:12px">
              <div class="card" style="padding:16px;border:2px solid var(--accent)">
                <div style="font-size:14px;font-weight:700;margin-bottom:12px">Request a private lesson</div>
                <div class="field" style="margin-bottom:10px">
                  <label class="label" style="font-size:12px">Preferred date</label>
                  <input id="plr-date" type="date" class="input" style="width:100%" min="${new Date().toISOString().slice(0,10)}" />
                </div>
                <div class="field" style="margin-bottom:10px">
                  <label class="label" style="font-size:12px">Preferred time (optional)</label>
                  <input id="plr-time" type="time" class="input" style="width:100%" />
                </div>
                <div class="field" style="margin-bottom:10px">
                  <label class="label" style="font-size:12px">Focus area (optional)</label>
                  <select id="plr-focus" class="input" style="width:100%">
                    <option value="">Any</option>
                    ${FOCUS_OPTIONS.map(o => `<option value="${o}">${o}</option>`).join('')}
                  </select>
                </div>
                <div class="field" style="margin-bottom:14px">
                  <label class="label" style="font-size:12px">Notes (optional)</label>
                  <input id="plr-notes" type="text" class="input" style="width:100%" placeholder="What you'd like to work on…" />
                </div>
                <button class="btn btn-primary btn-full" onclick="submitPlRequest()">Send request</button>
              </div>
            </div>`;
        })()}

        <!-- Upcoming bookings -->
        ${myBookings.length > 0 ? `
          <div class="section-hd">Upcoming classes</div>
          <div class="card">${upcomingRows}</div>
        ` : ''}

        <!-- Attendance history -->
        <div class="section-hd" style="display:flex;align-items:center;justify-content:space-between">
          <span>Attendance history</span>
          ${attendedClasses.length > 20 ? `<button onclick="go('history')" style="font-size:12px;font-weight:600;background:none;border:none;cursor:pointer;color:var(--accent);padding:0;font-family:var(--font)">See all ${attendedClasses.length} →</button>` : ''}
        </div>
        ${attendedClasses.length > 0 ? `
          <div class="card" style="padding:0 16px">
            ${historyRows}
            ${attendedClasses.length > 20 ? `<div style="padding:12px 0;text-align:center"><button onclick="go('history')" style="background:none;border:1px solid var(--border);border-radius:8px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;color:var(--accent);font-family:var(--font)">View all ${attendedClasses.length} sessions →</button></div>` : '<div style="height:1px"></div>'}
          </div>
        ` : `
          <div class="empty" style="padding:28px 16px">
            <div class="empty-icon">📋</div>
            <div class="empty-title">No classes yet</div>
            <p style="font-size:13px">Your attendance history will appear here.</p>
          </div>
        `}
      </div>
    </div>
    ${bottomNav('me')}
  `;
}

// ─── Edit Profile ─────────────────────────────────────────────────────────────
function renderEditProfile() {
  const student = STUDENTS.find(s => s.id === currentStudentId);
  if (!student) { go('me'); return ''; }

  return `
    <div class="screen">
      <div class="topbar">
        <button class="topbar-back" onclick="go('me')">← Back</button>
        <div class="topbar-title">Edit Profile</div>
        <div></div>
      </div>
      <div class="content" style="padding:16px">
        <div class="card" style="padding:20px;margin-bottom:12px">
          <div class="field">
            <label class="label">Full name</label>
            <input id="ep-name" class="input" value="${escHtml(student.name)}" placeholder="Your full name" />
          </div>
          <div class="field">
            <label class="label">Email</label>
            <input id="ep-email" class="input" type="email" value="${escHtml(student.contact || '')}" placeholder="you@example.com" />
          </div>
          <div class="field">
            <label class="label">Phone</label>
            <input id="ep-phone" class="input" type="tel" value="${escHtml(student.phone || '')}" placeholder="+351 900 000 000" />
          </div>
          <div class="field">
            <label class="label">Date of birth</label>
            <input id="ep-dob" class="input" type="date" value="${student.dob || ''}" />
          </div>
          <div class="field">
            <label class="label">Weight (kg)</label>
            <input id="ep-weight" class="input" type="number" min="20" max="300" value="${student.weightKg || ''}" placeholder="e.g. 75" />
          </div>
          <div style="margin-top:20px;display:flex;gap:10px">

            <button class="btn btn-secondary" onclick="go('me')">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Training History Screen ───────────────────────────────────────────────────
function renderHistory() {
  loadMyNotes();
  const attendedRecords = ATTENDANCE.filter(a => a.studentId === currentStudentId && a.attended);
  const allClasses = attendedRecords
    .map(a => resolveClass(a.classId))
    .filter(Boolean)
    .sort((a, b) => new Date(b.startsAt) - new Date(a.startsAt));

  // Build unique class type list for filter
  const types = ['All', ...Array.from(new Set(allClasses.map(c => c.classType))).sort()];

  // Group by month for display
  function monthKey(isoStr) {
    const d = new Date(isoStr);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function monthLabel(key) {
    const [y, m] = key.split('-');
    return new Date(parseInt(y), parseInt(m) - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  }

  const byMonth = {};
  allClasses.forEach(cls => {
    const mk = monthKey(cls.startsAt);
    if (!byMonth[mk]) byMonth[mk] = [];
    byMonth[mk].push(cls);
  });

  const monthKeys = Object.keys(byMonth).sort().reverse();

  const monthSections = monthKeys.map(mk => {
    const classes = byMonth[mk];
    const rows = classes.map(cls => {
      const myNote = getMyNote(cls.id);
      const sessionNote = SESSION_NOTES[cls.id];
      return `
        <div onclick="go('classes/${cls.id}')" style="display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer" class="hist-row" data-type="${cls.classType}">
          <div style="min-width:44px;text-align:center;flex-shrink:0">
            <div style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-faint)">${dayName(cls.startsAt).slice(0,3)}</div>
            <div style="font-size:17px;font-weight:700;line-height:1.1">${dayNum(cls.startsAt)}</div>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600">${cls.classType}</div>
            <div style="font-size:12px;color:var(--text-muted)">${fmtTime(cls.startsAt)} · ${cls.durationMin || 60} min</div>
            ${myNote ? `<div style="font-size:11px;color:var(--text-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px">✏️ ${myNote.text}</div>` : ''}
            ${sessionNote && !myNote ? `<div style="font-size:11px;color:var(--text-faint);margin-top:3px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px">📋 ${sessionNote.text}</div>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;padding-top:2px">
            ${myNote ? '<span style="font-size:12px" title="Has note">✏️</span>' : ''}
            <span style="font-size:12px;font-weight:600;color:var(--success)">✓</span>
            <span style="color:var(--text-faint);font-size:16px">›</span>
          </div>
        </div>`;
    }).join('');
    return `
      <div class="month-group" data-month="${mk}">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-faint);padding:14px 0 4px">${monthLabel(mk)} <span style="font-weight:400">(${classes.length})</span></div>
        <div class="card" style="padding:0 16px">
          ${rows}
          <div style="height:1px"></div>
        </div>
      </div>`;
  }).join('');

  const typeFilterBtns = types.map(type =>
    `<button onclick="histFilterType('${type}')" id="hist-filter-${type.replace(/\s/g,'_')}"
      style="white-space:nowrap;padding:6px 14px;border-radius:20px;border:1px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);
        background:${type === 'All' ? 'var(--accent)' : 'transparent'};
        color:${type === 'All' ? '#fff' : 'var(--text-muted)'}">
      ${type}
    </button>`
  ).join('');

  return `
    <div class="screen">
      <div class="topbar">
        <button class="topbar-back" onclick="go('me')">← Back</button>
        <div class="topbar-title">Training History</div>
        <div style="font-size:12px;color:var(--text-muted);font-weight:600">${allClasses.length} sessions</div>
      </div>
      <div class="content" style="padding:0 16px 24px">

        <!-- Type filter -->
        ${types.length > 2 ? `
        <div style="display:flex;gap:8px;overflow-x:auto;padding:14px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none">
          ${typeFilterBtns}
        </div>` : '<div style="height:14px"></div>'}

        <!-- Stats strip -->
        <div style="display:flex;gap:0;margin-bottom:16px;border:1px solid var(--border);border-radius:12px;overflow:hidden">
          <div style="flex:1;text-align:center;padding:12px 8px;border-right:1px solid var(--border)">
            <div style="font-size:20px;font-weight:800">${allClasses.length}</div>
            <div style="font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em">Total</div>

let _histCurrentFilter = 'All';
function histFilterType(type) {
  _histCurrentFilter = type;
  // Update button styles
  document.querySelectorAll('[id^="hist-filter-"]').forEach(btn => {
    const isActive = btn.id === 'hist-filter-' + type.replace(/\s/g,'_');
    btn.style.background = isActive ? 'var(--accent)' : 'transparent';
    btn.style.color      = isActive ? '#fff' : 'var(--text-muted)';
  });
  // Show/hide rows
  document.querySelectorAll('.hist-row').forEach(row => {
    const match = type === 'All' || row.dataset.type === type;
    row.style.display = match ? '' : 'none';
  });
  // Show/hide month groups that have no visible rows
  document.querySelectorAll('.month-group').forEach(group => {
    const visible = Array.from(group.querySelectorAll('.hist-row')).some(r => r.style.display !== 'none');
    group.style.display = visible ? '' : 'none';
  });
}

function saveProfileEdits() {
  const student = STUDENTS.find(s => s.id === currentStudentId);
  if (!student) return;

  const name   = document.getElementById('ep-name').value.trim();
  const email  = document.getElementById('ep-email').value.trim();
  const phone  = document.getElementById('ep-phone').value.trim();
  const dob    = document.getElementById('ep-dob').value || null;
  const weight = parseFloat(document.getElementById('ep-weight').value) || null;

  if (!name) { showToast('Name is required'); return; }
  const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  const apply = () => { Object.assign(student, { name, initials, contact: email || student.contact, phone: phone || null, dob, weightKg: weight }); };

  if (isStudentTenant()) {
    sUpdateProfile({ name, initials, contact: email || student.contact, phone: phone || null, dob, weightKg: weight }).then(r => {
      if (!r.ok) { showToast('Could not save profile — try again.'); return; }
      apply();
      showToast('Profile updated ✓');
      setTimeout(() => go('me'), 400);
    });
    return;
  }
  apply();
  persistData();
  showToast('Profile updated ✓');
  setTimeout(() => go('me'), 400);
}

// ── Self-practice persistence ────────────────────────────────────────────────
const PRACTICE_KEY = 'tatami_student_practice';

function loadPracticed(studentId) {
  try {
    const raw = JSON.parse(localStorage.getItem(PRACTICE_KEY) || '{}');
    return new Set(raw[studentId] || []);
  } catch { return new Set(); }
}

function savePracticed(studentId, set) {
  try {
    const raw = JSON.parse(localStorage.getItem(PRACTICE_KEY) || '{}');
    raw[studentId] = [...set];
    localStorage.setItem(PRACTICE_KEY, JSON.stringify(raw));
  } catch {}
}

function togglePractice(itemId) {
  const practiced = loadPracticed(currentStudentId);
  if (practiced.has(itemId)) practiced.delete(itemId);
  else practiced.add(itemId);
  savePracticed(currentStudentId, practiced);
  // Re-render just the progress section content so scroll position is preserved
  const el = document.getElementById('progress-content');
  if (el) el.innerHTML = buildProgressContent();
}

function buildProgressContent() {
  // Read mastery (admin-granted) and self-practice
  let mastered = new Set();
  try {
    const raw = JSON.parse(localStorage.getItem('tatami_student_mastery') || '{}');
    mastered = new Set(raw[currentStudentId] || []);
  } catch {}
  const practiced = loadPracticed(currentStudentId);

  const totalItems = CURRICULUM_ITEMS.length;
  const masteredCount = CURRICULUM_ITEMS.filter(i => mastered.has(i.id)).length;
  const practicedCount = CURRICULUM_ITEMS.filter(i => !mastered.has(i.id) && practiced.has(i.id)).length;
  const pct = totalItems ? Math.round((masteredCount / totalItems) * 100) : 0;

  // Belt color for progress bar
  const enr = ENROLLMENTS.find(e => e.studentId === currentStudentId);
  const beltColors = { 'bjj-white': '#e5e7eb', 'bjj-blue': '#3b82f6', 'bjj-purple': '#8b5cf6', 'bjj-brown': '#92400e', 'bjj-black': '#1f2937' };
  const barColor = (enr && beltColors[enr.currentLevelId]) || 'var(--primary)';

  // Complexity badge colors
  const cxColor = { beginner: '#d1fae5', intermediate: '#fef3c7', advanced: '#fee2e2' };
  const cxText  = { beginner: '#065f46', intermediate: '#92400e', advanced: '#991b1b' };

  // Group items by section
  const sectionCards = CURRICULUM_SECTIONS.map(sec => {
    const items = CURRICULUM_ITEMS.filter(i => i.sectionId === sec.id).sort((a, b) => a.order - b.order);
    const doneCnt = items.filter(i => mastered.has(i.id)).length;
    const pracCnt = items.filter(i => !mastered.has(i.id) && practiced.has(i.id)).length;
    const allDone = doneCnt === items.length;
    return `
      <div class="card" style="margin-bottom:12px;padding:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div style="font-weight:700;font-size:14px">${sec.name.en}</div>
          <div style="font-size:12px;font-weight:600;color:${allDone ? '#059669' : 'var(--text-muted)'}">
            ${doneCnt}/${items.length}${allDone ? ' ✓' : ''}${pracCnt > 0 && !allDone ? ` · <span style="color:#d97706">${pracCnt} drilling</span>` : ''}
          </div>
        </div>
        ${items.map(item => {
          const done = mastered.has(item.id);
          const prac = !done && practiced.has(item.id);
          // Circle: solid green = mastered by coach, amber outline with check = self-practiced, empty = not started
          const circleStyle = done
            ? 'border:2px solid #059669;background:#059669'
            : prac
              ? 'border:2px solid #d97706;background:#fffbeb'
              : 'border:2px solid var(--border-color);background:transparent';
          const checkSvg = done
            ? '<svg width="10" height="10" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            : prac
              ? '<svg width="10" height="10" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
              : '';
          const textStyle = done
            ? 'color:var(--text-muted);text-decoration:line-through'
            : prac
              ? 'color:var(--text-body);font-weight:500'
              : 'color:var(--text-body)';
          const tapHint = done ? '' : `
            <span style="font-size:10px;color:${prac ? '#d97706' : 'var(--text-faint)'};white-space:nowrap;margin-left:4px">
              ${prac ? 'drilling' : 'tap to drill'}

          return `
            <div onclick="${done ? '' : `togglePractice('${item.id}')`}"
                 style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border-color);${done ? '' : 'cursor:pointer;'}
                   ${prac ? 'background:linear-gradient(to right,#fffbeb,transparent);margin:0 -16px;padding-left:16px;padding-right:16px' : ''}">
              <div style="width:20px;height:20px;border-radius:50%;${circleStyle};flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s">
                ${checkSvg}
              </div>
              <div style="flex:1;font-size:13px;${textStyle}">${item.name.en}</div>
              <span style="font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:${cxColor[item.complexity]||'#f3f4f6'};color:${cxText[item.complexity]||'#374151'}">${item.complexity}</span>

            </div>`;
        }).join('')}
      </div>`;
  }).join('');

  // Attendance bars
  const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

  const todayDate = new Date();

    const wkStart = thisWeekStart - (7 - i) * WEEK_MS;

      if (!a.attended || a.studentId !== currentStudentId) return false;
      const cls = CLASSES.find(c => c.id === a.classId);
      if (!cls) return false;
      const t = new Date(cls.startsAt).getTime();
      return t >= wkStart && t < wkEnd;
    }).length;
    const d = new Date(wkStart);
    const label = i === 7 ? 'This wk' : d.toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
    return { label, count };
  });
  const totalAttended = ATTENDANCE.filter(a => a.studentId === currentStudentId && a.attended).length;
  const streak = getAttendanceStreak(currentStudentId);
  const maxWk = Math.max(...attendWeeks.map(w => w.count), 1);
  const attendBars = attendWeeks.map((w, i) => {
    const isNow = i === 7;

          <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Total classes</div>
        </div>
        <div style="width:1px;background:var(--border-color)"></div>
        <div style="flex:1;text-align:center">
          <div style="font-size:20px;font-weight:800;color:${streak > 0 ? 'var(--success,#059669)' : 'var(--text-muted)'}">${streak}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Week streak 🔥</div>
        </div>
        <div style="width:1px;background:var(--border-color)"></div>
        <div style="flex:1;text-align:center">
          <div style="font-size:20px;font-weight:800">${attendWeeks[7].count}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px">This week</div>
        </div>
      </div>
    </div>
    <!-- Overall mastery card -->
    <div class="card" style="margin-bottom:16px;padding:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-weight:700;font-size:15px">Overall mastery</div>
        <div style="font-size:22px;font-weight:800;color:${pct === 100 ? '#059669' : 'var(--primary)'}">${pct}%</div>
      </div>
      <div style="height:10px;background:var(--surface-alt);border-radius:99px;overflow:hidden;margin-bottom:6px">
        <div style="height:100%;width:${pct}%;background:${barColor === '#e5e7eb' ? 'var(--primary)' : barColor};border-radius:99px;transition:width .4s ease"></div>
      </div>
      <div style="display:flex;gap:16px;font-size:12px;color:var(--text-muted);margin-top:4px">
        <span>🟢 ${masteredCount} mastered by coach</span>
        ${practicedCount > 0 ? `<span style="color:#d97706">🟡 ${practicedCount} self-drilling</span>` : ''}
      </div>
    </div>
    <!-- Legend -->
    <div style="display:flex;gap:16px;font-size:11px;color:var(--text-muted);margin-bottom:12px;padding:0 4px">
      <span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:14px;border-radius:50%;background:#059669;display:inline-block"></span> Coach-verified</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:14px;border-radius:50%;border:2px solid #d97706;background:#fffbeb;display:inline-block"></span> Self-drilling</span>

    </div>
    ${CURRICULUM_ITEMS.length === 0 ? `
      <div class="empty" style="padding:48px 16px">
        <div class="empty-icon">📋</div>
        <div class="empty-title">No curriculum yet</div>
        <p style="font-size:13px">Your coach hasn't set up curriculum items yet.</p>
      </div>` : sectionCards}
  `;
}

function renderNews() {
  const now = Date.now();
  const active = ANNOUNCEMENTS
    .filter(a => !a.expiresAt || new Date(a.expiresAt).getTime() > now)
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || new Date(b.createdAt) - new Date(a.createdAt));

  const fmtAnnDate = iso => new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

  const cards = active.length ? active.map(ann => `
    <div class="card" style="margin-bottom:12px;padding:16px">
      ${ann.pinned ? `<div style="font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">📌 Pinned</div>` : ''}
      <div style="font-weight:600;font-size:15px;margin-bottom:6px">${esc(ann.title)}</div>
      <div style="font-size:14px;color:var(--text-muted);line-height:1.5;margin-bottom:10px">${esc(ann.body)}</div>
      <div style="font-size:11px;color:var(--text-muted)">${fmtAnnDate(ann.createdAt)}${ann.expiresAt ? ` · expires ${fmtAnnDate(ann.expiresAt)}` : ''}</div>
    </div>
  `).join('') : `
    <div class="empty" style="padding:48px 16px">
      <div class="empty-icon">📢</div>
      <div class="empty-title">No announcements</div>
      <p style="font-size:13px">Check back later for updates from your academy.</p>
    </div>
  `;

  return `
    <div class="screen">
      <div class="top-bar">
        <span class="top-bar-title">News</span>
      </div>
      <div class="content" style="padding:16px">
        ${cards}
      </div>
    </div>
    ${bottomNav('news')}
  `;
}

    await studentSignOut();
    location.reload();
    return;

  currentStudentId = null;
  localStorage.removeItem('tatami_student_id');
  go('');
}

// Boot: resolve the logged-in student and hydrate from Supabase (tenant mode);
// otherwise fall back to demo data (data.js + admin's localStorage).
(async function bootStudent() {
  try { await initStudentApp(); } catch (e) { console.error('[student] boot:', e); }
  if (isStudentTenant()) {
    currentStudentId = STUDENT_CTX.studentId;
    try { localStorage.setItem('tatami_student_id', currentStudentId); } catch {}
    const h = location.hash.replace(/^#\/?/, '');
    if (h === '' || h === 'login' || h.startsWith('login/')) location.hash = 'home';
  } else {
    loadPersistedData();   // demo data only when not a real logged-in student
  }
  render();
})();
// Note: sign-in (studentSignIn) and sign-out (logout) reload explicitly, so we
// deliberately do NOT reload from onAuthStateChange — that would risk a reload
// loop if the SDK ever emits SIGNED_IN on session restore.
